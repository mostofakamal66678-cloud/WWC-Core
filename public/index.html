<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>WWC · Home</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      overscroll-behavior:none;
    }

    body{
      user-select:none;
      -webkit-user-select:none;
    }

    button,
    input{
      font-family:inherit;
    }

    button{
      border:0;
      outline:0;
      cursor:pointer;
    }

    .app{
      position:relative;
      width:100%;
      height:100dvh;
      overflow:hidden;
      background:#000;
    }

    /* =========================
       FEED
    ========================= */

    .feed{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      overflow-y:auto;
      overflow-x:hidden;
      scroll-snap-type:y mandatory;
      scroll-behavior:smooth;
      scrollbar-width:none;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior-y:contain;
    }

    .feed::-webkit-scrollbar{
      display:none;
    }

    .video-item{
      position:relative;
      width:100%;
      height:100dvh;
      min-height:100dvh;
      background:#000;
      scroll-snap-align:start;
      scroll-snap-stop:always;
      overflow:hidden;
    }

    .video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      background:#000;
      display:block;
    }

    .video-item::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:52%;
      background:linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,.15) 30%,
        rgba(0,0,0,.85) 100%
      );
      pointer-events:none;
      z-index:2;
    }

    /* =========================
       TOP BAR
    ========================= */

    .top-bar{
      position:absolute;
      top:0;
      left:0;
      right:0;
      height:85px;
      z-index:20;

      display:flex;
      align-items:center;
      justify-content:center;

      padding-top:env(safe-area-inset-top);

      background:linear-gradient(
        rgba(0,0,0,.65),
        transparent
      );

      pointer-events:none;
    }

    .tabs{
      display:flex;
      align-items:center;
      gap:28px;
      pointer-events:auto;
    }

    .tab{
      position:relative;
      padding:8px 5px;
      background:transparent;
      color:rgba(255,255,255,.55);
      font-size:17px;
      font-weight:700;
    }

    .tab.active{
      color:#fff;
    }

    .tab.active::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:3px;
      border-radius:10px;
      background:#fff;
    }

    .search-btn{
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);

      width:42px;
      height:42px;

      border-radius:50%;
      background:rgba(0,0,0,.45);
      color:#fff;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:18px;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);

      pointer-events:auto;
    }

    .search-btn:active{
      transform:translateY(-50%) scale(.9);
    }

    /* =========================
       VIDEO LOADER
    ========================= */

    .video-loader{
      position:absolute;
      inset:0;
      z-index:8;

      display:flex;
      align-items:center;
      justify-content:center;

      pointer-events:none;
    }

    .video-loader span{
      width:34px;
      height:34px;

      border:3px solid rgba(255,255,255,.2);
      border-top-color:#fff;
      border-radius:50%;

      animation:spin .7s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    /* =========================
       ACTION BAR
    ========================= */

    .action-bar{
      position:absolute;
      right:8px;
      bottom:112px;
      z-index:30;

      width:62px;

      display:flex;
      flex-direction:column;
      align-items:center;
      gap:13px;
    }

    .action{
      width:58px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      color:#fff;
      background:transparent;
      padding:0;
    }

    .action-icon{
      width:48px;
      height:48px;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:30px;

      filter:drop-shadow(
        0 2px 6px rgba(0,0,0,.8)
      );

      transition:
        transform .15s
        cubic-bezier(.2,.9,.3,1.2);
    }

    .action:active .action-icon{
      transform:scale(.82);
    }

    .action-count{
      margin-top:1px;

      color:#fff;
      font-size:12px;
      font-weight:700;

      text-shadow:0 1px 5px #000;
    }

    .like-btn.liked .action-icon{
      color:#ff2d55;
      transform:scale(1.12);
      animation:likePop .35s ease;
    }

    @keyframes likePop{
      0%{transform:scale(.7)}
      40%{transform:scale(1.4)}
      70%{transform:scale(.9)}
      100%{transform:scale(1.12)}
    }

    .save-btn.saved .action-icon{
      color:#ffd84d;
      transform:scale(1.08);
      animation:savePop .3s ease;
    }

    @keyframes savePop{
      0%{transform:scale(.7)}
      60%{transform:scale(1.2)}
      100%{transform:scale(1.08)}
    }

    /* =========================
       CREATOR
    ========================= */

    .creator-avatar{
      position:relative;

      width:50px;
      height:50px;

      border:2px solid #fff;
      border-radius:50%;

      overflow:visible;
      cursor:pointer;
    }

    .creator-avatar img{
      width:100%;
      height:100%;

      object-fit:cover;
      border-radius:50%;
      display:block;
    }

    .follow-plus{
      position:absolute;

      left:50%;
      bottom:-6px;

      transform:translateX(-50%);

      width:22px;
      height:22px;

      border-radius:50%;

      background:#fff;
      color:#000;

      font-size:18px;
      font-weight:700;

      display:flex;
      align-items:center;
      justify-content:center;

      border:0;
    }

    .follow-plus.following{
      background:#ff2d55;
      color:#fff;
      font-size:12px;
    }

    /* =========================
       VIDEO INFO
    ========================= */

    .video-info{
      position:absolute;

      left:15px;
      right:82px;
      bottom:95px;

      z-index:25;
    }

    .username{
      margin-bottom:6px;

      color:#fff;

      font-size:17px;
      font-weight:700;

      text-shadow:
        0 2px 8px rgba(0,0,0,.9);

      cursor:pointer;
    }

    .caption{
      color:#fff;

      font-size:14px;
      line-height:1.5;

      text-shadow:
        0 2px 8px rgba(0,0,0,.9);

      word-break:break-word;
    }

    .sound{
      margin-top:8px;

      color:#fff;

      font-size:13px;
      font-weight:600;

      text-shadow:
        0 2px 8px rgba(0,0,0,.9);
    }

    /* =========================
       SOUND
    ========================= */

    .sound-btn{
      position:absolute;

      left:14px;
      bottom:155px;

      z-index:35;

      width:42px;
      height:42px;

      border-radius:50%;

      background:rgba(0,0,0,.45);
      color:#fff;

      display:flex;
      align-items:center;
      justify-content:center;

      backdrop-filter:blur(5px);
      -webkit-backdrop-filter:blur(5px);

      font-size:18px;
    }

    /* =========================
       PAUSE
    ========================= */

    .pause-indicator{
      position:absolute;

      left:50%;
      top:50%;

      transform:
        translate(-50%,-50%)
        scale(.7);

      width:65px;
      height:65px;

      border-radius:50%;

      background:rgba(0,0,0,.5);

      display:flex;
      align-items:center;
      justify-content:center;

      opacity:0;
      pointer-events:none;

      transition:all .2s;

      z-index:40;

      font-size:28px;
    }

    .pause-indicator.show{
      opacity:1;

      transform:
        translate(-50%,-50%)
        scale(1);
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav{
      position:fixed;

      left:0;
      right:0;
      bottom:0;

      height:75px;

      z-index:100;

      display:flex;
      align-items:center;
      justify-content:space-around;

      padding-bottom:env(safe-area-inset-bottom);

      background:linear-gradient(
        transparent,
        rgba(0,0,0,.97) 28%
      );

      border-top:1px solid rgba(255,255,255,.05);
    }

    .nav-btn{
      width:20%;
      height:65px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      gap:2px;

      color:rgba(255,255,255,.5);

      font-size:10px;
      font-weight:600;

      background:transparent;
    }

    .nav-btn.active{
      color:#fff;
    }

    .nav-icon{
      font-size:24px;
    }

    .upload-btn{
      width:50px;
      height:38px;

      border-radius:10px;

      background:#fff;
      color:#000;

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:26px;
      font-weight:300;

      box-shadow:
        -3px 0 0 #25f4ee,
        3px 0 0 #fe2c55;

      transition:transform .15s;
    }

    .upload-btn:active{
      transform:scale(.9);
    }

    /* =========================
       COMMENTS
    ========================= */

    .comment-panel{
      position:fixed;

      left:0;
      right:0;
      bottom:0;

      z-index:150;

      height:55vh;

      background:#111;

      border-radius:18px 18px 0 0;

      transform:translateY(100%);

      transition:
        transform .3s
        cubic-bezier(.2,.9,.3,1);

      display:flex;
      flex-direction:column;
    }

    .comment-panel.open{
      transform:translateY(0);
    }

    .comment-header{
      height:50px;
      flex:none;

      display:flex;
      align-items:center;
      justify-content:center;

      border-bottom:1px solid #333;

      font-weight:700;

      position:relative;
    }

    .close-comments{
      position:absolute;
      right:15px;

      color:#fff;
      background:transparent;

      font-size:24px;
    }

    .comments-list{
      flex:1;

      overflow-y:auto;

      padding:15px;
      color:#fff;
    }

    .comment{
      padding:10px 0;

      border-bottom:1px solid #222;

      line-height:1.4;
      color:#eee;
    }

    .comment strong{
      display:block;
      margin-bottom:4px;
      color:#fff;
    }

    .comment-input{
      display:flex;
      gap:8px;

      padding:10px;

      border-top:1px solid #333;

      padding-bottom:
        calc(10px + env(safe-area-inset-bottom));
    }

    .comment-input input{
      flex:1;

      border:1px solid #444;

      background:#222;
      color:#fff;

      border-radius:22px;

      padding:10px 15px;

      outline:none;
    }

    .comment-input input::placeholder{
      color:#666;
    }

    .comment-input button{
      width:44px;

      border-radius:50%;

      background:#fff;
      color:#000;

      font-size:16px;
    }

    /* =========================
       TOAST
    ========================= */

    .toast{
      position:fixed;

      left:50%;
      bottom:95px;

      transform:
        translateX(-50%)
        translateY(20px);

      z-index:500;

      background:rgba(30,30,30,.95);
      color:#fff;

      padding:10px 20px;

      border-radius:22px;

      font-size:14px;

      opacity:0;
      pointer-events:none;

      transition:all .25s;

      white-space:nowrap;

      max-width:90vw;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .toast.show{
      opacity:1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =========================
       EMPTY / ERROR
    ========================= */

    .feed-message{
      width:100%;
      height:100dvh;

      display:flex;
      align-items:center;
      justify-content:center;

      text-align:center;

      color:#aaa;

      padding:30px;
    }

    .feed-message-inner{
      max-width:320px;
    }

    .feed-message-icon{
      font-size:45px;
      margin-bottom:15px;
    }

    .retry-btn{
      margin-top:18px;

      border-radius:22px;

      padding:10px 22px;

      background:#fff;
      color:#000;

      font-weight:700;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-overlay{
      position:fixed;

      inset:0;

      z-index:1000;

      background:rgba(0,0,0,.96);

      padding:
        calc(60px + env(safe-area-inset-top))
        20px
        20px;

      animation:fadeIn .2s ease;

      overflow-y:auto;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:scale(.98);
      }
      to{
        opacity:1;
        transform:scale(1);
      }
    }

    .search-container{
      max-width:600px;
      margin:0 auto;
    }

    .search-header{
      display:flex;
      gap:10px;
      margin-bottom:20px;
    }

    .search-header input{
      flex:1;

      padding:14px 18px;

      border-radius:12px;

      border:1px solid #444;

      background:#222;
      color:#fff;

      font-size:16px;

      outline:none;
    }

    .search-header input:focus{
      border-color:#777;
    }

    .search-header input::placeholder{
      color:#666;
    }

    .search-close-btn{
      width:50px;
      height:50px;

      border-radius:50%;

      background:#333;
      color:#fff;

      font-size:22px;
    }

    .search-result-item{
      padding:12px 16px;

      border-bottom:1px solid #222;

      display:flex;
      align-items:center;
      gap:12px;

      color:#fff;

      cursor:pointer;
    }

    .search-result-item:active{
      background:#222;
    }

    .search-result-item img{
      width:40px;
      height:40px;

      border-radius:50%;

      object-fit:cover;
    }

    .search-result-item .info{
      flex:1;
      min-width:0;
    }

    .search-result-item .name{
      font-weight:600;
    }

    .search-result-item .desc{
      margin-top:3px;

      font-size:12px;
      color:#888;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media(min-width:700px){

      .video-item{
        max-width:500px;
        margin:auto;
      }

      .bottom-nav{
        max-width:500px;

        left:50%;
        right:auto;

        transform:translateX(-50%);
      }
    }

    @media(max-width:480px){

      .tabs{
        gap:24px;
      }

      .tab{
        font-size:16px;
      }

      .video-info{
        left:14px;
        right:78px;
      }

      .action-bar{
        right:5px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <main class="feed" id="feed"></main>

  <!-- =========================
       BOTTOM NAVIGATION
  ========================== -->

  <nav class="bottom-nav">

    <button class="nav-btn active" id="navHome">
      <span class="nav-icon">
        <i class="fas fa-home"></i>
      </span>

      </span>

    </button>

        <i class="fas fa-inbox"></i>

    <button class="nav-btn" id="navProfile">
      <span class="nav-icon">

  ========================== -->

        class="close-comments"

  <div class="toast" id="toast"></div>

</div>

/* =====================================================
   FIREBASE CONFIG

/* =====================================================

let currentUser = null;

/* =====================================================

const feed =

/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function number(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;
}


function formatNumber(value){

  const num =
    Number(value) || 0;

  if(num >= 1000000){
    return (
      num / 1000000
    ).toFixed(1) + "M";
  }

  if(num >= 1000){
    return (
      num / 1000
    ).toFixed(1) + "K";
  }

  return String(num);
}


function getFollowingIds(){

  return Array.isArray(
    currentProfile?.followingIds
  )
    ? currentProfile.followingIds
    : [];
}


function getUsername(video){

  const value =
    video.username ||
    video.userName ||
    video.handle ||
    "wwc_user";

  return String(value)
    .replace(/^@/,"");
}


function showToast(text){

  if(!toast) return;

  toast.textContent =
    text;

  toast.classList.add("show");

  clearTimeout(
    window.__wwcToastTimer
  );

  window.__wwcToastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    },2500);
}


function withTimeout(
  promise,
  milliseconds
){

  return Promise.race([

    promise,

    new Promise(
      (_,reject) => {

        setTimeout(
          () => reject(
            new Error("Request timeout")
          ),
          milliseconds
        );

      }
    )

  ]);
}

/* =====================================================
   VIDEO URL
===================================================== */

async function resolveVideoURL(video){

  const directUrl =
    video.videoURL ||
    video.videoUrl ||
    video.downloadURL ||
    video.downloadUrl ||
    video.fileURL ||
    video.fileUrl ||
    video.url ||
    video.src;

  if(
    typeof directUrl === "string" &&
    directUrl.startsWith("http")
  ){
    return directUrl;
  }


  const localUrl =
    video.localPath ||
    video.localUrl ||
    video.file;

  if(localUrl){
    return localUrl;
  }


  const storagePath =
    video.storagePath ||
    video.filePath ||
    video.storage ||
    video.path;


  if(storagePath){

    try{

      return await withTimeout(
        getDownloadURL(
          ref(
            storage,
            storagePath
          )
        ),
        10000
      );

    }catch(error){

      console.error(
        "Storage URL error:",
        error
      );

      return "";
    }
  }


  return "";
}

/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(){

  if(!currentUser) return;

  if(isLoadingVideos) return;

  isLoadingVideos = true;

  showLoadingScreen();


  try{

    const videosQuery =
      query(
        collection(
          db,
          "videos"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    const snapshot =
      await withTimeout(
        getDocs(videosQuery),
        15000
      );


    const videos = [];


    snapshot.forEach(
      videoDoc => {

        videos.push({
          id:videoDoc.id,
          ...videoDoc.data()
        });

      }
    );


    /*
      Resolve URLs.
      Promise.all is considerably faster
      than resolving them one by one.
    */

    const resolved =
      await Promise.all(

        videos.map(
          async video => {

            try{

              const url =
                await resolveVideoURL(
                  video
                );

              return {
                ...video,
                resolvedVideoURL:url
              };

            }catch(error){

              console.error(
                "URL resolve error:",
                error
              );

              return {
                ...video,
                resolvedVideoURL:""
              };

            }

          }
        )

      );


    allVideos =
      resolved.filter(
        video =>
          !!video.resolvedVideoURL
      );


    console.log(
      "Videos loaded:",
      allVideos.length
    );


    renderFeed();


  }catch(error){

    console.error(
      "Video loading error:",
      error
    );


    showFeedError(
      "Could not load videos.",
      true
    );

  }finally{

    isLoadingVideos = false;

  }

}

function openSearch(){

  isSearchMode = true;

  lastSearchQuery = "";


  document.body.insertAdjacentHTML(

  const input =
    document.getElementById(
      "searchInput"
    );

  const closeBtn =
    document.getElementById(

    );


  input?.focus();


  input?.addEventListener(
    "input",
    event => {

      performSearch(
        event.target.value.trim()

  );

function performSearch(queryText){

  lastSearchQuery =
    queryText;


  if(!queryText){

    searchResults = [];

    updateSearchResults();

    return;

  }


  const q =
    queryText.toLowerCase();


  searchResults =
    allVideos.filter(
      video => {

        const username =
          getUsername(video)
            .toLowerCase();

        const name =
          String(
            video.name ||
            video.displayName ||
            ""
          ).toLowerCase();

        const caption =
          String(
            video.caption ||
            video.description ||
            ""
          ).toLowerCase();

        return (
          username.includes(q) ||
          name.includes(q) ||
          caption.includes(q)
        );

      }
    );


  updateSearchResults();

}


function updateSearchResults(){

  const results =
    document.getElementById(
      "searchResults"
    );

  if(!results) return;


  if(!lastSearchQuery){

===================================================== */

function renderFeed(){

  if(!feed) return;


  if(observer){

    observer.disconnect();
    observer = null;

  }


  if(currentPlayingVideo){

    try{
      currentPlayingVideo.pause();
    }catch(error){}

    currentPlayingVideo = null;

  }


  feed.innerHTML = "";


  let videos;


  if(isSearchMode){

    videos =
      searchResults;

  }else{

    videos =
      currentFeed === "following"

      ? allVideos.filter(
          video =>
            getFollowingIds()
              .includes(
                video.uid ||
                video.creatorId ||
                video.userId
              )
        )

      : [...allVideos];

  }


  if(!videos.length){

    const messageText =
      isSearchMode
      ? `"${lastSearchQuery}" - No results found`

        ? "You're not following anyone yet"
        : "No videos found";

    feed.innerHTML = `

          <div class="feed-message-icon">
            ${isSearchMode ? "🔍" : "🎬"}

            currentFeed === "following" &&
            !isSearchMode

                id="goForYouBtn">

              </button>
            `
            : ""
          }

        </div>

        "click",

/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlayPause(item){

  const video =
    item.querySelector(
      ".video"
    );

  const indicator =
    item.querySelector(
      ".pause-indicator"
    );


  if(video.paused){

    playVideo(video);

    indicator.classList.remove(
      "show"
    );

  }else{

    video.pause();

    indicator.classList.add(
      "show"
    );

  }

}


async function playVideo(video){

  if(!video) return;


  if(
    currentPlayingVideo &&
    currentPlayingVideo !== video
  ){

    try{
      currentPlayingVideo.pause();
    }catch(error){}

  }


  currentPlayingVideo =
    video;


  /*
    Start muted.
    This avoids mobile autoplay restrictions.
  */

  video.muted = true;


  try{

    await video.play();

  }catch(error){

    console.warn(
      "Autoplay blocked:",
      error
    );

  }

}


/* =====================================================
   VIDEO OBSERVER
===================================================== */

function setupVideoObserver(){

  if(observer){

    observer.disconnect();

  }


  const items =
    [...document.querySelectorAll(
      ".video-item"
    )];


  if(!items.length) return;


  observer =
    new IntersectionObserver(
      entries => {

        let bestEntry = null;

        let bestRatio = 0;


        entries.forEach(
          entry => {

            if(
              entry.isIntersecting &&
              entry.intersectionRatio >
              bestRatio
            ){

              bestRatio =
                entry.intersectionRatio;

              bestEntry =
                entry;

            }

          }
        );


        if(bestEntry){

          const video =
            bestEntry.target.querySelector(
              ".video"
            );

          if(video){

            playVideo(video);

          }

        }


        items.forEach(
          item => {

            if(
              item !== bestEntry?.target
            ){

              const video =
                item.querySelector(
                  ".video"
                );

              video?.pause();

            }

          }
        );

      },
      {
        threshold:[
          0.25,
          0.5,
          0.65,
          0.8,
          1
        ]
      }
    );


  items.forEach(
    item =>
      observer.observe(item)
  );


  /*
    Start first video.
  */

  setTimeout(
    () => {

      const first =
        items[0];

      const video =
        first?.querySelector(
          ".video"
        );

      if(video){

        playVideo(video);

      }

    },
    300
  );

}

/* =====================================================
   LIKE
===================================================== */

async function toggleLike(
  videoId,
  button
){

  if(!currentUser){

    showToast(
      "Please login first"
    );

    return;

  }


  if(button.disabled) return;

  button.disabled = true;


  try{

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const result =
      await runTransaction(
        db,
        async transaction => {

          const snapshot =
            await transaction.get(
              videoRef
            );


          if(!snapshot.exists()){

            throw new Error(
              "Video not found"
            );

          }


          const data =
            snapshot.data();


          const likedBy =
            Array.isArray(
              data.likedBy
            )
              ? data.likedBy
              : [];


          const alreadyLiked =
            likedBy.includes(
              currentUser.uid
            );


          const newLikedBy =
            alreadyLiked

              ? likedBy.filter(
                  uid =>
                    uid !==
                    currentUser.uid
                )

              : [
                  ...likedBy,
                  currentUser.uid
                ];


          const newLikes =
            Math.max(
              0,
              number(data.likes) +
              (
                alreadyLiked
                  ? -1
                  : 1
              )
            );


          transaction.update(
            videoRef,
            {
              likedBy:newLikedBy,
              likes:newLikes
            }
          );


          return {
            liked:!alreadyLiked,
            likes:newLikes
          };

        }
      );


    button.classList.toggle(
      "liked",
      result.liked
    );


    const count =
      button.querySelector(
        ".action-count"
      );


    if(count){

      count.textContent =
        formatNumber(
          result.likes
        );

    }


    const localVideo =
      allVideos.find(
        video =>
          video.id ===
          videoId
      );


    if(localVideo){

      localVideo.likes =
        result.likes;

      localVideo.likedBy =
        Array.isArray(
          localVideo.likedBy
        )
          ? localVideo.likedBy
          : [];


      if(result.liked){

        if(
          !localVideo.likedBy.includes(
            currentUser.uid
          )
        ){

          localVideo.likedBy.push(
            currentUser.uid
          );

        }

      }else{

        localVideo.likedBy =
          localVideo.likedBy.filter(
            uid =>
              uid !==
              currentUser.uid
          );

      }

    }

  }catch(error){

    console.error(
      "Like error:",
      error
    );

    showToast(
      "Like failed"
    );

  }finally{

    button.disabled = false;

  }

}


/* =====================================================
   SAVE
===================================================== */

async function toggleSave(
  videoId,
  button
){

  if(!currentUser){

    showToast(
      "Please login first"
    );

    return;

  }


  if(button.disabled) return;

  button.disabled = true;


  try{

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );

    const userRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const result =
      await runTransaction(
        db,
        async transaction => {

          const videoSnapshot =
            await transaction.get(
              videoRef
            );


          if(!videoSnapshot.exists()){

            throw new Error(
              "Video not found"
            );

          }


          const userSnapshot =
            await transaction.get(
              userRef
            );


          const videoData =
            videoSnapshot.data();


          const userData =
            userSnapshot.exists()
              ? userSnapshot.data()
              : {};


          const savedBy =
            Array.isArray(
              videoData.savedBy
            )
              ? videoData.savedBy
              : [];


          const alreadySaved =
            savedBy.includes(
              currentUser.uid
            );


          const newSavedBy =
            alreadySaved

              ? savedBy.filter(
                  uid =>
                    uid !==
                    currentUser.uid
                )

              : [
                  ...savedBy,
                  currentUser.uid
                ];


          const newSaves =
            Math.max(
              0,
              number(videoData.saves) +
              (
                alreadySaved
                  ? -1
                  : 1
              )
            );


          const oldSaved =
            Array.isArray(
              userData.savedVideoIds
            )
              ? userData.savedVideoIds
              : [];


          const newUserSaved =
            alreadySaved

              ? oldSaved.filter(
                  id =>
                    id !==
                    videoId
                )

              : oldSaved.includes(
                  videoId
                )
                  ? oldSaved
                  : [
                      ...oldSaved,
                      videoId
                    ];


          transaction.update(
            videoRef,
            {
              savedBy:newSavedBy,
              saves:newSaves
            }
          );


          transaction.set(
            userRef,
            {
              savedVideoIds:
                newUserSaved
            },
            {
              merge:true
            }
          );


          return {
            saved:!alreadySaved,
            saves:newSaves
          };

        }
      );


    button.classList.toggle(
      "saved",
      result.saved
    );


    const count =
      button.querySelector(
        ".action-count"
      );


    if(count){

      count.textContent =
        formatNumber(
          result.saves
        );

    }


    if(
      !Array.isArray(
        currentProfile.savedVideoIds
      )
    ){

      currentProfile.savedVideoIds =
        [];

    }


    if(result.saved){

      if(
        !currentProfile.savedVideoIds.includes(
          videoId
        )
      ){

        currentProfile.savedVideoIds.push(
          videoId
        );

      }

      showToast(
        "🔖 Saved"
      );

    }else{

      currentProfile.savedVideoIds =
        currentProfile.savedVideoIds.filter(
          id =>
            id !==
            videoId
        );

      showToast(
        "Removed from saved"
      );

    }


  }catch(error){

    console.error(
      "Save error:",
      error
    );

    showToast(
      "Save failed"
    );

  }finally{

    button.disabled = false;

  }

}


/* =====================================================
   FOLLOW
===================================================== */

async function toggleFollow(
  targetUid,
  button
){

  if(
    !currentUser ||
    !targetUid ||
    targetUid ===
    currentUser.uid
  ){

    return;

  }


  if(button.disabled) return;

  button.disabled = true;


  try{

    const myRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const targetRef =
      doc(
        db,
        "users",
        targetUid
      );


    const result =
      await runTransaction(
        db,
        async transaction => {

          const mySnapshot =
            await transaction.get(
              myRef
            );

          const targetSnapshot =
            await transaction.get(
              targetRef
            );


          if(
            !mySnapshot.exists() ||
            !targetSnapshot.exists()
          ){

            throw new Error(
              "Profile not found"
            );

          }


          const myData =
            mySnapshot.data();

          const targetData =
            targetSnapshot.data();


          const following =
            Array.isArray(
              myData.followingIds
            )
              ? myData.followingIds
              : [];


          const followers =
            Array.isArray(
              targetData.followerIds
            )
              ? targetData.followerIds
              : [];


          const alreadyFollowing =
            following.includes(
              targetUid
            );


          if(alreadyFollowing){

            transaction.update(
              myRef,
              {
                followingIds:
                  following.filter(
                    id =>
                      id !==
                      targetUid
                  ),

                following:
                  Math.max(
                    0,
                    number(
                      myData.following
                    ) - 1
                  )
              }
            );


            transaction.update(
              targetRef,
              {
                followerIds:
                  followers.filter(
                    id =>
                      id !==
                      currentUser.uid
                  ),

                followers:
                  Math.max(
                    0,
                    number(
                      targetData.followers
                    ) - 1
                  )
              }
            );

          }else{

            transaction.update(
              myRef,
              {
                followingIds:
                  [
                    ...following,
                    targetUid
                  ],

                following:
                  number(
                    myData.following
                  ) + 1
              }
            );


            transaction.update(
              targetRef,
              {
                followerIds:
                  [
                    ...followers,
                    currentUser.uid
                  ],

                followers:
                  number(
                    targetData.followers
                  ) + 1
              }
            );

          }


          return {
            following:
              !alreadyFollowing
          };

        }
      );


    button.classList.toggle(
      "following",
      result.following
    );


    button.textContent =
      result.following
        ? "✓"
        : "+";


    currentProfile =
      (
        await getDoc(
          doc(
            db,
            "users",
            currentUser.uid
          )
        )
      ).data() ||
      currentProfile;


    showToast(
      result.following
        ? "✅ Following"
        : "Unfollowed"
    );


  }catch(error){

    console.error(
      "Follow error:",
      error
    );

    showToast(
      "Follow failed"
    );

  }finally{

    button.disabled = false;

  }

}

function toggleSound(
  item,
  button
){

  const video =
    item.querySelector(
      ".video"
    );


  if(!video) return;


  if(video.muted){

    video.muted = false;

    button.innerHTML =
      '<i class="fas fa-volume-up"></i>';

    showToast(
      "🔊 Sound On"
    );

    /*
      Calling play after unmuting
      is allowed because the user
      interacted with the button.
    */

    video.play()
      .catch(
        () => {}
      );

  }else{

    video.muted = true;

    button.innerHTML =
      '<i class="fas fa-volume-mute"></i>';

    showToast(
      "🔇 Sound Off"
    );

  }

}


/* =====================================================
   SHARE
===================================================== */

async function shareVideo(
  videoId,
  button
){

  if(!currentUser){

    showToast(
      "Please login first"
    );

    return;

  }


  if(button.disabled) return;

  button.disabled = true;


  try{

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    /*
      Increase share count
      safely with a transaction.
    */

    const newShares =
      await runTransaction(
        db,
        async transaction => {

          const snapshot =
            await transaction.get(
              videoRef
            );


          if(!snapshot.exists()){

            throw new Error(
              "Video not found"
            );

          }


          const data =
            snapshot.data();


          const shares =
            number(
              data.shares
            ) + 1;


          transaction.update(
            videoRef,
            {
              shares
            }
          );


          return shares;

        }
      );


    const count =
      button.querySelector(
        ".action-count"
      );


    if(count){

      count.textContent =
        formatNumber(
          newShares
        );

    }


    const localVideo =
      allVideos.find(
        video =>
          video.id ===
          videoId
      );


    if(localVideo){

      localVideo.shares =
        newShares;

    }


    const shareUrl =
      new URL(
        window.location.href
      );


    shareUrl.searchParams.set(
      "video",
      videoId
    );


    if(
      navigator.share
    ){

      try{

        await navigator.share({

          title:
            "World Wide Connect",

          text:
            "Check this video on WWC",

          url:
            shareUrl.toString()

        });

      }catch(error){

        /*
          User cancelled share.
          No error toast needed.
        */

      }

    }else{

      try{

        await navigator.clipboard.writeText(
          shareUrl.toString()
        );

        showToast(
          "🔗 Link Copied"
        );

      }catch(error){

        showToast(
          "Unable to copy link"
        );

      }

    }


  }catch(error){

    console.error(
      "Share error:",
      error
    );

    showToast(
      "Share failed"
    );

  }finally{

    button.disabled = false;

  }

}

async function loadComments(
  videoId
){

  if(!commentsList) return;


  commentsList.innerHTML = `

    <div
      style="
        text-align:center;
        color:#888;
        padding:25px;
      "
    >
      Loading...
    </div>

  `;


  try{

    const snapshot =
      await withTimeout(

        getDocs(
          collection(
            db,
            "videos",
            videoId,
            "comments"
          )
        ),

        10000

      );


    commentsList.innerHTML =
      "";


    if(snapshot.empty){

      commentsList.innerHTML = `

        <div
          style="
            text-align:center;
            color:#777;
            padding:30px;
          "
        >
          No comments yet.
        </div>

      `;

      return;

    }


    const comments = [];


    snapshot.forEach(
      commentDoc => {

        comments.push({
          id:commentDoc.id,
          ...commentDoc.data()
        });

      }
    );


    comments.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds ||
          0;

        const bTime =
          b.createdAt?.seconds ||
          0;

        return (
          aTime -
          bTime
        );

      }
    );


    comments.forEach(
      data => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "comment";


        const username =
          data.username ||
          data.name ||
          "WWC User";


        const text =
          data.text ||
          "";


        div.innerHTML = `

          <strong>
            ${escapeHtml(
              username
            )}
          </strong>

          ${escapeHtml(
            text
          )}

        `;


        commentsList.appendChild(
          div
        );

      }
    );


  }catch(error){

    console.error(
      "Comments error:",
      error
    );


    commentsList.innerHTML = `

      <div
        style="
          text-align:center;
          color:#ff667f;
          padding:25px;
        "
      >
        Could not load comments.
      </div>

    `;

  }

}

async function addComment(){

  if(!currentUser){

    showToast(
      "Please login first"
    );

    return;

  }


  if(!currentVideoId){

    return;

  }


  const text =
    commentInput
      ?.value
      .trim();


  if(!text){

    return;

  }


  try{

    const username =
      String(
        currentProfile.username ||
        currentProfile.name ||
        "WWC User"
      )
      .replace(
        /^@/,
        ""
      );


    await addDoc(

      collection(
        db,
        "videos",
        currentVideoId,
        "comments"
      ),

      {

        uid:
          currentUser.uid,

        username,

        name:
          currentProfile.name ||
          "WWC User",

        photoURL:
          currentProfile.photoURL ||
          defaultPhoto,

        text,

        createdAt:
          serverTimestamp()

      }

    );


    /*
      Update comment counter
      with a transaction.
    */

    const videoRef =
      doc(
        db,
        "videos",
        currentVideoId
      );


    const newCount =
      await runTransaction(
        db,
        async transaction => {

          const snapshot =
            await transaction.get(
              videoRef
            );


          if(!snapshot.exists()){

            throw new Error(
              "Video not found"
            );

          }


          const count =
            number(
              snapshot.data().comments
            ) + 1;


          transaction.update(
            videoRef,
            {
              comments:count
            }
          );


          return count;

        }
      );


    if(commentInput){

      commentInput.value =
        "";

    }


    await loadComments(
      currentVideoId
    );


    const item =
      document.querySelector(
        `.video-item[data-video-id="${CSS.escape(currentVideoId)}"]`
      );


    if(item){

      const button =
        item.querySelector(
          '[data-action="comment"]'
        );


      const count =
        button?.querySelector(
          ".action-count"
        );


      if(count){

        count.textContent =
          formatNumber(
            newCount
          );

      }

    }


    showToast(
      "💬 Comment Added"
    );


  }catch(error){

    console.error(
      "Comment error:",
      error
    );

    showToast(
      "Comment failed"
    );

  }

}

/* =====================================================
   VIDEO QUERY PARAMETER
===================================================== */

function openVideoFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const videoId =
    params.get(
      "video"
    );


  if(!videoId) return;


  setTimeout(
    () => {

      const target =
        document.querySelector(
          `.video-item[data-video-id="${CSS.escape(videoId)}"]`
        );


      if(target){

        target.scrollIntoView({
          behavior:"smooth",
          block:"start"
        });

      }

    },
    500
  );

}


/* =====================================================
   VISIBILITY CHANGE
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if(document.hidden){

      document
        .querySelectorAll(
          ".video"
        )
        .forEach(
          video => {

            try{
              video.pause();
            }catch(error){}

          }
        );


      return;

    }


    /*
      When the app becomes visible again,
      play the most visible video.
    */

    const items =
      [
        ...document.querySelectorAll(
          ".video-item"
        )
      ];


    let bestItem =
      null;

    let bestRatio =
      0;


    items.forEach(
      item => {

        const rect =
          item.getBoundingClientRect();


        const visible =
          Math.min(
            window.innerHeight,
            rect.bottom
          ) -
          Math.max(
            0,
            rect.top
          );


        const ratio =
          Math.max(
            0,
            visible
          ) /
          window.innerHeight;


        if(
          ratio >
          bestRatio
        ){

          bestRatio =
            ratio;

          bestItem =
            item;

        }

      }
    );


    if(bestItem){

      const video =
        bestItem.querySelector(
          ".video"
        );


      if(video){

        playVideo(
          video
        );

      }

    }

  }
);
