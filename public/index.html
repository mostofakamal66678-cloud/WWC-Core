<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>WWC - For You</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overscroll-behavior:none;
}

button{
  font-family:inherit;
}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:#000;
}

/* =========================
   FEED
========================= */

.feed{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;

  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;

  -webkit-overflow-scrolling:touch;

  scrollbar-width:none;

  overscroll-behavior-y:contain;
}

.feed::-webkit-scrollbar{
  display:none;
}

/* =========================
   VIDEO ITEM
========================= */

.video-item{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100dvh;

  background:#000;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  overflow:hidden;
  contain:layout paint style;
}

.video{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;

  display:block;

  transform:translateZ(0);
  will-change:transform;
}

/* bottom dark gradient */

.video-item::after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:48%;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.85)
    );

  pointer-events:none;
}

/* =========================
   TOP BAR
========================= */

.top-bar{
  position:absolute;

  top:0;
  left:0;
  right:0;

  height:72px;

  z-index:20;

  display:flex;
  align-items:center;
  justify-content:center;

  padding-top:env(safe-area-inset-top);

  background:
    linear-gradient(
      rgba(0,0,0,.55),
      transparent
    );
}

.tabs{
  display:flex;
  align-items:center;
  gap:30px;
}

.tab{
  position:relative;

  border:0;
  background:transparent;

  color:rgba(255,255,255,.65);

  font-size:17px;
  font-weight:bold;

  padding:10px 3px;

  cursor:pointer;
}

.tab.active{
  color:#fff;
}

.tab.active::after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:1px;

  height:3px;

  border-radius:10px;

  background:#fff;
}

/* =========================
   SEARCH
========================= */

.search-btn{
  position:absolute;

  right:12px;
  top:50%;

  transform:translateY(-50%);

  width:45px;
  height:45px;

  border:0;
  border-radius:50%;

  background:rgba(0,0,0,.38);

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  backdrop-filter:blur(6px);
}

.search-btn svg{
  width:28px;
  height:28px;

  fill:none;
  stroke:#fff;
  stroke-width:2;
}

/* =========================
   RIGHT ACTION BAR
========================= */

.action-bar{
  position:absolute;

  right:8px;
  bottom:108px;

  z-index:40;

  width:65px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:17px;
}

.action{
  width:62px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  border:0;
  background:transparent;

  color:#fff;

  cursor:pointer;

  padding:0;
}

.action-icon{
  width:51px;
  height:51px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#fff;

  filter:
    drop-shadow(
      0 2px 4px rgba(0,0,0,.8)
    );

  transition:
    transform .15s ease,
    color .15s ease;
}

.action-icon svg{
  width:39px;
  height:39px;

  fill:none;

  stroke:currentColor;

  stroke-width:2;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.action:active .action-icon{
  transform:scale(.82);
}

/* LIKE */

.like-btn.liked .action-icon{
  color:#ff3040;
  transform:scale(1.08);
}

.like-btn.liked .action-icon svg{
  fill:#ff3040;
  stroke:#ff3040;
}

/* SAVE */

.save-btn.saved .action-icon{
  color:#fff;
}

.save-btn.saved .action-icon svg{
  fill:#fff;
  stroke:#fff;
}

.action-count{
  margin-top:1px;

  color:#fff;

  font-size:13px;
  font-weight:bold;

  text-shadow:
    0 1px 4px #000;
}

/* =========================
   CREATOR
========================= */

.creator-avatar{
  position:relative;

  width:53px;
  height:53px;

  border-radius:50%;

  border:2px solid #fff;

  overflow:visible;

  margin-bottom:2px;
}

.creator-avatar img{
  width:100%;
  height:100%;

  object-fit:cover;

  border-radius:50%;

  display:block;
}

.follow-plus{
  position:absolute;

  bottom:-7px;
  left:50%;

  transform:translateX(-50%);

  width:24px;
  height:24px;

  border-radius:50%;

  border:0;

  background:#fff;
  color:#000;

  font-size:20px;
  line-height:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  font-weight:bold;
}

.follow-plus.following{
  background:#fff;
  color:#000;
  font-size:14px;
}

/* =========================
   VIDEO INFO
========================= */

.video-info{
  position:absolute;

  left:15px;
  right:85px;
  bottom:95px;

  z-index:35;
}

.username{
  font-size:18px;
  font-weight:bold;

  margin-bottom:9px;

  text-shadow:
    0 2px 4px rgba(0,0,0,.9);
}

.caption{
  font-size:15px;

  line-height:1.45;

  margin-bottom:9px;

  text-shadow:
    0 2px 4px rgba(0,0,0,.9);
}

.sound{
  display:flex;

  align-items:center;

  gap:6px;

  font-size:14px;

  font-weight:bold;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  text-shadow:
    0 2px 4px rgba(0,0,0,.9);
}

/* =========================
   SOUND BUTTON
========================= */

.sound-btn{
  position:absolute;

  left:14px;
  bottom:150px;

  z-index:45;

  width:42px;
  height:42px;

  border:0;

  border-radius:50%;

  background:rgba(0,0,0,.42);

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  backdrop-filter:blur(5px);
}

.sound-btn svg{
  width:24px;
  height:24px;

  fill:none;

  stroke:#fff;

  stroke-width:2;

  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   PAUSE
========================= */

.pause-indicator{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.8);

  width:70px;
  height:70px;

  border-radius:50%;

  background:rgba(0,0,0,.48);

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;

  pointer-events:none;

  transition:.15s;

  z-index:50;
}

.pause-indicator.show{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

.pause-indicator svg{
  width:34px;
  height:34px;

  fill:#fff;
}

/* =========================
   DOUBLE TAP HEART
========================= */

.double-heart{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.2);

  font-size:100px;

  opacity:0;

  pointer-events:none;

  z-index:60;
}

.double-heart.show{
  animation:heartPop .65s ease forwards;
}

@keyframes heartPop{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.2);
  }

  30%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.25);
  }

  70%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1.4);
  }

}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:72px;

  z-index:100;

  display:flex;

  align-items:center;

  justify-content:space-around;

  padding-bottom:
    env(safe-area-inset-bottom);

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.97) 28%
    );
}

.nav-btn{
  position:relative;

  width:20%;
  height:65px;

  border:0;

  background:transparent;

  color:#fff;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:3px;

  font-size:11px;

  font-weight:bold;

  cursor:pointer;
}

.nav-btn svg{
  width:29px;
  height:29px;

  fill:none;

  stroke:currentColor;

  stroke-width:2;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.upload-btn{
  position:relative;

  width:56px;
  height:42px;

  border:0;

  border-radius:12px;

  background:#fff;

  color:#000;

  display:flex;

  align-items:center;
  justify-content:center;

  box-shadow:
    -4px 0 0 #25f4ee,
    4px 0 0 #fe2c55;
}

.upload-btn svg{
  width:27px;
  height:27px;

  stroke:#000;

  stroke-width:2.5;

  fill:none;
}

.badge{
  position:absolute;

  top:2px;
  right:15px;

  min-width:20px;
  height:20px;

  padding:0 5px;

  border-radius:10px;

  background:#fe2c55;

  color:#fff;

  font-size:11px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-weight:bold;
}

/* =========================
   COMMENTS
========================= */

.comment-panel{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:200;

  height:55vh;

  background:#111;

  border-radius:
    18px 18px 0 0;

  transform:
    translateY(100%);

  transition:
    transform .3s ease;

  display:flex;

  flex-direction:column;
}

.comment-panel.open{
  transform:
    translateY(0);
}

.comment-header{
  height:55px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-bottom:1px solid #333;

  position:relative;

  font-weight:bold;
}

.close-comments{
  position:absolute;

  right:15px;

  border:0;

  background:transparent;

  color:#fff;

  font-size:26px;
}

.comments-list{
  flex:1;

  overflow-y:auto;

  padding:15px;
}

.comment{
  padding:10px 0;

  border-bottom:1px solid #222;

  line-height:1.4;
}

.comment strong{
  display:block;

  margin-bottom:4px;
}

.comment-input{
  display:flex;

  gap:8px;

  padding:10px;

  border-top:1px solid #333;
}

.comment-input input{
  flex:1;

  min-width:0;

  border:1px solid #444;

  background:#222;

  color:#fff;

  border-radius:22px;

  padding:12px 15px;

  outline:none;
}

.comment-input button{
  width:50px;

  border:0;

  border-radius:50%;

  background:#fff;

  color:#000;

  font-size:18px;
}

/* =========================
   SEARCH
========================= */

.search-panel{
  position:fixed;

  inset:0;

  z-index:300;

  background:#000;

  display:none;

  padding:15px;
}

.search-panel.open{
  display:block;
}

.search-top{
  display:flex;

  align-items:center;

  gap:10px;
}

.search-top input{
  flex:1;

  height:45px;

  border:1px solid #444;

  border-radius:10px;

  background:#222;

  color:#fff;

  padding:0 14px;

  font-size:16px;

  outline:none;
}

.close-search{
  width:45px;
  height:45px;

  border:0;

  border-radius:50%;

  background:#222;

  color:#fff;

  font-size:24px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  left:50%;
  bottom:90px;

  transform:
    translateX(-50%)
    translateY(20px);

  z-index:500;

  background:
    rgba(30,30,30,.95);

  color:#fff;

  padding:11px 18px;

  border-radius:22px;

  font-size:14px;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  white-space:nowrap;
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}

/* =========================
   LOADING
========================= */

.feed-loading{
  position:absolute;

  inset:0;

  z-index:10;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#000;

  color:#aaa;

  font-size:15px;

  pointer-events:none;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

  .video-item{
    max-width:500px;

    margin:auto;
  }

  .bottom-nav{
    max-width:500px;

    left:50%;
    right:auto;

    transform:
      translateX(-50%);
  }

}
</style>
</head>

<body>

<div class="app">

<main class="feed" id="feed">

  <div
    class="feed-loading"
    id="feedLoading"
  >
    ভিডিও লোড হচ্ছে...
  </div>

</main>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    type="button"
    onclick="goHome()"
  >

    <svg viewBox="0 0 24 24">
      <path d="M3 11L12 3L21 11V21H14V15H10V21H3Z"/>
    </svg>

    <span>Home</span>

  </button>


  <button
    class="nav-btn"
    type="button"
    onclick="goFriends()"
  >

    <svg viewBox="0 0 24 24">
      <circle cx="9" cy="8" r="3"/>
      <circle cx="17" cy="9" r="2.5"/>
      <path d="M3 20C3 16.5 5.5 14 9 14C12.5 14 15 16.5 15 20"/>
      <path d="M15 15C18 15 20 17 20 20"/>
    </svg>

  <button

    type="button"

  >

  </button>


  <button

    type="button"

  >

    <svg viewBox="0 0 24 24">
      <path d="M4 5H20V17H15L12 20L9 17H4Z"/>
      <path d="M8 10H16"/>
      <path d="M8 13H13"/>
    </svg>

    <span>Inbox</span>

  >

    <svg viewBox="0 0 24 24">

      <path d="M4 21C4 16.5 7.5 14 12 14C16.5 14 20 16.5 20 21"/>
    </svg>

    <span>Profile</span>

</nav>


<!-- =========================
     COMMENT PANEL
========================= -->

<div
  class="comment-panel"
  id="commentPanel"
>

  <div class="comment-header">

    Comments

    <button
      class="close-comments"
      type="button"

  </div>


  <div
    class="comments-list"
    id="commentsList"
  ></div>


  <div class="comment-input">

    <input
      id="commentInput"
      type="text"
      placeholder="Add comment..."
      autocomplete="off"
    >

    <button
      type="button"
      onclick="addComment()"

      ➤
    </button>

  </div>

</div>


<!-- =========================
     SEARCH
========================= -->

<div
  class="search-panel"
  id="searchPanel"
>

  <div class="search-top">

    <input
      id="searchInput"
      type="search"
      placeholder="Search..."
      autocomplete="off"
    >

    <button
      class="close-search"
      type="button"
      onclick="closeSearch()"
    >
      ×
    </button>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  getApps,
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  setDoc,
  updateDoc,
  arrayUnion,
  arrayRemove,
  increment,
  addDoc,
  serverTimestamp,
  runTransaction,
  query,
  orderBy
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

  authDomain:
    "world-wide-connect-62c87.firebaseapp.com",

  projectId:
    "world-wide-connect-62c87",

  storageBucket:
    "world-wide-connect-62c87.firebasestorage.app",

  messagingSenderId:
    "93178453668",

  appId:
    "1:93178453668:web:2184630caa8e61f7445031",

  measurementId:
    "G-PKFJ5NEMGQ"

};


const app =
  getApps().length
    ? getApps()[0]
    : initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   GLOBAL STATE
===================================================== */

let currentUser =
  null;

let currentProfile =
  {};

let videos =
  [];

let currentFeedMode =
  "forYou";

let currentVideoId =
  null;

let observer =
  null;

let toastTimer =
  null;

let isChangingVideo =
  false;

let lastTap =
  0;

let loadingMore =
  false;

const defaultPhoto =
  "./images/profile.png";


/* =====================================================
   TOAST
===================================================== */

function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      1800
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   CURRENT PROFILE
===================================================== */

async function loadCurrentProfile(){

  const ref =
    doc(
      db,
      "users",
      currentUser.uid
    );


  const snap =
    await getDoc(ref);


  if(!snap.exists()){

    currentProfile = {

      uid:
        currentUser.uid,

      name:
        currentUser.displayName ||
        "WWC User",

      username:
        "wwc_" +
        currentUser.uid
          .substring(
            0,
            6
          ),

      email:
        currentUser.email ||
        "",

      photoURL:
        currentUser.photoURL ||
        defaultPhoto,

      followers:
        0,

      following:
        0,

      likes:
        0,

      followerIds:
        [],

      followingIds:
        [],

      savedVideoIds:
        []

    };


    await setDoc(
      ref,
      currentProfile
    );

  }else{

    currentProfile =
      snap.data();

  }

}


/* =====================================================
   FOLLOWING IDS
===================================================== */

function getFollowingIds(){

  return Array.isArray(
    currentProfile.followingIds
  )
    ? currentProfile.followingIds
    : [];

}


/* =====================================================
   VIDEO URL
===================================================== */

function getVideoURL(
  video,
  index
){

  return (
    video.videoURL ||
    video.videoUrl ||
    video.url ||
    video.src ||
    video.fileURL ||
    (
      index % 2 === 0
        ? "./videos/video1.mp4"
        : "./videos/video2.mp4"
    )
  );

}


/* =====================================================
   USERNAME
===================================================== */

function getUsername(video){

  return String(
    video.username ||
    video.userName ||
    video.handle ||
    "wwc_user"
  )
  .replace(
    /^@/,
    ""
  );

}


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(){

  const loading =
    document.getElementById(
      "feedLoading"
    );

  loading.style.display =
    "flex";


  try{

    const snap =
      await getDocs(
        collection(
          db,
          "videos"
        )
      );


    videos = [];


    snap.forEach(
      videoDoc => {

        const data =
          videoDoc.data();


        videos.push({

          id:
            videoDoc.id,

          ...data

        });

      }
    );


    /*
      Latest videos first.
      If createdAt exists.
    */

    videos.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds ||
          0;

        const bTime =
          b.createdAt?.seconds ||
          0;

        return bTime - aTime;

      }
    );


  }catch(error){

    console.error(
      "Video load error:",
      error
    );

  }


  /*
    Local fallback
  */

  if(!videos.length){

    videos = [

/* =====================================================
   FILTER
===================================================== */

function getFilteredVideos(){

  if(
    currentFeedMode ===
    "following"
  ){

    const following =
      getFollowingIds();


    return videos.filter(
      video => {

        const creator =
          video.creatorId ||
          video.userId ||
          video.uid ||
          video.ownerId;


        return following.includes(
          creator
        );

      }
    );

  }


  /*
    Simple recommendation
    algorithm.

    Videos from followed
    creators get priority,
    then liked videos,
    then recent videos.
  */

  const following =
    getFollowingIds();


  return [...videos].sort(
    (a,b) => {

      const aCreator =
        a.creatorId ||
        a.userId ||
        a.uid ||
        a.ownerId;


      const bCreator =
        b.creatorId ||
        b.userId ||
        b.uid ||
        b.ownerId;


      const aFollowing =
        following.includes(
          aCreator
        )
          ? 1
          : 0;


      const bFollowing =
        following.includes(
          bCreator
        )
          ? 1
          : 0;


      const aLikes =
        Number(
          a.likes || 0
        );


      const bLikes =
        Number(
          b.likes || 0
        );


      return (
        (bFollowing - aFollowing) * 100000 +
        (bLikes - aLikes)
      );

    }
  );

}

/* =====================================================
   VIDEO CLICK
===================================================== */

function handleVideoClick(
  event
){

  if(
    event.target.closest(
      "button"
    )
  ){
    return;
  }


  const item =
    event.currentTarget;


  const now =
    Date.now();


  const difference =
    now - lastTap;


  if(
    difference > 0 &&
    difference < 320
  ){

    const likeButton =
      item.querySelector(
        ".like-btn"
      );


    if(
      !likeButton.classList.contains(
        "liked"
      )
    ){

      const videoId =
        item.dataset.videoId;


      toggleLike(
        item,
        videoId,
        likeButton
      );

    }


    const heart =
      item.querySelector(
        ".double-heart"
      );


    heart.classList.remove(
      "show"
    );


    void heart.offsetWidth;


    heart.classList.add(
      "show"
    );


    lastTap =
      0;


    return;

  }


  lastTap =
    now;


  const video =
    item.querySelector(
      ".video"
    );


  const indicator =
    item.querySelector(
      ".pause-indicator"
    );


  if(video.paused){

    playVideo(
      video
    );

    indicator.classList.remove(
      "show"
    );

  }else{

    video.pause();

    indicator.classList.add(
      "show"
    );

  }

}


/* =====================================================
   PLAY ONE VIDEO ONLY
===================================================== */

function playOnlyVideo(
  index
){

  const items =
    [
      ...document.querySelectorAll(
        ".video-item"
      )
    ];


  if(
    !items.length ||
    !items[index]
  ){
    return;
  }


  items.forEach(
    (item,i) => {

      const video =
        item.querySelector(
          ".video"
        );


      if(i === index){

        playVideo(
          video
        );

        currentVideoId =
          item.dataset.videoId;

        preloadNearbyVideos(
          i
        );

      }else{

        video.pause();

      }

    }
  );

}


/* =====================================================
   PLAY VIDEO
===================================================== */

function playVideo(
  video
){

  if(!video){
    return;
  }


  video.muted =
    video.muted !== false
      ? true
      : video.muted;


  const promise =
    video.play();


  if(
    promise &&
    promise.catch
  ){

    promise.catch(
      () => {

        /*
          Mobile browser may
          block autoplay.
        */

        video.muted =
          true;

        video.play()
          .catch(
            () => {}
          );

      }
    );

  }

}


/* =====================================================
   PRELOAD NEARBY
===================================================== */

function preloadNearbyVideos(
  index
){

  const items =
    [
      ...document.querySelectorAll(
        ".video-item"
      )
    ];


  const indexes = [
    index - 1,
    index + 1,
    index + 2
  ];


  indexes.forEach(
    i => {

      if(
        !items[i]
      ){
        return;
      }


      const video =
        items[i].querySelector(
          ".video"
        );


      if(video){

        video.preload =
          "auto";

        try{

          video.load();

        }catch(error){}

      }

    }
  );

}


/* =====================================================
   INTERSECTION OBSERVER
===================================================== */

function setupVideoObserver(){

  if(observer){

    observer.disconnect();

  }


  const items =
    document.querySelectorAll(
      ".video-item"
    );


  observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(
          entry => {

            if(
              entry.isIntersecting &&
              entry.intersectionRatio >= .70
            ){

              const index =
                [
                  ...items
                ].indexOf(
                  entry.target
                );


              if(index < 0){
                return;
              }


              playOnlyVideo(
                index
              );


              /*
                Near bottom হলে
                future videos load করার
                প্রস্তুতি।
              */

              if(
                index >=
                items.length - 2
              ){

                loadMoreVideos();

              }

            }

          }
        );

      },
      {
        threshold:[
          .70,
          .85,
          1
        ]
      }
    );


  items.forEach(
    item =>
      observer.observe(
        item
      )
  );

}


/* =====================================================
   LOAD MORE
===================================================== */

async function loadMoreVideos(){

  if(
    loadingMore ||
    !currentUser
  ){
    return;
  }


  /*
    Current Firestore implementation
    already loads all videos.

    Therefore if all videos are
    already loaded, do nothing.

    This function is kept ready for
    pagination later.
  */

  loadingMore =
    true;


  try{

    /*
      Re-check Firestore for newly
      uploaded videos.
    */

    const snap =
      await getDocs(
        collection(
          db,
          "videos"
        )
      );


    const existingIds =
      new Set(
        videos.map(
          video => video.id
        )
      );


    let added =
      false;


    snap.forEach(
      videoDoc => {

        if(
          !existingIds.has(
            videoDoc.id
          )
        ){

          videos.push({

            id:
              videoDoc.id,

            ...videoDoc.data()

          });


          added =
            true;

        }

      }
    );


    if(added){

      const oldCount =
        document.querySelectorAll(
          ".video-item"
        ).length;


      /*
        Add only new videos.
      */

      const newVideos =
        videos.slice(
          oldCount
        );


      newVideos.forEach(
        (video,index) => {

          const item =
            createVideoItem(
              video,
              oldCount + index
            );


          document
            .getElementById(
              "feed"
            )
            .appendChild(
              item
            );

        }
      );


      setupVideoObserver();

    }

  }catch(error){

    console.warn(
      "Load more error:",
      error
    );

  }finally{

    loadingMore =
      false;

  }

}

/* =====================================================
   LIKE
===================================================== */

async function toggleLike(
  item,
  videoId,
  button
){

  if(!currentUser){
    return;
  }


  button.disabled =
    true;


  try{

    /*
      Local fallback
    */

    if(
      videoId.startsWith(
        "local-video-"
      )
    ){

      const liked =
        button.classList.contains(
          "liked"
        );


      const countElement =
        button.querySelector(
          ".action-count"
        );


      const oldCount =
        Number(
          countElement.textContent
        ) || 0;


      const newCount =
        liked
          ? Math.max(
              0,
              oldCount - 1
            )
          : oldCount + 1;


      button.classList.toggle(
        "liked",
        !liked
      );


      countElement.textContent =
        newCount;


      showToast(
        liked
          ? "Like সরানো হয়েছে"
          : "Liked ❤️"
      );


      return;

    }


    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    await runTransaction(
      db,
      async transaction => {

        const snap =
          await transaction.get(
            videoRef
          );


        if(!snap.exists()){

          throw new Error(
            "Video not found"
          );

        }


        const data =
          snap.data();


        const likedBy =
          Array.isArray(
            data.likedBy
          )
            ? data.likedBy
            : [];


        const liked =
          likedBy.includes(
            currentUser.uid
          );


        if(liked){

          transaction.update(
            videoRef,
            {

              likedBy:
                arrayRemove(
                  currentUser.uid
                ),

              likes:
                increment(-1)

            }
          );

        }else{

          transaction.update(
            videoRef,
            {

              likedBy:
                arrayUnion(
                  currentUser.uid
                ),

              likes:
                increment(1)

            }
          );

        }

      }
    );


    button.classList.toggle(
      "liked"
    );


    const newSnap =
      await getDoc(
        videoRef
      );


    const count =
      Number(
        newSnap.data()?.likes ||
        0
      );


    button
      .querySelector(
        ".action-count"
      )
      .textContent =
        Math.max(
          0,
          count
        );


    showToast(
      button.classList.contains(
        "liked"
      )
        ? "Liked ❤️"
        : "Like সরানো হয়েছে"
    );


  }catch(error){

    console.error(
      "LIKE ERROR:",
      error
    );


    showToast(
      "Like সংরক্ষণ করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}

          ? "Saved হয়েছে"
          : "Saved থেকে সরানো হয়েছে"
      );


      return;

    }


    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const userRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const videoSnap =
      await getDoc(
        videoRef
      );


    if(!videoSnap.exists()){

      throw new Error(
        "Video not found"
      );

    }


    const data =
      videoSnap.data();


    const savedBy =
      Array.isArray(
        data.savedBy
      )
        ? data.savedBy
        : [];


    const saved =
      savedBy.includes(
        currentUser.uid
      );


    if(saved){

      await updateDoc(
        videoRef,
        {

          savedBy:
            arrayRemove(
              currentUser.uid
            ),

          saves:
            increment(-1)

        }
      );


      await updateDoc(
        userRef,
        {

          savedVideoIds:
            arrayRemove(
              videoId
            )

        }
      );


      button.classList.remove(
        "saved"
      );


      showToast(
        "Saved থেকে সরানো হয়েছে"
      );


    }else{

      await updateDoc(
        videoRef,
        {

          savedBy:
            arrayUnion(
              currentUser.uid
            ),

          saves:
            increment(1)

        }
      );


      await updateDoc(
        userRef,
        {

          savedVideoIds:
            arrayUnion(
              videoId
            )

        }
      );


      button.classList.add(
        "saved"
      );


      showToast(
        "ভিডিও Saved হয়েছে"
      );

    }


    const updated =
      await getDoc(
        videoRef
      );


    const count =
      Number(
        updated.data()?.saves ||
        0
      );


    button
      .querySelector(
        ".action-count"
      )
      .textContent =
        Math.max(
          0,
          count
        );


  }catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );


    showToast(
      "Save সংরক্ষণ করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}


/* =====================================================
   FOLLOW
===================================================== */

async function toggleFollow(
  targetUid,
  button
){

  if(
    !currentUser ||
    !targetUid ||
    targetUid ===
      currentUser.uid
  ){
    return;
  }


  button.disabled =
    true;


  try{

    const myRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const targetRef =
      doc(
        db,
        "users",
        targetUid
      );


    const mySnap =
      await getDoc(
        myRef
      );


    const targetSnap =
      await getDoc(
        targetRef
      );


    if(
      !mySnap.exists() ||
      !targetSnap.exists()
    ){

      throw new Error(
        "Profile not found"
      );

    }


    const myData =
      mySnap.data();


    const followingIds =
      Array.isArray(
        myData.followingIds
      )
        ? myData.followingIds
        : [];


    const alreadyFollowing =
      followingIds.includes(
        targetUid
      );


    if(alreadyFollowing){

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayRemove(
              targetUid
            ),

          following:
            increment(-1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayRemove(
              currentUser.uid
            ),

          followers:
            increment(-1)

        }
      );


      button.classList.remove(
        "following"
      );


      button.textContent =
        "+";


      showToast(
        "Unfollow করা হয়েছে"
      );


    }else{

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayUnion(
              targetUid
            ),

          following:
            increment(1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayUnion(
              currentUser.uid
            ),

          followers:
            increment(1)

        }
      );


      button.classList.add(
        "following"
      );


      button.textContent =
        "✓";


      showToast(
        "Following করা হয়েছে"
      );

    }


    currentProfile =
      (
        await getDoc(
          myRef
        )
      ).data();


  }catch(error){

    console.error(
      "FOLLOW ERROR:",
      error
    );


    showToast(
      "Follow পরিবর্তন করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}

/* =====================================================
   LOAD COMMENTS
===================================================== */

async function loadComments(
  videoId
){

  const list =
    document.getElementById(
      "commentsList"
    );


  list.innerHTML = `

    <div style="
      text-align:center;
      color:#888;
      padding:25px;
    ">
      Comments লোড হচ্ছে...
    </div>

  `;


  try{

    const commentsRef =
      collection(
        db,
        "videos",
        videoId,
        "comments"
      );


    const snap =
      await getDocs(
        commentsRef
      );


    list.innerHTML =
      "";


    if(snap.empty){

      list.innerHTML = `

        <div style="
          text-align:center;
          color:#777;
          padding:30px;
        ">
          এখনো কোনো Comment নেই।
        </div>

      `;


      return;

    }


    const comments =
      [];


    snap.forEach(
      commentDoc => {

        comments.push({
          id:
            commentDoc.id,

          ...commentDoc.data()

        });

      }
    );


    comments.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds ||
          0;


        const bTime =
          b.createdAt?.seconds ||
          0;


        return aTime - bTime;

      }
    );


    comments.forEach(
      data => {

        const comment =
          document.createElement(
            "div"
          );


        comment.className =
          "comment";


        comment.innerHTML = `

          <strong>
            ${escapeHtml(
              data.username ||
              data.name ||
              "WWC User"
            )}
          </strong>

          ${escapeHtml(
            data.text ||
            ""
          )}

        `;


        list.appendChild(
          comment
        );

      }
    );


  }catch(error){

    console.error(
      "COMMENTS ERROR:",
      error
    );


    list.innerHTML = `

      <div style="
        text-align:center;
        color:#ff667f;
        padding:25px;
      ">
        Comments লোড করা যায়নি।
      </div>

    `;

  }

}


/* =====================================================
   ADD COMMENT
===================================================== */

async function addComment(){

  const input =
    document.getElementById(
      "commentInput"
    );


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  if(
    !currentUser ||
    !currentVideoId
  ){
    return;
  }


  const button =
    document.querySelector(
      ".comment-input button"
    );


  button.disabled =
    true;


  try{

    /*
      Local video comments
      cannot be stored in Firestore
      because local video has no
      Firestore document.
    */

    if(
      currentVideoId.startsWith(
        "local-video-"
      )
    ){

      showToast(
        "Local ভিডিওতে Comment database-এ সংরক্ষণ করা যাবে না"
      );


      input.value =
        "";


      return;

    }


    const username =
      String(
        currentProfile.username ||
        currentProfile.name ||
        "WWC User"
      )
      .replace(
        /^@/,
        ""
      );


    await addDoc(

      collection(
        db,
        "videos",
        currentVideoId,
        "comments"
      ),

      {

        uid:
          currentUser.uid,

        username:
          username,

        name:
          currentProfile.name ||
          "WWC User",

        text:
          text,

        createdAt:
          serverTimestamp()

      }

    );


    const videoRef =
      doc(
        db,
        "videos",
        currentVideoId
      );


    await updateDoc(
      videoRef,
      {

        comments:
          increment(1)

      }
    );


    input.value =
      "";


    /*
      Update visible comment
      count.
    */

    const item =
      document.querySelector(
        `.video-item[data-video-id="${CSS.escape(
          currentVideoId
        )}"]`
      );


    if(item){

      const commentButton =
        item.querySelector(
          '[data-action="comment"]'
        );


      const count =
        commentButton
          ?.querySelector(
            ".action-count"
          );


      if(count){

        count.textContent =
          Number(
            count.textContent
          ) + 1;

      }

    }


    await loadComments(
      currentVideoId
    );


    showToast(
      "Comment সংরক্ষণ হয়েছে"
    );


  }catch(error){

    console.error(
      "COMMENT ERROR:",
      error
    );


    showToast(
      "Comment সংরক্ষণ করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}

async function shareVideo(
  videoId
){

  const url =
    new URL(
      window.location.href
    );


  url.searchParams.set(
    "video",
    videoId
  );


  const shareData = {

    title:
      "WWC-Core",

    text:
      "এই ভিডিওটি WWC-Core এ দেখুন।",

    url:
      url.toString()

  };


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );

      showToast(
        "Share হয়েছে"
      );

    }else{

      await navigator.clipboard.writeText(
        url.toString()
      );


      showToast(
        "ভিডিও Link Copy হয়েছে"
      );

    }

  }catch(error){

    if(
      error?.name !==
      "AbortError"
    ){

      try{

        await navigator.clipboard.writeText(
          url.toString()
        );


        showToast(
          "ভিডিও Link Copy হয়েছে"
        );

      }catch(e){

        showToast(
          "Share করা যায়নি"
        );

      }

    }

  }

}

/* =====================================================

===================================================== */

const feed =

  );


let scrollTimer =
  null;


feed.addEventListener(
  "scroll",
  () => {

    clearTimeout(
      scrollTimer
    );

      setTimeout(
        () => {

          snapToNearestVideo();

        },
        90
      );

  },
  {
    passive:true
  }
);


/* =====================================================
   SNAP TO NEAREST
===================================================== */

function snapToNearestVideo(){

  const items =
    [
      ...document.querySelectorAll(
        ".video-item"
      )
    ];


  if(!items.length){
    return;
  }


  const scrollTop =
    feed.scrollTop;


  let closest =
    0;


  let smallest =
    Infinity;


  items.forEach(
    (item,index) => {

      const distance =
        Math.abs(
          item.offsetTop -
          scrollTop
        );


      if(
        distance <
        smallest
      ){

        smallest =
          distance;

        closest =
          index;

      }

    }
  );


  if(
    smallest <
    window.innerHeight * .45
  ){

    const item =
      items[closest];


    item.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });


    playOnlyVideo(
      closest
    );

  }

}


/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.hidden
    ){

      document
        .querySelectorAll(
          ".video"
        )
        .forEach(
          video =>
            video.pause()
        );

    }else{

      const items =
        [
          ...document.querySelectorAll(
            ".video-item"
          )
        ];


      if(!items.length){
        return;
      }


      let best =
        0;


      let bestRatio =
        0;


      items.forEach(
        (item,index) => {

          const rect =
            item.getBoundingClientRect();


          const visibleTop =
            Math.max(
              0,
              rect.top
            );


          const visibleBottom =
            Math.min(
              window.innerHeight,
              rect.bottom
            );


          const visible =
            Math.max(
              0,
              visibleBottom -
              visibleTop
            );


          const ratio =
            visible /
            window.innerHeight;


          if(
            ratio >
            bestRatio
          ){

            bestRatio =
              ratio;

            best =
              index;

          }

        }
      );


      playOnlyVideo(
        best
      );

    }

  }
);
