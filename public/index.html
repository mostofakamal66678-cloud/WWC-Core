<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WWC - World Wide Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== রিসেট ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }
        .app {
            max-width: 430px;
            width: 100%;
            height: 100vh;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* ===== হেডার ===== */
        .header {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            max-width: 430px;
            width: 100%;
            z-index: 30;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
        }
        .header h1 {
            color: white;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .header h1 i {
            color: #ff3b6f;
            margin-right: 6px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* ===== ট্যাব (For You / Following) – ডান পাশে ===== */
        .tabs {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tabs button {
            background: none;
            border: none;
            color: #aaa;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 20px;
            transition: 0.3s;
            letter-spacing: 0.3px;
        }
        .tabs button.active {
            color: white;
            background: rgba(255, 255, 255, 0.12);
        }
        .tabs button:hover {
            color: white;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-actions button {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.8;
            transition: 0.2s;
            padding: 4px 6px;
            border-radius: 6px;
        }
        .header-actions button:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== ফিড – ফুলস্ক্রিন ===== */
        .feed {
            height: 100vh;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }
        .feed::-webkit-scrollbar {
            display: none;
        }
        .video-card {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            background: #000;
            overflow: hidden;
        }
        .video-card video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== ওভারলে ===== */
        .video-overlay {
            position: relative;
            z-index: 2;
            padding: 20px 16px 30px 16px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.65));
            color: white;
        }
        .video-user {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .video-user span {
            font-weight: 400;
            font-size: 13px;
            color: #ccc;
            background: rgba(255, 255, 255, 0.12);
            padding: 2px 12px;
            border-radius: 20px;
            transition: 0.3s;
            cursor: pointer;
        }
        .video-user span:hover {
            background: #ff3b6f;
            color: white;
        }
        .video-desc {
            font-size: 14px;
            margin-bottom: 4px;
            line-height: 1.4;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
        .video-hashtags {
            font-size: 13px;
            color: #4fc3f7;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }

        /* ===== মিউজিক ব্যাজ ===== */
        .music-badge {
            position: absolute;
            bottom: 80px;
            left: 16px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 14px 4px 8px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            transition: 0.3s;
        }
        .music-badge:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .music-badge i {
            font-size: 14px;
            color: #ff3b6f;
            animation: spin 4s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== অ্যাকশন বাটন ===== */
        .video-actions {
            position: absolute;
            right: 14px;
            bottom: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            z-index: 3;
        }
        .video-actions button {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            opacity: 0.9;
        }
        .video-actions button i {
            transition: 0.2s;
        }
        .video-actions button span {
            font-size: 11px;
            font-weight: 600;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
        }
        .video-actions button:hover {
            transform: scale(1.08);
            opacity: 1;
        }
        .video-actions .liked {
            color: #ff3b6f;
        }
        .video-actions .liked i {
            animation: likePop 0.3s ease;
        }
        @keyframes likePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }
        .video-actions .bookmarked {
            color: #4fc3f7;
        }

        /* ===== মোর বাটন ===== */
        .more-btn {
            position: absolute;
            right: 14px;
            top: 70px;
            z-index: 3;
            background: none;
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            opacity: 0.8;
            transition: 0.2s;
        }
        .more-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* ===== নিচের নেভিগেশন ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            max-width: 430px;
            width: 100%;
            z-index: 30;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-around;
            padding: 8px 0 14px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .bottom-nav button {
            background: none;
            border: none;
            color: #888;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: 0.2s;
            padding: 4px 12px;
            border-radius: 8px;
        }
        .bottom-nav button i {
            transition: 0.2s;
        }
        .bottom-nav button.active {
            color: white;
        }
        .bottom-nav button.active i {
            transform: scale(1.05);
        }
        .bottom-nav button span {
            font-size: 10px;
            font-weight: 500;
        }
        .bottom-nav button:hover {
            color: #ddd;
        }

        /* ===== মডাল ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            max-width: 430px;
            width: 100%;
            height: 100vh;
            z-index: 50;
            background: rgba(0, 0, 0, 0.92);
            padding: 60px 20px 20px;
            color: white;
            overflow-y: auto;
            backdrop-filter: blur(6px);
        }
        .modal .close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            opacity: 0.7;
            transition: 0.2s;
        }
        .modal .close:hover {
            opacity: 1;
            transform: rotate(90deg);
        }
        .modal h2 {
            text-align: center;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .modal input,
        .modal textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .modal input:focus,
        .modal textarea:focus {
            border-color: #ff3b6f;
        }
        .modal .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: #ff3b6f;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .modal .btn-primary:hover {
            background: #e62e5c;
            transform: scale(1.01);
        }
        .modal .comment-item {
            padding: 8px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 6px;
        }
        .modal .comment-item strong {
            color: #ff3b6f;
        }
        .modal .comment-item span {
            color: #aaa;
            font-size: 13px;
        }

        /* ===== রেসপন্সিভ ===== */
        @media (max-width: 430px) {
            .video-actions {
                right: 10px;
                bottom: 100px;
                gap: 18px;
            }
            .video-actions button {
                font-size: 24px;
            }
            .video-actions button span {
                font-size: 10px;
            }
            .header h1 {
                font-size: 18px;
            }
            .music-badge {
                font-size: 12px;
                bottom: 70px;
                left: 12px;
                padding: 3px 10px 3px 6px;
            }
            .more-btn {
                right: 10px;
                top: 60px;
                font-size: 18px;
            }
            .tabs button {
                font-size: 12px;
                padding: 3px 8px;
            }
            .header-actions {
                gap: 4px;
            }
            .header-actions button {
                font-size: 16px;
                padding: 2px 4px;
            }
            .video-overlay {
                padding: 16px 12px 24px 12px;
            }
            .video-user {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- ===== হেডার ===== -->
        <div class="header">
            <h1><i class="fas fa-globe-americas"></i> WWC</h1>
            <div class="header-right">
                <!-- ট্যাব (For You / Following) – ডান পাশে -->
                <div class="tabs">
                    <button class="active" onclick="switchTab('forYou')">For You</button>
                    <button onclick="switchTab('following')">Following</button>
                </div>
                <div class="header-actions">
                    <button onclick="openModal('upload')"><i class="fas fa-plus-circle"></i></button>
                    <button onclick="openModal('profile')"><i class="fas fa-user-circle"></i></button>
                </div>
            </div>
        </div>

        <!-- ===== ভিডিও ফিড ===== -->
        <div class="feed" id="feed">

            <!-- ===== ভিডিও ১ ===== -->
            <div class="video-card">
                <video src="videos/video1.mp4" muted playsinline></video>
                <button class="more-btn" onclick="moreOptions()">⋯</button>
                <div class="music-badge" onclick="viewMusic()">
                    <i class="fas fa-music"></i> Original Sound
                </div>
                <div class="video-overlay">
                    <div class="video-user" onclick="openModal('profile')">
                        @wwc_user
                        <span onclick="event.stopPropagation(); followUser(this)">Follow</span>
                    </div>
                    <div class="video-desc">🌍 বিশ্বকে সংযুক্ত করি</div>
                    <div class="video-hashtags">#wwc #connect #bengali</div>
                </div>
                <div class="video-actions">
                    <button onclick="likeVideo(this)">
                        <i class="fas fa-heart"></i>
                        <span>1.2K</span>
                    </button>
                    <button onclick="openModal('comments')">
                        <i class="fas fa-comment"></i>
                        <span>45</span>
                    </button>
                    <button onclick="shareVideo()">
                        <i class="fas fa-share"></i>
                        <span>Share</span>
                    </button>
                    <button onclick="bookmarkVideo(this)">
                        <i class="fas fa-bookmark"></i>
                        <span>Save</span>
                    </button>
                </div>
            </div>

            <!-- ===== ভিডিও ২ ===== -->
            <div class="video-card">
                <video src="videos/video2.mp4" muted playsinline></video>
                <button class="more-btn" onclick="moreOptions()">⋯</button>
                <div class="music-badge" onclick="viewMusic()">
                    <i class="fas fa-music"></i> Viral Beats
                </div>
                <div class="video-overlay">
                    <div class="video-user" onclick="openModal('profile')">
                        @gk.shopona
                        <span onclick="event.stopPropagation(); followUser(this)">Follow</span>
                    </div>
                    <div class="video-desc">#কিভিটিএবানায় #foryoupage</div>
                    <div class="video-hashtags">#bdtiktokofficial #trending</div>
                </div>
                <div class="video-actions">
                    <button onclick="likeVideo(this)">
                        <i class="fas fa-heart"></i>
                        <span>8.5K</span>
                    </button>
                    <button onclick="openModal('comments')">
                        <i class="fas fa-comment"></i>
                        <span>230</span>
                    </button>
                    <button onclick="shareVideo()">
                        <i class="fas fa-share"></i>
                        <span>Share</span>
                    </button>
                    <button onclick="bookmarkVideo(this)">
                        <i class="fas fa-bookmark"></i>
                        <span>Save</span>
                    </button>
                </div>
            </div>

            <!-- ===== ভিডিও ৩ ===== -->
            <div class="video-card">
                <video src="videos/video3.mp4" muted playsinline></video>
                <button class="more-btn" onclick="moreOptions()">⋯</button>
                <div class="music-badge" onclick="viewMusic()">
                    <i class="fas fa-music"></i> Comedy Mix
                </div>
                <div class="video-overlay">
                    <div class="video-user" onclick="openModal('profile')">
                        @funny_clips
                        <span onclick="event.stopPropagation(); followUser(this)">Follow</span>
                    </div>
                    <div class="video-desc">হাসতে ভোলেন না 😂</div>
                    <div class="video-hashtags">#comedy #funny #reels</div>
                </div>
                <div class="video-actions">
                    <button onclick="likeVideo(this)">
                        <i class="fas fa-heart"></i>
                        <span>20.1K</span>
                    </button>
                    <button onclick="openModal('comments')">
                        <i class="fas fa-comment"></i>
                        <span>3.4K</span>
                    </button>
                    <button onclick="shareVideo()">
                        <i class="fas fa-share"></i>
                        <span>Share</span>
                    </button>
                    <button onclick="bookmarkVideo(this)">
                        <i class="fas fa-bookmark"></i>
                        <span>Save</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- ===== নিচের নেভিগেশন ===== -->
        <div class="bottom-nav">
            <button class="active" onclick="navigateTo('home', this)">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </button>
            <button onclick="navigateTo('explore', this)">
                <i class="fas fa-compass"></i>
                <span>Explore</span>
            </button>
            <button onclick="navigateTo('upload', this)">
                <i class="fas fa-plus-circle"></i>
                <span>Upload</span>
            </button>
            <button onclick="navigateTo('inbox', this)">
                <i class="fas fa-inbox"></i>
                <span>Inbox</span>
            </button>
            <button onclick="navigateTo('profile', this)">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </button>
        </div>

        <!-- ===== মডাল ===== -->
        <div id="modal" class="modal">
            <button class="close" onclick="closeModal()">✕</button>
            <div id="modalContent"></div>
        </div>

    </div>

    <script>
        // ============================================================
        // জাভাস্ক্রিপ্ট
        // ============================================================

        const videos = document.querySelectorAll('.video-card video');
        const feed = document.getElementById('feed');

        function playVisibleVideo() {
            videos.forEach(v => v.pause());
            const scrollY = feed.scrollTop;
            const height = feed.clientHeight;
            const index = Math.round(scrollY / height);
            if (index >= 0 && index < videos.length) {
                const video = videos[index];
                video.play().catch(() => {});
            }
        }
        feed.addEventListener('scroll', playVisibleVideo);
        window.addEventListener('load', () => setTimeout(playVisibleVideo, 300));

        function likeVideo(btn) {
            const icon = btn.querySelector('i');
            const span = btn.querySelector('span');
            let count = parseInt(span.innerText.replace(/,/g, ''));
            btn.classList.toggle('liked');
            if (btn.classList.contains('liked')) {
                span.innerText = (count + 1).toLocaleString();
                icon.style.animation = 'likePop 0.3s ease';
                setTimeout(() => icon.style.animation = '', 300);
            } else {
                span.innerText = (count - 1).toLocaleString();
            }
        }

        function bookmarkVideo(btn) {
            btn.classList.toggle('bookmarked');
            const span = btn.querySelector('span');
            if (btn.classList.contains('bookmarked')) {
                span.innerText = 'Saved';
                btn.querySelector('i').style.animation = 'likePop 0.2s ease';
                setTimeout(() => btn.querySelector('i').style.animation = '', 200);
            } else {
                span.innerText = 'Save';
            }
        }

        function followUser(el) {
            if (el.innerText === 'Follow') {
                el.innerText = 'Following';
                el.style.background = '#ff3b6f';
                el.style.color = 'white';
            } else {
                el.innerText = 'Follow';
                el.style.background = 'rgba(255,255,255,0.12)';
                el.style.color = '#ccc';
            }
        }

        document.querySelectorAll('.video-card video').forEach(video => {
            video.addEventListener('dblclick', () => {
                video.muted = !video.muted;
                const likeBtn = video.closest('.video-card').querySelector('.video-actions button:first-child');
                if (likeBtn && !likeBtn.classList.contains('liked')) {
                    likeVideo(likeBtn);
                }
            });
        });

        function switchTab(tab) {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            if (tab === 'forYou') {
                document.querySelector('.tabs button:first-child').classList.add('active');
            } else {
                document.querySelector('.tabs button:last-child').classList.add('active');
            }
            alert(`"${tab}" ট্যাব শীঘ্রই লাইভ হবে!`);
        }

        function openModal(type) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            modal.style.display = 'block';

            if (type === 'comments') {
                content.innerHTML = `
                    <h2><i class="fas fa-comment"></i> কমেন্ট</h2>
                    <div style="margin-bottom:12px;">
                        <div class="comment-item"><strong>@user1</strong> <span>দারুণ ভিডিও! 👏</span></div>
                        <div class="comment-item"><strong>@user2</strong> <span>খুব সুন্দর ❤️</span></div>
                        <div class="comment-item"><strong>@friend3</strong> <span>এটা আমার fav</span></div>
                    </div>
                    <input type="text" placeholder="কমেন্ট লিখুন..." id="commentInput" />
                    <button class="btn-primary" onclick="postComment()"><i class="fas fa-paper-plane"></i> পোস্ট করুন</button>
                `;
            } else if (type === 'upload') {
                content.innerHTML = `
                    <h2><i class="fas fa-upload"></i> ভিডিও আপলোড</h2>
                    <input type="text" placeholder="শিরোনাম" id="uploadTitle" />
                    <textarea rows="3" placeholder="বিবরণ" id="uploadDesc"></textarea>
                    <input type="file" accept="video/*" id="uploadFile" />
                    <input type="text" placeholder="হ্যাশট্যাগ (যেমন: #fun)" id="uploadTags" />
                    <button class="btn-primary" onclick="uploadVideo()"><i class="fas fa-cloud-upload-alt"></i> আপলোড</button>
                `;
            } else if (type === 'profile') {
                content.innerHTML = `
                    <h2><i class="fas fa-user-circle"></i> প্রোফাইল</h2>
                    <div style="text-align:center; font-size:64px; margin:10px 0;">👤</div>
                    <h3 style="text-align:center;">@wwc_user</h3>
                    <p style="text-align:center; color:#aaa;">🌍 বিশ্বকে সংযুক্ত করি</p>
                    <div style="display:flex; justify-content:space-around; margin:16px 0;">
                        <div><strong>120</strong><br><span style="color:#aaa;">Posts</span></div>
                        <div><strong>1.5K</strong><br><span style="color:#aaa;">Followers</span></div>
                        <div><strong>850</strong><br><span style="color:#aaa;">Following</span></div>
                    </div>
                    <button class="btn-primary" onclick="alert('প্রোফাইল এডিট ডেমো!')">✏️ প্রোফাইল এডিট</button>
                    <button class="btn-primary" style="margin-top:10px; background:#444;" onclick="alert('লগআউট ডেমো!')">🚪 লগআউট</button>
                `;
            }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function postComment() {
            const input = document.getElementById('commentInput');
            if (input && input.value.trim()) {
                alert(`✅ "${input.value}" কমেন্ট পোস্ট করা হয়েছে!`);
                input.value = '';
            } else {
                alert('⚠️ দয়া করে কিছু লিখুন!');
            }
        }

        function uploadVideo() {
            const title = document.getElementById('uploadTitle').value;
            const desc = document.getElementById('uploadDesc').value;
            const file = document.getElementById('uploadFile').files[0];
            if (!file) {
                alert('⚠️ দয়া করে একটি ভিডিও ফাইল নির্বাচন করুন!');
                return;
            }
            alert(`✅ "${title || 'শিরোনামহীন'}" আপলোডের জন্য প্রস্তুত!\n📁 ${file.name}\n(বর্তমানে ডেমো)`);
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({
                    title: 'WWC ভিডিও',
                    text: 'দেখুন এই দারুণ ভিডিও! 🌍',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    alert('✅ শেয়ার লিংক কপি করা হয়েছে!');
                }).catch(() => {
                    alert('🔗 শেয়ার লিংক: ' + window.location.href);
                });
            }
        }

        function viewMusic() {
            alert('🎵 এই ভিডিওর সাউন্ড: Original Sound\n(শীঘ্রই আরও তথ্য আসছে!)');
        }

        function moreOptions() {
            const choice = confirm('📌 রিপোর্ট করুন\n📌 কপি লিংক\n📌 ইউজার ব্লক করুন\n\n"OK" → রিপোর্ট, "Cancel" → বাতিল');
            if (choice) {
                alert('✅ ভিডিও রিপোর্ট করা হয়েছে!');
            }
        }

        function navigateTo(page, btn) {
            document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            if (page === 'upload') openModal('upload');
            else if (page === 'profile') openModal('profile');
            else if (page === 'inbox') alert('📩 ইনবক্স শীঘ্রই আসছে!');
            else if (page === 'explore') alert('🔍 এক্সপ্লোর শীঘ্রই আসছে!');
            else if (page === 'home') closeModal();
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>

</body>
</html>
