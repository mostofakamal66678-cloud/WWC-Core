<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>World Wide Connect</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body>

  <div id="app">

    <!-- TOP BAR -->
    <header class="wwc-top-bar">

      <div class="wwc-top-tabs">

        <button
          id="followingTab"
          class="wwc-top-tab"
          type="button"
        >
          Following
        </button>

        <button
          id="forYouTab"
          class="wwc-top-tab active"
          type="button"
        >
          For You
        </button>

      </div>

      <button
        id="searchBtn"
        class="wwc-search-btn"
        type="button"
        aria-label="Search"
      >
        🔍
      </button>

    </header>


    <!-- VIDEO FEED -->
    <main
      id="video-feed"
      aria-label="WWC Video Feed"
    >

      <div class="feed-loading">
        <div class="loading-icon">⏳</div>
        <div>Video Feed Loading...</div>
      </div>

    </main>


    <!-- PROFILE MENU -->
    <div
      id="profileMenu"
      class="profile-menu"
      aria-hidden="true"
    >

      <div class="profile-menu-header">

        <div class="profile-menu-title">
          👤 My Profile
        </div>

        <button
          id="profileMenuClose"
          class="profile-menu-close"
          type="button"
        >
          ✕
        </button>

      </div>

      <button
        id="profileBtnMenu"
        class="profile-menu-btn"
        type="button"
      >
        👤 Profile
      </button>

      <button
        id="loginBtn"
        class="profile-menu-btn"
        type="button"
      >
        🔐 Login / Register
      </button>

      <button
        id="logoutBtn"
        class="profile-menu-btn logout-menu-btn"
        type="button"
      >
        🚪 Logout
      </button>

    </div>


    <!-- COMMENT BOX -->
    <div
      id="commentBox"
      class="comment-box"
      aria-hidden="true"
    >

      <div class="comment-title">
        <span>💬</span>
        <span>Comments</span>

        <button
          id="commentClose"
          class="comment-close"
          type="button"
        >
          ✕
        </button>
      </div>

      <div
        id="commentsList"
        class="comments-list"
      ></div>

      <div class="comment-input-area">

        <textarea
          id="commentInput"
          placeholder="Write a comment..."
          maxlength="500"
        ></textarea>

        <button
          id="commentSend"
          type="button"
        >
          Send
        </button>

      </div>

    </div>


    <!-- VIDEO UPLOAD INPUT -->
    <input
      id="videoUpload"
      type="file"
      accept="video/*"
      hidden
    >


    <!-- BOTTOM NAVIGATION -->
    <nav
      class="wwc-bottom-nav"
      aria-label="Main navigation"
    >

      <button
        class="wwc-nav-btn active"
        id="homeBtn"
        type="button"
      >
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </button>


      <button
        class="wwc-nav-btn"
        id="friendsBtn"
        type="button"
      >
        <span class="nav-icon">👥</span>
        <span class="nav-label">Friends</span>
      </button>


      <button
        id="uploadBtn"
        class="wwc-create-btn"
        type="button"
        aria-label="Upload Video"
      >
        <span>+</span>
      </button>


      <button
        class="wwc-nav-btn"
        id="inboxBtn"
        type="button"
      >
        <span class="nav-icon">💬</span>
        <span class="nav-label">Inbox</span>
      </button>


      <button
        id="profileBtn"
        class="wwc-nav-btn"
        type="button"
      >
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profile</span>
      </button>

    </nav>

  </div>


  <script
    type="module"
    src="./js/app.js"
  ></script>

</body>
</html>
