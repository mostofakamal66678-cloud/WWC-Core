<!DOCTYPE html>
<html lang="bn">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>World Wide Connect</title>

  <!-- MAIN CSS -->
  <link
    rel="stylesheet"
    href="./css/style.css"
  >

  <!-- FONT AWESOME ICONS -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

</head>


<body>

  <div id="app">


    <!-- =================================================
         TOP BAR
         ================================================= -->

    <header class="wwc-top-bar">

      <div class="wwc-top-tabs">

        <button
          id="followingTab"
          class="wwc-top-tab"
          type="button"
        >
          Following
        </button>


        <button
          id="forYouTab"
          class="wwc-top-tab active"
          type="button"
        >
          For You
        </button>

      </div>


      <!-- SEARCH -->

      <button
        id="searchBtn"
        class="wwc-search-btn"
        type="button"
        aria-label="Search"
      >

        <span>
          <i class="fa-solid fa-magnifying-glass"></i>
        </span>

      </button>

    </header>



    <!-- =================================================
         VIDEO FEED
         ================================================= -->

    <main
      id="video-feed"
      aria-label="WWC Video Feed"
    >

      <div class="feed-loading">

        <div>
          <i class="fa-solid fa-spinner fa-spin"></i>
        </div>

        <div>
          Video Feed Loading...
        </div>

      </div>

    </main>



    <!-- =================================================
         PROFILE MENU
         ================================================= -->

    <div
      id="profileMenu"
      class="profile-menu"
      aria-hidden="true"
    >

      <div class="profile-menu-header">

        <div class="profile-menu-title">

          <i class="fa-solid fa-user"></i>

          My Profile

        </div>


        <button
          id="profileMenuClose"
          class="profile-menu-close"
          type="button"
          aria-label="Close"
        >

          <i class="fa-solid fa-xmark"></i>

        </button>

      </div>


      <button
        id="profileBtnMenu"
        class="profile-menu-btn"
        type="button"
      >

        <i class="fa-solid fa-user"></i>

        Profile

      </button>


      <button
        id="loginBtn"
        class="profile-menu-btn"
        type="button"
      >

        <i class="fa-solid fa-right-to-bracket"></i>

        Login / Register

      </button>


      <button
        id="logoutBtn"
        class="profile-menu-btn logout-menu-btn"
        type="button"
      >

        <i class="fa-solid fa-right-from-bracket"></i>

        Logout

      </button>

    </div>



    <!-- =================================================
         COMMENT BOX
         ================================================= -->

    <div
      id="commentBox"
      class="comment-box"
      aria-hidden="true"
    >

      <div class="comment-title">

        <i class="fa-regular fa-comment"></i>

        Comments

      </div>


      <div
        id="commentsList"
        class="comments-list"
      >
      </div>


      <textarea
        id="commentInput"
        placeholder="Write a comment..."
        maxlength="500"
      ></textarea>


      <div class="comment-buttons">

        <button
          id="commentCancel"
          type="button"
        >
          Cancel
        </button>


        <button
          id="commentSend"
          type="button"
        >
          Send
        </button>

      </div>

    </div>



    <!-- =================================================
         VIDEO UPLOAD INPUT
         ================================================= -->

    <input
      id="videoUpload"
      type="file"
      accept="video/*"
      hidden
    >



    <!-- =================================================
         BOTTOM NAVIGATION
         ================================================= -->

    <nav
      class="wwc-bottom-nav"
      aria-label="Main navigation"
    >


      <!-- HOME -->

      <button
        class="wwc-nav-btn active"
        id="homeBtn"
        type="button"
      >

        <span class="nav-icon">

          <i class="fa-solid fa-house"></i>

        </span>

        <span class="nav-label">
          Home
        </span>

      </button>



      <!-- FRIENDS -->

      <button
        class="wwc-nav-btn"
        id="friendsBtn"
        type="button"
      >

        <span class="nav-icon">

          <i class="fa-solid fa-user-group"></i>

        </span>

        <span class="nav-label">
          Friends
        </span>

      </button>



      <!-- CREATE -->

      <button
        id="uploadBtn"
        class="wwc-create-btn"
        type="button"
        aria-label="Upload Video"
      >

        <span>
          +
        </span>

      </button>



      <!-- INBOX -->

      <button
        class="wwc-nav-btn"
        id="inboxBtn"
        type="button"
      >

        <span class="nav-icon">

          <i class="fa-regular fa-comment-dots"></i>

        </span>

        <span class="nav-label">
          Inbox
        </span>

      </button>



      <!-- PROFILE -->

      <button
        id="profileBtn"
        class="wwc-nav-btn"
        type="button"
      >

        <span class="nav-icon">

          <i class="fa-regular fa-user"></i>

        </span>

        <span class="nav-label">
          Profile
        </span>

      </button>

    </nav>

  </div>



  <!-- =================================================
       MAIN APPLICATION JAVASCRIPT
       ================================================= -->

  <script
    type="module"
    src="./js/app.js"
  ></script>


</body>
</html>
