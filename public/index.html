<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>World Wide Connect</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <!-- TOP / AUTH BUTTONS -->
  <div class="auth-bar">

    <button id="loginBtn" class="auth-btn">
      Login / Register
    </button>

    <button id="logoutBtn" class="auth-btn">
      🚪 Logout
    </button>

    <button id="uploadBtn" class="auth-btn">
      ⬆️ Upload Video
    </button>

  </div>


  <!-- VIDEO FEED -->
  <main id="video-feed">


    <!-- VIDEO 1 -->
    <section class="video-item">

      <video
        class="feed-video"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
      >
        <source
          src="https://res.cloudinary.com/fsalagrz/video/upload/v1786681051/Video5.mp4"
          type="video/mp4"
        >
      </video>

      <!-- PROFILE -->
      <div class="profile-area">

        <img
          class="profile-photo"
          src="./images/profile.png"
          alt="Profile"
        >

        <div class="username">
          @wwc_user
        </div>

        <button class="follow-btn">
          Follow
        </button>

      </div>


      <!-- ACTIONS -->
      <div class="actions">

        <button class="action-btn like-btn">
          ❤️
          <span class="like-count">0</span>
        </button>

        <button class="action-btn comment-btn">
          💬
        </button>

        <button class="action-btn share-btn">
          ↗️
        </button>

      </div>

    </section>



    <!-- VIDEO 2 -->
    <section class="video-item">

      <video
        class="feed-video"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
      >
        <source
          src="./videos/video2.mp4"
          type="video/mp4"
        >
      </video>

      <!-- PROFILE -->
      <div class="profile-area">

        <img
          class="profile-photo"
          src="./images/profile.png"
          alt="Profile"
        >

        <div class="username">
          @wwc_user_2
        </div>

        <button class="follow-btn">
          Follow
        </button>

      </div>


      <!-- ACTIONS -->
      <div class="actions">

        <button class="action-btn like-btn">
          ❤️
          <span class="like-count">0</span>
        </button>

        <button class="action-btn comment-btn">
          💬
        </button>

        <button class="action-btn share-btn">
          ↗️
        </button>

      </div>

    </section>



    <!-- VIDEO 3 -->
    <section class="video-item">

      <video
        class="feed-video"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
      >
        <source
          src="./videos/video3.mp4"
          type="video/mp4"
        >
      </video>

      <!-- PROFILE -->
      <div class="profile-area">

        <img
          class="profile-photo"
          src="./images/profile.png"
          alt="Profile"
        >

        <div class="username">
          @wwc_user_3
        </div>

        <button class="follow-btn">
          Follow
        </button>

      </div>


      <!-- ACTIONS -->
      <div class="actions">

        <button class="action-btn like-btn">
          ❤️
          <span class="like-count">0</span>
        </button>

        <button class="action-btn comment-btn">
          💬
        </button>

        <button class="action-btn share-btn">
          ↗️
        </button>

      </div>

    </section>

  </main>


  <!-- COMMENT BOX -->
  <div id="commentBox" class="comment-box">

    <div class="comment-title">
      Comments
    </div>

    <textarea
      id="commentInput"
      placeholder="Write a comment..."
    ></textarea>

    <div class="comment-buttons">

      <button id="commentCancel">
        Cancel
      </button>

      <button id="commentSend">
        Send
      </button>

    </div>

  </div>


  <!-- JAVASCRIPT -->
  <script src="./app.js"></script>

</body>
</html>
