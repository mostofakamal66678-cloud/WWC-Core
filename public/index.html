<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>WWC · TikTok Feed</title>
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <style>
    /* ===== রিসেট ===== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      overscroll-behavior: none;
    }
    button {
      border: 0;
      outline: 0;
      cursor: pointer;
      background: transparent;
      font-family: inherit;
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* ===== অ্যাপ ===== */
    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }
    
    /* ===== ফিড ===== */
    .feed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .feed::-webkit-scrollbar { display: none; }
    
    /* ===== ভিডিও আইটেম ===== */
    .video-item {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      background: #000;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      contain: layout paint style;
    }
    
    /* ===== ভিডিও ===== */
    .video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      display: block;
    }
    
    /* ===== গ্রেডিয়েন্ট ওভারলে ===== */
    .video-item::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 50%;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      pointer-events: none;
      z-index: 2;
    }
    
    /* ===== টপ বার ===== */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 82px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: env(safe-area-inset-top);
      background: linear-gradient(rgba(0,0,0,0.6), transparent);
      pointer-events: none;
    }
    .top-bar .tabs {
      display: flex;
      align-items: center;
      gap: 30px;
      pointer-events: auto;
    }
    .top-bar .tab {
      position: relative;
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 17px;
      font-weight: 700;
      padding: 8px 4px;
      transition: color 0.2s;
    }
    .top-bar .tab.active {
      color: #fff;
    }
    .top-bar .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      border-radius: 10px;
      background: #fff;
    }
    .search-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      backdrop-filter: blur(6px);
      font-size: 18px;
    }
    
    /* ===== ডান পাশের অ্যাকশন বার ===== */
    .action-bar {
      position: absolute;
      right: 8px;
      bottom: 110px;
      z-index: 30;
      width: 62px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .action {
      width: 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: transparent;
      padding: 0;
    }
    .action-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
      transition: transform 0.15s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      color: #fff;
    }
    .action:active .action-icon { transform: scale(0.82); }
    .action-count {
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 1px 4px #000;
      margin-top: 1px;
      color: #fff;
    }
    
    /* ===== লাইক ===== */
    .like-btn.liked .action-icon {
      color: #ff2d55;
      transform: scale(1.15);
      animation: likePop 0.35s ease;
    }
    @keyframes likePop {
      0% { transform: scale(0.7); }
      40% { transform: scale(1.4); }
      70% { transform: scale(0.9); }
      100% { transform: scale(1.15); }
    }
    
    /* ===== সেভ ===== */
    .save-btn.saved .action-icon {
      color: #ffd84d;
      transform: scale(1.1);
      animation: savePop 0.3s ease;
    }
    @keyframes savePop {
      0% { transform: scale(0.7); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1.1); }
    }
    
    /* ===== ক্রিয়েটর ===== */
    .creator-avatar {
      position: relative;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #fff;
      overflow: visible;
    }
    .creator-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }
    .follow-plus {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;

      color: #000;

      align-items: center;
      justify-content: center;
      transition: all 0.2s;

    .follow-plus.following {
      background: #ff2d55;
      color: #fff;
      font-size: 12px;
    }
    
    /* ===== ভিডিও ইনফো ===== */
    .video-info {
      position: absolute;
      left: 15px;
      right: 85px;
      bottom: 95px;
      z-index: 25;
    }
    .video-info .username {
      font-size: 17px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      margin-bottom: 6px;
    }
    .video-info .caption {
      font-size: 14px;
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    .video-info .sound {
      font-size: 13px;
      font-weight: 600;
      margin-top: 8px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    
    /* ===== সাউন্ড বাটন ===== */
    .sound-btn {
      position: absolute;
      left: 14px;
      bottom: 155px;
      z-index: 35;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
      font-size: 18px;
    }
    
    /* ===== পজ ইন্ডিকেটর ===== */
    .pause-indicator {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.7);
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;

      font-size: 28px;
    }
    .pause-indicator.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    
    /* ===== লোডার ===== */
    .video-loader {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;

    .video-loader span {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.2);

    }

    .bottom-nav {

      left: 0;
      right: 0;

      flex-direction: column;

      justify-content: center;

      font-size: 10px;
      font-weight: 700;
      transition: color 0.2s;

    }
    .nav-btn.active { color: #fff; }

      border-radius: 10px;
      background: #fff;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 300;

    }
    
    /* ===== কমেন্ট প্যানেল ===== */
    .comment-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 150;
      height: 55vh;
      background: #111;
      border-radius: 18px 18px 0 0;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    .comment-panel.open { transform: translateY(0); }
    .comment-header {
      height: 50px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #333;
      font-weight: 700;

      color: #fff;
    }
    .close-comments {
      position: absolute;
      right: 15px;
      color: #fff;
      font-size: 24px;
      background: transparent;
      border: 0;
    }
    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      color: #fff;
    }
    .comment {
      padding: 10px 0;
      border-bottom: 1px solid #222;
      line-height: 1.4;
      color: #eee;
    }
    .comment strong { display: block; margin-bottom: 4px; color: #fff; }
    .comment-input {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid #333;
    }
    .comment-input input {
      flex: 1;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      border-radius: 22px;
      padding: 10px 15px;
      outline: none;
    }
    .comment-input input::placeholder { color: #666; }
    .comment-input button {
      width: 44px;
      border-radius: 50%;
      background: #fff;
      color: #000;
      font-size: 16px;
      border: 0;
    }
    
    /* ===== টোস্ট ===== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 95px;
      transform: translateX(-50%) translateY(20px);
      z-index: 500;
      background: rgba(30,30,30,0.95);
      color: #fff;
      padding: 10px 20px;
      border-radius: 22px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    
    /* ===== মেসেজ ===== */
    .feed-message {
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #aaa;
      padding: 30px;
    }
    .feed-message-inner { max-width: 320px; }
    .feed-message-icon { font-size: 45px; margin-bottom: 15px; }
    .retry-btn {
      margin-top: 18px;
      border-radius: 22px;
      padding: 10px 22px;
      background: #fff;
      color: #000;
      font-weight: 700;

    }
    
    /* ===== ডেস্কটপ ===== */
    @media(min-width: 700px) {
      .video-item { max-width: 500px; margin: auto; }
      .bottom-nav { max-width: 500px; left: 50%; right: auto; transform: translateX(-50%); }
    }
  </style>
</head>

<!-- ===== Firebase + Main App ===== -->
<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { getFirestore, collection, getDocs, getDoc, doc, setDoc, updateDoc, runTransaction, addDoc, serverTimestamp, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";

// ===== Firebase Config =====
const firebaseConfig = {
  apiKey: "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",
  authDomain: "world-wide-connect-62c87.firebaseapp.com",
  projectId: "world-wide-connect-62c87",
  storageBucket: "world-wide-connect-62c87.firebasestorage.app",
  messagingSenderId: "93178453668",
  appId: "1:93178453668:web:2184630caa8e61f7445031",
  measurementId: "G-PKFJ5NEMGQ"
};

// ===== Init Firebase =====
const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

// ===== Global State =====
let currentUser = null;
let currentProfile = { followingIds: [], savedVideoIds: [] };
let videos = [];
let currentFeedMode = "forYou";
let currentVideoId = null;
let observer = null;
let toastTimer = null;
let loadingFeed = false;
let currentPlayingVideo = null;
const defaultPhoto = "./images/profile.png";

// ===== Helpers =====
function escapeHtml(v) { return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
function number(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
function getFollowingIds() { return Array.isArray(currentProfile?.followingIds) ? currentProfile.followingIds : []; }

function showToast(text) {
  const toast = document.getElementById("toast");
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
}

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_,reject) => setTimeout(() => reject(new Error("Timeout")), ms))]);
}

function getUsername(video) {
  return String(video.username || video.userName || video.handle || "wwc_user").replace(/^@/,"");
}

// ===== VIDEO URL RESOLVER =====
async function resolveVideoURL(video) {
  const directUrl = video.videoURL || video.videoUrl || video.downloadURL || video.downloadUrl || video.fileURL || video.fileUrl || video.url || video.src;
  if (directUrl && directUrl.startsWith('http')) return directUrl;
  if (video.localPath || video.localUrl || video.file) return video.localPath || video.localUrl || video.file;
  const storagePath = video.storagePath || video.filePath || video.storage || video.path;
  if (storagePath) {
    try { return await withTimeout(getDownloadURL(ref(storage, storagePath)), 10000); } 
    catch(e) { console.error("Storage error:", e); return ""; }
  }
  if (video.googleDriveId || video.gdriveId) {
    return `https://drive.google.com/uc?export=download&id=${video.googleDriveId || video.gdriveId}`;
  }
  return "";
}

// ===== LOAD VIDEOS =====
async function loadVideos() {
  if (loadingFeed) return;
  loadingFeed = true;
  showLoading();
  try {
    const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
    const snap = await withTimeout(getDocs(q), 10000);
    videos = [];
    snap.forEach(doc => { videos.push({ id: doc.id, ...doc.data() }); });
    
    if (!videos.length) { showEmpty("এখনো কোনো ভিডিও নেই।"); loadingFeed = false; return; }
    
    for (let i = 0; i < videos.length; i++) {
      videos[i].resolvedVideoURL = await resolveVideoURL(videos[i]);
    }
    videos = videos.filter(v => !!v.resolvedVideoURL);
    sortVideos();
    renderFeed();
  } catch (e) {
    console.error("Load error:", e);
    showError("ভিডিও লোড করা যায়নি।");
  }
  loadingFeed = false;
}

function sortVideos() {
  if (currentFeedMode === "forYou") {
    videos.sort((a,b) => (number(b.likes)*3 + number(b.comments)*5 + number(b.saves)*6) - (number(a.likes)*3 + number(a.comments)*5 + number(a.saves)*6));
  }
}

function getFilteredVideos() {
  if (currentFeedMode === "following") {
    const following = getFollowingIds();
    return videos.filter(v => following.includes(v.uid || v.creatorId || v.userId || ""));
  }
  return videos;
}

// ===== RENDER =====
function showLoading() {
  document.getElementById("feed").innerHTML = `<div class="feed-message"><div class="feed-message-inner"><div class="feed-message-icon">⏳</div><div>ভিডিও লোড হচ্ছে...</div></div></div>`;
}
function showEmpty(msg) {
  document.getElementById("feed").innerHTML = `<div class="feed-message"><div class="feed-message-inner"><div class="feed-message-icon">🎬</div><div>${escapeHtml(msg)}</div></div></div>`;
}
function showError(msg) {
  document.getElementById("feed").innerHTML = `<div class="feed-message"><div class="feed-message-inner"><div class="feed-message-icon">⚠️</div><div>${escapeHtml(msg)}</div><button class="retry-btn" onclick="reloadFeed()">আবার চেষ্টা করুন</button></div></div>`;
}

function renderFeed() {
  const feed = document.getElementById("feed");
  const list = getFilteredVideos();
  feed.innerHTML = "";
  if (!list.length) { showEmpty(currentFeedMode === "following" ? "আপনি এখনো কাউকে Follow করেননি।" : "কোনো ভিডিও পাওয়া যায়নি।"); return; }
  
  list.forEach((video, index) => {
    feed.appendChild(createVideoItem(video, index));
  });
  setupVideoObserver();
  preloadNearbyVideos();
}

// ===== CREATE VIDEO ITEM =====
function createVideoItem(video, index) {
  const item = document.createElement("section");
  item.className = "video-item";
  item.dataset.videoId = video.id;
  
  const username = getUsername(video);
  const name = video.name || video.displayName || username;
  const photo = video.photoURL || video.photo || defaultPhoto;
  const caption = video.caption || video.description || "";
  const sound = video.sound || "🎵 Original sound - WWC";
  const creatorId = video.uid || video.creatorId || video.userId || "";
  const following = getFollowingIds().includes(creatorId);
  const liked = Array.isArray(video.likedBy) && video.likedBy.includes(currentUser?.uid);
  const saved = Array.isArray(video.savedBy) && video.savedBy.includes(currentUser?.uid);
  const likes = number(video.likes);
  const comments = number(video.comments);
  const saves = number(video.saves);
  const shares = number(video.shares);
  const url = video.resolvedVideoURL;
  
  item.innerHTML = `
    <video class="video" src="${escapeHtml(url)}" loop muted playsinline webkit-playsinline preload="metadata"></video>
    <div class="video-loader"><span></span></div>
    <div class="top-bar">
      <div class="tabs">
        <button class="tab ${currentFeedMode === "following" ? "active" : ""}" data-tab="following">Following</button>
        <button class="tab ${currentFeedMode === "forYou" ? "active" : ""}" data-tab="forYou">For You</button>
      </div>
      <button class="search-btn" data-action="search"><i class="fas fa-search"></i></button>
    </div>
    <div class="action-bar">
      <div class="action">
        <div class="creator-avatar">
          <img src="${escapeHtml(photo)}" alt="${escapeHtml(name)}" onerror="this.src='${defaultPhoto}'">
          ${creatorId && creatorId !== currentUser?.uid ? `<button class="follow-plus ${following ? "following" : ""}" data-action="follow" data-creator="${escapeHtml(creatorId)}">${following ? "✓" : "+"}</button>` : ""}
        </div>
      </div>
      <button class="action like-btn ${liked ? "liked" : ""}" data-action="like"><span class="action-icon"><i class="fas fa-heart"></i></span><span class="action-count">${likes}</span></button>
      <button class="action comment-btn" data-action="comment"><span class="action-icon"><i class="fas fa-comment"></i></span><span class="action-count">${comments}</span></button>
      <button class="action save-btn ${saved ? "saved" : ""}" data-action="save"><span class="action-icon"><i class="fas fa-bookmark"></i></span><span class="action-count">${saves}</span></button>
      <button class="action share-btn" data-action="share"><span class="action-icon"><i class="fas fa-share"></i></span><span class="action-count">${shares}</span></button>
    </div>
    <button class="sound-btn" data-action="sound"><i class="fas fa-volume-up"></i></button>
    <div class="video-info">
      <div class="username">@${escapeHtml(username)}</div>
      <div class="caption">${escapeHtml(caption)}</div>
      <div class="sound">${escapeHtml(sound)}</div>
    </div>
    <div class="pause-indicator"><i class="fas fa-pause"></i></div>
  `;
  
  const videoEl = item.querySelector(".video");
  const loader = item.querySelector(".video-loader");
  
  videoEl.addEventListener("loadeddata", () => { loader.style.display = "none"; });
  videoEl.addEventListener("playing", () => { loader.style.display = "none"; });
  videoEl.addEventListener("waiting", () => { loader.style.display = "flex"; });
  videoEl.addEventListener("error", () => { loader.style.display = "none"; console.error("Video error:", url); });
  
  item.addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    togglePlayPause(item);
  });
  
  return item;
}

// ===== PLAY/PAUSE =====
function togglePlayPause(item) {
  const video = item.querySelector(".video");
  const indicator = item.querySelector(".pause-indicator");
  if (video.paused) {
    playVideo(video);
    indicator.classList.remove("show");
  } else {
    video.pause();
    indicator.classList.add("show");
  }
}

async function playVideo(video) {
  if (currentPlayingVideo && currentPlayingVideo !== video) {
    try { currentPlayingVideo.pause(); } catch(e) {}
  }
  currentPlayingVideo = video;
  video.muted = true;
  try { await video.play(); } catch(e) { console.warn("Play error:", e); }
}

// ===== VIDEO OBSERVER =====
function setupVideoObserver() {
  if (observer) observer.disconnect();
  const items = [...document.querySelectorAll(".video-item")];
  if (!items.length) return;
  observer = new IntersectionObserver((entries) => {
    items.forEach(item => {
      const video = item.querySelector(".video");
      const rect = item.getBoundingClientRect();
      const visible = Math.min(window.innerHeight, rect.bottom) - Math.max(0, rect.top);
      const percentage = visible / window.innerHeight;
      if (percentage > 0.6) { playVideo(video); }
      else { video.pause(); }
    });
    preloadNearbyVideos();
  }, { threshold: [0.3, 0.5, 0.7, 0.9] });
  items.forEach(item => observer.observe(item));
  const first = items[0];
  if (first) { setTimeout(() => { const v = first.querySelector(".video"); if (v) playVideo(v); }, 300); }
}

function preloadNearbyVideos() {
  const items = [...document.querySelectorAll(".video-item")];
  if (!items.length) return;
  let activeIndex = 0;
  items.forEach((item, i) => {
    const rect = item.getBoundingClientRect();
    if (Math.abs(rect.top) < window.innerHeight * 0.5) activeIndex = i;
  });
  for (let i = activeIndex; i < Math.min(items.length, activeIndex + 3); i++) {
    const v = items[i]?.querySelector(".video");
    if (v) v.preload = "auto";
  }
}

// ===== FEED ACTIONS =====
document.getElementById("feed").addEventListener("click", async (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { switchFeed(tab.dataset.tab === "following" ? "following" : "forYou"); return; }
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const item = btn.closest(".video-item");
  if (!item) return;
  const videoId = item.dataset.videoId;
  const action = btn.dataset.action;
  
  if (action === "like") await toggleLike(videoId, btn);
  else if (action === "save") await toggleSave(videoId, btn);
  else if (action === "comment") await openComments(videoId);
  else if (action === "share") await shareVideo(videoId, btn);
  else if (action === "follow") await toggleFollow(btn.dataset.creator, btn);
  else if (action === "sound") toggleSound(item, btn);
  else if (action === "search") openSearch();
});

// =====================================================
// ✅ LIKE - সম্পূর্ণ ফিক্সড
// =====================================================
async function toggleLike(videoId, btn) {
  if (!currentUser) { showToast("আগে Login করুন"); return; }
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const videoRef = doc(db, "videos", videoId);
    const result = await runTransaction(db, async (t) => {
      const snap = await t.get(videoRef);
      if (!snap.exists()) throw new Error("NOT_FOUND");
      const data = snap.data();
      const likedBy = Array.isArray(data.likedBy) ? data.likedBy : [];
      const already = likedBy.includes(currentUser.uid);
      const newLikedBy = already ? likedBy.filter(u => u !== currentUser.uid) : [...likedBy, currentUser.uid];
      const newLikes = Math.max(0, number(data.likes) + (already ? -1 : 1));
      t.update(videoRef, { likedBy: newLikedBy, likes: newLikes });
      return { liked: !already, likes: newLikes };
    });
    btn.classList.toggle("liked", result.liked);
    const countEl = btn.querySelector(".action-count");
    if (countEl) countEl.textContent = result.likes;
    showToast(result.liked ? "❤️ Liked" : "Like removed");
  } catch(e) { console.error("Like error:", e); showToast("Like করা যায়নি"); }
  btn.disabled = false;
}

// =====================================================
// ✅ SAVE - সম্পূর্ণ ফিক্সড
// =====================================================
async function toggleSave(videoId, btn) {
  if (!currentUser) { showToast("আগে Login করুন"); return; }
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const videoRef = doc(db, "videos", videoId);
    const userRef = doc(db, "users", currentUser.uid);
    const result = await runTransaction(db, async (t) => {
      const vs = await t.get(videoRef);
      if (!vs.exists()) throw new Error("NOT_FOUND");
      const data = vs.data();
      const savedBy = Array.isArray(data.savedBy) ? data.savedBy : [];
      const already = savedBy.includes(currentUser.uid);
      const newSavedBy = already ? savedBy.filter(u => u !== currentUser.uid) : [...savedBy, currentUser.uid];
      const newSaves = Math.max(0, number(data.saves) + (already ? -1 : 1));
      t.update(videoRef, { savedBy: newSavedBy, saves: newSaves });
      // Update user profile
      const us = await t.get(userRef);
      const uData = us.exists() ? us.data() : {};
      const oldSaved = Array.isArray(uData.savedVideoIds) ? uData.savedVideoIds : [];
      const newUserSaved = already ? oldSaved.filter(id => id !== videoId) : (oldSaved.includes(videoId) ? oldSaved : [...oldSaved, videoId]);
      t.set(userRef, { savedVideoIds: newUserSaved }, { merge: true });
      return { saved: !already, saves: newSaves };
    });
    btn.classList.toggle("saved", result.saved);
    const countEl = btn.querySelector(".action-count");
    if (countEl) countEl.textContent = result.saves;
    showToast(result.saved ? "🔖 Saved" : "Removed from saved");
  } catch(e) { console.error("Save error:", e); showToast("Save করা যায়নি"); }
  btn.disabled = false;
}

// =====================================================
// ✅ FOLLOW - সম্পূর্ণ ফিক্সড
// =====================================================
async function toggleFollow(targetUid, btn) {
  if (!currentUser || !targetUid || targetUid === currentUser.uid) return;
  btn.disabled = true;
  try {
    const myRef = doc(db, "users", currentUser.uid);
    const targetRef = doc(db, "users", targetUid);
    const result = await runTransaction(db, async (t) => {
      const ms = await t.get(myRef);
      const ts = await t.get(targetRef);
      if (!ms.exists() || !ts.exists()) throw new Error("PROFILE_NOT_FOUND");
      const mData = ms.data();
      const tData = ts.data();
      const following = Array.isArray(mData.followingIds) ? mData.followingIds : [];
      const followers = Array.isArray(tData.followerIds) ? tData.followerIds : [];
      const already = following.includes(targetUid);
      if (already) {
        t.update(myRef, { followingIds: following.filter(id => id !== targetUid), following: Math.max(0, number(mData.following) - 1) });
        t.update(targetRef, { followerIds: followers.filter(id => id !== currentUser.uid), followers: Math.max(0, number(tData.followers) - 1) });
      } else {
        t.update(myRef, { followingIds: [...following, targetUid], following: number(mData.following) + 1 });
        t.update(targetRef, { followerIds: [...followers, currentUser.uid], followers: number(tData.followers) + 1 });
      }
      return { following: !already };
    });
    btn.classList.toggle("following", result.following);
    btn.textContent = result.following ? "✓" : "+";
    const ms = await getDoc(doc(db, "users", currentUser.uid));
    if (ms.exists()) currentProfile = ms.data();
    showToast(result.following ? "✅ Following" : "Unfollowed");
  } catch(e) { console.error("Follow error:", e); showToast("Follow করা যায়নি"); }
  btn.disabled = false;
}

// =====================================================
// ✅ SOUND - সম্পূর্ণ ফিক্সড
// =====================================================
function toggleSound(item, btn) {
  const video = item.querySelector(".video");
  if (video.muted) {
    video.muted = false;
    btn.innerHTML = '<i class="fas fa-volume-up"></i>';
    playVideo(video);
    showToast("🔊 Sound On");
  } else {
    video.muted = true;
    btn.innerHTML = '<i class="fas fa-volume-mute"></i>';
    showToast("🔇 Sound Off");
  }
}

// =====================================================
// ✅ SHARE - সম্পূর্ণ ফিক্সড
// =====================================================
async function shareVideo(videoId, btn) {
  if (!currentUser) { showToast("আগে Login করুন"); return; }
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const videoRef = doc(db, "videos", videoId);
    const snap = await getDoc(videoRef);
    if (snap.exists()) {
      const newShares = number(snap.data().shares) + 1;
      await updateDoc(videoRef, { shares: newShares });
      const countEl = btn.querySelector(".action-count");
      if (countEl) countEl.textContent = newShares;
    }
    const url = new URL(window.location.href);
    url.searchParams.set("video", videoId);
    if (navigator.share) {
      try { await navigator.share({ title: "WWC", text: "এই ভিডিওটি দেখুন", url: url.toString() }); } catch(e) {}
    } else {
      await navigator.clipboard.writeText(url.toString());
      showToast("🔗 Link Copy হয়েছে");
    }
  } catch(e) { console.error("Share error:", e); showToast("Share করা যায়নি"); }
  btn.disabled = false;
}

// =====================================================
// ✅ COMMENTS - সম্পূর্ণ ফিক্সড
// =====================================================
async function openComments(videoId) {
  currentVideoId = videoId;
  document.getElementById("commentPanel").classList.add("open");
  await loadComments(videoId);
}

function closeComments() { 
  document.getElementById("commentPanel").classList.remove("open"); 
}

async function loadComments(videoId) {
  const list = document.getElementById("commentsList");
  list.innerHTML = '<div style="text-align:center;color:#888;padding:25px;">Loading...</div>';
  try {
    const snap = await withTimeout(getDocs(collection(db, "videos", videoId, "comments")), 8000);
    list.innerHTML = "";
    if (snap.empty) { list.innerHTML = '<div style="text-align:center;color:#777;padding:30px;">No comments yet.</div>'; return; }
    const comments = [];
    snap.forEach(d => comments.push({ id: d.id, ...d.data() }));
    comments.sort((a,b) => (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0));
    comments.forEach(data => {
      const div = document.createElement("div");
      div.className = "comment";
      div.innerHTML = `<strong>${escapeHtml(data.username || data.name || "WWC User")}</strong>${escapeHtml(data.text || "")}`;
      list.appendChild(div);
    });
  } catch(e) { list.innerHTML = '<div style="text-align:center;color:#ff667f;padding:25px;">Comments লোড করা যায়নি।</div>'; }
}

async function addComment() {
  const input = document.getElementById("commentInput");
  const text = input.value.trim();
  if (!text || !currentUser || !currentVideoId) return;
  try {
    const videoRef = doc(db, "videos", currentVideoId);
    const username = String(currentProfile.username || currentProfile.name || "WWC User").replace(/^@/,"");
    await addDoc(collection(db, "videos", currentVideoId, "comments"), {
      uid: currentUser.uid, 
      username: username,
      name: currentProfile.name || "WWC User",
      photoURL: currentProfile.photoURL || defaultPhoto,
      text: text,
      createdAt: serverTimestamp()
    });
    const vs = await getDoc(videoRef);
    const newComments = number(vs.data()?.comments) + 1;
    await updateDoc(videoRef, { comments: newComments });
    input.value = "";
    await loadComments(currentVideoId);
    updateCommentCount(currentVideoId, newComments);
    showToast("💬 Comment Added");
  } catch(e) { console.error("Comment error:", e); showToast("Comment করা যায়নি"); }
}

function updateCommentCount(videoId, count) {
  const item = document.querySelector(`.video-item[data-video-id="${CSS.escape(videoId)}"]`);
  if (item) {
    const btn = item.querySelector('[data-action="comment"]');
    if (btn) { const el = btn.querySelector(".action-count"); if (el) el.textContent = count; }
  }
}

// ===== VISIBILITY =====
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { document.querySelectorAll(".video").forEach(v => v.pause()); }
  else {
    const items = [...document.querySelectorAll(".video-item")];
    let best = null, bestRatio = 0;
    items.forEach(item => {
      const rect = item.getBoundingClientRect();
      const visible = Math.min(window.innerHeight, rect.bottom) - Math.max(0, rect.top);
      const ratio = visible / window.innerHeight;
      if (ratio > bestRatio) { bestRatio = ratio; best = item; }
    });
    if (best) { const v = best.querySelector(".video"); if (v) playVideo(v); }
  }
});
