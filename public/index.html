<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>WWC - For You</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

button{
  font-family:inherit;
}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:#000;
}

.feed{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}

.feed::-webkit-scrollbar{
  display:none;
}

.video-item{
  position:relative;
  width:100%;
  height:100dvh;
  background:#000;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  overflow:hidden;
}

.video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

/* DARK GRADIENT */

.video-item::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:45%;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.82)
  );
  pointer-events:none;
}

/* TOP BAR */

.top-bar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:72px;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:env(safe-area-inset-top);
  background:linear-gradient(
    rgba(0,0,0,.5),
    transparent
  );
}

.tabs{
  display:flex;
  align-items:center;
  gap:30px;
}

.tab{
  position:relative;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.65);
  font-size:17px;
  font-weight:bold;
  padding:10px 3px;
  cursor:pointer;
}

.tab.active{
  color:#fff;
}

.tab.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:1px;
  height:3px;
  border-radius:10px;
  background:#fff;
}

/* SEARCH */

.search-btn{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.35);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  backdrop-filter:blur(6px);
}

.search-btn svg{
  width:28px;
  height:28px;
  fill:none;
  stroke:#fff;
  stroke-width:2;
}

/* RIGHT ACTIONS */

.action-bar{
  position:absolute;
  right:8px;
  bottom:108px;
  z-index:30;
  width:65px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:17px;
}

.action{
  width:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  color:#fff;
  cursor:pointer;
  padding:0;
}

.action-icon{
  width:51px;
  height:51px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#fff;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));
  transition:transform .15s ease,color .15s ease;
}

.action-icon svg{
  width:39px;
  height:39px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.action:active .action-icon{
  transform:scale(.82);
}

/* LIKE */

.like-btn.liked .action-icon{
  color:#ff3040;
  transform:scale(1.08);
}

.like-btn.liked .action-icon svg{
  fill:#ff3040;
  stroke:#ff3040;
}

/* SAVE */

.save-btn.saved .action-icon{
  color:#fff;
}

.save-btn.saved .action-icon svg{
  fill:#fff;
  stroke:#fff;
}

.action-count{
  margin-top:1px;
  color:#fff;
  font-size:13px;
  font-weight:bold;
  text-shadow:0 1px 4px #000;
}

/* CREATOR */

.creator-avatar{
  position:relative;
  width:53px;
  height:53px;
  border-radius:50%;
  border:2px solid #fff;
  overflow:visible;
  margin-bottom:2px;
}

.creator-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
}

.follow-plus{
  position:absolute;
  bottom:-7px;
  left:50%;
  transform:translateX(-50%);
  width:24px;
  height:24px;
  border-radius:50%;
  border:0;
  background:#fff;
  color:#000;
  font-size:20px;
  line-height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-weight:bold;
}

.follow-plus.following{
  background:#fff;
  color:#000;
  font-size:14px;
}

/* VIDEO INFO */

.video-info{
  position:absolute;
  left:15px;
  right:85px;
  bottom:95px;
  z-index:25;
}

.username{
  font-size:18px;
  font-weight:bold;
  margin-bottom:9px;
  text-shadow:0 2px 4px rgba(0,0,0,.9);
}

.caption{
  font-size:15px;
  line-height:1.45;
  margin-bottom:9px;
  text-shadow:0 2px 4px rgba(0,0,0,.9);
}

.sound{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 2px 4px rgba(0,0,0,.9);
}

/* SOUND BUTTON */

.sound-btn{
  position:absolute;
  left:14px;
  bottom:150px;
  z-index:35;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.42);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(5px);
}

.sound-btn svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:#fff;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* PAUSE */

.pause-indicator{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.8);
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,0,0,.48);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.15s;
  z-index:40;
}

.pause-indicator.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.pause-indicator svg{
  width:34px;
  height:34px;
  fill:#fff;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.97) 28%
  );
}

.nav-btn{
  position:relative;
  width:20%;
  height:65px;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.nav-btn svg{
  width:29px;
  height:29px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav-btn.active{
  color:#fff;
}

/* UPLOAD */

.upload-btn{
  position:relative;
  width:56px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:
    -4px 0 0 #25f4ee,
    4px 0 0 #fe2c55;
}

.upload-btn svg{
  width:27px;
  height:27px;
  stroke:#000;
  stroke-width:2.5;
  fill:none;
}

/* BADGE */

.badge{
  position:absolute;
  top:2px;
  right:15px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:10px;
  background:#fe2c55;
  color:#fff;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

/* COMMENTS */

.comment-panel{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:150;
  height:55vh;
  background:#111;
  border-radius:18px 18px 0 0;
  transform:translateY(100%);
  transition:transform .3s ease;
  display:flex;
  flex-direction:column;
}

.comment-panel.open{
  transform:translateY(0);
}

.comment-header{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #333;
  position:relative;
  font-weight:bold;
}

.close-comments{
  position:absolute;
  right:15px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:26px;
}

.comments-list{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.comment{
  padding:10px 0;
  border-bottom:1px solid #222;
  line-height:1.4;
}

.comment strong{
  display:block;
  margin-bottom:4px;
}

.comment-input{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid #333;
}

.comment-input input{
  flex:1;
  min-width:0;
  border:1px solid #444;
  background:#222;
  color:#fff;
  border-radius:22px;
  padding:12px 15px;
  outline:none;
}

.comment-input button{
  width:50px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  font-size:18px;
}

/* SEARCH */

.search-panel{
  position:fixed;
  inset:0;
  z-index:300;
  background:#000;
  display:none;
  padding:15px;
}

.search-panel.open{
  display:block;
}

.search-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.search-top input{
  flex:1;
  height:45px;
  border:1px solid #444;
  border-radius:10px;
  background:#222;
  color:#fff;
  padding:0 14px;
  font-size:16px;
  outline:none;
}

.close-search{
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:24px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  z-index:500;
  background:rgba(30,30,30,.95);
  color:#fff;
  padding:11px 18px;
  border-radius:22px;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* LOADING */

.feed-loading{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  color:#aaa;
  font-size:15px;
  pointer-events:none;
}

/* DESKTOP */

@media(min-width:700px){

  .video-item{
    max-width:500px;
    margin:auto;
  }

  .bottom-nav{
    max-width:500px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
  }

}

</style>
</head>

<body>

<div class="app">

<main class="feed" id="feed">

<nav class="bottom-nav">

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  getApps,
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  setDoc,
  updateDoc,
  arrayUnion,
  arrayRemove,
  increment,
  addDoc,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

  authDomain:
    "world-wide-connect-62c87.firebaseapp.com",

  projectId:
    "world-wide-connect-62c87",

  storageBucket:
    "world-wide-connect-62c87.firebasestorage.app",

  messagingSenderId:
    "93178453668",

  appId:
    "1:93178453668:web:2184630caa8e61f7445031",

  measurementId:
    "G-PKFJ5NEMGQ"

};


const app =
  getApps().length
    ? getApps()[0]
    : initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let currentProfile = {};

let videos = [];

let currentFeedMode = "forYou";

let currentVideoIndex = 0;

let currentVideoId = null;

let observer = null;

let toastTimer = null;

const defaultPhoto =
  "./images/profile.png";


/* =====================================================
   TOAST
===================================================== */

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    },1800);

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   USER PROFILE
===================================================== */

async function loadCurrentProfile(){

  const ref =
    doc(
      db,
      "users",
      currentUser.uid
    );

  const snap =
    await getDoc(ref);

  if(!snap.exists()){

    currentProfile = {

      uid:
        currentUser.uid,

      name:
        currentUser.displayName ||
        "WWC User",

      username:
        "wwc_" +
        currentUser.uid.substring(0,6),

      email:
        currentUser.email || "",

      photoURL:
        currentUser.photoURL ||
        defaultPhoto,

      followers:0,

      following:0,

      likes:0,

      followerIds:[],

      followingIds:[],

      savedVideoIds:[]

    };

    await setDoc(
      ref,
      currentProfile
    );

  }else{

    currentProfile =
      snap.data();

  }

}


/* =====================================================
   GET FOLLOWING IDS
===================================================== */

function getFollowingIds(){

  return Array.isArray(
    currentProfile.followingIds
  )
    ? currentProfile.followingIds
    : [];

}


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(){

  const loading =
    document.getElementById(
      "feedLoading"
    );

  loading.style.display =
    "flex";

  videos = [];


  /*
    Primary collection:
    videos
  */

  try{

    const snap =
      await getDocs(
        collection(
          db,
          "videos"
        )
      );


    snap.forEach(videoDoc => {

      const data =
        videoDoc.data();

      videos.push({

        id:
          videoDoc.id,

        ...data

      });

    });

  }catch(error){

    console.error(
      "Videos load error:",
      error
    );

  }


  /*
    If Firestore has no videos,
    use local fallback videos.
  */

  if(!videos.length){

    videos = [

      {
        id:"local-video-1",

        videoURL:
          "./videos/video1.mp4",

        username:
          currentProfile.username ||
          "wwc_user",

        name:
          currentProfile.name ||
          "WWC User",

        photoURL:
          currentProfile.photoURL ||
          defaultPhoto,

        caption:
          "🌍 WWC-Core এ আপনাকে স্বাগতম। World Wide Connect",

        sound:
          "Original sound - WWC",

        likes:0,

        comments:0,

        saves:0,

        creatorId:
          currentUser.uid

      },

      {
        id:"local-video-2",

        videoURL:
          "./videos/video2.mp4",

        username:
          currentProfile.username ||
          "wwc_user",

        name:
          currentProfile.name ||
          "WWC User",

        photoURL:
          currentProfile.photoURL ||
          defaultPhoto,

        caption:
          "🌍 নতুন ভিডিও দেখুন WWC-Core এ।",

        sound:
          "Original sound - WWC",

        likes:0,

        comments:0,

        saves:0,

        creatorId:
          currentUser.uid

      }

    ];

  }


  renderFeed();

  loading.style.display =
    "none";

}


/* =====================================================
   VIDEO URL
===================================================== */

function getVideoURL(video,index){

  return (
    video.videoURL ||
    video.videoUrl ||
    video.url ||
    video.src ||
    video.fileURL ||
    (
      index === 0
        ? "./videos/video1.mp4"
        : "./videos/video2.mp4"
    )
  );

}


/* =====================================================
   USERNAME
===================================================== */

function getUsername(video){

  return String(
    video.username ||
    video.userName ||
    video.handle ||
    "wwc_user"
  ).replace(/^@/,"");

}


/* =====================================================
   FILTER FEED
===================================================== */

function getFilteredVideos(){

  if(
    currentFeedMode ===
    "following"
  ){

    const following =
      getFollowingIds();

    return videos.filter(
      video => {

        const creator =
          video.creatorId ||
          video.userId ||
          video.uid ||
          video.ownerId;

        return following.includes(
          creator
        );

      }
    );

  }

  return videos;

}


/* =====================================================
   RENDER FEED
===================================================== */

function renderFeed(){

  const feed =
    document.getElementById("feed");

  feed.innerHTML = "";

  const list =
    getFilteredVideos();


  if(!list.length){

    const empty =
      document.createElement("div");

    empty.style.cssText = `
      width:100%;
      height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#aaa;
      text-align:center;
      padding:30px;
    `;

    empty.innerHTML = `
      <div>
        <div style="font-size:42px;margin-bottom:12px">
          👥
        </div>
        <div>
          ${
            currentFeedMode === "following"
              ? "আপনি এখনো কাউকে Follow করেননি।"
              : "কোনো ভিডিও পাওয়া যায়নি।"
          }
        </div>
      </div>
    `;

    feed.appendChild(empty);

    return;

  }


  list.forEach(
    (video,index) => {

      feed.appendChild(
        createVideoItem(
          video,
          index
        )
      );

    }
  );


  setupVideoObserver();

}


/* =====================================================
   CREATE VIDEO

/* =====================================================
   VIDEO CLICK
===================================================== */

function handleVideoClick(event){

  const item =
    event.currentTarget;

  if(
    event.target.closest("button")
  ){
    return;
  }


  const video =
    item.querySelector(".video");

  const indicator =
    item.querySelector(
      ".pause-indicator"
    );


  if(video.paused){

    video.play()
      .catch(() => {});

    indicator.classList.remove(
      "show"
    );

  }else{

    video.pause();

    indicator.classList.add(
      "show"
    );

  }

}


/* =====================================================
   ACTION EVENTS
===================================================== */

document
  .getElementById("feed")
  .addEventListener(
    "click",
    async event => {

      const button =
        event.target.closest(
          "[data-action]"
        );

      if(!button){
        return;
      }


      const item =
        button.closest(
          ".video-item"
        );

      if(!item){
        return;
      }


      const videoId =
        item.dataset.videoId;


      const action =
        button.dataset.action;


      if(action === "like"){

        await toggleLike(
          item,
          videoId,
          button
        );

      }


      if(action === "save"){

        await toggleSave(
          item,
          videoId,
          button
        );

      }


      if(action === "comment"){

        await openComments(
          videoId
        );

      }


      if(action === "share"){

        await shareVideo(
          videoId
        );

      }


      if(action === "follow"){

        await toggleFollow(
          button.dataset.creator,
          button
        );

      }


      if(action === "sound"){

        toggleSound(
          item,
          button
        );

      }


      if(action === "search"){

        openSearch();

      }


      if(action === "following"){

        switchFeed(
          "following"
        );

      }


      if(action === "forYou"){

        switchFeed(
          "forYou"
        );

      }

    }
  );


/* =====================================================

===================================================== */

document
  .getElementById("feed")

/* =====================================================
   LIKE
===================================================== */

async function toggleLike(
  item,
  videoId,
  button
){

  if(!currentUser){
    return;
  }


  button.disabled = true;


  try{

    const ref =
      doc(
        db,
        "videos",
        videoId
      );


    const snap =
      await getDoc(ref);


    if(!snap.exists()){

      /*
        Local fallback video.
      */

      const current =
        Number(
          button
            .querySelector(
              ".action-count"
            )
            .textContent
        ) || 0;


      const liked =
        button.classList.contains(
          "liked"
        );


      button.classList.toggle(
        "liked",
        !liked
      );


      button
        .querySelector(
          ".action-count"
        )
        .textContent =
          liked
            ? Math.max(
                0,
                current - 1
              )
            : current + 1;


      return;

    }


    const data =
      snap.data();


    const likedBy =
      Array.isArray(
        data.likedBy
      )
        ? data.likedBy
        : [];


    const alreadyLiked =
      likedBy.includes(
        currentUser.uid
      );


    if(alreadyLiked){

      await updateDoc(
        ref,
        {

          likedBy:
            arrayRemove(
              currentUser.uid
            ),

          likes:
            increment(-1)

        }
      );

      button.classList.remove(
        "liked"
      );

    }else{

      await updateDoc(
        ref,
        {

          likedBy:
            arrayUnion(
              currentUser.uid
            ),

          likes:
            increment(1)

        }
      );

      button.classList.add(
        "liked"
      );

      const icon =
        button.querySelector(
          ".action-icon"
        );

      icon.animate(
        [
          {
            transform:"scale(.7)"
          },
          {
            transform:"scale(1.3)"
          },
          {
            transform:"scale(1)"
          }
        ],
        {
          duration:250
        }
      );

    }


    const updated =
      await getDoc(ref);


    const newCount =
      updated.exists()
        ? Number(
            updated.data().likes || 0
          )
        : 0;


    button
      .querySelector(
        ".action-count"
      )
      .textContent =
        Math.max(
          0,
          newCount
        );


  }catch(error){

    console.error(
      "Like error:",
      error
    );

    showToast(
      "Like সংরক্ষণ করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}


/* =====================================================
   SAVE
===================================================== */

async function toggleSave(
  item,
  videoId,
  button
){

  if(!currentUser){
    return;
  }


  button.disabled = true;


  try{

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const userRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const videoSnap =
      await getDoc(
        videoRef
      );


    const userSnap =
      await getDoc(
        userRef
      );


    if(!videoSnap.exists()){

      button.classList.toggle(
        "saved"
      );

      showToast(
        button.classList.contains(
          "saved"
        )
          ? "ভিডিও Saved হয়েছে"
          : "Saved থেকে সরানো হয়েছে"
      );

      return;

    }


    const videoData =
      videoSnap.data();


    const savedBy =
      Array.isArray(
        videoData.savedBy
      )
        ? videoData.savedBy
        : [];


    const alreadySaved =
      savedBy.includes(
        currentUser.uid
      );


    if(alreadySaved){

      await updateDoc(
        videoRef,
        {

          savedBy:
            arrayRemove(
              currentUser.uid
            ),

          saves:
            increment(-1)

        }
      );


      if(userSnap.exists()){

        await updateDoc(
          userRef,
          {

            savedVideoIds:
              arrayRemove(
                videoId
              )

          }
        );

      }


      button.classList.remove(
        "saved"
      );

      showToast(
        "Saved থেকে সরানো হয়েছে"
      );


    }else{

      await updateDoc(
        videoRef,
        {

          savedBy:
            arrayUnion(
              currentUser.uid
            ),

          saves:
            increment(1)

        }
      );


      if(userSnap.exists()){

        await updateDoc(
          userRef,
          {

            savedVideoIds:
              arrayUnion(
                videoId
              )

          }
        );

      }


      button.classList.add(
        "saved"
      );

      showToast(
        "ভিডিও Saved হয়েছে"
      );

    }


    const updated =
      await getDoc(
        videoRef
      );


    const count =
      updated.exists()
        ? Number(
            updated.data().saves || 0
          )
        : 0;


    button
      .querySelector(
        ".action-count"
      )
      .textContent =
        Math.max(
          0,
          count
        );


  }catch(error){

    console.error(
      "Save error:",
      error
    );

    showToast(
      "Save সংরক্ষণ করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}


/* =====================================================
   FOLLOW
===================================================== */

async function toggleFollow(
  targetUid,
  button
){

  if(
    !currentUser ||
    !targetUid ||
    targetUid ===
      currentUser.uid
  ){
    return;
  }


  button.disabled =
    true;


  try{

    const myRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const targetRef =
      doc(
        db,
        "users",
        targetUid
      );


    const mySnap =
      await getDoc(
        myRef
      );


    const targetSnap =
      await getDoc(
        targetRef
      );


    if(
      !mySnap.exists() ||
      !targetSnap.exists()
    ){

      throw new Error(
        "Profile not found"
      );

    }


    const myData =
      mySnap.data();


    const following =
      Array.isArray(
        myData.followingIds
      )
        ? myData.followingIds
        : [];


    const alreadyFollowing =
      following.includes(
        targetUid
      );


    if(alreadyFollowing){

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayRemove(
              targetUid
            ),

          following:
            increment(-1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayRemove(
              currentUser.uid
            ),

          followers:
            increment(-1)

        }
      );


      button.classList.remove(
        "following"
      );

      button.textContent =
        "+";


      showToast(
        "Unfollow করা হয়েছে"
      );


    }else{

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayUnion(
              targetUid
            ),

          following:
            increment(1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayUnion(
              currentUser.uid
            ),

          followers:
            increment(1)

        }
      );


      button.classList.add(
        "following"
      );

      button.textContent =
        "✓";


      showToast(
        "Following করা হয়েছে"
      );

    }


    currentProfile =
      (
        await getDoc(
          myRef
        )
      ).data();


  }catch(error){

    console.error(
      "Follow error:",
      error
    );

    showToast(
      "Follow পরিবর্তন করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}

async function openComments(
  videoId
){

  currentVideoId =
    videoId;


  const panel =
    document.getElementById(
      "commentPanel"
    );


  panel.classList.add(
    "open"
  );


  await loadComments(

  );

}


/* =====================================================
   LOAD COMMENTS
===================================================== */

async function loadComments(
  videoId
){

  const list =
    document.getElementById(
      "commentsList"
    );


  list.innerHTML = `
    <div style="
      text-align:center;
      color:#888;
      padding:25px;
    ">
      Comments লোড হচ্ছে...
    </div>
  `;


  try{

    const commentsRef =
      collection(
        db,
        "videos",
        videoId,
        "comments"
      );


    const snap =
      await getDocs(
        commentsRef
      );


    list.innerHTML =
      "";


    if(snap.empty){

      list.innerHTML = `
        <div style="
          text-align:center;
          color:#777;
          padding:30px;
        ">
          এখনো কোনো Comment নেই।
        </div>
      `;

      return;

    }


    snap.forEach(
      commentDoc => {

        const data =
          commentDoc.data();


        const comment =
          document.createElement(
            "div"
          );


        comment.className =
          "comment";


        comment.innerHTML = `

          <strong>
            ${escapeHtml(
              data.username ||
              data.name ||
              "WWC User"
            )}
          </strong>

          ${escapeHtml(
            data.text || ""
          )}

        `;


        list.appendChild(
          comment
        );

      }
    );


  }catch(error){

    console.error(
      "Comments load error:",
      error
    );


    list.innerHTML = `
      <div style="
        text-align:center;
        color:#ff667f;
        padding:25px;
      ">
        Comments লোড করা যায়নি।
      </div>
    `;

  }

}


/* =====================================================
   ADD COMMENT
===================================================== */

async function addComment(){

  const input =
    document.getElementById(
      "commentInput"
    );


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  if(
    !currentUser ||
    !currentVideoId
  ){
    return;
  }


  const button =
    document.querySelector(
      ".comment-input button"
    );


  button.disabled =
    true;


  try{

    const username =
      String(
        currentProfile.username ||
        currentProfile.name ||
        "WWC User"
      ).replace(/^@/,"");


    await addDoc(

      collection(
        db,
        "videos",
        currentVideoId,
        "comments"
      ),

      {

        uid:
          currentUser.uid,

        username:
          username,

        name:
          currentProfile.name ||
          "WWC User",

        text:
          text,

        createdAt:
          serverTimestamp()

      }

    );


    const videoRef =
      doc(
        db,
        "videos",
        currentVideoId
      );


    await updateDoc(
      videoRef,
      {
        comments:
          increment(1)
      }
    );


    input.value =
      "";


    await loadComments(
      currentVideoId
    );


    showToast(
      "Comment সংরক্ষণ হয়েছে"
    );


  }catch(error){

    console.error(
      "Comment error:",
      error
    );


    showToast(
      "Comment সংরক্ষণ করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}

/* =====================================================
   SHARE
===================================================== */

async function shareVideo(
  videoId
){

  const url =
    new URL(
      window.location.href
    );


  url.searchParams.set(
    "video",
    videoId
  );


  const shareData = {

    title:
      "WWC-Core",

    text:
      "এই ভিডিওটি WWC-Core এ দেখুন।",

    url:
      url.toString()

  };


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard.writeText(
        url.toString()
      );

      showToast(
        "ভিডিও Link Copy হয়েছে"
      );

    }

  }catch(error){

    if(
      error &&
      error.name !==
        "AbortError"
    ){

      try{

        await navigator.clipboard.writeText(
          url.toString()
        );

        showToast(
          "ভিডিও Link Copy হয়েছে"
        );

      }catch(e){

        showToast(
          "Share করা যায়নি"
        );

      }

    }

  }

}

      "searchPanel"
    )
    .classList.remove(
      "open"
    );

}


/* =====================================================
   SEARCH INPUT
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    event => {

      const q =
        event.target.value
          .trim()
          .toLowerCase();


      if(!q){

        renderFeed();

        return;

      }


      const filtered =
        videos.filter(
          video => {

            const username =
              getUsername(
                video
              ).toLowerCase();


            const name =
              String(
                video.name ||
                video.displayName ||
                ""
              ).toLowerCase();


            const caption =
              String(
                video.caption ||
                video.description ||
                ""
              ).toLowerCase();


            return (
              username.includes(q) ||
              name.includes(q) ||
              caption.includes(q)
            );

          }
        );


      renderSearchResults(
        filtered
      );

    }
  );


/* =====================================================
   SEARCH RESULTS
===================================================== */

function renderSearchResults(
  list
){

  const feed =
    document.getElementById(
      "feed"
    );


  feed.innerHTML =
    "";


  if(!list.length){

    feed.innerHTML = `
      <div style="
        width:100%;
        height:100dvh;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#888;
      ">
        কোনো ভিডিও পাওয়া যায়নি।
      </div>
    `;

    return;

  }


  list.forEach(
    (video,index) => {

      feed.appendChild(
        createVideoItem(
          video,
          index
        )
      );

    }
  );


  setupVideoObserver();

}


/* =====================================================
   VIDEO OBSERVER
===================================================== */

function setupVideoObserver(){

  if(observer){

    observer.disconnect();

  }


  observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(
          entry => {

            const video =
              entry.target.querySelector(
                ".video"
              );


            const indicator =
              entry.target.querySelector(
                ".pause-indicator"
              );


            if(
              entry.isIntersecting
            ){

              currentVideoIndex =
                [
                  ...document.querySelectorAll(
                    ".video-item"
                  )
                ].indexOf(
                  entry.target
                );


              video.play()
                .catch(
                  () => {}
                );


              indicator.classList.remove(
                "show"
              );


            }else{

              video.pause();

            }

          }
        );

      },

      {
        threshold:.7
      }

    );


  document
    .querySelectorAll(
      ".video-item"
    )
    .forEach(
      item =>
        observer.observe(
          item
        )
    );

}
