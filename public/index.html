<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

button{
  font-family:inherit;
}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  background:#000;
  overflow:hidden;
}

/* ================= VIDEO FEED ================= */

.feed{
  position:absolute;
  inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}

.feed::-webkit-scrollbar{
  display:none;
}

.video-item{
  position:relative;
  width:100%;
  height:100dvh;
  background:#000;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  overflow:hidden;
}

.video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

/* নিচের কালো gradient */

.video-item::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:45%;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.82)
  );
  pointer-events:none;
}

/* ================= TOP BAR ================= */

.top-bar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:72px;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:env(safe-area-inset-top);
  background:linear-gradient(
    rgba(0,0,0,.5),
    transparent
  );
}

.tabs{
  display:flex;
  align-items:center;
  gap:30px;
  height:100%;
}

.tab{
  position:relative;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.65);
  font-size:17px;
  font-weight:bold;
  padding:10px 3px;
  cursor:pointer;
}

.tab.active{
  color:#fff;
}

.tab.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:1px;
  height:3px;
  border-radius:10px;
  background:#fff;
}

/* ================= SEARCH ================= */

.search-btn{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.32);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  backdrop-filter:blur(6px);
}

.search-btn svg{
  width:29px;
  height:29px;
  fill:none;
  stroke:#fff;
  stroke-width:2;
  stroke-linecap:round;
}

/* ================= RIGHT ACTIONS ================= */

.action-bar{
  position:absolute;
  right:9px;
  bottom:105px;
  z-index:30;
  width:66px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}

.action{
  width:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  color:#fff;
  cursor:pointer;
  padding:0;
}

.action-icon{
  width:53px;
  height:53px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));
  transition:transform .15s ease,color .15s ease;
}

.action-icon svg{
  width:39px;
  height:39px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.action:active .action-icon{
  transform:scale(.8);
}

.action-count{
  margin-top:0;
  color:#fff;
  font-size:13px;
  font-weight:bold;
  text-shadow:0 1px 4px #000;
}

/* ================= LIKE ================= */

.like-btn.liked .action-icon{
  color:#ff3040;
  transform:scale(1.08);
}

.like-btn.liked .action-icon svg{
  fill:#ff3040;
  stroke:#ff3040;
}

/* ================= BOOKMARK ================= */

.bookmark-btn.saved .action-icon{
  color:#fff;
}

.bookmark-btn.saved .action-icon svg{
  fill:#fff;
  stroke:#fff;
}

.bookmark-btn.saved .action-count{
  color:#fff;
}

/* ================= CREATOR ================= */

.creator-avatar{
  position:relative;
  width:54px;
  height:54px;
  border-radius:50%;
  border:2px solid #fff;
  overflow:visible;
  margin-bottom:2px;
}

.creator-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
}

.follow-plus{
  position:absolute;
  bottom:-7px;
  left:50%;
  transform:translateX(-50%);
  width:25px;
  height:25px;
  border-radius:50%;

  background:#fff;
  color:#000;
  font-size:19px;
  line-height:19px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.follow-plus.following{
  background:#fff;
  color:#000;
  font-size:15px;
}

/* ================= VIDEO INFO ================= */

.video-info{
  position:absolute;
  left:15px;
  right:88px;
  bottom:96px;
  z-index:25;
}

.username{
  font-size:18px;
  font-weight:bold;
  margin-bottom:9px;
  text-shadow:0 2px 4px rgba(0,0,0,.9);
}

.caption{
  font-size:15px;
  line-height:1.45;
  margin-bottom:9px;
  text-shadow:0 2px 4px rgba(0,0,0,.9);
}

.sound{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 2px 4px rgba(0,0,0,.9);
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:74px;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.96) 28%

}

.nav-btn{

  width:20%;
  height:65px;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.nav-btn svg{

  height:29px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav-btn.active{

}

.nav-btn:active{

/* ================= UPLOAD ================= */

.upload-btn{

.upload-btn svg{

/* ================= BADGE ================= */

.badge{

  top:2px;

  height:19px;

  font-size:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

/* ================= PAUSE ================= */

.pause-indicator{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.8);
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.15s;
  z-index:40;
}

.pause-indicator.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.pause-indicator svg{
  width:34px;
  height:34px;
  fill:#fff;
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%) translateY(20px);

}

.toast.show{

.comments-list{

</style>

<script>

/* ================= TOAST ================= */

let toastTimer;

function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    },1800);
}


/* ================= LIKE ================= */

function toggleLike(button){

  const count =
    button.querySelector(".action-count");

  let number =
    Number(count.textContent) || 0;

  if(button.classList.contains("liked")){

    button.classList.remove("liked");

    number =
      Math.max(0,number - 1);

  }else{

    button.classList.add("liked");

    number++;

  }

  count.textContent = number;

  const icon =
    button.querySelector(".action-icon");

  icon.animate(
    [
      {transform:"scale(.7)"},
      {transform:"scale(1.28)"},
      {transform:"scale(1)"}
    ],
    {
      duration:250,
      easing:"ease-out"
    }
  );
}


/* ================= FOLLOW ================= */

function toggleFollow(button){

    );

  }
}


/* ================= BOOKMARK ================= */

/* ================= SHARE ================= */

async function shareVideo(){

  const shareData = {

    title:"WWC-Core",

    text:"এই ভিডিওটি WWC-Core এ দেখুন।",

    url:window.location.href

  };

  try{

    if(navigator.share){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );

      showToast(
        "ভিডিওর Link Copy হয়েছে"
      );

    }

  }catch(error){

    console.log(
      "Share cancelled"
    );

  }
}


/* ================= COMMENTS ================= */

function openComments(){

  document
    .getElementById("commentPanel")
    .classList.add("open");

}

function closeComments(){

  document
    .getElementById("commentPanel")
    .classList.remove("open");

}

function addComment(){

  const input =
    document.getElementById(
      "commentInput"
    );

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  const list =
    document.getElementById(
      "commentsList"
    );

  const comment =
    document.createElement("div");

  comment.className =
    "comment";

  const strong =
    document.createElement("strong");

  strong.textContent = "You";

  const textNode =
    document.createTextNode(text);

  comment.appendChild(strong);

  comment.appendChild(textNode);

  list.appendChild(comment);

  input.value = "";

  list.scrollTop =
    list.scrollHeight;

  showToast(
    "Comment করা হয়েছে"
  );
}

/* ================= VIDEO PLAY / PAUSE ================= */

const videos =
  document.querySelectorAll(".video");

videos.forEach(video => {

  const item =
    video.closest(".video-item");

  const indicator =
    item.querySelector(
      ".pause-indicator"
    );

  item.addEventListener(
    "click",
    event => {

      if(
        event.target.closest("button")
      ){
        return;
      }

      if(video.paused){

        video.play()
          .catch(()=>{});

        indicator.classList.remove(
          "show"
        );

      }else{

        video.pause();

        indicator.classList.add(
          "show"
        );

      }

    }
  );

});


/* ================= AUTO PLAY ================= */

const observer =
  new IntersectionObserver(
    entries => {

      entries.forEach(entry => {

        const video =
          entry.target.querySelector(
            ".video"
          );

        const indicator =
          entry.target.querySelector(
            ".pause-indicator"
          );

        if(entry.isIntersecting){

          video.play()
            .catch(()=>{});

          indicator.classList.remove(
            "show"
          );

        }else{

          video.pause();

        }

      });

    },
    {
      threshold:.7
    }
  );


document
  .querySelectorAll(".video-item")
  .forEach(item => {

    observer.observe(item);

  });
