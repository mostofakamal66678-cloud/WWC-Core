*{

html,

.feed{

/* =====================================================

const app =

/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let currentProfile = {};

let videos = [];

let currentFeedMode = "forYou";

let currentVideoId = null;

let observer = null;

let toastTimer = null;

let loadingFeed = false;

let currentPlayingVideo = null;


/* =====================================================
   DEFAULT IMAGE
===================================================== */

const defaultPhoto =
  "./images/profile.png";


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =====================================================
   NUMBER
===================================================== */

function number(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


/* =====================================================
   TOAST
===================================================== */

function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      1800
    );

}


/* =====================================================
   TIMEOUT
===================================================== */

function withTimeout(
  promise,
  ms
){

  return Promise.race([

    promise,

    new Promise(
      (_,reject) => {

        setTimeout(
          () => {

            reject(
              new Error(
                "Operation timeout"
              )
            );

          },
          ms
        );

      }
    )

  ]);

}


/* =====================================================
   LOAD CURRENT PROFILE
===================================================== */

async function loadCurrentProfile(){

  if(!currentUser){
    return;
  }

  const userRef =
    doc(
      db,
      "users",
      currentUser.uid
    );

  try{

    const snap =
      await withTimeout(
        getDoc(userRef),
        8000
      );

    if(snap.exists()){

      currentProfile =
        snap.data();

      return;

    }

    currentProfile = {

      uid:
        currentUser.uid,

      name:
        currentUser.displayName ||
        "WWC User",

      username:
        "wwc_" +
        currentUser.uid.substring(
          0,
          6
        ),

      email:
        currentUser.email ||
        "",

      photoURL:
        currentUser.photoURL ||
        defaultPhoto,

      followers:0,

      following:0,

      likes:0,

      followerIds:[],

      followingIds:[],

      savedVideoIds:[]

    };

    await withTimeout(
      setDoc(
        userRef,
        currentProfile
      ),
      8000
    );

  }catch(error){

    console.error(
      "PROFILE ERROR:",
      error
    );

    currentProfile = {

      uid:
        currentUser.uid,

      name:
        currentUser.displayName ||
        "WWC User",

      username:
        "wwc_" +
        currentUser.uid.substring(
          0,
          6
        ),

      photoURL:
        currentUser.photoURL ||
        defaultPhoto,

      followingIds:[],

      savedVideoIds:[]

    };

  }

}


/* =====================================================
   FOLLOWING IDS
===================================================== */

function getFollowingIds(){

  return Array.isArray(
    currentProfile.followingIds
  )
    ? currentProfile.followingIds
    : [];

}


/* =====================================================
   USERNAME
===================================================== */

function getUsername(video){

  return String(

    video.username ||
    video.userName ||
    video.handle ||
    "wwc_user"

  ).replace(
    /^@/,
    ""
  );

}


/* =====================================================
   RESOLVE VIDEO URL
===================================================== */

async function resolveVideoURL(
  video,
  index
){

  console.log(
    "Checking video:",
    video
  );


  /* ---------------------------------------------------
     DIRECT URL FIELDS
  --------------------------------------------------- */

  const directFields = [

    "videoURL",
    "videoUrl",
    "downloadURL",
    "downloadUrl",
    "fileURL",
    "fileUrl",
    "video",
    "url",
    "src"

  ];


  for(
    const field of directFields
  ){

    const value =
      video[field];


    if(
      typeof value === "string" &&
      value.trim()
    ){

      console.log(
        "VIDEO URL FOUND:",
        field,
        value
      );

      return value.trim();

    }

  }


  /* ---------------------------------------------------
     FIREBASE STORAGE PATH
  --------------------------------------------------- */

  const storageFields = [

    "storagePath",
    "filePath",
    "storage",
    "path",
    "videoPath"

  ];


  for(
    const field of storageFields
  ){

    const value =
      video[field];


    if(
      typeof value === "string" &&
      value.trim()
    ){

      try{

        console.log(
          "STORAGE PATH FOUND:",
          value
        );


        const storageRef =
          ref(
            storage,
            value.trim()
          );


        const url =
          await withTimeout(
            getDownloadURL(
              storageRef
            ),
            12000
          );


        console.log(
          "STORAGE URL:",
          url
        );


        return url;

      }catch(error){

        console.error(
          "Storage URL error:",
          error
        );

      }

    }

  }


  /* ---------------------------------------------------
     LOCAL FALLBACK
  --------------------------------------------------- */

  if(index % 2 === 0){

    return "./videos/video1.mp4";

  }

  return "./videos/video2.mp4";

}


/* =====================================================
   SCORE
===================================================== */

function scoreVideo(video){

  const likes =
    number(video.likes);

  const comments =
    number(video.comments);

  const saves =
    number(video.saves);

  const views =
    number(video.views);

  let score =

    likes * 3 +
    comments * 5 +
    saves * 6 +
    views * .2;


  const creatorId =

    video.creatorId ||
    video.userId ||
    video.uid ||
    video.ownerId ||
    "";


  if(
    getFollowingIds()
      .includes(creatorId)
  ){

    score += 100;

  }


  return score;

}

/* =====================================================
   PLAY VIDEO
===================================================== */

async function playVideo(
  video
){

  if(
    !video ||
    !video.src
  ){

    console.warn(
      "NO VIDEO SRC"
    );

    return;

  }


  if(
    currentPlayingVideo &&
    currentPlayingVideo !==
      video
  ){

    try{

      currentPlayingVideo.pause();

    }catch(error){}

  }


  currentPlayingVideo =
    video;


  video.muted =
    true;


  try{

    await video.play();

  }catch(error){

    console.warn(
      "AUTOPLAY ERROR:",
      error
    );

  }

}


/* =====================================================
   OBSERVER
===================================================== */

function setupVideoObserver(){

  if(observer){

    observer.disconnect();

  }


  const items =
    [
      ...document.querySelectorAll(
        ".video-item"
      )
    ];


  if(!items.length){

    return;

  }


  observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(
          entry => {

            const item =
              entry.target;


            const video =
              item.querySelector(
                ".video"
              );


            if(
              entry.isIntersecting &&
              entry.intersectionRatio >= .65
            ){

              playVideo(
                video
              );

            }else if(
              entry.intersectionRatio < .4
            ){

              try{

                video.pause();

              }catch(error){}

            }

          }
        );


        preloadNearbyVideos();

      },

      {
        threshold:[
          .25,
          .5,
          .65,
          .8,
          .95
        ]
      }

    );


  items.forEach(
    item => {

      observer.observe(
        item
      );

    }
  );


  setTimeout(
    () => {

      const first =
        items[0];


      if(first){

        const video =
          first.querySelector(
            ".video"
          );


        playVideo(
          video
        );

      }

    },
    500
  );

}


/* =====================================================
   PRELOAD
===================================================== */

function preloadNearbyVideos(){

  const items =
    [
      ...document.querySelectorAll(
        ".video-item"
      )
    ];


  if(!items.length){

    return;

  }


  let activeIndex =
    0;


  items.forEach(
    (item,index) => {

      const rect =
        item.getBoundingClientRect();


      if(
        Math.abs(
          rect.top
        ) <
        window.innerHeight * .5
      ){

        activeIndex =
          index;

      }

    }
  );


  for(
    let i =
      activeIndex;

    i <
      Math.min(
        items.length,
        activeIndex + 3
      );

    i++

  ){

    const video =
      items[i].querySelector(
        ".video"
      );


    if(video){

      video.preload =
        "auto";

    }

  }

}

/* =====================================================
   LIKE
===================================================== */

async function toggleLike(
  item,
  videoId,
  button
){

  if(!currentUser){

    showToast(
      "আগে Login করুন"
    );

    return;

  }


  if(button.disabled){

    return;

  }


  button.disabled =
    true;


  try{

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const snap =
      await getDoc(
        videoRef
      );


    if(!snap.exists()){

      const liked =
        button.classList.contains(
          "liked"
        );


      const countEl =
        button.querySelector(
          ".action-count"
        );


      const oldCount =
        number(
          countEl.textContent
        );


      button.classList.toggle(
        "liked",
        !liked
      );


      countEl.textContent =
        Math.max(
          0,
          liked
            ? oldCount - 1
            : oldCount + 1
        );


      return;

    }


    const data =
      snap.data();


    const likedBy =
      Array.isArray(
        data.likedBy
      )
        ? data.likedBy
        : [];


    const liked =
      likedBy.includes(
        currentUser.uid
      );


    if(liked){

      await updateDoc(
        videoRef,
        {

          likedBy:
            arrayRemove(
              currentUser.uid
            ),

          likes:
            increment(-1)

        }
      );


      button.classList.remove(
        "liked"
      );

    }else{

      await updateDoc(
        videoRef,
        {

          likedBy:
            arrayUnion(
              currentUser.uid
            ),

          likes:
            increment(1)

        }
      );


      button.classList.add(
        "liked"
      );

    }


    const updated =
      await getDoc(
        videoRef
      );


    button
      .querySelector(
        ".action-count"
      )
      .textContent =
        updated.exists()
          ? number(
              updated.data().likes
            )
          : 0;


  }catch(error){

    console.error(
      "LIKE ERROR:",
      error
    );

    showToast(
      "Like সংরক্ষণ করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}

        button.classList.contains(
          "saved"
        );


      button.classList.toggle(
        "saved",
        !saved
      );


      showToast(
        saved
          ? "Saved থেকে সরানো হয়েছে"
          : "ভিডিও Saved হয়েছে"
      );


      return;

    }


    const data =
      videoSnap.data();


    const savedBy =
      Array.isArray(
        data.savedBy
      )
        ? data.savedBy
        : [];


    const saved =
      savedBy.includes(
        currentUser.uid
      );


    if(saved){

      await updateDoc(
        videoRef,
        {

          savedBy:
            arrayRemove(
              currentUser.uid
            ),

          saves:
            increment(-1)

        }
      );


      await updateDoc(
        userRef,
        {

          savedVideoIds:
            arrayRemove(
              videoId
            )

        }
      );


      button.classList.remove(
        "saved"
      );


      showToast(
        "Saved থেকে সরানো হয়েছে"
      );

    }else{

      await updateDoc(
        videoRef,
        {

          savedBy:
            arrayUnion(
              currentUser.uid
            ),

          saves:
            increment(1)

        }
      );


      await updateDoc(
        userRef,
        {

          savedVideoIds:
            arrayUnion(
              videoId
            )

        }
      );


      button.classList.add(
        "saved"
      );


      showToast(
        "ভিডিও Saved হয়েছে"
      );

    }


    const updated =
      await getDoc(
        videoRef
      );


    button
      .querySelector(
        ".action-count"
      )
      .textContent =
        updated.exists()
          ? number(
              updated.data().saves
            )
          : 0;


  }catch(error){

    console.error(
      "SAVE ERROR:",
      error
    );

    showToast(
      "Save সংরক্ষণ করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}


/* =====================================================
   FOLLOW
===================================================== */

async function toggleFollow(
  targetUid,
  button
){

  if(
    !currentUser ||
    !targetUid ||
    targetUid ===
      currentUser.uid
  ){

    return;

  }


  button.disabled =
    true;


  try{

    const myRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const targetRef =
      doc(
        db,
        "users",
        targetUid
      );


    const mySnap =
      await getDoc(
        myRef
      );


    const targetSnap =
      await getDoc(
        targetRef
      );


    if(
      !mySnap.exists() ||
      !targetSnap.exists()
    ){

      throw new Error(
        "Profile not found"
      );

    }


    const myData =
      mySnap.data();


    const following =
      Array.isArray(
        myData.followingIds
      )
        ? myData.followingIds
        : [];


    const exists =
      following.includes(
        targetUid
      );


    if(exists){

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayRemove(
              targetUid
            ),

          following:
            increment(-1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayRemove(
              currentUser.uid
            ),

          followers:
            increment(-1)

        }
      );


      button.classList.remove(
        "following"
      );


      button.textContent =
        "+";


      showToast(
        "Unfollow করা হয়েছে"
      );

    }else{

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayUnion(
              targetUid
            ),

          following:
            increment(1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayUnion(
              currentUser.uid
            ),

          followers:
            increment(1)

        }
      );


      button.classList.add(
        "following"
      );


      button.textContent =
        "✓";


      showToast(
        "Following করা হয়েছে"
      );

    }


    const updated =
      await getDoc(
        myRef
      );


    if(updated.exists()){

      currentProfile =
        updated.data();

    }


  }catch(error){

    console.error(
      "FOLLOW ERROR:",
      error
    );

    showToast(
      "Follow পরিবর্তন করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}

async function loadComments(
  videoId
){

  const list =
    document.getElementById(
      "commentsList"
    );


  list.innerHTML = `

    <div
      style="
        text-align:center;
        color:#888;
        padding:25px;
      "
    >
      Comments লোড হচ্ছে...
    </div>

  `;


  try{

    const commentsRef =
      collection(
        db,
        "videos",
        videoId,
        "comments"
      );


    const snap =
      await withTimeout(
        getDocs(
          commentsRef
        ),
        8000
      );


    list.innerHTML =
      "";


    if(snap.empty){

      list.innerHTML = `

        <div
          style="
            text-align:center;
            color:#777;
            padding:30px;
          "
        >
          এখনো কোনো Comment নেই।
        </div>

      `;

      return;

    }


    const comments = [];


    snap.forEach(
      commentDoc => {

        comments.push({

          id:
            commentDoc.id,

          ...commentDoc.data()

        });

      }
    );


    comments.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds ||
          0;

        const bTime =
          b.createdAt?.seconds ||
          0;


        return (
          aTime -
          bTime
        );

      }
    );


    comments.forEach(
      data => {

        const comment =
          document.createElement(
            "div"
          );


        comment.className =
          "comment";


        comment.innerHTML = `

          <strong>
            ${escapeHtml(
              data.username ||
              data.name ||
              "WWC User"
            )}
          </strong>

          ${escapeHtml(
            data.text ||
            ""
          )}

        `;


        list.appendChild(
          comment
        );

      }
    );


  }catch(error){

    console.error(
      "COMMENT LOAD ERROR:",
      error
    );


    list.innerHTML = `

      <div
        style="
          text-align:center;
          color:#ff667f;
          padding:25px;
        "
      >
        Comments লোড করা যায়নি।
      </div>

    `;

  }

}


async function addComment(){

  const input =
    document.getElementById(
      "commentInput"
    );


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  if(
    !currentUser ||
    !currentVideoId
  ){

    showToast(
      "আগে Login করুন"
    );

    return;

  }


  const sendButton =
    document.querySelector(
      ".comment-input button"
    );


  sendButton.disabled =
    true;


  try{

    const username =
      String(
        currentProfile.username ||
        currentProfile.name ||
        "WWC User"
      ).replace(
        /^@/,
        ""
      );


    await addDoc(

      collection(
        db,
        "videos",
        currentVideoId,
        "comments"
      ),

      {

        uid:
          currentUser.uid,

        username:
          username,

        name:
          currentProfile.name ||
          "WWC User",

        text:
          text,

        createdAt:
          serverTimestamp()

      }

    );


    const videoRef =
      doc(
        db,
        "videos",
        currentVideoId
      );


    const videoSnap =
      await getDoc(
        videoRef
      );


    if(videoSnap.exists()){

      await updateDoc(
        videoRef,
        {

          comments:
            increment(1)

        }
      );

    }


    input.value =
      "";


    await loadComments(
      currentVideoId
    );


    showToast(
      "Comment সংরক্ষণ হয়েছে"
    );


  }catch(error){

    console.error(
      "COMMENT ERROR:",
      error
    );


    showToast(
      "Comment সংরক্ষণ করা যায়নি"
    );

  }finally{

    sendButton.disabled =
      false;

  }

}


function closeComments(){

  document
    .getElementById(
      "commentPanel"
    )
    .classList.remove(
      "open"
    );

}


/* =====================================================
   SHARE
===================================================== */

async function shareVideo(
  videoId
){

  const url =
    new URL(
      window.location.href
    );


  url.searchParams.set(
    "video",
    videoId
  );


  const shareData = {

    title:
      "WWC-Core",

    text:
      "এই ভিডিওটি WWC-Core এ দেখুন।",

    url:
      url.toString()

  };


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard.writeText(
        url.toString()
      );


      showToast(
        "ভিডিও Link Copy হয়েছে"
      );

    }

  }catch(error){

    if(
      error?.name !==
      "AbortError"
    ){

      try{

        await navigator.clipboard.writeText(
          url.toString()
        );


        showToast(
          "ভিডিও Link Copy হয়েছে"
        );

      }catch(e){

        showToast(
          "Share করা যায়নি"
        );

      }

    }

  }

}

/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    event => {

      const q =
        event.target.value
          .trim()
          .toLowerCase();


      if(!q){

        renderFeed();

        return;

      }


      const filtered =
        videos.filter(
          video => {

            const username =
              getUsername(
                video
              )
              .toLowerCase();


            const name =
              String(
                video.name ||
                video.displayName ||
                ""
              )
              .toLowerCase();


            const caption =
              String(
                video.caption ||
                video.description ||
                ""
              )
              .toLowerCase();


            return (

              username.includes(q) ||

              name.includes(q) ||

              caption.includes(q)

            );

          }
        );


      renderSearchResults(
        filtered
      );

    }
  );


function renderSearchResults(
  list
){

  const feed =
    document.getElementById(
      "feed"
    );


  feed.innerHTML =
    "";


  if(!list.length){

    feed.innerHTML = `

      <div class="feed-message">

        <div>
          কোনো ভিডিও পাওয়া যায়নি।
        </div>

      </div>

    `;

    return;

  }


  list.forEach(
    (video,index) => {

      feed.appendChild(
        createVideoItem(
          video,
          index
        )
      );

    }
  );


  setupVideoObserver();

  preloadNearbyVideos();

}

/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if(document.hidden){

      document
        .querySelectorAll(
          ".video"
        )
        .forEach(
          video => {

            video.pause();

          }
        );

      return;

    }


    const items =
      [
        ...document.querySelectorAll(
          ".video-item"
        )
      ];


    let best =
      null;


    let bestRatio =
      0;


    items.forEach(
      item => {

        const rect =
          item.getBoundingClientRect();


        const visible =
          Math.min(
            window.innerHeight,
            rect.bottom
          )
          -
          Math.max(
            0,
            rect.top
          );


        const ratio =
          visible /
          window.innerHeight;


        if(
          ratio >
          bestRatio
        ){

          bestRatio =
            ratio;

          best =
            item;

        }

      }
    );


    if(best){

      const video =
        best.querySelector(
          ".video"
        );


      if(video){

        playVideo(
          video
        );

      }

    }

  }
);
