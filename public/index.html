<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>WWC - For You</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}


/* =====================================================
   APP
===================================================== */

.app {
  position: relative;
  width: 100%;
  height: 100dvh;
  background: #000;
  overflow: hidden;
}


/* =====================================================
   FEED
===================================================== */

.feed {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  overflow-y: auto;
  overflow-x: hidden;

  scroll-snap-type: y mandatory;

  scrollbar-width: none;
}

.feed::-webkit-scrollbar {
  display: none;
}


/* =====================================================
   VIDEO ITEM
===================================================== */

.video-item {
  position: relative;

  width: 100%;
  height: 100dvh;

  background: #000;

  scroll-snap-align: start;
  scroll-snap-stop: always;

  overflow: hidden;
}


/* =====================================================
   VIDEO
===================================================== */

.video {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  background: #000;
}


/* =====================================================
   DARK GRADIENT
===================================================== */

.video-item::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 45%;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.82)
    );

  pointer-events: none;
}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar {
  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 70px;

  z-index: 20;

  display: flex;

  align-items: center;
  justify-content: center;

  padding-top: env(safe-area-inset-top);

  background:
    linear-gradient(
      rgba(0,0,0,.5),
      transparent
    );
}


/* =====================================================
   TABS
===================================================== */

.tabs {
  display: flex;

  align-items: center;

  gap: 30px;

  height: 100%;
}

.tab {
  position: relative;

  border: 0;

  background: transparent;

  color: rgba(255,255,255,.62);

  font-size: 17px;

  font-weight: bold;

  padding: 10px 3px;

  cursor: pointer;
}

.tab.active {
  color: #fff;
}

.tab.active::after {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  bottom: 1px;

  height: 3px;

  border-radius: 10px;

  background: #fff;
}


/* =====================================================
   SEARCH
===================================================== */

.search-btn {
  position: absolute;

  right: 14px;
  top: 50%;

  transform: translateY(-50%);

  width: 45px;
  height: 45px;

  border: 0;

  border-radius: 50%;

  background: rgba(0,0,0,.35);

  color: #fff;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  backdrop-filter: blur(5px);
}

.search-btn svg {
  width: 29px;
  height: 29px;

  fill: none;

  stroke: #fff;

  stroke-width: 2;

  stroke-linecap: round;
}


/* =====================================================
   RIGHT ACTION BAR
===================================================== */

.action-bar {
  position: absolute;

  right: 9px;
  bottom: 105px;

  z-index: 30;

  width: 66px;

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 16px;
}


/* =====================================================
   ACTION BUTTON
===================================================== */

.action {
  width: 62px;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  border: 0;

  background: transparent;

  color: #fff;

  cursor: pointer;

  padding: 0;
}

.action:disabled {
  opacity: .6;
}


/* =====================================================
   ACTION ICON
===================================================== */

.action-icon {
  width: 51px;
  height: 51px;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 50%;

  color: #fff;

  filter:
    drop-shadow(
      0 2px 5px rgba(0,0,0,.8)
    );

  transition:
    transform .15s ease,
    color .15s ease;
}

.action-icon svg {
  width: 39px;
  height: 39px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
  stroke-linejoin: round;
}

.action:active .action-icon {
  transform: scale(.82);
}


/* =====================================================
   LIKE
===================================================== */

.like-btn.liked .action-icon {
  color: #ff3040;

  transform: scale(1.08);
}

.like-btn.liked .action-icon svg {
  fill: #ff3040;

  stroke: #ff3040;
}


/* =====================================================
   BOOKMARK
===================================================== */

.bookmark-btn.saved .action-icon {
  color: #fff;
}

.bookmark-btn.saved .action-icon svg {
  fill: #fff;

  stroke: #fff;
}


/* =====================================================
   COUNTS
===================================================== */

.action-count {
  margin-top: 1px;

  color: #fff;

  font-size: 13px;

  font-weight: bold;

  text-shadow:
    0 1px 4px #000;

  max-width: 62px;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}


/* =====================================================
   CREATOR
===================================================== */

.creator-action {
  width: 62px;

  display: flex;

  justify-content: center;
}

.creator-avatar {
  position: relative;

  width: 53px;
  height: 53px;

  border-radius: 50%;

  border: 2px solid #fff;

  overflow: visible;

  margin-bottom: 3px;
}

.creator-avatar img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  border-radius: 50%;

  display: block;
}


/* =====================================================
   FOLLOW PLUS
===================================================== */

.follow-plus {
  position: absolute;

  bottom: -7px;
  left: 50%;

  transform: translateX(-50%);

  width: 24px;
  height: 24px;

  border-radius: 50%;

  border: 0;

  background: #fff;

  color: #000;

  font-size: 20px;

  line-height: 20px;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  box-shadow:
    0 2px 6px rgba(0,0,0,.5);
}

.follow-plus.following {
  background: #fff;

  color: #000;

  font-size: 14px;
}

.follow-plus:disabled {
  opacity: .6;
}


/* =====================================================
   VIDEO INFO
===================================================== */

.video-info {
  position: absolute;

  left: 15px;
  right: 88px;

  bottom: 95px;

  z-index: 25;
}

.username {
  font-size: 18px;

  font-weight: bold;

  margin-bottom: 9px;

  text-shadow:
    0 2px 5px rgba(0,0,0,.9);
}

.caption {
  font-size: 15px;

  line-height: 1.45;

  margin-bottom: 9px;

  text-shadow:
    0 2px 5px rgba(0,0,0,.9);
}

.sound {
  display: flex;

  align-items: center;

  gap: 6px;

  font-size: 14px;

  font-weight: bold;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  text-shadow:
    0 2px 5px rgba(0,0,0,.9);
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  height: 72px;

  z-index: 100;

  display: flex;

  align-items: center;
  justify-content: space-around;

  padding-bottom:
    env(safe-area-inset-bottom);

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.96) 28%
    );
}


/* =====================================================
   NAV BUTTON
===================================================== */

.nav-btn {
  position: relative;

  width: 20%;

  height: 65px;

  border: 0;

  background: transparent;

  color: #fff;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 3px;

  font-size: 11px;

  font-weight: bold;

  cursor: pointer;
}

.nav-btn svg {
  width: 29px;
  height: 29px;

  fill: none;

  stroke: currentColor;

  stroke-width: 2;

  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-btn.active {
  color: #fff;
}

.nav-btn:active svg {
  transform: scale(.82);
}


/* =====================================================
   UPLOAD
===================================================== */

.upload-btn {
  position: relative;

  width: 56px;
  height: 42px;

  border: 0;

  border-radius: 12px;

  background: #fff;

  color: #000;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  box-shadow:
    -5px 0 0 #25f4ee,
    5px 0 0 #fe2c55;
}

.upload-btn svg {
  width: 27px;
  height: 27px;

  stroke: #000;

  stroke-width: 2.5;

  fill: none;

  stroke-linecap: round;
}


/* =====================================================
   BADGE
===================================================== */

.badge {
  position: absolute;

  top: 3px;
  right: 14px;

  min-width: 20px;
  height: 20px;

  padding: 0 5px;

  border-radius: 10px;

  background: #fe2c55;

  color: #fff;

  font-size: 11px;

  display: flex;

  align-items: center;
  justify-content: center;

  font-weight: bold;
}


/* =====================================================
   PAUSE
===================================================== */

.pause-indicator {
  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%,-50%)
    scale(.8);

  width: 70px;
  height: 70px;

  border-radius: 50%;

  background: rgba(0,0,0,.45);

  display: flex;

  align-items: center;
  justify-content: center;

  opacity: 0;

  pointer-events: none;

  transition: .15s;
}

.pause-indicator.show {
  opacity: 1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

.pause-indicator svg {
  width: 34px;
  height: 34px;

  fill: #fff;
}


/* =====================================================
   TOAST
===================================================== */

.toast {
  position: fixed;

  left: 50%;
  bottom: 90px;

  transform:
    translateX(-50%)
    translateY(20px);

  z-index: 500;

  background: rgba(30,30,30,.96);

  color: #fff;

  padding: 11px 18px;

  border-radius: 22px;

  font-size: 14px;

  opacity: 0;

  pointer-events: none;

  transition: .25s;

  max-width: 85%;

  text-align: center;
}

.toast.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =====================================================
   COMMENT PANEL
===================================================== */

.comment-panel {
  position: fixed;

  left: 0;
  right: 0;
  bottom: 0;

  z-index: 400;

  height: 55vh;

  background: #111;

  border-radius:
    18px 18px 0 0;

  transform:
    translateY(100%);

  transition:
    transform .3s ease;

  display: flex;

  flex-direction: column;
}

.comment-panel.open {
  transform:
    translateY(0);
}

.comment-header {
  height: 55px;

  flex-shrink: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  border-bottom: 1px solid #333;

  position: relative;

  font-weight: bold;
}

.comment-count-title {
  margin-left: 5px;

  color: #aaa;

  font-size: 13px;
}

.close-comments {
  position: absolute;

  right: 15px;

  border: 0;

  background: transparent;

  color: #fff;

  font-size: 28px;

  cursor: pointer;
}

.comments-list {
  flex: 1;

  overflow-y: auto;

  padding: 15px;
}

.comment {
  padding: 11px 0;

  border-bottom: 1px solid #222;
}

.comment strong {
  display: block;

  margin-bottom: 4px;
}

.comment-text {
  color: #ddd;

  line-height: 1.4;
}

.no-comments {
  text-align: center;

  color: #777;

  padding: 40px 10px;
}

.comment-input {
  display: flex;

  gap: 8px;

  padding: 10px;

  border-top: 1px solid #333;

  padding-bottom:
    calc(
      10px + env(safe-area-inset-bottom)
    );
}

.comment-input input {
  flex: 1;

  min-width: 0;

  border: 1px solid #444;

  background: #222;

  color: #fff;

  border-radius: 22px;

  padding: 12px 15px;

  outline: none;

  font-size: 15px;
}

.comment-input button {
  width: 50px;
  height: 45px;

  flex-shrink: 0;

  border: 0;

  border-radius: 50%;

  background: #fff;

  color: #000;

  font-size: 18px;

  cursor: pointer;
}


/* =====================================================
   SEARCH PANEL
===================================================== */

.search-panel {
  position: fixed;

  inset: 0;

  z-index: 600;

  background: #000;

  display: none;

  padding:
    calc(15px + env(safe-area-inset-top))
    15px
    15px;
}

.search-panel.open {
  display: block;
}

.search-top {
  display: flex;

  align-items: center;

  gap: 10px;
}

.search-top input {
  flex: 1;

  height: 45px;

  border: 1px solid #444;

  border-radius: 10px;

  background: #222;

  color: #fff;

  padding: 0 14px;

  font-size: 16px;

  outline: none;
}

.close-search {
  width: 45px;
  height: 45px;

  border: 0;

  border-radius: 50%;

  background: #222;

  color: #fff;

  font-size: 24px;

  cursor: pointer;
}


/* =====================================================
   SEARCH RESULTS
===================================================== */

.search-results {
  margin-top: 20px;

  overflow-y: auto;

  max-height: calc(100vh - 100px);
}

.search-result {
  display: flex;

  align-items: center;

  gap: 12px;

  padding: 12px 4px;

  border-bottom: 1px solid #222;
}

.search-result img {
  width: 48px;
  height: 48px;

  border-radius: 50%;

  object-fit: cover;
}

.search-result-info {
  flex: 1;

  min-width: 0;
}

.search-result-name {
  font-weight: bold;

  margin-bottom: 3px;
}

.search-result-handle {
  color: #888;

  font-size: 13px;
}

.search-result button {
  border: 0;

  border-radius: 8px;

  padding: 9px 12px;

  background: #fff;

  color: #000;

  font-weight: bold;
}


/* =====================================================
   DESKTOP
===================================================== */

@media (min-width: 700px) {

  .video-item {
    max-width: 500px;

    margin: auto;
  }

  .bottom-nav {
    max-width: 500px;

    left: 50%;
    right: auto;

    transform:
      translateX(-50%);
  }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media (max-width: 380px) {

  .action-bar {
    right: 5px;

    gap: 11px;
  }

  .action-icon {
    width: 46px;
    height: 46px;
  }

  .action-icon svg {
    width: 35px;
    height: 35px;
  }

  .creator-avatar {
    width: 49px;
    height: 49px;
  }

  .video-info {
    left: 10px;
    right: 72px;
  }

}

</style>

</head>

/* =====================================================
   FORMAT NUMBER
===================================================== */

function formatNumber(number) {

  number =
    Number(number) || 0;


  if (number >= 1000000) {

    return (
      (number / 1000000)
        .toFixed(1)
        .replace(".0", "") +
      "M"
    );

  }


  if (number >= 1000) {

    return (
      (number / 1000)
        .toFixed(1)
        .replace(".0", "") +
      "K"
    );

  }


  return String(number);

}

/* =====================================================
   ENSURE VIDEO DOCUMENT
===================================================== */

async function ensureVideoDocument(
  videoItem
) {

  const videoId =
    videoItem.dataset.videoId;


  const videoRef =
    doc(
      db,
      "videos",
      videoId
    );


  const snapshot =
    await getDoc(
      videoRef
    );


  if (!snapshot.exists()) {

    const creatorUid =
      currentUser
        ? currentUser.uid
        : "";


    await setDoc(
      videoRef,
      {

        videoId:
          videoId,

        creatorUid:
          creatorUid,

        likes:
          0,

        comments:
          0,

        bookmarks:
          0,

        createdAt:
          serverTimestamp()

      }
    );


    videoItem.dataset.creatorUid =
      creatorUid;


    return {

      likes: 0,
      comments: 0,
      bookmarks: 0,
      creatorUid: creatorUid

    };

  }


  const data =
    snapshot.data();


  videoItem.dataset.creatorUid =
    data.creatorUid || "";


  return data;

}


/* =====================================================
   UPDATE VIDEO COUNTS
===================================================== */

function updateVideoCounts(
  videoItem,
  data
) {

  if (!videoItem || !data) {
    return;
  }


  const likeCount =
    videoItem.querySelector(
      ".like-count"

  const commentCount =
    videoItem.querySelector(
      ".comment-count"
    );


  const bookmarkCount =
    videoItem.querySelector(
      ".bookmark-count"
    );


  if (likeCount) {

    likeCount.textContent =
      formatNumber(
        data.likes || 0
      );

  }


  if (commentCount) {

    commentCount.textContent =
      formatNumber(
        data.comments || 0
      );

  }


  if (bookmarkCount) {

    bookmarkCount.textContent =
      formatNumber(
        data.bookmarks || 0
      );

  }

}

/* =====================================================
   LIKE
===================================================== */

window.toggleLike =
async function toggleLike(
  button
) {

  if (!currentUser) {

    showToast(
      "আগে Login করুন"
    );

    setTimeout(
      () => {

        window.location.href =
          "./auth.html";

      },
      600
    );

    return;
  }


  const videoItem =
    getVideoItemFromButton(
      button
    );


  if (!videoItem) {
    return;
  }


  const videoId =
    videoItem.dataset.videoId;


  const icon =
    button.querySelector(
      ".action-icon"
    );


  button.disabled =
    true;


  try {

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const likeRef =
      doc(
        db,
        "videos",
        videoId,
        "likes",
        currentUser.uid
      );


    let newLiked =
      false;


    await runTransaction(
      db,
      async transaction => {

        const videoSnap =
          await transaction.get(
            videoRef
          );


        const likeSnap =
          await transaction.get(
            likeRef
          );


        if (
          likeSnap.exists()
        ) {

          transaction.delete(
            likeRef
          );


          transaction.update(
            videoRef,
            {

              likes:
                increment(-1)

            }
          );


          newLiked =
            false;

        } else {

          transaction.set(
            likeRef,
            {

              uid:
                currentUser.uid,

              createdAt:
                serverTimestamp()

            }
          );


          transaction.update(
            videoRef,
            {

              likes:
                increment(1)

            }
          );


          newLiked =
            true;

        }

      }
    );


    if (newLiked) {

      button.classList.add(
        "liked"
      );

      showToast(
        "❤️ Liked"
      );

    } else {

      button.classList.remove(
        "liked"
      );

      showToast(
        "Like সরানো হয়েছে"
      );

    }


    const updated =
      await getDoc(
        videoRef
      );


    if (
      updated.exists()
    ) {

      updateVideoCounts(
        videoItem,
        updated.data()
      );

    }


    icon.animate(
      [
        {
          transform:
            "scale(.7)"
        },
        {
          transform:
            "scale(1.3)"
        },
        {
          transform:
            "scale(1)"
        }
      ],
      {
        duration: 250
      }
    );


  } catch (error) {

    console.error(
      "Like error:",
      error
    );


    showToast(
      "Like করা যায়নি"
    );

  } finally {

    button.disabled =
      false;

  }

};

async function updateFollowButton(
  videoItem
) {

  if (!currentUser) {
    return;
  }


  const targetUid =
    videoItem.dataset.creatorUid;


  if (
    !targetUid ||
    targetUid === currentUser.uid
  ) {

    const button =
      videoItem.querySelector(
        ".follow-plus"
      );


    if (button) {

      button.style.display =
        targetUid === currentUser.uid
          ? "none"
          : "flex";

    }


    return;

  }


  const myRef =
    doc(
      db,
      "users",
      currentUser.uid
    );


  const mySnap =
    await getDoc(
      myRef
    );


  if (!mySnap.exists()) {
    return;
  }


  const data =
    mySnap.data();


  const followingIds =
    Array.isArray(
      data.followingIds
    )
      ? data.followingIds
      : [];


  const button =
    videoItem.querySelector(
      ".follow-plus"
    );


  if (!button) {
    return;
  }


  if (
    followingIds.includes(
      targetUid
    )
  ) {

    button.classList.add(
      "following"
    );

    button.textContent =
      "✓";

  } else {

    button.classList.remove(
      "following"
    );

    button.textContent =
      "+";

  }

}

window.toggleFollow =
async function toggleFollow(
  button
) {

  if (!currentUser) {

    showToast(
      "আগে Login করুন"
    );

    setTimeout(
      () => {

        window.location.href =
          "./auth.html";

      },
      600
    );

    return;
  }


  const videoItem =
    button.closest(
      ".video-item"
    );


  if (!videoItem) {
    return;
  }


  const targetUid =
    videoItem.dataset.creatorUid;


  if (
    !targetUid
  ) {

    showToast(
      "Creator profile পাওয়া যায়নি"
    );

    return;

  }


  if (
    targetUid ===
    currentUser.uid
  ) {

    showToast(
      "নিজেকে Follow করা যাবে না"
    );

    return;

  }


  button.disabled =
    true;


  try {

    const myRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const targetRef =
      doc(
        db,
        "users",
        targetUid
      );


    const mySnap =
      await getDoc(
        myRef
      );


    const targetSnap =
      await getDoc(
        targetRef
      );


    if (
      !mySnap.exists() ||
      !targetSnap.exists()
    ) {

      throw new Error(
        "Profile not found"
      );

    }


    const myData =
      mySnap.data();


    const followingIds =
      Array.isArray(
        myData.followingIds
      )
        ? myData.followingIds
        : [];


    const isFollowing =
      followingIds.includes(
        targetUid
      );


    if (isFollowing) {

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayRemove(
              targetUid
            ),

          following:
            increment(-1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayRemove(
              currentUser.uid
            ),

          followers:
            increment(-1)

        }
      );


      button.classList.remove(
        "following"
      );

      button.textContent =
        "+";


      showToast(
        "Unfollow করা হয়েছে"
      );


    } else {

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayUnion(
              targetUid
            ),

          following:
            increment(1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayUnion(
              currentUser.uid
            ),

          followers:
            increment(1)

        }
      );


      button.classList.add(
        "following"
      );

      button.textContent =
        "✓";


      showToast(
        "Following করা হয়েছে"
      );

    }


  } catch (error) {

    console.error(
      "Follow error:",
      error
    );


    showToast(
      "Follow পরিবর্তন করা যায়নি"
    );

  } finally {

    button.disabled =
      false;

  }

};

window.shareVideo =
async function shareVideo(
  button
) {

  const videoItem =
    getVideoItemFromButton(
      button

  const videoId =
    videoItem
      ? videoItem.dataset.videoId
      : "";


  const shareUrl =
    window.location.origin +
    window.location.pathname +
    "?video=" +
    encodeURIComponent(
      videoId
    );


  const shareData = {

    title:
      "WWC-Core",

    text:
      "এই ভিডিওটি WWC-Core এ দেখুন।",

    url:
      shareUrl

  };


  try {

    if (
      navigator.share
    ) {

      await navigator.share(
        shareData
      );

      showToast(
        "ভিডিও Share করা হয়েছে"
      );

    } else {

      await navigator.clipboard.writeText(
        shareUrl
      );

      showToast(
        "ভিডিওর Link Copy হয়েছে"
      );

    }

  } catch (error) {

    console.log(
      "Share cancelled"
    );

  }

};

/* =====================================================
   LOAD COMMENTS
===================================================== */

async function loadComments() {

  if (
    !activeVideoId
  ) {
    return;
  }


  try {

    const commentsRef =
      collection(
        db,
        "videos",
        activeVideoId,
        "comments"
      );


    const commentsQuery =
      query(
        commentsRef,
        orderBy(
          "createdAt",
          "asc"
        ),
        limit(100)
      );


    const snapshot =
      await getDocs(
        commentsQuery
      );


    commentsList.innerHTML =
      "";


    if (
      snapshot.empty
    ) {

      commentsList.innerHTML =
        `
          <div class="no-comments">
            এখনো কোনো Comment নেই।
          </div>
        `;

    } else {

      snapshot.forEach(
        commentDoc => {

          const data =
            commentDoc.data();


          const comment =
            document.createElement(
              "div"
            );


          comment.className =
            "comment";


          const name =
            escapeHtml(
              data.name ||
              "WWC User"
            );


          const text =
            escapeHtml(
              data.text ||
              ""
            );


          comment.innerHTML =
            `
              <strong>
                ${name}
              </strong>

              <div class="comment-text">
                ${text}
              </div>
            `;


          commentsList.appendChild(
            comment
          );

        }
      );

    }


    commentTitleCount.textContent =
      snapshot.size;


    commentsList.scrollTop =
      commentsList.scrollHeight;


  } catch (error) {

    console.error(
      "Comments load error:",
      error
    );


    commentsList.innerHTML =
      `
        <div class="no-comments">
          Comment load করা যায়নি।
        </div>
      `;

  }

}


/* =====================================================
   ADD COMMENT
===================================================== */

window.addComment =
async function addComment() {

  if (!currentUser) {

    showToast(
      "আগে Login করুন"
    );

    return;

  }


  if (
    !activeVideoId ||
    !activeVideoItem
  ) {

    return;

  }


  const text =
    commentInput.value.trim();


  if (!text) {

    showToast(
      "Comment লিখুন"
    );

    return;

  }


  commentSendBtn.disabled =
    true;


  try {

    const name =
      currentProfile &&
      currentProfile.name
        ? currentProfile.name
        : (
            currentUser.displayName ||
            "WWC User"
          );


    const commentsRef =
      collection(
        db,
        "videos",
        activeVideoId,
        "comments"
      );


    await addDoc(
      commentsRef,
      {

        uid:
          currentUser.uid,

        name:
          name,

        text:
          text,

        createdAt:
          serverTimestamp()

      }
    );


    const videoRef =
      doc(
        db,
        "videos",
        activeVideoId
      );


    await updateDoc(
      videoRef,
      {

        comments:
          increment(1)

      }
    );


    commentInput.value =
      "";


    await loadComments();


    const updated =
      await getDoc(
        videoRef
      );


    if (
      updated.exists()
    ) {

      updateVideoCounts(
        activeVideoItem,
        updated.data()
      );

    }


    showToast(
      "Comment করা হয়েছে"
    );


  } catch (error) {

    console.error(
      "Comment error:",
      error
    );


    showToast(
      "Comment করা যায়নি"
    );

  } finally {

    commentSendBtn.disabled =
      false;

  }

};


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

/* =====================================================
   SEARCH USERS
===================================================== */

async function searchUsers() {

  const queryText =
    searchInput.value
      .trim()
      .toLowerCase();


  if (!queryText) {

    searchResults.innerHTML =
      `
        <div class="no-comments">
          User খুঁজতে নাম বা username লিখুন।
        </div>
      `;

    return;

  }


  searchResults.innerHTML =
    `
      <div class="no-comments">
        Search হচ্ছে...
      </div>
    `;


  try {

    const snapshot =
      await getDocs(
        collection(
          db,
          "users"
        )
      );


    searchResults.innerHTML =
      "";


    let found =
      0;


    snapshot.forEach(
      userDoc => {

        const data =
          userDoc.data();


        if (
          currentUser &&
          userDoc.id ===
          currentUser.uid
        ) {

          return;

        }


        const name =
          String(
            data.name ||
            data.displayName ||
            ""
          );


        const username =
          String(
            data.username ||
            ""
          )
            .replace(
              /^@/,
              ""
            );


        const nameMatch =
          name
            .toLowerCase()
            .includes(
              queryText
            );


        const usernameMatch =
          username
            .toLowerCase()
            .includes(
              queryText
            );


        if (
          !nameMatch &&
          !usernameMatch
        ) {

          return;

        }


        found++;


        const result =
          document.createElement(
            "div"
          );


        result.className =
          "search-result";


        result.innerHTML =
          `
            <img
              src="${escapeHtml(
                data.photoURL ||
                defaultPhoto
              )}"
              alt="Profile"
            >

            <div class="search-result-info">

              <div class="search-result-name">
                ${escapeHtml(
                  name ||
                  "WWC User"
                )}
              </div>

              <div class="search-result-handle">
                @${escapeHtml(
                  username ||
                  "wwc_user"
                )}
              </div>

            </div>

            <button
              type="button"
              data-user-profile="${escapeHtml(
                userDoc.id
              )}"
            >
              Profile
            </button>
          `;


        searchResults.appendChild(
          result
        );

      }
    );


    if (!found) {

      searchResults.innerHTML =
        `
          <div class="no-comments">
            কোনো User পাওয়া যায়নি।
          </div>
        `;

    }


  } catch (error) {

    console.error(
      "Search error:",
      error
    );


    searchResults.innerHTML =
      `
        <div class="no-comments">
          Search করা যায়নি।
        </div>
      `;

  }

}

/* =====================================================
   VIDEO PLAY / PAUSE
===================================================== */

const videos =
  document.querySelectorAll(
    ".video"
  );


videos.forEach(
  video => {

    const item =
      video.closest(
        ".video-item"
      );


    const indicator =
      item.querySelector(
        ".pause-indicator"
      );


    item.addEventListener(
      "click",
      event => {

        if (
          event.target.closest(
            "button"
          )
        ) {

          return;

        }


        if (
          video.paused
        ) {

          video.play()
            .catch(
              () => {}
            );


          indicator.classList.remove(
            "show"
          );

        } else {

          video.pause();


          indicator.classList.add(
            "show"
          );

        }

      }
    );

  }
);


/* =====================================================
   AUTO PLAY
===================================================== */

const observer =
  new IntersectionObserver(
    entries => {

      entries.forEach(
        entry => {

          const video =
            entry.target.querySelector(
              ".video"
            );


          const indicator =
            entry.target.querySelector(
              ".pause-indicator"
            );


          if (
            entry.isIntersecting
          ) {

            video.play()
              .catch(
                () => {}
              );


            indicator.classList.remove(
              "show"
            );

          } else {

            video.pause();

          }

        }
      );

    },
    {
      threshold: .7
    }
  );


document
  .querySelectorAll(
    ".video-item"
  )
  .forEach(
    item => {

      observer.observe(
        item
      );

    }
  );


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    currentUser =
      user;


    if (!user) {

      showToast(
        "Login না থাকলে Like/Comment/Save করতে Login করুন"
      );


      return;

    }


    try {

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const userSnap =
        await getDoc(
          userRef
        );


      if (
        userSnap.exists()
      ) {

        currentProfile =
          userSnap.data();

      } else {

        currentProfile = {

          uid:
            user.uid,

          name:
            user.displayName ||
            "WWC User",

          username:
            "wwc_" +
            user.uid.substring(
              0,
              6
            ),

          email:
            user.email ||
            "",

          photoURL:
            user.photoURL ||
            defaultPhoto,

          followers:
            0,

          following:
            0,

          followerIds:
            [],

          followingIds:
            []

        };


        await setDoc(
          userRef,
          currentProfile
        );

      }


      await loadAllVideoData();


    } catch (error) {

      console.error(
        "Auth/profile error:",
        error
      );


      showToast(
        "Profile load করা যায়নি"
      );

    }

  }
);
