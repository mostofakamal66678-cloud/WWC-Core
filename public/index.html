<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>World Wide Connect</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- ===== TOP BAR ===== -->
    <header class="wwc-top-bar">
        <div class="wwc-top-tabs">
            <button class="wwc-top-tab" id="followingTab" type="button">Following</button>
            <button class="wwc-top-tab active" id="forYouTab" type="button">For You</button>
        </div>
        <button id="searchBtn" class="wwc-search-btn" type="button" aria-label="Search">🔍</button>
    </header>

    <!-- ===== VIDEO FEED ===== -->
    <main id="video-feed">
        <!-- ভিডিওগুলো এখানে লোড হবে -->
    </main>

    <!-- ===== BOTTOM NAVIGATION ===== -->
    <nav class="wwc-bottom-nav" aria-label="Main Navigation">
        
        <!-- HOME -->
        <button class="wwc-nav-btn active" id="homeBtn" type="button">
            <span>🏠</span>
            <span>Home</span>
        </button>

        <!-- FRIENDS -->
        <button class="wwc-nav-btn" id="friendsBtn" type="button">
            <span>👥</span>
            <span>Friends</span>
        </button>

        <!-- CREATE / UPLOAD -->
        <button id="uploadBtn" class="wwc-create-btn" type="button" aria-label="Upload Video">+</button>

        <!-- INBOX -->
        <button class="wwc-nav-btn" id="inboxBtn" type="button">
            <span>💬</span>
            <span>Inbox</span>
        </button>

        <!-- PROFILE -->
        <button id="profileBtn" class="wwc-nav-btn" type="button">
            <span>👤</span>
            <span>Profile</span>
        </button>

    </nav>

    <!-- ===== PROFILE MENU ===== -->
    <div id="profileMenu" class="profile-menu" aria-hidden="true">
        <div class="profile-menu-header">
            <div class="profile-menu-title">👤 My Profile</div>
            <button id="profileMenuClose" class="profile-menu-close" type="button" aria-label="Close">✕</button>
        </div>
        <button id="profileBtnMenu" class="profile-menu-btn" type="button">👤 Profile</button>
        <button id="loginBtn" class="profile-menu-btn" type="button">🔐 Login / Register</button>
        <button id="logoutBtn" class="profile-menu-btn logout-menu-btn" type="button">🚪 Logout</button>
    </div>

    <!-- ===== COMMENT BOX ===== -->
    <div id="commentBox" class="comment-box" aria-hidden="true">
        <div class="comment-title">💬 Comments</div>
        <textarea id="commentInput" placeholder="Write a comment..." maxlength="500"></textarea>
        <div class="comment-buttons">
            <button id="commentCancel" type="button">Cancel</button>
            <button id="commentSend" type="button">Send</button>
        </div>
    </div>

    <!-- ===== HIDDEN VIDEO UPLOAD ===== -->
    <input id="videoUpload" type="file" accept="video/*" hidden>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
