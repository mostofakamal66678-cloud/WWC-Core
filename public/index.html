<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>WWC - For You</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overscroll-behavior:none;
}

button,input{
  font-family:inherit;
}

button{
  -webkit-user-select:none;
  user-select:none;
}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:#000;
}

.feed{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
  overscroll-behavior-y:contain;
}

.feed::-webkit-scrollbar{
  display:none;
}

.video-item{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:100dvh;
  background:#000;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  overflow:hidden;
}

.video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.video-item::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:48%;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.86)
  );
  pointer-events:none;
}

/* TOP */

.top-bar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:78px;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:env(safe-area-inset-top);
  background:linear-gradient(
    rgba(0,0,0,.48),
    transparent
  );
}

.tabs{
  display:flex;
  align-items:center;
  gap:30px;
}

.tab{
  position:relative;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.62);
  font-size:17px;
  font-weight:bold;
  padding:10px 3px;
}

.tab.active{
  color:#fff;
}

.tab.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:1px;
  height:3px;
  border-radius:10px;
  background:#fff;
}

/* SEARCH */

.search-btn{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.40);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(7px);
}

.search-btn svg{
  width:29px;
  height:29px;
  fill:none;
  stroke:#fff;
  stroke-width:2;
  stroke-linecap:round;
}

/* ACTIONS */

.action-bar{
  position:absolute;
  right:7px;
  bottom:105px;
  z-index:30;
  width:67px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
}

.action{
  width:62px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  color:#fff;
  padding:0;
}

.action-icon{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.9));
  transition:transform .15s ease;
}

.action-icon svg{
  width:40px;
  height:40px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.action:active .action-icon{
  transform:scale(.82);
}

.action-count{
  margin-top:1px;
  color:#fff;
  font-size:13px;
  font-weight:bold;
  text-shadow:0 1px 4px #000;
}

/* LIKE */

.like-btn.liked .action-icon{
  color:#ff3040;
  transform:scale(1.08);
}

.like-btn.liked .action-icon svg{
  fill:#ff3040;
  stroke:#ff3040;
}

/* SAVE */

.save-btn.saved .action-icon{
  color:#fff;
}

.save-btn.saved .action-icon svg{
  fill:#fff;
  stroke:#fff;
}

/* AVATAR */

.creator-avatar{
  position:relative;
  width:54px;
  height:54px;
  border-radius:50%;
  border:2px solid #fff;
  overflow:visible;
}

.creator-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
}

.follow-plus{
  position:absolute;
  bottom:-7px;
  left:50%;
  transform:translateX(-50%);
  width:25px;
  height:25px;
  border-radius:50%;
  border:0;
  background:#fff;
  color:#000;
  font-size:20px;
  line-height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.follow-plus.following{
  font-size:14px;
}

/* INFO */

.video-info{
  position:absolute;
  left:15px;
  right:88px;
  bottom:93px;
  z-index:25;
}

.username{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
  text-shadow:0 2px 4px rgba(0,0,0,.9);
}

.caption{
  font-size:15px;
  line-height:1.45;
  margin-bottom:8px;
  text-shadow:0 2px 4px rgba(0,0,0,.9);
}

.sound{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 2px 4px rgba(0,0,0,.9);
}

/* SOUND */

.sound-btn{
  position:absolute;
  left:14px;
  bottom:145px;
  z-index:35;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.43);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(5px);
}

.sound-btn svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:#fff;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* PAUSE */

.pause-indicator{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.8);
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,0,0,.48);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.15s;
  z-index:40;
}

.pause-indicator.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.pause-indicator svg{
  width:34px;
  height:34px;
  fill:#fff;
}

/* BOTTOM */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:75px;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.98) 30%
  );
}

.nav-btn{
  position:relative;
  width:20%;
  height:68px;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
  font-weight:bold;
}

.nav-btn svg{
  width:29px;
  height:29px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.upload-btn{
  position:relative;
  width:57px;
  height:43px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    -4px 0 0 #25f4ee,
    4px 0 0 #fe2c55;
}

.upload-btn svg{
  width:28px;
  height:28px;
  stroke:#000;
  stroke-width:2.5;
  fill:none;
}

.badge{
  position:absolute;
  top:2px;
  right:14px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:10px;
  background:#fe2c55;
  color:#fff;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

/* COMMENTS */

.comment-panel{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:150;
  height:58vh;
  background:#111;
  border-radius:18px 18px 0 0;
  transform:translateY(100%);
  transition:transform .3s ease;
  display:flex;
  flex-direction:column;
}

.comment-panel.open{
  transform:translateY(0);
}

.comment-header{
  height:55px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #333;
  position:relative;
  font-weight:bold;
}

.close-comments{
  position:absolute;
  right:15px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:28px;
}

.comments-list{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.comment{
  padding:11px 0;
  border-bottom:1px solid #252525;
  line-height:1.45;
}

.comment strong{
  display:block;
  margin-bottom:4px;
}

.comment-input{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid #333;
  background:#111;
}

.comment-input input{
  flex:1;
  min-width:0;
  height:45px;
  border:1px solid #444;
  background:#222;
  color:#fff;
  border-radius:22px;
  padding:0 15px;
  outline:none;
}

.comment-input button{
  width:48px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  font-size:18px;
}

/* SEARCH */

.search-panel{
  position:fixed;
  inset:0;
  z-index:300;
  background:#000;
  display:none;
  padding:15px;
}

.search-panel.open{
  display:block;
}

.search-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.search-top input{
  flex:1;
  height:45px;
  border:1px solid #444;
  border-radius:10px;
  background:#222;
  color:#fff;
  padding:0 14px;
  font-size:16px;
  outline:none;
}

.close-search{
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:24px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%) translateY(20px);
  z-index:500;
  background:rgba(30,30,30,.96);
  color:#fff;
  padding:11px 18px;
  border-radius:22px;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
  max-width:90vw;
  overflow:hidden;
  text-overflow:ellipsis;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* LOADING */

.feed-loading{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  color:#aaa;
  font-size:15px;
  pointer-events:none;
}

.hidden{
  display:none!important;
}

@media(min-width:700px){

  .video-item{
    max-width:500px;
    margin:auto;
  }

  .bottom-nav{
    max-width:500px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
  }

  .comment-panel{
    max-width:500px;
    left:50%;
    right:auto;
    transform:translate(-50%,100%);
  }

  .comment-panel.open{
    transform:translate(-50%,0);
  }

}
</style>
</head>

<body>

<div class="app">

<main class="feed" id="feed">

  <div class="feed-loading" id="feedLoading">
    ভিডিও লোড হচ্ছে...
  </div>

</main>

<nav class="bottom-nav">

<script type="module">

/* =========================================================
   FIREBASE IMPORTS
========================================================= */

import {
  getApps,
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  setDoc,
  updateDoc,
  arrayUnion,
  arrayRemove,
  increment,
  addDoc,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

  authDomain:
    "world-wide-connect-62c87.firebaseapp.com",

  projectId:
    "world-wide-connect-62c87",

  storageBucket:
    "world-wide-connect-62c87.firebasestorage.app",

  messagingSenderId:
    "93178453668",

  appId:
    "1:93178453668:web:2184630caa8e61f7445031",

  measurementId:
    "G-PKFJ5NEMGQ"
};


/* =========================================================
   INIT
========================================================= */

const app =
  getApps().length
    ? getApps()[0]
    : initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;

let currentProfile = {};

let videos = [];

let currentFeedMode = "forYou";

let currentVideoId = null;

let observer = null;

let toastTimer = null;

let soundEnabled = false;

const defaultPhoto =
  "./images/profile.png";


/* =========================================================
   DOM
========================================================= */

const feed =
  document.getElementById("feed");

const feedLoading =
  document.getElementById("feedLoading");

const toast =
  document.getElementById("toast");

const commentPanel =
  document.getElementById("commentPanel");

const commentsList =
  document.getElementById("commentsList");

const commentInput =
  document.getElementById("commentInput");

const searchPanel =
  document.getElementById("searchPanel");

const searchInput =
  document.getElementById("searchInput");


/* =========================================================
   TOAST
========================================================= */

function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    },1800);
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   NUMBER
========================================================= */

function safeNumber(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;
}


/* =========================================================
   PROFILE
========================================================= */

async function loadCurrentProfile(){

  if(!currentUser){
    return;
  }

  const ref =
    doc(
      db,
      "users",
      currentUser.uid
    );

  const snap =
    await getDoc(ref);

  if(!snap.exists()){

    currentProfile = {

      uid:
        currentUser.uid,

      name:
        currentUser.displayName ||
        "WWC User",

      username:
        "wwc_" +
        currentUser.uid.substring(0,6),

      email:
        currentUser.email ||
        "",

      photoURL:
        currentUser.photoURL ||
        defaultPhoto,

      followers:
        0,

      following:
        0,

      likes:
        0,

      followerIds:
        [],

      followingIds:
        [],

      savedVideoIds:
        []

    };

    await setDoc(
      ref,
      currentProfile
    );

  }else{

    currentProfile =
      snap.data();

  }
}


/* =========================================================
   FOLLOWING IDS
========================================================= */

function getFollowingIds(){

  return Array.isArray(
    currentProfile.followingIds
  )
    ? currentProfile.followingIds
    : [];
}


/* =========================================================
   LOAD VIDEOS
========================================================= */

async function loadVideos(){

  feedLoading.style.display =
    "flex";

  videos = [];

  try{

    const videosRef =
      collection(
        db,
        "videos"
      );

    const snap =
      await getDocs(
        videosRef
      );

    snap.forEach(
      videoDoc => {

        const data =
          videoDoc.data();

        videos.push({

          id:
            videoDoc.id,

          ...data

        });

      }
    );

  }catch(error){

    console.error(
      "Videos load error:",
      error
    );

    showToast(
      "ভিডিও লোড করতে সমস্যা হয়েছে"
    );

  }


  /*
   Sort by createdAt when available.
   Newest first.
  */

  videos.sort(
    (a,b) => {

      const aTime =
        a.createdAt?.seconds ||
        0;

      const bTime =
        b.createdAt?.seconds ||
        0;

      return bTime - aTime;

    }
  );


  renderFeed();

  feedLoading.style.display =
    "none";
}


/* =========================================================
   VIDEO URL
========================================================= */

function getVideoURL(video){

  return (
    video.videoURL ||
    video.videoUrl ||
    video.url ||
    video.src ||
    video.fileURL ||
    video.downloadURL ||
    ""
  );
}


/* =========================================================
   USERNAME
========================================================= */

function getUsername(video){

  return String(
    video.username ||
    video.userName ||
    video.handle ||
    "wwc_user"
  ).replace(/^@/,"");
}


/* =========================================================
   CREATOR ID
========================================================= */

function getCreatorId(video){

  return (
    video.creatorId ||
    video.userId ||
    video.uid ||
    video.ownerId ||
    ""
  );
}


/* =========================================================
   FILTER
========================================================= */

function getFilteredVideos(){

  if(
    currentFeedMode ===
    "following"
  ){

    const following =
      getFollowingIds();

    return videos.filter(
      video => {

        return following.includes(
          getCreatorId(video)
        );

      }
    );

  }

  return videos;
}


/* =========================================================
   RENDER FEED
========================================================= */

function renderFeed(){

  if(observer){

    observer.disconnect();

    observer = null;

  }

  feed.innerHTML = "";

  const list =
    getFilteredVideos();


  if(!list.length){

    const empty =
      document.createElement(
        "div"
      );

    empty.style.cssText = `
      width:100%;
      height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#aaa;
      padding:30px;
    `;

    empty.innerHTML = `

      <div>

        <div style="
          font-size:45px;
          margin-bottom:12px;
        ">
          ${
            currentFeedMode ===
            "following"
              ? "👥"
              : "🎬"
          }
        </div>

        <div>

          ${
            currentFeedMode ===
            "following"
              ? "আপনি এখনো কাউকে Follow করেননি।"
              : "কোনো ভিডিও পাওয়া যায়নি।"
          }

        </div>

      </div>

    `;

    feed.appendChild(
      empty
    );

    return;
  }


  list.forEach(
    (video,index) => {

      const item =
        createVideoItem(
          video,
          index
        );

      feed.appendChild(
        item
      );

    }
  );


  setupVideoObserver();

}

/* =========================================================
   PLAY / PAUSE
========================================================= */

function toggleVideoPlay(item){

  const video =
    item.querySelector(
      ".video"
    );

  const indicator =
    item.querySelector(
      ".pause-indicator"
    );


  if(!video){

    return;

  }


  if(video.paused){

    video.play()
      .then(() => {

        indicator.classList.remove(
          "show"
        );

      })
      .catch(() => {

        showToast(
          "ভিডিও চালু করা যায়নি"
        );

      });

  }else{

    video.pause();

    indicator.classList.add(
      "show"
    );

  }
}


/* =========================================================
   ACTION EVENT
========================================================= */

feed.addEventListener(
  "click",
  async event => {

    const actionButton =
      event.target.closest(
        "[data-action]"
      );

    const tab =
      event.target.closest(
        "[data-tab]"
      );


    if(tab){

      switchFeed(
        tab.dataset.tab ===
        "following"
          ? "following"
          : "forYou"
      );

      return;

    }


    if(!actionButton){

      return;

    }


    const action =
      actionButton.dataset.action;


    if(action === "search"){

      openSearch();

      return;

    }


    const item =
      actionButton.closest(
        ".video-item"
      );


    if(!item){

      return;

    }


    const videoId =
      item.dataset.videoId;


    if(action === "like"){

      await toggleLike(
        item,
        videoId,
        actionButton
      );

    }


    if(action === "comment"){

      await openComments(
        videoId
      );

    }


    if(action === "save"){

      await toggleSave(
        item,
        videoId,
        actionButton
      );

    }


    if(action === "share"){

      await shareVideo(
        videoId
      );

    }


    if(action === "follow"){

      await toggleFollow(
        actionButton.dataset.creator,
        actionButton
      );

    }


    if(action === "sound"){

      toggleSound(
        item,
        actionButton
      );

    }

  }
);


/* =========================================================
   SWITCH FEED
========================================================= */

function switchFeed(mode){

  currentFeedMode =
    mode;

  renderFeed();

  requestAnimationFrame(
    () => {

      const first =
        feed.querySelector(
          ".video-item"
        );

      if(first){

        feed.scrollTo({
          top:0,
          behavior:"instant"
        });

      }

    }
  );
}


/* =========================================================
   LIKE
========================================================= */

async function toggleLike(
  item,
  videoId,
  button
){

  if(!currentUser){

    showToast(
      "আগে Login করুন"
    );

    return;

  }


  if(button.dataset.busy === "1"){

    return;

  }

  button.dataset.busy =
    "1";


  try{

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const snap =
      await getDoc(
        videoRef
      );


    if(!snap.exists()){

      showToast(
        "ভিডিওটি Firebase-এ পাওয়া যায়নি"
      );

      return;

    }


    const data =
      snap.data();


    const likedBy =
      Array.isArray(
        data.likedBy
      )
        ? data.likedBy
        : [];


    const alreadyLiked =
      likedBy.includes(
        currentUser.uid
      );


    if(alreadyLiked){

      await updateDoc(
        videoRef,
        {

          likedBy:
            arrayRemove(
              currentUser.uid
            ),

          likes:
            increment(-1)

        }
      );

      button.classList.remove(
        "liked"
      );


    }else{

      await updateDoc(
        videoRef,
        {

          likedBy:
            arrayUnion(
              currentUser.uid
            ),

          likes:
            increment(1)

        }
      );

      button.classList.add(
        "liked"
      );


      const icon =
        button.querySelector(
          ".action-icon"
        );

      if(icon){

        icon.animate(
          [
            {
              transform:"scale(.7)"
            },
            {
              transform:"scale(1.35)"
            },
            {
              transform:"scale(1)"
            }
          ],
          {
            duration:260
          }
        );

      }

    }


    const updated =
      await getDoc(
        videoRef
      );


    const count =
      updated.exists()
        ? Math.max(
            0,
            safeNumber(
              updated.data().likes
            )
          )
        : 0;


    const countElement =
      button.querySelector(
        ".action-count"
      );


    if(countElement){

      countElement.textContent =
        count;

    }


  }catch(error){

    console.error(
      "LIKE ERROR:",
      error
    );

    showToast(
      "Like সংরক্ষণ করা যায়নি"
    );

  }finally{

    button.dataset.busy =
      "0";

  }
}

/* =========================================================
   FOLLOW
========================================================= */

async function toggleFollow(
  targetUid,
  button
){

  if(
    !currentUser ||
    !targetUid
  ){

    return;

  }


  if(
    targetUid ===
    currentUser.uid
  ){

    return;

  }


  if(button.dataset.busy === "1"){

    return;

  }

  button.dataset.busy =
    "1";


  try{

    const myRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const targetRef =
      doc(
        db,
        "users",
        targetUid
      );


    const mySnap =
      await getDoc(
        myRef
      );


    const targetSnap =
      await getDoc(
        targetRef
      );


    if(
      !mySnap.exists() ||
      !targetSnap.exists()
    ){

      showToast(
        "User profile পাওয়া যায়নি"
      );

      return;

    }


    const myData =
      mySnap.data();


    const followingIds =
      Array.isArray(
        myData.followingIds
      )
        ? myData.followingIds
        : [];


    const alreadyFollowing =
      followingIds.includes(
        targetUid
      );


    if(alreadyFollowing){

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayRemove(
              targetUid
            ),

          following:
            increment(-1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayRemove(
              currentUser.uid
            ),

          followers:
            increment(-1)

        }
      );


      button.classList.remove(
        "following"
      );

      button.textContent =
        "+";


      showToast(
        "Unfollow করা হয়েছে"
      );


    }else{

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayUnion(
              targetUid
            ),

          following:
            increment(1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayUnion(
              currentUser.uid
            ),

          followers:
            increment(1)

        }
      );


      button.classList.add(
        "following"
      );

      button.textContent =
        "✓";


      showToast(
        "Following করা হয়েছে"
      );

    }


    currentProfile =
      (
        await getDoc(
          myRef
        )
      ).data();


  }catch(error){

    console.error(
      "FOLLOW ERROR:",
      error
    );

    showToast(
      "Follow পরিবর্তন করা যায়নি"
    );

  }finally{

    button.dataset.busy =
      "0";

  }
}

/* =========================================================
   COMMENTS LOAD
========================================================= */

async function loadComments(
  videoId
){

  commentsList.innerHTML = `

    <div style="
      text-align:center;
      color:#888;
      padding:25px;
    ">
      Comments লোড হচ্ছে...
    </div>

  `;


  try{

    const commentsRef =
      collection(
        db,
        "videos",
        videoId,
        "comments"
      );


    const commentsQuery =
      query(
        commentsRef,
        orderBy(
          "createdAt",
          "asc"
        )
      );


    let snap;


    try{

      snap =
        await getDocs(
          commentsQuery
        );

    }catch(orderError){

      /*
        If index/order causes a problem,
        load without order.
      */

      console.warn(
        "Comment order fallback:",
        orderError
      );

      snap =
        await getDocs(
          commentsRef
        );

    }


    commentsList.innerHTML =
      "";


    if(snap.empty){

      commentsList.innerHTML = `

        <div style="
          text-align:center;
          color:#777;
          padding:30px;
        ">
          এখনো কোনো Comment নেই।
        </div>

      `;

      return;

    }


    snap.forEach(
      commentDoc => {

        const data =
          commentDoc.data();


        const comment =
          document.createElement(
            "div"
          );


        comment.className =
          "comment";


        comment.innerHTML = `

          <strong>
            ${escapeHtml(
              data.username ||
              data.name ||
              "WWC User"
            )}
          </strong>

          ${escapeHtml(
            data.text ||
            ""
          )}

        `;


        commentsList.appendChild(
          comment
        );

      }
    );


    commentsList.scrollTop =
      commentsList.scrollHeight;


  }catch(error){

    console.error(
      "COMMENTS LOAD ERROR:",
      error
    );


    commentsList.innerHTML = `

      <div style="
        text-align:center;
        color:#ff667f;
        padding:25px;
      ">
        Comments লোড করা যায়নি।
      </div>

    `;

  }
}

    await addDoc(

      collection(
        db,
        "videos",
        currentVideoId,
        "comments"
      ),

      {

        uid:
          currentUser.uid,

        username:
          username,

        name:
          currentProfile.name ||
          "WWC User",

        text:
          text,

        createdAt:
          serverTimestamp()

      }

    );


    /*
      Update video comment count.
    */

    const videoRef =
      doc(
        db,
        "videos",
        currentVideoId
      );


    const videoSnap =
      await getDoc(
        videoRef
      );


    if(videoSnap.exists()){

      await updateDoc(
        videoRef,
        {

          comments:
            increment(1)

        }
      );

    }


    commentInput.value =
      "";


    await loadComments(
      currentVideoId
    );


    /*
      Update visible count.
    */

    const item =
      document.querySelector(
        `.video-item[data-video-id="${CSS.escape(currentVideoId)}"]`
      );


    if(item){

      const button =
        item.querySelector(
          ".comment-btn"
        );


      if(button){

        const count =
          button.querySelector(
            ".action-count"
          );


        if(count){

          count.textContent =
            safeNumber(
              videoSnap.data()?.comments
            ) + 1;

        }

      }

    }


    showToast(
      "Comment সংরক্ষণ হয়েছে"
    );


  }catch(error){

    console.error(
      "COMMENT ERROR:",
      error
    );

    showToast(
      "Comment সংরক্ষণ করা যায়নি"
    );

  }finally{

    sendButton.dataset.busy =
      "0";

  }
}

/* =========================================================
   SHARE
========================================================= */

async function shareVideo(
  videoId
){

  const url =
    new URL(
      window.location.href
    );


  url.searchParams.set(
    "video",
    videoId
  );


  const shareData = {

    title:
      "WWC-Core",

    text:
      "এই ভিডিওটি WWC-Core এ দেখুন।",

    url:
      url.toString()

  };


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );

      showToast(
        "Share করা হয়েছে"
      );

    }else{

      await copyText(
        url.toString()
      );

      showToast(
        "ভিডিও Link Copy হয়েছে"
      );

    }

  }catch(error){

    if(
      error?.name ===
      "AbortError"
    ){

      return;

    }


    try{

      await copyText(
        url.toString()
      );

      showToast(
        "ভিডিও Link Copy হয়েছে"
      );

    }catch(copyError){

      console.error(
        "SHARE ERROR:",
        copyError
      );

      showToast(
        "Share করা যায়নি"
      );

    }

  }
}


/* =========================================================
   COPY
========================================================= */

async function copyText(
  text
){

  if(
    navigator.clipboard &&
    window.isSecureContext
  ){

    await navigator.clipboard.writeText(
      text
    );

    return;

  }


  const textarea =
    document.createElement(
      "textarea"
    );

  textarea.value =
    text;

  textarea.style.position =
    "fixed";

  textarea.style.left =
    "-9999px";

  document.body.appendChild(
    textarea
  );

  textarea.select();

  document.execCommand(
    "copy"
  );

  textarea.remove();

}

/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
  "input",
  event => {

    const q =
      event.target.value
        .trim()
        .toLowerCase();


    if(!q){

      renderFeed();

      return;

    }


    const filtered =
      videos.filter(
        video => {

          const username =
            getUsername(
              video
            ).toLowerCase();


          const name =
            String(
              video.name ||
              video.displayName ||
              ""
            ).toLowerCase();


          const caption =
            String(
              video.caption ||
              video.description ||
              ""
            ).toLowerCase();


          return (
            username.includes(q) ||
            name.includes(q) ||
            caption.includes(q)
          );

        }
      );


    renderSearchResults(
      filtered
    );

  }
);

function renderSearchResults(
  list
){

  if(observer){

    observer.disconnect();

    observer = null;

  }


  feed.innerHTML =
    "";


  if(!list.length){

    feed.innerHTML = `

      <div style="
        width:100%;
        height:100dvh;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#888;
        text-align:center;
      ">
        কোনো ভিডিও পাওয়া যায়নি।
      </div>

    `;

    return;

  }


  list.forEach(
    (video,index) => {

      feed.appendChild(
        createVideoItem(
          video,
          index
        )
      );

    }
  );


  setupVideoObserver();

}


/* =========================================================
   VIDEO OBSERVER
========================================================= */

function setupVideoObserver(){

  if(observer){

    observer.disconnect();

  }


  observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(
          entry => {

            const video =
              entry.target.querySelector(
                ".video"
              );


            const indicator =
              entry.target.querySelector(
                ".pause-indicator"
              );


            if(!video){

              return;

            }


            if(
              entry.isIntersecting &&
              entry.intersectionRatio >= .65
            ){

              /*
                Pause every other video.
              */

              document
                .querySelectorAll(
                  ".video"
                )
                .forEach(
                  other => {

                    if(
                      other !==
                      video
                    ){

                      other.pause();

                    }

                  }
                );


              video.muted =
                !soundEnabled;


              video.play()
                .then(() => {

                  indicator?.classList.remove(
                    "show"
                  );

                })
                .catch(
                  error => {

                    console.log(
                      "Autoplay blocked:",
                      error
                    );

                  }
                );


            }else{

              video.pause();

            }

          }
        );

      },

      {
        threshold:[
          0.2,
          0.65,
          0.9
        ]
      }

    );


  document
    .querySelectorAll(
      ".video-item"
    )
    .forEach(
      item => {

        observer.observe(
          item
        );

      }
    );


  /*
    Start the first video.
  */

  requestAnimationFrame(
    () => {

      const first =
        document.querySelector(
          ".video-item .video"
        );

      if(first){

        first.muted =
          !soundEnabled;

        first.play()
          .catch(() => {});

      }

    }
  );
}

/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.hidden
    ){

      document
        .querySelectorAll(
          ".video"
        )
        .forEach(
          video => {

            video.pause();

          }
        );

    }else{

      const visible =
        document.querySelector(
          ".video-item .video"
        );

      if(visible){

        /*
          Browser may block autoplay.
          That's okay; user can tap.
        */

        visible.muted =
          !soundEnabled;

        visible.play()
          .catch(() => {});

      }

    }

  }
);
