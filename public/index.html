<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>WWC · Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<div class="app">
  <!-- ফিড -->
  <main class="feed" id="feed"></main>
  
  <!-- টিকটক স্টাইল বটম নেভ -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="goHome()">
      <span class="nav-icon"><i class="fas fa-home"></i></span>
      <span>Home</span>
    </button>
    <button class="nav-btn" onclick="goFriends()">
      <span class="nav-icon"><i class="fas fa-user-friends"></i></span>
      <span>Friends</span>
      <span class="badge" id="friendBadge">0</span>
    </button>
    <button class="nav-btn" onclick="goUpload()">
      <span class="upload-btn"><i class="fas fa-plus"></i></span>
    </button>
    <button class="nav-btn" onclick="goInbox()">
      <span class="nav-icon"><i class="fas fa-inbox"></i></span>
      <span>Inbox</span>
      <span class="badge" id="inboxBadge">0</span>
    </button>
    <button class="nav-btn" onclick="goProfile()">
      <span class="nav-icon"><i class="fas fa-user"></i></span>
      <span>Profile</span>
    </button>
  </nav>
  
  <!-- কমেন্ট প্যানেল -->
  <div class="comment-panel" id="commentPanel">
    <div class="comment-header">
      <span>Comments</span>
      <button class="close-comments" onclick="closeComments()">✕</button>
    </div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comment-input">
      <input id="commentInput" type="text" maxlength="500" placeholder="Add comment...">
      <button onclick="addComment()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
  
  <!-- টোস্ট -->
  <div class="toast" id="toast"></div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
