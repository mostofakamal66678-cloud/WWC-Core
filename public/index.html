<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>WWC - For You</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

button {
  font-family: inherit;
}

.app {
  position: relative;
  width: 100%;
  height: 100dvh;
  background: #000;
  overflow: hidden;
}

.feed {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}

.feed::-webkit-scrollbar {
  display: none;
}

.video-item {
  position: relative;
  width: 100%;
  height: 100dvh;
  background: #000;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  overflow: hidden;
}

.video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}

.video-item::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 42%;
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.78)
  );
  pointer-events: none;
}

/* =========================
   TOP BAR
========================= */

.top-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 72px;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: env(safe-area-inset-top);
  background: linear-gradient(
    rgba(0,0,0,.48),
    transparent
  );
}

.tabs {
  display: flex;
  align-items: center;
  gap: 30px;
}

.tab {
  position: relative;
  border: 0;
  background: transparent;
  color: rgba(255,255,255,.65);
  font-size: 17px;
  font-weight: bold;
  padding: 10px 3px;
  cursor: pointer;
}

.tab.active {
  color: #fff;
}

.tab.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 1px;
  height: 3px;
  border-radius: 10px;
  background: #fff;
}

.search-btn {
  position: absolute;
  right: 13px;
  top: 50%;
  transform: translateY(-50%);
  width: 45px;
  height: 45px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.35);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  backdrop-filter: blur(6px);
}

.search-btn svg {
  width: 28px;
  height: 28px;
  fill: none;
  stroke: #fff;
  stroke-width: 2;
}

/* =========================
   RIGHT ACTION BAR
========================= */

.action-bar {
  position: absolute;
  right: 9px;
  bottom: 105px;
  z-index: 40;
  width: 65px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.action {
  width: 62px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 0;
  background: transparent;
  color: #fff;
  cursor: pointer;
  padding: 0;
}

.action-icon {
  width: 51px;
  height: 51px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.8));
  transition:
    transform .15s ease,
    color .15s ease;
}

.action-icon svg {
  width: 39px;
  height: 39px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.action:active .action-icon {
  transform: scale(.82);
}

.action-count {
  margin-top: 1px;
  color: #fff;
  font-size: 13px;
  font-weight: bold;
  text-shadow: 0 1px 3px #000;
}

/* LIKE */

.like-btn.liked .action-icon {
  color: #ff3040;
  transform: scale(1.08);
}

.like-btn.liked .action-icon svg {
  fill: #ff3040;
  stroke: #ff3040;
}

/* SAVE */

.save-btn.saved .action-icon {
  color: #fff;
}

.save-btn.saved .action-icon svg {
  fill: #fff;
  stroke: #fff;
}

/* =========================
   PROFILE
========================= */

.creator-avatar {
  position: relative;
  width: 53px;
  height: 53px;
  border-radius: 50%;
  border: 2px solid #fff;
  overflow: visible;
  margin-bottom: 3px;
}

.creator-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}

.follow-plus {
  position: absolute;
  bottom: -7px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 0;
  background: #fff;
  color: #000;
  font-size: 20px;
  line-height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: bold;
}

.follow-plus.following {
  background: #fff;
  color: #000;
  font-size: 14px;
}

/* =========================
   VIDEO INFO
========================= */

.video-info {
  position: absolute;
  left: 15px;
  right: 88px;
  bottom: 96px;
  z-index: 35;
}

.username {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 9px;
  text-shadow: 0 2px 4px rgba(0,0,0,.9);
}

.caption {
  font-size: 15px;
  line-height: 1.45;
  margin-bottom: 9px;
  text-shadow: 0 2px 4px rgba(0,0,0,.9);
}

.sound-name {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 2px 4px rgba(0,0,0,.9);
}

/* =========================
   SOUND BUTTON
========================= */

.sound-toggle {
  position: absolute;
  top: 82px;
  left: 14px;
  z-index: 60;
  width: 43px;
  height: 43px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.45);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(5px);
  cursor: pointer;
}

.sound-toggle svg {
  width: 25px;
  height: 25px;
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* =========================
   PAUSE
========================= */

.pause-indicator {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%) scale(.8);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: rgba(0,0,0,.45);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: .15s;
  z-index: 45;
}

.pause-indicator.show {
  opacity: 1;
  transform: translate(-50%,-50%) scale(1);
}

.pause-indicator svg {
  width: 34px;
  height: 34px;
  fill: #fff;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 72px;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom);
  background: linear-gradient(
    transparent,
    rgba(0,0,0,.96) 25%
  );
}

.nav-btn {
  position: relative;
  width: 20%;
  height: 65px;
  border: 0;
  background: transparent;
  color: #aaa;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
}

.nav-btn svg {
  width: 29px;
  height: 29px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-btn.active {
  color: #fff;
}

.upload-btn {
  position: relative;
  width: 56px;
  height: 42px;
  border: 0;
  border-radius: 12px;
  background: #fff;
  color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow:
    -5px 0 0 #25f4ee,
    5px 0 0 #fe2c55;
}

.upload-btn svg {
  width: 27px;
  height: 27px;
  stroke: #000;
  stroke-width: 2.5;
  fill: none;
}

.badge {
  position: absolute;
  top: -2px;
  right: 17px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 10px;
  background: #fe2c55;
  color: #fff;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

/* =========================
   COMMENTS
========================= */

.comment-panel {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 150;
  height: 58vh;
  background: #111;
  border-radius: 18px 18px 0 0;
  transform: translateY(100%);
  transition: transform .3s ease;
  display: flex;
  flex-direction: column;
}

.comment-panel.open {
  transform: translateY(0);
}

.comment-header {
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid #333;
  position: relative;
  font-weight: bold;
}

.close-comments {
  position: absolute;
  right: 15px;
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 26px;
  cursor: pointer;
}

.comments-list {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.comment {
  padding: 11px 0;
  border-bottom: 1px solid #222;
  line-height: 1.4;
}

.comment strong {
  display: block;
  margin-bottom: 4px;
}

.comment-input {
  display: flex;
  gap: 8px;
  padding: 10px;
  border-top: 1px solid #333;
}

.comment-input input {
  flex: 1;
  min-width: 0;
  border: 1px solid #444;
  background: #222;
  color: #fff;
  border-radius: 22px;
  padding: 12px 15px;
  outline: none;
}

.comment-input button {
  width: 50px;
  border: 0;
  border-radius: 50%;
  background: #fff;
  color: #000;
  font-size: 18px;
  cursor: pointer;
}

/* =========================
   SEARCH
========================= */

.search-panel {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: #000;
  display: none;
  padding: 15px;
}

.search-panel.open {
  display: block;
}

.search-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.search-top input {
  flex: 1;
  height: 45px;
  border: 1px solid #444;
  border-radius: 10px;
  background: #222;
  color: #fff;
  padding: 0 14px;
  font-size: 16px;
  outline: none;
}

.close-search {
  width: 45px;
  height: 45px;
  border: 0;
  border-radius: 50%;
  background: #222;
  color: #fff;
  font-size: 24px;
}

/* =========================
   TOAST
========================= */

.toast {
  position: fixed;
  left: 50%;
  bottom: 90px;
  transform: translateX(-50%) translateY(20px);
  z-index: 500;
  background: rgba(30,30,30,.95);
  color: #fff;
  padding: 11px 18px;
  border-radius: 22px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* =========================
   LOADING
========================= */

.loading {
  position: fixed;
  inset: 0;
  z-index: 600;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.hidden {
  display: none !important;
}

@media (min-width: 700px) {

  .video-item {
    max-width: 500px;
    margin: auto;
  }

  .bottom-nav {
    max-width: 500px;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
  }

}

</style>

</head>

<body>

<div class="app">

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  getApps,
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  setDoc,
  updateDoc,
  addDoc,
  arrayUnion,
  arrayRemove,
  increment,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

  authDomain:
    "world-wide-connect-62c87.firebaseapp.com",

  projectId:
    "world-wide-connect-62c87",

  storageBucket:
    "world-wide-connect-62c87.firebasestorage.app",

  messagingSenderId:
    "93178453668",

  appId:
    "1:93178453668:web:2184630caa8e61f7445031",

  measurementId:
    "G-PKFJ5NEMGQ"

};


const app =
  getApps().length
    ? getApps()[0]
    : initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let currentProfile = null;

let currentMode = "forYou";

let currentCommentVideoId = null;

let toastTimer = null;

let observer = null;


/* =====================================================
   VIDEO DATA
===================================================== */

const videos = [

  {
    id: "video1",
    src: "./videos/video1.mp4",
    username: "@wwc_user",
    caption:
      "🌍 WWC-Core এ আপনাকে স্বাগতম। World Wide Connect",
    sound:
      "Original sound - WWC",
    avatar:
      "./images/profile.png"
  },

  {
    id: "video2",
    src: "./videos/video2.mp4",
    username: "@wwc_user",
    caption:
      "🌍 নতুন ভিডিও দেখুন WWC-Core এ।",
    sound:
      "Original sound - WWC",
    avatar:
      "./images/profile.png"
  }

];


/* =====================================================
   ELEMENTS
===================================================== */

const feed =
  document.getElementById("feed");

const loading =
  document.getElementById("loading");

const toast =
  document.getElementById("toast");

const commentPanel =
  document.getElementById("commentPanel");

const commentsList =
  document.getElementById("commentsList");

const commentInput =
  document.getElementById("commentInput");

const searchPanel =
  document.getElementById("searchPanel");


/* =====================================================
   TOAST
===================================================== */

function showToast(text) {

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    }, 1800);

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   USER VIDEO INTERACTION DOC
===================================================== */

function interactionRef(videoId) {

  return doc(
    db,
    "users",
    currentUser.uid,
    "videoInteractions",
    videoId
  );

}


/* =====================================================
   LOAD USER
===================================================== */

async function loadCurrentUser() {

  if (!currentUser) {
    return;
  }

  const ref =
    doc(
      db,
      "users",
      currentUser.uid
    );

  const snap =
    await getDoc(ref);


  if (!snap.exists()) {

    currentProfile = {

      uid:
        currentUser.uid,

      name:
        currentUser.displayName ||
        "WWC User",

      username:
        "wwc_" +
        currentUser.uid.substring(0,6),

      email:
        currentUser.email || "",

      photoURL:
        currentUser.photoURL ||
        "./images/profile.png",

      followers: 0,
      following: 0,
      likes: 0,

      followerIds: [],
      followingIds: [],

      videos: []

    };


    await setDoc(
      ref,
      currentProfile
    );

  } else {

    currentProfile =
      snap.data();

  }

}


/* =====================================================
   CREATE FEED
===================================================== */

async function renderFeed() {

  feed.innerHTML = "";

  const visibleVideos =
    await getVideosForMode();


  if (!visibleVideos.length) {

    feed.innerHTML = `

      <section class="video-item">

        <div
          style="
            position:absolute;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:30px;
          "
        >

          <div>

            <div style="font-size:45px;">
              🎬
            </div>

            <div style="margin-top:12px;">
              এই মুহূর্তে কোনো ভিডিও নেই।
            </div>

          </div>

        </div>

      </section>

    `;

    return;

  }


  for (
    const video of visibleVideos
  ) {

    const item =
      await createVideoItem(video);

    feed.appendChild(item);

  }


  setupVideoObserver();

}


/* =====================================================
   FOLLOWING / FOR YOU
===================================================== */

async function getVideosForMode() {

  if (
    currentMode === "forYou"
  ) {

    return [...videos];

  }


  const followingIds =
    Array.isArray(
      currentProfile?.followingIds
    )
      ? currentProfile.followingIds
      : [];


  if (!followingIds.length) {

    return [];

  }


  /*
    Demo feed-এর creator হলো
    current user's username।

    পরে upload system-এ creatorUid
    যুক্ত করলে এখানে creatorUid দিয়ে
    filter করা যাবে।
  */

  return videos.filter(
    video => {

      return followingIds.includes(
        video.creatorUid
      );

    }
  );

}


/* =====================================================
   VIDEO CARD
===================================================== */

async function createVideoItem(video) {

  const item =
    document.createElement("section");

  item.className =
    "video-item";

  item.dataset.videoId =
    video.id;


  const interaction =
    await getInteraction(
      video.id
    );


  const liked =
    interaction?.liked === true;

  const saved =
    interaction?.saved === true;


  const likeCount =
    Number(
      interaction?.likeCount || 0
    );

/* =====================================================
   GET INTERACTION
===================================================== */

async function getInteraction(videoId) {

  if (!currentUser) {
    return null;
  }


  try {

    const snap =
      await getDoc(
        interactionRef(videoId)
      );


    if (!snap.exists()) {

      return null;

    }


    return snap.data();

  } catch (error) {

    console.error(
      "Interaction read error:",
      error
    );

    return null;

  }

}


/* =====================================================
   ENSURE INTERACTION DOC
===================================================== */

async function ensureInteraction(
  videoId
) {

  const ref =
    interactionRef(videoId);

  const snap =
    await getDoc(ref);


  if (!snap.exists()) {

    await setDoc(
      ref,
      {
        videoId,
        liked: false,
        saved: false,
        likeCount: 0,
        saveCount: 0,
        commentCount: 0
      }
    );

    return {
      videoId,
      liked: false,
      saved: false,
      likeCount: 0,
      saveCount: 0,
      commentCount: 0
    };

  }


  return snap.data();

}

   LIKE
===================================================== */

async function toggleLike(
  item
) {

  if (!currentUser) {

    showToast(
      "আগে Login করুন"
    );

    return;

  }


  const button =
    item.querySelector(
      "[data-like]"
    );


  button.disabled = true;


  try {

    const data =
      await ensureInteraction(
        item.dataset.videoId
      );


    const newLiked =
      !Boolean(data.liked);


    const newCount =
      Math.max(
        0,
        Number(data.likeCount || 0)
        +
        (newLiked ? 1 : -1)
      );


    await setDoc(
      interactionRef(
        item.dataset.videoId
      ),
      {

        liked:
          newLiked,

        likeCount:
          newCount

      },
      {
        merge: true
      }
    );


    button.classList.toggle(
      "liked",
      newLiked
    );


    item.querySelector(
      ".like-count"
    ).textContent =
      newCount;


    showToast(
      newLiked
        ? "❤️ Like করা হয়েছে"
        : "Like সরানো হয়েছে"

    const icon =
      button.querySelector(

    icon.animate(
      [

        { transform: "scale(1.25)" },
        { transform: "scale(1)" }

  } catch (error) {

    console.error(

    showToast(

async function loadComments(
  videoId
) {

  commentsList.innerHTML = "";


  try {

    const commentsRef =
      collection(
        db,
        "videos",
        videoId,
        "comments"
      );


    const snap =
      await getDocs(
        commentsRef
      );


    if (snap.empty) {

      commentsList.innerHTML = `

        <div
          style="
            text-align:center;
            color:#777;
            padding:35px 10px;
          "
        >
          এখনো কোনো Comment নেই।
        </div>

      `;

      return;

    }


    const comments =
      [];


    snap.forEach(
      commentDoc => {

        comments.push({
          id:
            commentDoc.id,

          ...commentDoc.data()

        });

      }
    );


    comments.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.toMillis
            ? a.createdAt.toMillis()
            : 0;

        const bTime =
          b.createdAt?.toMillis
            ? b.createdAt.toMillis()
            : 0;

        return aTime - bTime;

      }
    );


    comments.forEach(
      comment => {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "comment";


        div.innerHTML = `

          <strong>
            ${escapeHtml(
              comment.userName ||
              "WWC User"
            )}
          </strong>

          ${escapeHtml(
            comment.text || ""
          )}

        `;


        commentsList.appendChild(
          div
        );

      }
    );


    commentsList.scrollTop =
      commentsList.scrollHeight;


  } catch (error) {

    console.error(
      "Comment load error:",
      error
    );


    commentsList.innerHTML = `

      <div
        style="
          text-align:center;
          color:#ff667f;
          padding:30px;
        "
      >
        Comment লোড করা যায়নি।
      </div>

    `;

  }

}


async function addComment() {

  if (!currentUser) {

    showToast(
      "আগে Login করুন"
    );

    return;

  }


  const text =
    commentInput.value.trim();


  if (!text) {
    return;
  }


  if (!currentCommentVideoId) {
    return;
  }


  const sendButton =
    document.querySelector(
      ".comment-input button"
    );


  sendButton.disabled = true;


  try {

    await addDoc(
      collection(
        db,
        "videos",
        currentCommentVideoId,
        "comments"
      ),
      {

        uid:
          currentUser.uid,

        userName:
          currentProfile?.name ||
          currentUser.displayName ||
          "WWC User",

        userPhoto:
          currentProfile?.photoURL ||
          currentUser.photoURL ||
          "./images/profile.png",

        text:
          text,

        createdAt:
          new Date()

      }
    );


    const interaction =
      await ensureInteraction(
        currentCommentVideoId
      );


    await setDoc(
      interactionRef(
        currentCommentVideoId
      ),
      {

        commentCount:
          Number(
            interaction.commentCount || 0
          ) + 1

      },
      {
        merge: true
      }
    );


    commentInput.value = "";


    await loadComments(
      currentCommentVideoId
    );


    const item =
      document.querySelector(
        `[data-video-id="${CSS.escape(currentCommentVideoId)}"]`
      );


    if (item) {

      const count =
        item.querySelector(
          ".comment-count"
        );


      if (count) {

        count.textContent =
          Number(
            interaction.commentCount || 0
          ) + 1;

      }

    }


    showToast(
      "✓ Comment সংরক্ষণ হয়েছে"
    );


  } catch (error) {

    console.error(
      "Comment error:",
      error
    );


    showToast(
      "Comment সংরক্ষণ করা যায়নি"
    );

  } finally {

    sendButton.disabled = false;

  }

}

  commentPanel.classList.remove(

async function shareVideo(
  item
) {

  const url =
    window.location.origin +
    window.location.pathname +
    "?video=" +
    encodeURIComponent(
      item.dataset.videoId
    );


  const shareData = {

    title:
      "WWC-Core",

    text:
      "এই ভিডিওটি WWC-Core এ দেখুন।",

    url:
      url

  };


  try {

    if (
      navigator.share
    ) {

      await navigator.share(
        shareData
      );

      showToast(
        "✓ Share করা হয়েছে"
      );

    } else if (
      navigator.clipboard
    ) {

      await navigator.clipboard.writeText(
        url
      );

      showToast(
        "✓ Video Link Copy হয়েছে"
      );

    } else {

      showToast(
        "Share এই ডিভাইসে Support করছে না"
      );

    }

  } catch (error) {

    if (
      error?.name !==
      "AbortError"
    ) {

      console.error(
        "Share error:",
        error
      );

    }

  }

}


/* =====================================================
   FOLLOW
===================================================== */

async function toggleFollow(
  button,
  video
) {

  if (!currentUser) {

    showToast(
      "আগে Login করুন"
    );

    return;

  }


  /*
    Demo creator যদি বর্তমান user হয়,
    নিজেকে Follow করা যাবে না।
  */

  if (
    video.creatorUid &&
    video.creatorUid ===
    currentUser.uid
  ) {

    showToast(
      "নিজেকে Follow করা যাবে না"
    );

    return;

  }


  /*
    creatorUid না থাকলে আপাতত UI feedback।
    Upload system-এ creatorUid যুক্ত হলে
    এটি Firebase follow system-এর সঙ্গে কাজ করবে।
  */

  if (!video.creatorUid) {

    const following =
      button.classList.contains(
        "following"
      );


    button.classList.toggle(
      "following",
      !following
    );


    button.textContent =
      !following
        ? "✓"
        : "+";


    showToast(
      !following
        ? "Following করা হয়েছে"
        : "Unfollow করা হয়েছে"
    );


    return;

  }


  button.disabled = true;


  try {

    const myRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const targetRef =
      doc(
        db,
        "users",
        video.creatorUid
      );


    const mySnap =
      await getDoc(myRef);


    const targetSnap =
      await getDoc(targetRef);


    if (
      !mySnap.exists() ||
      !targetSnap.exists()
    ) {

      throw new Error(
        "Profile not found"
      );

    }


    const myData =
      mySnap.data();


    const targetData =
      targetSnap.data();


    const ids =
      Array.isArray(
        myData.followingIds
      )
        ? myData.followingIds
        : [];


    const alreadyFollowing =
      ids.includes(
        video.creatorUid
      );


    if (alreadyFollowing) {

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayRemove(
              video.creatorUid
            ),

          following:
            increment(-1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayRemove(
              currentUser.uid
            ),

          followers:
            increment(-1)

        }
      );


      button.classList.remove(
        "following"
      );

      button.textContent =
        "+";


      showToast(
        "Unfollow করা হয়েছে"
      );


    } else {

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayUnion(
              video.creatorUid
            ),

          following:
            increment(1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayUnion(
              currentUser.uid
            ),

          followers:
            increment(1)

        }
      );


      button.classList.add(
        "following"
      );

      button.textContent =
        "✓";


      showToast(
        "Following করা হয়েছে"
      );

    }


    currentProfile =
      (
        await getDoc(myRef)
      ).data();


  } catch (error) {

    console.error(
      "Follow error:",
      error
    );


    showToast(
      "Follow পরিবর্তন করা যায়নি"
    );

  } finally {

    button.disabled =
      false;

  }

}

/* =====================================================
   VIDEO EVENTS
===================================================== */

function attachVideoEvents(
  item,
  videoData
) {

  const video =
    item.querySelector(
      ".video"
    );


  const indicator =
    item.querySelector(
      ".pause-indicator"
    );


  item.addEventListener(
    "click",
    event => {

      if (
        event.target.closest(
          "button"
        )
      ) {

        return;

      }


      if (
        video.paused
      ) {

        video.play()
          .catch(() => {});

        indicator.classList.remove(
          "show"
        );

      } else {

        video.pause();

        indicator.classList.add(
          "show"
        );

      }

    }
  );


  item.querySelector(
    "[data-like]"
  ).addEventListener(
    "click",
    () => toggleLike(item)
  );


  item.querySelector(
    "[data-save]"
  ).addEventListener(
    "click",
    () => toggleSave(item)
  );


  item.querySelector(
    "[data-comment]"
  ).addEventListener(
    "click",
    () => openComments(item)
  );


  item.querySelector(
    "[data-share]"
  ).addEventListener(
    "click",
    () => shareVideo(item)
  );


  item.querySelector(
    "[data-follow]"
  ).addEventListener(
    "click",
    () => {

      toggleFollow(
        item.querySelector(
          "[data-follow]"
        ),
        videoData
      );

    }
  );


  item.querySelector(
    "[data-sound]"
  ).addEventListener(
    "click",
    () => toggleSound(item)
  );


  item.querySelectorAll(
    "[data-mode]"
  ).forEach(
    tab => {

      tab.addEventListener(
        "click",
        async event => {

          const mode =
            event.currentTarget.dataset.mode;


          currentMode =
            mode;


          await renderFeed();


          feed.scrollTop = 0;


          showToast(
            mode === "forYou"
              ? "For You"
              : "Following"
          );

        }
      );

    }
  );


  item.querySelector(
    "[data-search]"
  ).addEventListener(
    "click",
    openSearch
  );

}


/* =====================================================
   VIDEO OBSERVER
===================================================== */

function setupVideoObserver() {

  if (observer) {

    observer.disconnect();

  }


  observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(
          entry => {

            const item =
              entry.target;


            const video =
              item.querySelector(
                ".video"
              );


            const indicator =
              item.querySelector(
                ".pause-indicator"
              );


            if (
              entry.isIntersecting
            ) {

              video.play()
                .catch(() => {});


              indicator.classList.remove(
                "show"
              );

            } else {

              video.pause();

            }

          }
        );

      },
      {
        threshold: 0.7
      }
    );


  document
    .querySelectorAll(
      ".video-item"
    )
    .forEach(
      item => observer.observe(item)
    );

}

        .focus();

    },
    100
  );

}


function closeSearch() {

  searchPanel.classList.remove(
    "open"
  );

}


/* =====================================================
   NAVIGATION
===================================================== */

function goHome() {

  window.location.href =
    "./index.html";

}


function goFriends() {

  window.location.href =
    "./friends.html";

}


function goInbox() {

  window.location.href =
    "./inbox.html";

}


function goProfile() {

  window.location.href =
    "./profile.html";

}


function uploadVideo() {

  window.location.href =
    "./upload.html";

}


/* =====================================================
   COMMENT ENTER
===================================================== */

commentInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      addComment();

    }

  }
);


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    if (!user) {

      window.location.href =
        "./auth.html";

      return;

    }


    currentUser =
      user;


    try {

      await loadCurrentUser();

      await renderFeed();


      loading.classList.add(
        "hidden"
      );


    } catch (error) {

      console.error(
        "WWC Feed Error:",
        error
      );


      loading.textContent =
        "❌ WWC Feed লোড করা যায়নি।";

    }

  }
);


/* =====================================================
   KEYBOARD / BACK
===================================================== */

window.addEventListener(
  "popstate",
  () => {

    closeComments();
    closeSearch();

  }
);


/* =====================================================
   GLOBAL FUNCTIONS
===================================================== */

window.openSearch =
  openSearch;

window.closeSearch =
  closeSearch;

window.closeComments =
  closeComments;

window.addComment =
  addComment;

window.goHome =
  goHome;

window.goFriends =
  goFriends;

window.goInbox =
  goInbox;

window.goProfile =
  goProfile;

window.uploadVideo =
  uploadVideo;

</script>

</body>
</html>
