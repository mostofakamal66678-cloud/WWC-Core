<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>World Wide Connect</title>

  <!-- ================================
       MAIN CSS
  ================================= -->

  <link
    rel="stylesheet"
    href="./css/style.css"
  >
</head>

<body>

  <!-- =====================================================
       MAIN VIDEO FEED
  ====================================================== -->

  <main id="video-feed">


    <!-- ===================================================
         VIDEO 1
    ==================================================== -->

    <section
      class="video-item"
      data-video-id="video1"
      data-username="wwc_user"
    >

      <video
        class="feed-video"
        autoplay
        muted
        playsinline
        loop="false"
        preload="metadata"
      >
        <source
          src="https://res.cloudinary.com/fsalagrz/video/upload/v1786681051/Video5.mp4"
          type="video/mp4"
        >

        আপনার ব্রাউজার ভিডিও সাপোর্ট করে না।
      </video>


      <!-- PROFILE -->

      <div class="profile-area">

        <img
          class="profile-photo"
          src="./images/profile.png"
          alt="WWC User"
          loading="lazy"
        >

        <div class="username">
          @wwc_user
        </div>

        <button
          class="follow-btn"
          type="button"
          data-username="wwc_user"
        >
          Follow
        </button>

      </div>


      <!-- ACTIONS -->

      <div class="actions">

        <button
          class="action-btn like-btn"
          type="button"
          aria-label="Like"
          aria-pressed="false"
        >
          ❤️

          <span class="like-count">
            0
          </span>

        </button>


        <button
          class="action-btn comment-btn"
          type="button"
          aria-label="Comment"
        >
          💬
        </button>


        <button
          class="action-btn save-btn"
          type="button"
          aria-label="Save"
          aria-pressed="false"
        >
          🔖

          <span class="save-count">
            0
          </span>

        </button>


        <button
          class="action-btn share-btn"
          type="button"
          aria-label="Share"
        >
          ↗️
        </button>

      </div>


      <!-- VIDEO INFORMATION -->

      <div class="video-info">

        <div class="username">
          @wwc_user
        </div>

        <div class="video-caption">
          Welcome to World Wide Connect 🌎
        </div>

      </div>

    </section>



    <!-- ===================================================
         VIDEO 2
    ==================================================== -->

    <section
      class="video-item"
      data-video-id="video2"
      data-username="wwc_user_2"
    >

      <video
        class="feed-video"
        muted
        playsinline
        preload="metadata"
      >

        <source
          src="./videos/video2.mp4"
          type="video/mp4"
        >

        আপনার ব্রাউজার ভিডিও সাপোর্ট করে না।

      </video>


      <div class="profile-area">

        <img
          class="profile-photo"
          src="./images/profile.png"
          alt="WWC User 2"
          loading="lazy"
        >

        <div class="username">
          @wwc_user_2
        </div>

        <button
          class="follow-btn"
          type="button"
          data-username="wwc_user_2"
        >
          Follow
        </button>

      </div>


      <div class="actions">

        <button
          class="action-btn like-btn"
          type="button"
          aria-label="Like"
          aria-pressed="false"
        >
          ❤️

          <span class="like-count">
            0
          </span>

        </button>


        <button
          class="action-btn comment-btn"
          type="button"
          aria-label="Comment"
        >
          💬
        </button>


        <button
          class="action-btn save-btn"
          type="button"
          aria-label="Save"
          aria-pressed="false"
        >
          🔖

          <span class="save-count">
            0
          </span>

        </button>


        <button
          class="action-btn share-btn"
          type="button"
          aria-label="Share"
        >
          ↗️
        </button>

      </div>


      <div class="video-info">

        <div class="username">
          @wwc_user_2
        </div>

        <div class="video-caption">
          Share your world with everyone 🌎
        </div>

      </div>

    </section>



    <!-- ===================================================
         VIDEO 3
    ==================================================== -->

    <section
      class="video-item"
      data-video-id="video3"
      data-username="wwc_user_3"
    >

      <video
        class="feed-video"
        muted
        playsinline
        preload="metadata"
      >

        <source
          src="./videos/video3.mp4"
          type="video/mp4"
        >

        আপনার ব্রাউজার ভিডিও সাপোর্ট করে না।

      </video>


      <div class="profile-area">

        <img
          class="profile-photo"
          src="./images/profile.png"
          alt="WWC User 3"
          loading="lazy"
        >

        <div class="username">
          @wwc_user_3
        </div>

        <button
          class="follow-btn"
          type="button"
          data-username="wwc_user_3"
        >
          Follow
        </button>

      </div>


      <div class="actions">

        <button
          class="action-btn like-btn"
          type="button"
          aria-label="Like"
          aria-pressed="false"
        >
          ❤️

          <span class="like-count">
            0
          </span>

        </button>


        <button
          class="action-btn comment-btn"
          type="button"
          aria-label="Comment"
        >
          💬
        </button>


        <button
          class="action-btn save-btn"
          type="button"
          aria-label="Save"
          aria-pressed="false"
        >
          🔖

          <span class="save-count">
            0
          </span>

        </button>


        <button
          class="action-btn share-btn"
          type="button"
          aria-label="Share"
        >
          ↗️
        </button>

      </div>


      <div class="video-info">

        <div class="username">
          @wwc_user_3
        </div>

        <div class="video-caption">
          Connect with the world 🌍
        </div>

      </div>

    </section>

  </main>



  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <header class="wwc-top-bar">

    <div class="wwc-top-tabs">

      <button
        class="wwc-top-tab"
        id="followingTab"
        type="button"
      >
        Following
      </button>


      <button
        class="wwc-top-tab active"
        id="forYouTab"
        type="button"
      >
        For You
      </button>

    </div>


    <button
      id="searchBtn"
      class="wwc-search-btn"
      type="button"
      aria-label="Search"
    >
      🔍
    </button>

  </header>



  <!-- =====================================================
       COMMENT BOX
  ====================================================== -->

  <div
    id="commentBox"
    class="comment-box"
    aria-hidden="true"
  >

    <div class="comment-title">
      💬 Comments
    </div>


    <textarea
      id="commentInput"
      placeholder="Write a comment..."
      maxlength="500"
    ></textarea>


    <div class="comment-buttons">

      <button
        id="commentCancel"
        type="button"
      >
        Cancel
      </button>


      <button
        id="commentSend"
        type="button"
      >
        Send
      </button>

    </div>

  </div>



  <!-- =====================================================
       PROFILE MENU
  ====================================================== -->

  <div
    id="profileMenu"
    class="profile-menu"
    aria-hidden="true"
  >

    <div class="profile-menu-header">

      <div class="profile-menu-title">
        👤 My Profile
      </div>


      <button
        id="profileMenuClose"
        class="profile-menu-close"
        type="button"
        aria-label="Close"
      >
        ✕
      </button>

    </div>


    <button
      id="profileBtnMenu"
      class="profile-menu-btn"
      type="button"
    >
      👤 Profile
    </button>


    <button
      id="loginBtn"
      class="profile-menu-btn"
      type="button"
    >
      🔐 Login / Register
    </button>


    <button
      id="logoutBtn"
      class="profile-menu-btn logout-menu-btn"
      type="button"
    >
      🚪 Logout
    </button>

  </div>



  <!-- =====================================================
       BOTTOM NAVIGATION
  ====================================================== -->

  <nav
    class="wwc-bottom-nav"
    aria-label="Main Navigation"
  >

    <!-- HOME -->

    <button
      class="wwc-nav-btn active"
      id="homeBtn"
      type="button"
    >

      <span>
        🏠
      </span>

      <span>
        Home
      </span>

    </button>


    <!-- FRIENDS -->

    <button
      class="wwc-nav-btn"
      id="friendsBtn"
      type="button"
    >

      <span>
        👥
      </span>

      <span>
        Friends
      </span>

    </button>


    <!-- CREATE / UPLOAD -->

    <button
      id="uploadBtn"
      class="wwc-create-btn"
      type="button"
      aria-label="Upload Video"
    >
      +
    </button>


    <!-- INBOX -->

    <button
      class="wwc-nav-btn"
      id="inboxBtn"
      type="button"
    >

      <span>
        💬
      </span>

      <span>
        Inbox
      </span>

    </button>


    <!-- PROFILE -->

    <button
      id="profileBtn"
      class="wwc-nav-btn"
      type="button"
    >

      <span>
        👤
      </span>

      <span>
        Profile
      </span>

    </button>

  </nav>



  <!-- =====================================================
       HIDDEN VIDEO UPLOAD INPUT
  ====================================================== -->

  <input
    id="videoUpload"
    type="file"
    accept="video/*"
    hidden
  >



  <!-- =====================================================
       APP JAVASCRIPT
  ====================================================== -->

  <script
    type="module"
    src="./js/app.js"
  ></script>


</body>
</html>
