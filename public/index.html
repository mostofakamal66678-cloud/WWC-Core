<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>WWC · Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    /* ===== CSS (আগের মতো) ===== */
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;overscroll-behavior:none}
    button{border:0;outline:0;cursor:pointer;background:transparent;font-family:inherit;-webkit-user-select:none;user-select:none}
    .app{position:relative;width:100%;height:100dvh;overflow:hidden;background:#000}
    .feed{position:absolute;inset:0;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
    .feed::-webkit-scrollbar{display:none}
    .video-item{position:relative;width:100%;height:100dvh;min-height:100dvh;background:#000;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
    .video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block}
    .video-item::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(transparent,rgba(0,0,0,0.85));pointer-events:none;z-index:2}
    .top-bar{position:absolute;top:0;left:0;right:0;height:82px;z-index:20;display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top);background:linear-gradient(rgba(0,0,0,0.6),transparent);pointer-events:none}
    .top-bar .tabs{display:flex;align-items:center;gap:30px;pointer-events:auto}
    .top-bar .tab{position:relative;background:transparent;color:rgba(255,255,255,0.6);font-size:17px;font-weight:700;padding:8px 4px;transition:color .2s}
    .top-bar .tab.active{color:#fff}
    .top-bar .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:10px;background:#fff}
    .search-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,0.4);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(6px);font-size:18px;border:0;cursor:pointer}
    .action-bar{position:absolute;right:8px;bottom:110px;z-index:30;width:62px;display:flex;flex-direction:column;align-items:center;gap:14px}
    .action{width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:transparent;padding:0;border:0;cursor:pointer}
    .action-icon{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:30px;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.8));transition:transform .15s cubic-bezier(0.2,0.9,0.3,1.2);color:#fff}
    .action:active .action-icon{transform:scale(0.82)}
    .action-count{font-size:12px;font-weight:700;text-shadow:0 1px 4px #000;margin-top:1px;color:#fff}
    .like-btn.liked .action-icon{color:#ff2d55;transform:scale(1.15);animation:likePop .35s ease}
    @keyframes likePop{0%{transform:scale(0.7)}40%{transform:scale(1.4)}70%{transform:scale(0.9)}100%{transform:scale(1.15)}}
    .save-btn.saved .action-icon{color:#ffd84d;transform:scale(1.1);animation:savePop .3s ease}
    @keyframes savePop{0%{transform:scale(0.7)}60%{transform:scale(1.2)}100%{transform:scale(1.1)}}
    .creator-avatar{position:relative;width:50px;height:50px;border-radius:50%;border:2px solid #fff;overflow:visible;cursor:pointer}
    .creator-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
    .follow-plus{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#fff;color:#000;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .2s;border:0;cursor:pointer}
    .follow-plus.following{background:#ff2d55;color:#fff;font-size:12px}
    .video-info{position:absolute;left:15px;right:85px;bottom:95px;z-index:25}
    .video-info .username{font-size:17px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,0.9);margin-bottom:6px;cursor:pointer}
    .video-info .caption{font-size:14px;line-height:1.5;text-shadow:0 2px 8px rgba(0,0,0,0.9)}
    .video-info .sound{font-size:13px;font-weight:600;margin-top:8px;text-shadow:0 2px 8px rgba(0,0,0,0.9)}
    .sound-btn{position:absolute;left:14px;bottom:155px;z-index:35;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,0.45);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px);font-size:18px;border:0;cursor:pointer}
    .pause-indicator{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.7);width:65px;height:65px;border-radius:50%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:all .2s;z-index:40;font-size:28px}
    .pause-indicator.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .video-loader{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .video-loader span{width:32px;height:32px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;height:75px;z-index:100;display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(transparent,rgba(0,0,0,0.95) 25%);border-top:1px solid rgba(255,255,255,0.05)}
    .nav-btn{width:20%;height:65px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:rgba(255,255,255,0.5);font-size:10px;font-weight:600;transition:color .2s;position:relative;background:transparent;border:0;cursor:pointer}
    .nav-btn.active{color:#fff}
    .nav-btn .nav-icon{font-size:24px}
    .upload-btn{width:50px;height:38px;border-radius:10px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;box-shadow:-3px 0 0 #25f4ee,3px 0 0 #fe2c55;transition:transform .15s}
    .upload-btn:active{transform:scale(0.9)}
    .comment-panel{position:fixed;left:0;right:0;bottom:0;z-index:150;height:55vh;background:#111;border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(0.2,0.9,0.3,1);display:flex;flex-direction:column}
    .comment-panel.open{transform:translateY(0)}
    .comment-header{height:50px;flex:none;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #333;font-weight:700;position:relative;color:#fff}
    .close-comments{position:absolute;right:15px;color:#fff;font-size:24px;background:transparent;border:0;cursor:pointer}
    .comments-list{flex:1;overflow-y:auto;padding:15px;color:#fff}
    .comment{padding:10px 0;border-bottom:1px solid #222;line-height:1.4;color:#eee}
    .comment strong{display:block;margin-bottom:4px;color:#fff}
    .comment-input{display:flex;gap:8px;padding:10px;border-top:1px solid #333}
    .comment-input input{flex:1;border:1px solid #444;background:#222;color:#fff;border-radius:22px;padding:10px 15px;outline:none;font-family:inherit}
    .comment-input input::placeholder{color:#666}
    .comment-input button{width:44px;border-radius:50%;background:#fff;color:#000;font-size:16px;border:0;cursor:pointer}
    .toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%) translateY(20px);z-index:500;background:rgba(30,30,30,0.95);color:#fff;padding:10px 20px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .feed-message{width:100%;height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;color:#aaa;padding:30px}
    .feed-message-inner{max-width:320px}
    .feed-message-icon{font-size:45px;margin-bottom:15px}
    .retry-btn{margin-top:18px;border-radius:22px;padding:10px 22px;background:#fff;color:#000;font-weight:700;border:0;cursor:pointer}
    .search-overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;background:rgba(0,0,0,0.95);padding:60px 20px 20px;animation:fadeIn .25s ease}
    @keyframes fadeIn{from{opacity:0;transform:scale(0.98)}to{opacity:1;transform:scale(1)}}
    .search-container{max-width:600px;margin:0 auto}
    .search-header{display:flex;gap:10px;margin-bottom:20px}
    .search-header input{flex:1;padding:14px 18px;border-radius:12px;border:1px solid #444;background:#222;color:#fff;font-size:16px;outline:none}
    .search-header input:focus{border-color:#777}
    .search-header input::placeholder{color:#666}
    .search-close-btn{width:50px;height:50px;border-radius:50%;background:#333;color:#fff;font-size:22px;border:0;cursor:pointer}
    .search-close-btn:active{transform:scale(0.9)}
    .search-result-item{padding:12px 16px;border-bottom:1px solid #222;display:flex;align-items:center;gap:12px;color:#fff;cursor:pointer}
    .search-result-item:active{background:#222}
    .search-result-item img{width:40px;height:40px;border-radius:50%;object-fit:cover}
    .search-result-item .info{flex:1}
    .search-result-item .info .name{font-weight:600}
    .search-result-item .info .desc{font-size:12px;color:#888}
    @media(min-width:700px){.video-item{max-width:500px;margin:auto}.bottom-nav{max-width:500px;left:50%;right:auto;transform:translateX(-50%)}
  </style>
</head>
<body>

<div class="app">
  <main class="feed" id="feed"></main>
  
  <nav class="bottom-nav">
    <button class="nav-btn active" id="navHome"><span class="nav-icon"><i class="fas fa-home"></i></span><span>Home</span></button>
    <button class="nav-btn" id="navFriends"><span class="nav-icon"><i class="fas fa-user-friends"></i></span><span>Friends</span></button>
    <button class="nav-btn" id="navUpload"><span class="upload-btn"><i class="fas fa-plus"></i></span></button>
    <button class="nav-btn" id="navInbox"><span class="nav-icon"><i class="fas fa-inbox"></i></span><span>Inbox</span></button>
    <button class="nav-btn" id="navProfile"><span class="nav-icon"><i class="fas fa-user"></i></span><span>Profile</span></button>
  </nav>
  
  <div class="comment-panel" id="commentPanel">
    <div class="comment-header"><span>Comments</span><button class="close-comments" id="closeCommentsBtn">✕</button></div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comment-input">
      <input id="commentInput" type="text" maxlength="500" placeholder="Add comment...">
      <button id="commentSendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, runTransaction, query, orderBy, serverTimestamp, where } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";

// ===== Firebase Config =====
const firebaseConfig = {
  apiKey: "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",
  authDomain: "world-wide-connect-62c87.firebaseapp.com",
  projectId: "world-wide-connect-62c87",
  storageBucket: "world-wide-connect-62c87.firebasestorage.app",
  messagingSenderId: "93178453668",
  appId: "1:93178453668:web:2184630caa8e61f7445031",
  measurementId: "G-PKFJ5NEMGQ"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

console.log("✅ Firebase Initialized!");

// ===== Global State =====
let currentUser = null;
let currentProfile = { followingIds: [], savedVideoIds: [] };
let allVideos = [];
let currentFeed = "foryou";
let currentVideoId = null;
let observer = null;
let currentPlayingVideo = null;
let isSearchMode = false;
let searchResults = [];
let lastSearchQuery = "";
const defaultPhoto = "./images/profile.png";

// ===== DOM Refs =====
const feed = document.getElementById("feed");
const toast = document.getElementById("toast");
const commentPanel = document.getElementById("commentPanel");
const commentsList = document.getElementById("commentsList");
const commentInput = document.getElementById("commentInput");

// ===== Helpers =====
function escapeHtml(v) { return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
function number(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
function formatNumber(num) { num = Number(num) || 0; if (num >= 1000000) return (num/1000000).toFixed(1)+"M"; if (num >= 1000) return (num/1000).toFixed(1)+"K"; return String(num); }
function getFollowingIds() { return Array.isArray(currentProfile?.followingIds) ? currentProfile.followingIds : []; }
function getUsername(video) { return String(video.username || video.userName || video.handle || "wwc_user").replace(/^@/,""); }

function showToast(text) {
  if (!toast) return;
  toast.textContent = text;
  toast.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout")), ms))]);
}

// =====================================================
// ✅ NAVIGATION
// =====================================================
document.getElementById("navHome").addEventListener("click", () => { window.location.href = "./index.html"; });
document.getElementById("navFriends").addEventListener("click", () => { window.location.href = "./friends.html"; });
document.getElementById("navUpload").addEventListener("click", () => { window.location.href = "./upload.html"; });
document.getElementById("navInbox").addEventListener("click", () => { window.location.href = "./inbox.html"; });

// ✅ Profile Button - সম্পূর্ণ ফিক্সড
document.getElementById("navProfile").addEventListener("click", () => {
  if (currentUser) {
    window.location.href = `./profile.html?uid=${currentUser.uid}`;
  } else {
    window.location.href = "./auth.html";
  }
});

// =====================================================
// ✅ VIDEO URL RESOLVER
// =====================================================
async function resolveVideoURL(video) {
  const directUrl = video.videoURL || video.videoUrl || video.downloadURL || video.downloadUrl || video.fileURL || video.fileUrl || video.url || video.src;
  if (directUrl && directUrl.startsWith('http')) return directUrl;
  if (video.localPath || video.localUrl || video.file) return video.localPath || video.localUrl || video.file;
  const storagePath = video.storagePath || video.filePath || video.storage || video.path;
  if (storagePath) {
    try { return await withTimeout(getDownloadURL(ref(storage, storagePath)), 10000); } 
    catch(e) { console.error("Storage error:", e); return ""; }
  }
  return "";
}

// =====================================================
// ✅ LOAD VIDEOS
// =====================================================
async function loadVideos() {
  if (!currentUser) return;
  try {
    const q = query(collection(db, "videos"), orderBy("createdAt", "desc"));
    const snap = await withTimeout(getDocs(q), 10000);
    allVideos = [];
    snap.forEach(doc => { allVideos.push({ id: doc.id, ...doc.data() }); });
    
    for (let i = 0; i < allVideos.length; i++) {
      allVideos[i].resolvedVideoURL = await resolveVideoURL(allVideos[i]);
    }
    allVideos = allVideos.filter(v => !!v.resolvedVideoURL);
    console.log("✅ Videos loaded:", allVideos.length);
    renderFeed();
  } catch (e) {
    console.error("Load videos error:", e);
    if (feed) feed.innerHTML = `<div class="feed-message"><div class="feed-message-inner"><div class="feed-message-icon">⚠️</div><div>Could not load videos</div></div></div>`;
  }
}

// =====================================================
// ✅ SEARCH
// =====================================================
function openSearch() {
  isSearchMode = true;
  lastSearchQuery = "";
  
  const searchHTML = `
    <div class="search-overlay" id="searchOverlay">
      <div class="search-container">
        <div class="search-header">
          <input type="text" id="searchInput" placeholder="Search users, videos..." autofocus />
          <button class="search-close-btn" id="searchCloseBtn">✕</button>
        </div>
        <div id="searchResults"></div>
      </div>
    </div>
  `;
  
  const existing = document.getElementById("searchOverlay");
  if (existing) existing.remove();
  
  document.body.insertAdjacentHTML('beforeend', searchHTML);
  
  const input = document.getElementById("searchInput");
  const closeBtn = document.getElementById("searchCloseBtn");
  
  if (input) {
    input.focus();
    input.addEventListener("input", (e) => {
      performSearch(e.target.value.trim());
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeSearch();
      if (e.key === "Enter") {
        const value = e.target.value.trim();
        if (value) performSearch(value);
      }
    });
  }
  
  if (closeBtn) {
    closeBtn.addEventListener("click", closeSearch);
  }
}

function performSearch(query) {
  lastSearchQuery = query;
  
  if (!query) {
    isSearchMode = false;
    searchResults = [];
    renderFeed();
    return;
  }
  
  const lowerQuery = query.toLowerCase();
  searchResults = allVideos.filter(video => {
    const username = getUsername(video).toLowerCase();
    const name = String(video.name || video.displayName || "").toLowerCase();
    const caption = String(video.caption || video.description || "").toLowerCase();
    return username.includes(lowerQuery) || name.includes(lowerQuery) || caption.includes(lowerQuery);
  });
  
  isSearchMode = true;
  renderFeed();
  
  const resultsDiv = document.getElementById("searchResults");
  if (resultsDiv) {
    resultsDiv.innerHTML = `
      <div style="color:#888;padding:10px 0 15px;font-size:13px;border-bottom:1px solid #222;">
        <i class="fas fa-search" style="margin-right:8px;"></i>
        ${searchResults.length} results found
      </div>
      ${searchResults.map(v => `
        <div class="search-result-item" onclick="window.location.href='./index.html?video=${v.id}'">
          <img src="${escapeHtml(v.photoURL || v.photo || defaultPhoto)}" onerror="this.src='${defaultPhoto}'">
          <div class="info">
            <div class="name">@${escapeHtml(getUsername(v))}</div>
            <div class="desc">${escapeHtml((v.caption || v.description || "").substring(0, 50))}</div>
          </div>
        </div>
      `).join('')}
    `;
  }
}

function closeSearch() {
  isSearchMode = false;
  searchResults = [];
  const overlay = document.getElementById("searchOverlay");
  if (overlay) overlay.remove();
  renderFeed();
}

// =====================================================
// ✅ RENDER FEED
// =====================================================
function renderFeed() {
  if (!feed) return;
  feed.innerHTML = "";
  
  if (isSearchMode) {
    if (!searchResults.length) {
      feed.innerHTML = `<div class="feed-message"><div class="feed-message-inner"><div class="feed-message-icon">🔍</div><div>"${escapeHtml(lastSearchQuery)}" - No results found</div></div></div>`;
      return;
    }
    searchResults.forEach(video => {
      const item = createVideoItem(video);
      feed.appendChild(item);
    });
    setupVideoObserver();
    return;
  }
  
  let videos = currentFeed === "foryou" ? [...allVideos] : allVideos.filter(v => getFollowingIds().includes(v.uid));
  
  if (!videos.length) {
    feed.innerHTML = `<div class="feed-message"><div class="feed-message-inner"><div class="feed-message-icon">🎬</div><div>${currentFeed === "following" ? "You're not following anyone yet" : "No videos found"}</div></div></div>`;
    return;
  }
  
  videos.forEach(video => {
    const item = createVideoItem(video);
    feed.appendChild(item);
  });
  setupVideoObserver();
}

// =====================================================
// ✅ CREATE VIDEO ITEM
// =====================================================
function createVideoItem(video) {
  const item = document.createElement("section");
  item.className = "video-item";
  item.dataset.videoId = video.id;
  
  const username = getUsername(video);
  const name = video.name || video.displayName || username;
  const avatar = video.photoURL || video.photo || defaultPhoto;
  const caption = video.caption || video.description || "";
  const sound = video.sound || "🎵 Original sound - WWC";
  const creatorId = video.uid || video.creatorId || video.userId || "";
  
  const isFollowing = getFollowingIds().includes(creatorId);
  const isLiked = Array.isArray(video.likedBy) && video.likedBy.includes(currentUser?.uid);
  const isSaved = Array.isArray(video.savedBy) && video.savedBy.includes(currentUser?.uid);
  
  const likes = number(video.likes);
  const comments = number(video.comments);
  const saves = number(video.saves);
  const shares = number(video.shares);
  const url = video.resolvedVideoURL || "";
  
  item.innerHTML = `
    <video class="video" src="${escapeHtml(url)}" loop muted playsinline webkit-playsinline preload="metadata"></video>
    <div class="video-loader"><span></span></div>
    <div class="top-bar">
      <div class="tabs">
        <button class="tab ${currentFeed === "following" ? "active" : ""}" data-tab="following">Following</button>
        <button class="tab ${currentFeed === "foryou" ? "active" : ""}" data-tab="foryou">For You</button>
      </div>
      <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
    <div class="action-bar">
      <div class="action">
        <div class="creator-avatar" onclick="window.location.href='./profile.html?uid=${creatorId}'">
          <img src="${escapeHtml(avatar)}" alt="${escapeHtml(name)}" onerror="this.src='${defaultPhoto}'">
          ${creatorId && creatorId !== currentUser?.uid ? `
            <button class="follow-plus ${isFollowing ? "following" : ""}" data-action="follow" data-creator="${escapeHtml(creatorId)}">${isFollowing ? "✓" : "+"}</button>
          ` : ""}
        </div>
      </div>
      <button class="action like-btn ${isLiked ? "liked" : ""}" data-action="like"><span class="action-icon"><i class="fas fa-heart"></i></span><span class="action-count">${formatNumber(likes)}</span></button>
      <button class="action comment-btn" data-action="comment"><span class="action-icon"><i class="fas fa-comment"></i></span><span class="action-count">${formatNumber(comments)}</span></button>
      <button class="action save-btn ${isSaved ? "saved" : ""}" data-action="save"><span class="action-icon"><i class="fas fa-bookmark"></i></span><span class="action-count">${formatNumber(saves)}</span></button>
      <button class="action share-btn" data-action="share"><span class="action-icon"><i class="fas fa-share"></i></span><span class="action-count">${formatNumber(shares)}</span></button>
    </div>
    <button class="sound-btn" data-action="sound"><i class="fas fa-volume-up"></i></button>
    <div class="video-info">
      <div class="username" onclick="window.location.href='./profile.html?uid=${creatorId}'">@${escapeHtml(username)}</div>
      <div class="caption">${escapeHtml(caption)}</div>
      <div class="sound">${escapeHtml(sound)}</div>
    </div>
    <div class="pause-indicator"><i class="fas fa-pause"></i></div>
  `;
  
  const videoEl = item.querySelector(".video");
  const loader = item.querySelector(".video-loader");
  
  videoEl.addEventListener("loadeddata", () => { loader.style.display = "none"; });
  videoEl.addEventListener("playing", () => { loader.style.display = "none"; });
  videoEl.addEventListener("waiting", () => { loader.style.display = "flex"; });
  videoEl.addEventListener("error", () => { loader.style.display = "none"; console.error("Video error:", url); });
  
  item.addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    togglePlayPause(item);
  });
  
  return item;
}

// =====================================================
// ✅ PLAY/PAUSE
// =====================================================
function togglePlayPause(item) {
  const video = item.querySelector(".video");
  const indicator = item.querySelector(".pause-indicator");
  if (video.paused) {
    playVideo(video);
    indicator.classList.remove("show");
  } else {
    video.pause();
    indicator.classList.add("show");
  }
}

async function playVideo(video) {
  if (currentPlayingVideo && currentPlayingVideo !== video) {
    try { currentPlayingVideo.pause(); } catch(e) {}
  }
  currentPlayingVideo = video;
  video.muted = true;
  try { await video.play(); } catch(e) { console.warn("Play error:", e); }
}

// =====================================================
// ✅ VIDEO OBSERVER
// =====================================================
function setupVideoObserver() {
  if (observer) observer.disconnect();
  const items = [...document.querySelectorAll(".video-item")];
  if (!items.length) return;
  observer = new IntersectionObserver(() => {
    items.forEach(item => {
      const video = item.querySelector(".video");
      const rect = item.getBoundingClientRect();
      const visible = Math.min(window.innerHeight, rect.bottom) - Math.max(0, rect.top);
      const percentage = visible / window.innerHeight;
      if (percentage > 0.6) playVideo(video);
      else video.pause();
    });
  }, { threshold: [0.3, 0.5, 0.7, 0.9] });
  items.forEach(item => observer.observe(item));
  const first = items[0];
  if (first) { setTimeout(() => { const v = first.querySelector(".video"); if (v) playVideo(v); }, 300); }
}

// =====================================================
// ✅ FEED ACTIONS
// =====================================================
feed?.addEventListener("click", async (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { 
    if (isSearchMode) closeSearch();
    currentFeed = tab.dataset.tab === "following" ? "following" : "foryou"; 
    renderFeed(); 
    return; 
  }
  
  if (e.target.closest("#searchBtn") || e.target.closest(".search-btn")) {
    openSearch();
    return;
  }
  
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const item = btn.closest(".video-item");
  if (!item) return;
  const videoId = item.dataset.videoId;
  const action = btn.dataset.action;
  
  if (action === "like") await toggleLike(videoId, btn);
  else if (action === "save") await toggleSave(videoId, btn);
  else if (action === "comment") await openComments(videoId);
  else if (action === "share") await shareVideo(videoId, btn);
  else if (action === "follow") await toggleFollow(btn.dataset.creator, btn);
  else if (action === "sound") toggleSound(item, btn);
});

// =====================================================
// ✅ LIKE
// =====================================================
async function toggleLike(videoId, btn) {
  if (!currentUser) { showToast("Please login first"); return; }
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const videoRef = doc(db, "videos", videoId);
    const result = await runTransaction(db, async (t) => {
      const snap = await t.get(videoRef);
      if (!snap.exists()) throw new Error("NOT_FOUND");
      const data = snap.data();
      const likedBy = Array.isArray(data.likedBy) ? data.likedBy : [];
      const already = likedBy.includes(currentUser.uid);
      const newLikedBy = already ? likedBy.filter(u => u !== currentUser.uid) : [...likedBy, currentUser.uid];
      const newLikes = Math.max(0, number(data.likes) + (already ? -1 : 1));
      t.update(videoRef, { likedBy: newLikedBy, likes: newLikes });
      return { liked: !already, likes: newLikes };
    });
    btn.classList.toggle("liked", result.liked);
    const countEl = btn.querySelector(".action-count");
    if (countEl) countEl.textContent = formatNumber(result.likes);
  } catch(e) { console.error("Like error:", e); showToast("Like failed"); }
  btn.disabled = false;
}

// =====================================================
// ✅ SAVE - সম্পূর্ণ ফিক্সড
// =====================================================
async function toggleSave(videoId, btn) {
  if (!currentUser) { showToast("Please login first"); return; }
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const videoRef = doc(db, "videos", videoId);
    const userRef = doc(db, "users", currentUser.uid);
    const result = await runTransaction(db, async (t) => {
      const vs = await t.get(videoRef);
      if (!vs.exists()) throw new Error("NOT_FOUND");
      const data = vs.data();
      const savedBy = Array.isArray(data.savedBy) ? data.savedBy : [];
      const already = savedBy.includes(currentUser.uid);
      const newSavedBy = already ? savedBy.filter(u => u !== currentUser.uid) : [...savedBy, currentUser.uid];
      const newSaves = Math.max(0, number(data.saves) + (already ? -1 : 1));
      t.update(videoRef, { savedBy: newSavedBy, saves: newSaves });
      const us = await t.get(userRef);
      const uData = us.exists() ? us.data() : {};
      const oldSaved = Array.isArray(uData.savedVideoIds) ? uData.savedVideoIds : [];
      const newUserSaved = already ? oldSaved.filter(id => id !== videoId) : (oldSaved.includes(videoId) ? oldSaved : [...oldSaved, videoId]);
      t.set(userRef, { savedVideoIds: newUserSaved }, { merge: true });
      return { saved: !already, saves: newSaves };
    });
    btn.classList.toggle("saved", result.saved);
    const countEl = btn.querySelector(".action-count");
    if (countEl) countEl.textContent = formatNumber(result.saves);
    showToast(result.saved ? "🔖 Saved" : "Removed");
    
    // Update local profile
    if (result.saved) {
      if (!currentProfile.savedVideoIds) currentProfile.savedVideoIds = [];
      if (!currentProfile.savedVideoIds.includes(videoId)) {
        currentProfile.savedVideoIds.push(videoId);
      }
    } else {
      if (currentProfile.savedVideoIds) {
        currentProfile.savedVideoIds = currentProfile.savedVideoIds.filter(id => id !== videoId);
      }
    }
  } catch(e) { console.error("Save error:", e); showToast("Save failed: " + e.message); }
  btn.disabled = false;
}

// =====================================================
// ✅ FOLLOW
// =====================================================
async function toggleFollow(targetUid, btn) {
  if (!currentUser || !targetUid || targetUid === currentUser.uid) return;
  btn.disabled = true;
  try {
    const myRef = doc(db, "users", currentUser.uid);
    const targetRef = doc(db, "users", targetUid);
    const result = await runTransaction(db, async (t) => {
      const ms = await t.get(myRef);
      const ts = await t.get(targetRef);
      if (!ms.exists() || !ts.exists()) throw new Error("PROFILE_NOT_FOUND");
      const mData = ms.data(), tData = ts.data();
      const following = Array.isArray(mData.followingIds) ? mData.followingIds : [];
      const followers = Array.isArray(tData.followerIds) ? tData.followerIds : [];
      const already = following.includes(targetUid);
      if (already) {
        t.update(myRef, { followingIds: following.filter(id => id !== targetUid), following: Math.max(0, number(mData.following) - 1) });
        t.update(targetRef, { followerIds: followers.filter(id => id !== currentUser.uid), followers: Math.max(0, number(tData.followers) - 1) });
      } else {
        t.update(myRef, { followingIds: [...following, targetUid], following: number(mData.following) + 1 });
        t.update(targetRef, { followerIds: [...followers, currentUser.uid], followers: number(tData.followers) + 1 });
      }
      return { following: !already };
    });
    btn.classList.toggle("following", result.following);
    btn.textContent = result.following ? "✓" : "+";
    const ms = await getDoc(doc(db, "users", currentUser.uid));
    if (ms.exists()) currentProfile = ms.data();
    showToast(result.following ? "✅ Following" : "Unfollowed");
  } catch(e) { console.error("Follow error:", e); showToast("Follow failed"); }
  btn.disabled = false;
}

// =====================================================
// ✅ SOUND
// =====================================================
function toggleSound(item, btn) {
  const video = item.querySelector(".video");
  if (video.muted) {
    video.muted = false;
    btn.innerHTML = '<i class="fas fa-volume-up"></i>';
    playVideo(video);
    showToast("🔊 Sound On");
  } else {
    video.muted = true;
    btn.innerHTML = '<i class="fas fa-volume-mute"></i>';
    showToast("🔇 Sound Off");
  }
}

// =====================================================
// ✅ SHARE
// =====================================================
async function shareVideo(videoId, btn) {
  if (!currentUser) { showToast("Please login first"); return; }
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const videoRef = doc(db, "videos", videoId);
    const snap = await getDoc(videoRef);
    if (snap.exists()) {
      const newShares = number(snap.data().shares) + 1;
      await updateDoc(videoRef, { shares: newShares });
      const countEl = btn.querySelector(".action-count");
      if (countEl) countEl.textContent = formatNumber(newShares);
    }
    const url = new URL(window.location.href);
    url.searchParams.set("video", videoId);
    if (navigator.share) {
      try { await navigator.share({ title: "WWC", text: "Check this video", url: url.toString() }); } catch(e) {}
    } else {
      await navigator.clipboard.writeText(url.toString());
      showToast("🔗 Link Copied");
    }
  } catch(e) { console.error("Share error:", e); showToast("Share failed"); }
  btn.disabled = false;
}

// =====================================================
// ✅ COMMENTS
// =====================================================
async function openComments(videoId) {
  currentVideoId = videoId;
  commentPanel.classList.add("open");
  await loadComments(videoId);
}

document.getElementById("closeCommentsBtn")?.addEventListener("click", () => {
  commentPanel.classList.remove("open");
});

async function loadComments(videoId) {
  if (!commentsList) return;
  commentsList.innerHTML = '<div style="text-align:center;color:#888;padding:25px;">Loading...</div>';
  try {
    const snap = await withTimeout(getDocs(collection(db, "videos", videoId, "comments")), 8000);
    commentsList.innerHTML = "";
    if (snap.empty) { commentsList.innerHTML = '<div style="text-align:center;color:#777;padding:30px;">No comments yet.</div>'; return; }
    const comments = [];
    snap.forEach(d => comments.push({ id: d.id, ...d.data() }));
    comments.sort((a,b) => (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0));
    comments.forEach(data => {
      const div = document.createElement("div");
      div.className = "comment";
      div.innerHTML = `<strong>${escapeHtml(data.username || data.name || "WWC User")}</strong>${escapeHtml(data.text || "")}`;
      commentsList.appendChild(div);
    });
  } catch(e) { commentsList.innerHTML = '<div style="text-align:center;color:#ff667f;padding:25px;">Could not load comments</div>'; }
}

document.getElementById("commentSendBtn")?.addEventListener("click", addComment);
commentInput?.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); addComment(); }
});

async function addComment() {
  if (!commentInput) return;
  const text = commentInput.value.trim();
  if (!text || !currentUser || !currentVideoId) return;
  try {
    const videoRef = doc(db, "videos", currentVideoId);
    const username = String(currentProfile.username || currentProfile.name || "WWC User").replace(/^@/,"");
    await addDoc(collection(db, "videos", currentVideoId, "comments"), {
      uid: currentUser.uid, username, name: currentProfile.name || "WWC User",
      photoURL: currentProfile.photoURL || defaultPhoto, text, createdAt: serverTimestamp()
    });
    const vs = await getDoc(videoRef);
    const newComments = number(vs.data()?.comments) + 1;
    await updateDoc(videoRef, { comments: newComments });
    commentInput.value = "";
    await loadComments(currentVideoId);
    const item = document.querySelector(`.video-item[data-video-id="${CSS.escape(currentVideoId)}"]`);
    if (item) { const btn = item.querySelector('[data-action="comment"]'); if (btn) btn.querySelector(".action-count").textContent = formatNumber(newComments); }
    showToast("💬 Comment Added");
  } catch(e) { console.error("Comment error:", e); showToast("Comment failed"); }
}

// ✅ LOAD CURRENT PROFILE

async function loadCurrentProfile() {
  if (!currentUser) return;
  try {
    const snap = await getDoc(doc(db, "users", currentUser.uid));

// =====================================================
// ✅ VISIBILITY
// =====================================================
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { document.querySelectorAll(".video").forEach(v => v.pause()); }
  else {
    const items = [...document.querySelectorAll(".video-item")];
    let best = null, bestRatio = 0;
    items.forEach(item => {
      const rect = item.getBoundingClientRect();
      const visible = Math.min(window.innerHeight, rect.bottom) - Math.max(0, rect.top);
      const ratio = visible / window.innerHeight;
      if (ratio > bestRatio) { bestRatio = ratio; best = item; }
    });
    if (best) { const v = best.querySelector(".video"); if (v) playVideo(v); }
  }
});
