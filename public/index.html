<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>WWC - For You</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

button{
  font-family:inherit;
}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  background:#000;
  overflow:hidden;
}

.feed{
  position:absolute;
  inset:0;
  overflow-y:auto;
  overflow-x:hidden;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}

.feed::-webkit-scrollbar{
  display:none;
}

.video-item{
  position:relative;
  width:100%;
  height:100dvh;
  background:#000;
  scroll-snap-align:start;
  scroll-snap-stop:always;
  overflow:hidden;
}

.video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.video-item::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:45%;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.8)
  );
  pointer-events:none;
}

.top-bar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:75px;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:env(safe-area-inset-top);
  background:linear-gradient(
    rgba(0,0,0,.4),
    transparent
  );
}

.tabs{
  display:flex;
  align-items:center;
  gap:30px;
}

.tab{
  position:relative;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.65);
  font-size:18px;
  font-weight:bold;
  padding:12px 4px;
  cursor:pointer;
}

.tab.active{
  color:#fff;
}

.tab.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:2px;
  height:3px;
  border-radius:10px;
  background:#fff;
}

.search-btn{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:52px;
  height:52px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.38);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  backdrop-filter:blur(5px);
}

.search-btn svg{
  width:31px;
  height:31px;
  fill:none;
  stroke:#fff;
  stroke-width:2;
}

.action-bar{
  position:absolute;
  right:8px;
  bottom:125px;
  z-index:40;
  width:68px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:17px;
}

.action{
  width:64px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  color:#fff;
  cursor:pointer;
  padding:0;
}

.action-icon{
  width:52px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));
  transition:.15s;
}

.action-icon svg{
  width:42px;
  height:42px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.action:active .action-icon{
  transform:scale(.82);
}

.like-btn.liked .action-icon{
  color:#ff3040;
  transform:scale(1.06);
}

.like-btn.liked .action-icon svg{
  fill:#ff3040;
  stroke:#ff3040;
}

.saved .action-icon{
  color:#fff;
}

.saved .action-icon svg{
  fill:#fff;
  stroke:#fff;
}

.action-count{
  margin-top:2px;
  color:#fff;
  font-size:13px;
  font-weight:bold;
  text-shadow:0 2px 4px #000;
}

.creator-avatar{
  position:relative;
  width:55px;
  height:55px;
  border-radius:50%;
  border:2px solid #fff;
  overflow:visible;
}

.creator-avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
}

.follow-plus{
  position:absolute;
  left:50%;
  bottom:-8px;
  transform:translateX(-50%);
  width:25px;
  height:25px;
  border:0;
  border-radius:50%;
  background:#fe2c55;
  color:#fff;
  font-size:20px;
  line-height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.follow-plus.following{
  background:#fff;
  color:#000;
  font-size:15px;
}

.video-info{
  position:absolute;
  left:15px;
  right:85px;
  bottom:98px;
  z-index:35;
  text-shadow:0 2px 4px rgba(0,0,0,.85);
}

.username{
  font-size:18px;
  font-weight:bold;
  margin-bottom:9px;
}

.caption{
  font-size:16px;
  line-height:1.45;
  margin-bottom:9px;
}

.sound{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:78px;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.96) 28%
  );
}

.nav-btn{
  position:relative;
  width:20%;
  height:65px;
  border:0;
  background:transparent;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.nav-btn svg{
  width:30px;
  height:30px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav-btn.active{
  color:#fff;
}

.upload-btn{
  width:57px;
  height:43px;
  border-radius:12px;
  background:#fff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    -5px 0 0 #25f4ee,
    5px 0 0 #fe2c55;
}

.upload-btn svg{
  width:28px;
  height:28px;
  stroke:#000;
  stroke-width:2.5;
  fill:none;
}

.badge{
  position:absolute;
  top:0;
  right:14px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:10px;
  background:#fe2c55;
  color:#fff;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.pause-indicator{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.8);
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.15s;
  z-index:50;
}

.pause-indicator.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.pause-indicator svg{
  width:34px;
  height:34px;
  fill:#fff;
}

.comment-panel{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:200;
  height:58vh;
  background:#111;
  border-radius:18px 18px 0 0;
  transform:translateY(100%);
  transition:transform .3s ease;
  display:flex;
  flex-direction:column;
}

.comment-panel.open{
  transform:translateY(0);
}

.comment-header{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #333;
  position:relative;
  font-weight:bold;
}

.close-comments{
  position:absolute;
  right:15px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:28px;
}

.comments-list{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.comment{
  padding:10px 0;
  border-bottom:1px solid #222;
}

.comment strong{
  display:block;
  margin-bottom:4px;
}

.comment-input{
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid #333;
}

.comment-input input{
  flex:1;
  min-width:0;
  border:1px solid #444;
  background:#222;
  color:#fff;
  border-radius:22px;
  padding:12px 15px;
  outline:none;
}

.comment-input button{
  width:50px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#000;
  font-size:18px;
}

.search-panel{
  position:fixed;
  inset:0;
  z-index:300;
  background:#000;
  display:none;
  padding:15px;
}

.search-panel.open{
  display:block;
}

.search-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.search-top input{
  flex:1;
  height:45px;
  border:1px solid #444;
  border-radius:10px;
  background:#222;
  color:#fff;
  padding:0 14px;
  font-size:16px;
  outline:none;
}

.close-search{
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:24px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:95px;
  transform:translateX(-50%) translateY(20px);
  z-index:500;
  background:rgba(30,30,30,.96);
  color:#fff;
  padding:11px 18px;
  border-radius:22px;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.empty-feed{
  width:100%;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  color:#fff;
  font-size:16px;
}

.loading{
  position:fixed;
  inset:0;
  z-index:600;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.loading.hide{
  display:none;
}

@media(min-width:700px){
  .video-item{
    max-width:500px;
    margin:auto;
  }

  .bottom-nav{
    max-width:500px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
  }
}
</style>
</head>

<body>

<div class="app">

  <main class="feed" id="feed"></main>

  <nav class="bottom-nav">

    <button class="nav-btn active" onclick="goHome()">
      <svg viewBox="0 0 24 24">
        <path d="M3 11L12 3L21 11V21H14V15H10V21H3Z"/>
      </svg>
      <span>Home</span>
    </button>

    <button class="nav-btn" onclick="goFriends()">
      <svg viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3"/>
        <circle cx="17" cy="9" r="2.5"/>
        <path d="M3 20C3 16.5 5.5 14 9 14C12.5 14 15 16.5 15 20"/>
        <path d="M15 15C18 15 20 17 20 20"/>
      </svg>
      <span>Friends</span>
    </button>

    <button class="nav-btn" onclick="uploadVideo()">
      <span class="upload-btn">
        <svg viewBox="0 0 24 24">
          <path d="M12 5V19"/>
          <path d="M5 12H19"/>
        </svg>
      </span>
    </button>

    <button class="nav-btn" onclick="goInbox()">
      <svg viewBox="0 0 24 24">
        <path d="M4 5H20V17H15L12 20L9 17H4Z"/>
        <path d="M8 10H16"/>
        <path d="M8 13H13"/>
      </svg>
      <span>Inbox</span>
      <span class="badge" id="inboxBadge">0</span>
    </button>

    <button class="nav-btn" onclick="goProfile()">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21C4 16.5 7.5 14 12 14C16.5 14 20 16.5 20 21"/>
      </svg>
      <span>Profile</span>
    </button>

  </nav>

  <div class="comment-panel" id="commentPanel">

    <div class="comment-header">
      Comments

      <button
        class="close-comments"
        onclick="closeComments()"
      >
        ×
      </button>
    </div>

    <div
      class="comments-list"
      id="commentsList"
    ></div>

    <div class="comment-input">

      <input
        id="commentInput"
        type="text"
        placeholder="Add comment..."
      >

      <button onclick="addComment()">➤</button>

    </div>

  </div>

  <div class="search-panel" id="searchPanel">

    <div class="search-top">

      <input
        id="searchInput"
        type="search"
        placeholder="Search..."
      >

      <button
        class="close-search"
        onclick="closeSearch()"
      >
        ×
      </button>

    </div>

  </div>

  <div class="toast" id="toast"></div>

  <div class="loading" id="loading">
    WWC-Core লোড হচ্ছে...
  </div>

</div>

<script type="module" src="./app.js"></script>

</body>
</html>
