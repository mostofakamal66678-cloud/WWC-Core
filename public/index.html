<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta

<title>WWC - For You</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overscroll-behavior:none;
}

button,
input{
  font-family:inherit;
}

button{
  -webkit-user-select:none;
  user-select:none;
}


/* =====================================================
   APP
===================================================== */

.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:#000;
}


/* =====================================================
   FEED
===================================================== */

.feed{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;

  scroll-snap-type:y mandatory;
  scroll-behavior:smooth;

  scrollbar-width:none;

  overscroll-behavior-y:contain;

  -webkit-overflow-scrolling:touch;
}

.feed::-webkit-scrollbar{
  display:none;
}


/* =====================================================
   VIDEO ITEM
===================================================== */

.video-item{
  position:relative;

  width:100%;
  height:100dvh;
  min-height:100dvh;

  background:#000;

  scroll-snap-align:start;
  scroll-snap-stop:always;

  overflow:hidden;

  contain:layout paint style;
}


.video{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;

  display:block;
}


/* =====================================================
   VIDEO GRADIENT
===================================================== */

.video-item::after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:48%;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.85)
    );

  pointer-events:none;

  z-index:2;
}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar{
  position:absolute;

  top:0;
  left:0;
  right:0;

  height:75px;

  z-index:20;

  display:flex;
  align-items:center;
  justify-content:center;

  padding-top:env(safe-area-inset-top);

  background:
    linear-gradient(
      rgba(0,0,0,.55),
      transparent
    );
}

.tabs{
  display:flex;

  align-items:center;

  gap:30px;
}

.tab{
  position:relative;

  border:0;

  background:transparent;

  color:rgba(255,255,255,.65);

  font-size:17px;

  font-weight:bold;

  padding:10px 3px;
}

.tab.active{
  color:#fff;
}

.tab.active::after{
  content:"";

  position:absolute;

  left:0;
  right:0;

  bottom:1px;

  height:3px;

  border-radius:10px;

  background:#fff;
}


/* =====================================================
   SEARCH BUTTON
===================================================== */

.search-btn{
  position:absolute;

  right:12px;
  top:50%;

  transform:translateY(-50%);

  width:45px;
  height:45px;

  border:0;

  border-radius:50%;

  background:rgba(0,0,0,.38);

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  backdrop-filter:blur(6px);
}

.search-btn svg{
  width:28px;
  height:28px;

  fill:none;

  stroke:#fff;

  stroke-width:2;
}


/* =====================================================
   RIGHT ACTION BAR
===================================================== */

.action-bar{
  position:absolute;

  right:7px;
  bottom:108px;

  z-index:30;

  width:65px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:15px;
}

.action{
  width:62px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  border:0;

  background:transparent;

  color:#fff;

  padding:0;
}

.action-icon{
  width:51px;
  height:51px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#fff;

  filter:
    drop-shadow(
      0 2px 4px rgba(0,0,0,.8)

  transition:
    transform .15s ease;
}

.action-icon svg{
  width:39px;
  height:39px;

  fill:none;

  stroke:currentColor;

  stroke-width:2;

  stroke-linecap:round;
  stroke-linejoin:round;
}

.action:active .action-icon{
  transform:scale(.82);
}

.like-btn.liked .action-icon{
  color:#ff3040;

  transform:scale(1.08);
}

.like-btn.liked .action-icon svg{
  fill:#ff3040;

  stroke:#ff3040;
}

.save-btn.saved .action-icon{
  color:#fff;
}

.save-btn.saved .action-icon svg{
  fill:#fff;

  stroke:#fff;
}

.action-count{

  color:#fff;

  font-size:13px;

  font-weight:bold;

  text-shadow:

/* =====================================================

===================================================== */

.creator-avatar{

.creator-avatar img{

  height:100%;

}

.follow-plus{

  left:50%;

  width:24px;
  height:24px;

  background:#fff;

  color:#000;

  font-size:20px;

  line-height:20px;

  display:flex;

  align-items:center;
  justify-content:center;

}

.follow-plus.following{

/* =====================================================

===================================================== */

.video-info{

  right:85px;

.caption{

.sound{

  font-weight:bold;

  overflow:hidden;

  text-shadow:

/* =====================================================
   SOUND BUTTON
===================================================== */

.sound-btn{

  left:14px;

/* =====================================================
   PAUSE
===================================================== */

.pause-indicator{

  left:50%;
  top:50%;

  transform:

  height:70px;

  border-radius:50%;

  background:rgba(0,0,0,.5);

  display:flex;

  align-items:center;
  justify-content:center;

  opacity:0;

  pointer-events:none;

  transition:.15s;

  z-index:40;
}

.pause-indicator.show{
  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1);
}

.pause-indicator svg{
  width:34px;
  height:34px;

  fill:#fff;
}


/* =====================================================
   VIDEO LOADER
===================================================== */

.video-loader{
  position:absolute;

  inset:0;

  z-index:8;

  display:flex;

  align-items:center;
  justify-content:center;

}

.video-loader span{

  height:35px;

  border:3px solid rgba(255,255,255,.25);

  border-top-color:#fff;

  border-radius:50%;

  animation:
    spin .8s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   VIDEO ERROR
===================================================== */

.video-error{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:45;

  width:85%;

  max-width:330px;

  padding:20px;

  border-radius:16px;

  text-align:center;

}

.video-error.show{

}

.video-error-title{

  font-weight:bold;

}

.video-error-text{

  line-height:1.5;

  word-break:break-word;

===================================================== */

/* =====================================================

===================================================== */

.comment-panel{

  left:0;
  right:0;
  bottom:0;

.comment-panel.open{

}

.comments-list{

  overflow-y:auto;

  padding:15px;
}

.comment{

  line-height:1.4;

.comment strong{

.comment-input{

  gap:8px;

  padding:10px;

  border-top:1px solid #333;

.comment-input input{

  min-width:0;

  border:1px solid #444;

  background:#222;

  color:#fff;

  border-radius:22px;

  padding:12px 15px;

.comment-input button{

  border:0;

  border-radius:50%;

  background:#fff;

  color:#000;

/* =====================================================
   SEARCH
===================================================== */

.search-panel{
  position:fixed;

  inset:0;

  z-index:300;

  background:#000;

  display:none;

  padding:15px;
}

.search-panel.open{

}

.search-top{
  display:flex;

  align-items:center;

  gap:10px;
}

.search-top input{
  flex:1;

  height:45px;

  border:1px solid #444;

  border-radius:10px;

  background:#222;

  color:#fff;

  padding:0 14px;

  font-size:16px;

.close-search{
  width:45px;
  height:45px;

  border:0;

  border-radius:50%;

  background:#222;

  color:#fff;

/* =====================================================
   TOAST
===================================================== */

.toast{

.toast.show{

/* =====================================================

===================================================== */

.feed-message{

/* =====================================================

from

}
from

/* =====================================================

  measurementId:

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
  getApps().length
    ? getApps()[0]
    : initializeApp(
        firebaseConfig
      );


const auth =
  getAuth(app);


const db =
  getFirestore(app);


const storage =
  getStorage(app);


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let currentProfile = {};

let videos = [];

let currentFeedMode = "forYou";

let currentVideoId = null;

let observer = null;

let toastTimer = null;

let loadingFeed = false;

let currentPlayingVideo = null;


/* =====================================================
   DEFAULT IMAGE
===================================================== */

const defaultPhoto =
  "./images/profile.png";


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   NUMBER
===================================================== */

function number(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


/* =====================================================
   TOAST
===================================================== */

function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    text;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      1800
    );

}


/* =====================================================
   TIMEOUT
===================================================== */

function withTimeout(
  promise,
  ms
){

  return Promise.race([

    promise,

    new Promise(
      (_,reject) => {

        setTimeout(
          () => {

            reject(
              new Error(
                "Operation timeout"
              )
            );

          },
          ms
        );

      }
    )

  ]);

}


/* =====================================================
   CURRENT PROFILE
===================================================== */

async function loadCurrentProfile(){

  if(!currentUser){
    return;
  }


  const userRef =
    doc(
      db,
      "users",
      currentUser.uid
    );


  try{

    const snap =
      await withTimeout(
        getDoc(userRef),
        7000
      );


    if(
      snap.exists()
    ){

      currentProfile =
        snap.data();

      return;

    }


    currentProfile = {

      uid:
        currentUser.uid,

      name:
        currentUser.displayName ||
        "WWC User",

      username:
        "wwc_" +
        currentUser.uid.substring(
          0,
          6
        ),

      email:
        currentUser.email ||
        "",

      photoURL:
        currentUser.photoURL ||

/* =====================================================
   FOLLOWING IDS
===================================================== */

function getFollowingIds(){

  return Array.isArray(
    currentProfile.followingIds
  )
    ? currentProfile.followingIds

}


/* =====================================================
   GET USERNAME
===================================================== */

function getUsername(video){

  return String(

    video.username ||
    video.userName ||
    video.handle ||
    "wwc_user"

  ).replace(
    /^@/,
    ""
  );

}


/* =====================================================
   GET VIDEO URL
===================================================== */

async function resolveVideoURL(
  video,
  index
){

  /*
    1. সরাসরি URL
  */

  const directUrl =

    video.videoURL ||
    video.videoUrl ||
    video.downloadURL ||
    video.downloadUrl ||
    video.fileURL ||
    video.fileUrl ||
    video.url ||
    video.src;


  if(directUrl){

    return directUrl;

  }


  /*
    2. Firebase Storage path
  */

  const storagePath =

    video.storagePath ||
    video.filePath ||
    video.storage ||
    video.path;


  if(storagePath){

    try{

      const storageRef =
        ref(
          storage,
          storagePath
        );


      const downloadURL =
        await withTimeout(
          getDownloadURL(
            storageRef
          ),
          10000
        );


      return downloadURL;

    }catch(error){

      console.error(
        "Storage URL error:",
        error
      );

    }

  }


  /*
    3. Local fallback
  */

  return (
    index % 2 === 0
      ? "./videos/video1.mp4"
      : "./videos/video2.mp4"
  );

}


/* =====================================================
   VIDEO SCORE
===================================================== */

function scoreVideo(video){

  const likes =
    number(
      video.likes
    );

  const comments =
    number(
      video.comments
    );

  const saves =
    number(
      video.saves
    );

  const views =
    number(
      video.views
    );


  let score =

    likes * 3 +

    comments * 5 +

    saves * 6 +

    views * .2;


  const creatorId =

    video.creatorId ||
    video.userId ||
    video.uid ||
    video.ownerId ||
    "";


  if(
    getFollowingIds()
      .includes(
        creatorId
      )
  ){

    score += 100;

  }


  return score;

}

/* =====================================================
   VIDEO OBSERVER
===================================================== */

function setupVideoObserver(){

  if(observer){

    observer.disconnect();

  }


  const items =
    [
      ...document.querySelectorAll(
        ".video-item"
      )
    ];


  if(
    !items.length
  ){

    return;

  }


  observer =
    new IntersectionObserver(

      entries => {

        items.forEach(
          item => {

            const video =
              item.querySelector(
                ".video"
              );


            const rect =
              item.getBoundingClientRect();


            const visible =
              Math.min(
                window.innerHeight,
                rect.bottom
              )
              -
              Math.max(
                0,
                rect.top
              );


            const percentage =
              visible /
              window.innerHeight;


            if(
              percentage > .65
            ){

              playVideo(
                video
              );

            }else{

              video.pause();

            }

          }
        );


        preloadNearbyVideos();

      },

      {
        threshold:[
          .25,
          .5,
          .65,
          .8,
          .95
        ]
      }

    );


  items.forEach(
    item => {

      observer.observe(
        item
      );

    }
  );


  const first =
    items[0];


  if(first){

    const video =
      first.querySelector(
        ".video"
      );


    setTimeout(
      () => {

        playVideo(
          video
        );

      },
      300
    );

  }

}


/* =====================================================
   PRELOAD
===================================================== */

function preloadNearbyVideos(){

  const items =
    [
      ...document.querySelectorAll(
        ".video-item"
      )
    ];


  if(
    !items.length
  ){

    return;

  }


  let activeIndex =
    0;


  items.forEach(
    (item,index) => {

      const rect =
        item.getBoundingClientRect();


      if(
        Math.abs(
          rect.top
        )
        <
        window.innerHeight * .5
      ){

        activeIndex =
          index;

      }

    }
  );


  for(
    let i =
      activeIndex;

    i <
      Math.min(
        items.length,
        activeIndex + 3
      );

    i++

  ){

    const video =
      items[i].querySelector(
        ".video"
      );


    if(video){

      video.preload =
        "auto";

    }

  }

}

async function toggleLike(

  videoId,
  button
){

  if(
    !currentUser
  ){

    showToast(
      "আগে Login করুন"
    );

    return;

  }


  if(
    button.disabled
  ){

    return;

  }


  button.disabled =
    true;


  try{

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const snap =
      await getDoc(
        videoRef
      );


    /*
      Local video
    */

    if(
      !snap.exists()
    ){

      const liked =
        button.classList.contains(
          "liked"
        );


      const countEl =
        button.querySelector(
          ".action-count"
        );


      const oldCount =
        number(
          countEl.textContent
        );


      button.classList.toggle(
        "liked",
        !liked
      );


      countEl.textContent =
        Math.max(
          0,
          liked
            ? oldCount - 1
            : oldCount + 1
        );


      showToast(
        liked
          ? "Like সরানো হয়েছে"
          : "Like হয়েছে"
      );


      return;

    }


    const data =
      snap.data();


    const likedBy =
      Array.isArray(
        data.likedBy
      )
        ? data.likedBy
        : [];


    const liked =
      likedBy.includes(
        currentUser.uid
      );


    if(
      liked
    ){

      await updateDoc(
        videoRef,
        {

          likedBy:
            arrayRemove(
              currentUser.uid
            ),

          likes:
            increment(-1)

        }
      );


      button.classList.remove(
        "liked"
      );


    }else{

      await updateDoc(
        videoRef,
        {

          likedBy:
            arrayUnion(
              currentUser.uid
            ),

          likes:
            increment(1)

        }
      );


      button.classList.add(
        "liked"
      );

    }


    const updated =

/* =====================================================
   SAVE
===================================================== */

async function toggleSave(
  item,
  videoId,
  button
){

  if(
    !currentUser
  ){

    showToast(
      "আগে Login করুন"
    );

    return;

  }


  if(
    button.disabled
  ){

    return;

  }


  button.disabled =
    true;


  try{

    const videoRef =
      doc(
        db,
        "videos",
        videoId
      );


    const userRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const videoSnap =
      await getDoc(
        videoRef
      );


    if(
      !videoSnap.exists()
    ){

      const saved =
        button.classList.contains(
          "saved"
        );


      button.classList.toggle(
        "saved",
        !saved
      );


      showToast(
        saved
          ? "Saved থেকে সরানো হয়েছে"
          : "ভিডিও Saved হয়েছে"
      );


      return;

    }


    const data =
      videoSnap.data();


    const savedBy =
      Array.isArray(
        data.savedBy
      )
        ? data.savedBy
        : [];


    const saved =
      savedBy.includes(
        currentUser.uid
      );


    if(
      saved
    ){

      await updateDoc(
        videoRef,
        {

          savedBy:
            arrayRemove(
              currentUser.uid
            ),

          saves:
            increment(-1)

        }
      );


      await updateDoc(
        userRef,
        {

          savedVideoIds:
            arrayRemove(
              videoId
            )

        }
      );


      button.classList.remove(
        "saved"
      );


      showToast(
        "Saved থেকে সরানো হয়েছে"
      );


    }else{

      await updateDoc(
        videoRef,
        {

          savedBy:
            arrayUnion(
              currentUser.uid
            ),

          saves:
            increment(1)

        }
      );


      await updateDoc(
        userRef,
        {

          savedVideoIds:
            arrayUnion(
              videoId
            )

        }
      );


      button.classList.add(
        "saved"
      );


      showToast(
        "ভিডিও Saved হয়েছে"
      );

    }


    const updated =
      await getDoc(
        videoRef
      );


    button
      .querySelector(
        ".action-count"
      )
      .textContent =
        updated.exists()
          ? number(
              updated.data().saves
            )
          : 0;


  }catch(error){

    console.error(
      "Save error:",
      error
    );


    showToast(
      "Save সংরক্ষণ করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}


/* =====================================================
   FOLLOW
===================================================== */

async function toggleFollow(
  targetUid,
  button
){

  if(
    !currentUser ||
    !targetUid ||
    targetUid ===
      currentUser.uid
  ){

    return;

  }


  button.disabled =
    true;


  try{

    const myRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const targetRef =
      doc(
        db,
        "users",
        targetUid
      );


    const mySnap =
      await getDoc(
        myRef
      );


    const targetSnap =
      await getDoc(
        targetRef
      );


    if(
      !mySnap.exists() ||
      !targetSnap.exists()
    ){

      throw new Error(
        "Profile not found"
      );

    }


    const myData =
      mySnap.data();


    const following =
      Array.isArray(
        myData.followingIds
      )
        ? myData.followingIds
        : [];


    const exists =
      following.includes(
        targetUid
      );


    if(
      exists
    ){

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayRemove(
              targetUid
            ),

          following:
            increment(-1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayRemove(
              currentUser.uid
            ),

          followers:
            increment(-1)

        }
      );


      button.classList.remove(
        "following"
      );


      button.textContent =
        "+";


      showToast(
        "Unfollow করা হয়েছে"
      );


    }else{

      await updateDoc(
        myRef,
        {

          followingIds:
            arrayUnion(
              targetUid
            ),

          following:
            increment(1)

        }
      );


      await updateDoc(
        targetRef,
        {

          followerIds:
            arrayUnion(
              currentUser.uid
            ),

          followers:
            increment(1)

        }
      );


      button.classList.add(
        "following"
      );


      button.textContent =
        "✓";


      showToast(
        "Following করা হয়েছে"
      );

    }


    const updated =
      await getDoc(
        myRef
      );


    if(
      updated.exists()
    ){

      currentProfile =
        updated.data();

    }


  }catch(error){

    console.error(
      "Follow error:",
      error
    );


    showToast(
      "Follow পরিবর্তন করা যায়নি"
    );

  }finally{

    button.disabled =
      false;

  }

}

/* =====================================================
   LOAD COMMENTS
===================================================== */

async function loadComments(
  videoId
){

  const list =
    document.getElementById(
      "commentsList"
    );


  list.innerHTML = `

    <div
      style="
        text-align:center;
        color:#888;
        padding:25px;
      "
    >
      Comments লোড হচ্ছে...
    </div>

  `;


  try{

    const ref =
      collection(
        db,
        "videos",
        videoId,
        "comments"
      );


    const snap =
      await withTimeout(
        getDocs(ref),
        8000
      );


    list.innerHTML =
      "";


    if(
      snap.empty
    ){

      list.innerHTML = `

        <div
          style="
            text-align:center;
            color:#777;
            padding:30px;
          "
        >
          এখনো কোনো Comment নেই।
        </div>

      `;

      return;

    }


    const comments = [];


    snap.forEach(
      commentDoc => {

        comments.push({

          id:
            commentDoc.id,

          ...commentDoc.data()

        });

      }
    );


    comments.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds ||
          0;

        const bTime =
          b.createdAt?.seconds ||
          0;


        return (
          aTime -
          bTime
        );

      }
    );


    comments.forEach(
      data => {

        const comment =
          document.createElement(
            "div"
          );


        comment.className =
          "comment";


        comment.innerHTML = `

          <strong>
            ${escapeHtml(
              data.username ||
              data.name ||
              "WWC User"
            )}
          </strong>

          ${escapeHtml(
            data.text ||
            ""
          )}

        `;


        list.appendChild(
          comment
        );

      }
    );


  }catch(error){

    console.error(
      "Comments error:",
      error
    );


    list.innerHTML = `

      <div
        style="
          text-align:center;
          color:#ff667f;
          padding:25px;
        "
      >
        Comments লোড করা যায়নি।
      </div>

    `;

  }

}


/* =====================================================
   ADD COMMENT
===================================================== */

async function addComment(){

  const input =
    document.getElementById(
      "commentInput"
    );


  const text =
    input.value.trim();


  if(
    !text
  ){

    return;

  }


  if(
    !currentUser ||
    !currentVideoId
  ){

    showToast(
      "আগে Login করুন"
    );

    return;

  }


  const sendButton =
    document.querySelector(
      ".comment-input button"
    );


  sendButton.disabled =
    true;


  try{

    const username =
      String(
        currentProfile.username ||
        currentProfile.name ||
        "WWC User"
      ).replace(
        /^@/,
        ""
      );


    await addDoc(

      collection(
        db,
        "videos",
        currentVideoId,
        "comments"
      ),

      {

        uid:
          currentUser.uid,

        username:
          username,

        name:
          currentProfile.name ||
          "WWC User",

        text:
          text,

        createdAt:
          serverTimestamp()

      }

    );


    const videoRef =
      doc(
        db,
        "videos",
        currentVideoId
      );


    const videoSnap =
      await getDoc(
        videoRef
      );


    if(
      videoSnap.exists()
    ){

      await updateDoc(
        videoRef,
        {

          comments:
            increment(1)

        }
      );

    }


    input.value =
      "";


    await loadComments(
      currentVideoId
    );


    showToast(
      "Comment সংরক্ষণ হয়েছে"
    );


  }catch(error){

    console.error(
      "Comment error:",
      error
    );


    showToast(
      "Comment সংরক্ষণ করা যায়নি"
    );

  }finally{

    sendButton.disabled =
      false;

  }

}

/* =====================================================
   SHARE
===================================================== */

async function shareVideo(
  videoId
){

  const url =
    new URL(
      window.location.href
    );


  url.searchParams.set(
    "video",
    videoId
  );


  const shareData = {

    title:
      "WWC-Core",

    text:
      "এই ভিডিওটি WWC-Core এ দেখুন।",

    url:
      url.toString()

  };


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );


    }else{

      await navigator.clipboard.writeText(
        url.toString()
      );


      showToast(
        "ভিডিও Link Copy হয়েছে"
      );

    }

  }catch(error){

    if(
      error?.name !==
      "AbortError"
    ){

      try{

        await navigator.clipboard.writeText(
          url.toString()
        );


        showToast(
          "ভিডিও Link Copy হয়েছে"
        );

      }catch(e){

        showToast(
          "Share করা যায়নি"
        );

      }

    }

  }

}

/* =====================================================
   SEARCH INPUT
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    event => {

      const q =
        event.target.value
          .trim()
          .toLowerCase();


      if(
        !q
      ){

        renderFeed();

        return;

      }


      const filtered =
        videos.filter(
          video => {

            const username =
              getUsername(
                video
              )
              .toLowerCase();


            const name =
              String(
                video.name ||
                video.displayName ||
                ""
              )
              .toLowerCase();


            const caption =
              String(
                video.caption ||
                video.description ||
                ""
              )
              .toLowerCase();


            return (

              username.includes(q) ||

              name.includes(q) ||

              caption.includes(q)

            );

          }
        );


      renderSearchResults(
        filtered
      );

    }
  );

/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.hidden
    ){

      document
        .querySelectorAll(
          ".video"
        )
        .forEach(
          video => {

            video.pause();

          }
        );


    }else{

      const items =
        [
          ...document.querySelectorAll(
            ".video-item"
          )
        ];


      let best =
        null;


      let bestRatio =
        0;


      items.forEach(
        item => {

          const rect =
            item.getBoundingClientRect();


          const visible =
            Math.min(
              window.innerHeight,
              rect.bottom
            )
            -
            Math.max(
              0,
              rect.top
            );


          const ratio =
            visible /
            window.innerHeight;


          if(
            ratio >
            bestRatio
          ){

            bestRatio =
              ratio;

            best =
              item;

          }

        }
      );


      if(
        best
      ){

        const video =
          best.querySelector(
            ".video"
          );


        if(
          video
        ){

          playVideo(
            video
          );

        }

      }

    }

  }
);
