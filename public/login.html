<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WWC-Core Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111217;
      color: white;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      padding: 30px 25px;
      background: #1d1f25;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #444;
      border-radius: 10px;
      background: #292c33;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #loginBtn {
      background: white;
      color: #111;
    }

    #resetPasswordBtn {
      background: #4f46e5;
      color: white;
    }

    #signupBtn {
      background: #333740;
      color: white;
    }

    #googleBtn {
      background: #4285f4;
      color: white;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #888;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #444;
    }

    #message {
      min-height: 24px;
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #bbb;
    }

    .home-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #aaa;
      text-decoration: none;
    }

    .home-link:hover {
      color: white;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>🌍 WWC-Core</h1>

    <div class="subtitle">
      World wide connect
    </div>


    <!-- EMAIL -->

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >


    <!-- PASSWORD -->

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >


    <!-- LOGIN -->

    <button
      type="button"
      id="loginBtn"
    >
      🔐 Login
    </button>


    <!-- FORGOT PASSWORD -->

    <button
      type="button"
      id="resetPasswordBtn"
    >
      🔑 Forgot Password
    </button>


    <!-- CREATE ACCOUNT -->

    <button
      type="button"
      id="signupBtn"
    >
      📝 Create Account
    </button>


    <div class="divider">
      OR
    </div>


    <!-- GOOGLE -->

    <button
      type="button"
      id="googleBtn"
    >
      🔵 Continue with Google
    </button>


    <div id="message"></div>


    <a
      class="home-link"
      href="./index.html"
    >
      ← Back to WWC-Core
    </a>

  </div>


  <script type="module">

    // ========================================
    // FIREBASE APP
    // ========================================

    import {
      getApps,
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


    // ========================================
    // FIREBASE AUTH
    // ========================================

    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


    // ========================================
    // FIREBASE CONFIG
    // ========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

      authDomain:
        "world-wide-connect-62c87.firebaseapp.com",

      projectId:
        "world-wide-connect-62c87",

      storageBucket:
        "world-wide-connect-62c87.firebasestorage.app",

      messagingSenderId:
        "93178453668",

      appId:
        "1:93178453668:web:2184630caa8e61f7445031",

      measurementId:
        "G-PKFJ5NEMGQ"

    };


    // ========================================
    // INITIALIZE FIREBASE
    // ========================================

    const app = getApps().length
      ? getApps()[0]
      : initializeApp(firebaseConfig);


    const auth = getAuth(app);


    // ========================================
    // KEEP LOGIN ACTIVE
    // ========================================

    await setPersistence(
      auth,
      browserLocalPersistence
    );


    // ========================================
    // ELEMENTS
    // ========================================

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const resetPasswordBtn =
      document.getElementById("resetPasswordBtn");

    const signupBtn =
      document.getElementById("signupBtn");

    const googleBtn =
      document.getElementById("googleBtn");

    const message =
      document.getElementById("message");


    // ========================================
    // MESSAGE
    // ========================================

    function showMessage(text) {

      message.textContent = text;

    }


    // ========================================
    // EMAIL LOGIN
    // ========================================

    loginBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "⚠️ Email এবং Password দিন।"
          );

          return;
        }


        loginBtn.disabled = true;

        showMessage(
          "Login হচ্ছে..."
        );


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          showMessage(
            "✅ Login সফল হয়েছে!"
          );


          setTimeout(() => {

            window.location.href =
              "./index.html";

          }, 700);


        } catch (error) {

          console.error(
            "Login Error:",
            error
          );


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            showMessage(
              "❌ Email অথবা Password ভুল।"
            );

          } else if (
            error.code ===
            "auth/invalid-email"
          ) {

            showMessage(
              "❌ সঠিক Email লিখুন।"
            );

          } else {

            showMessage(
              "❌ Login করা যায়নি। আবার চেষ্টা করুন।"
            );

          }


          loginBtn.disabled = false;

        }

      }
    );


    // ========================================
    // FORGOT PASSWORD
    // ========================================

    resetPasswordBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();


        if (!email) {

          showMessage(
            "⚠️ আগে Email লিখুন।"
          );

          return;
        }


        resetPasswordBtn.disabled = true;


        try {

          await sendPasswordResetEmail(
            auth,
            email
          );


          showMessage(
            "✅ Password Reset Email পাঠানো হয়েছে। Email দেখুন।"
          );


        } catch (error) {

          console.error(
            "Password Reset Error:",
            error
          );


          if (
            error.code ===
            "auth/invalid-email"
          ) {

            showMessage(
              "❌ সঠিক Email লিখুন।"
            );

          } else {

            showMessage(
              "❌ Password Reset Email পাঠানো যায়নি।"
            );

          }

        }


        resetPasswordBtn.disabled = false;

      }
    );


    // ========================================
    // CREATE ACCOUNT
    // ========================================

    signupBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "⚠️ Email এবং Password দিন।"
          );

          return;
        }


        if (password.length < 6) {

          showMessage(
            "⚠️ Password কমপক্ষে 6 অক্ষরের হতে হবে।"
          );

          return;
        }


        signupBtn.disabled = true;

        showMessage(
          "Account তৈরি হচ্ছে..."
        );


        try {

          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


          showMessage(
            "✅ Account সফলভাবে তৈরি হয়েছে!"
          );


          setTimeout(() => {

            window.location.href =
              "./index.html";

          }, 700);


        } catch (error) {

          console.error(
            "Signup Error:",
            error
          );


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            showMessage(
              "⚠️ এই Email দিয়ে আগে থেকেই Account আছে। Login করুন।"
            );

          } else if (
            error.code ===
            "auth/invalid-email"
          ) {

            showMessage(
              "❌ সঠিক Email লিখুন।"
            );

          } else if (
            error.code ===
            "auth/weak-password"
          ) {

            showMessage(
              "❌ Password আরও শক্তিশালী দিন।"
            );

          } else {

            showMessage(
              "❌ Account তৈরি করা যায়নি। আবার চেষ্টা করুন।"
            );

          }


          signupBtn.disabled = false;

        }

      }
    );


    // ========================================
    // GOOGLE LOGIN
    // ========================================

    const googleProvider =
      new GoogleAuthProvider();


    googleBtn.addEventListener(
      "click",
      async () => {

        googleBtn.disabled = true;

        showMessage(
          "Google Sign-In শুরু হচ্ছে..."
        );


        try {

          await signInWithPopup(
            auth,
            googleProvider
          );


          showMessage(
            "✅ Google Login সফল হয়েছে!"
          );


          setTimeout(() => {

            window.location.href =
              "./index.html";

          }, 700);


        } catch (error) {

          console.error(
            "Google Login Error:",
            error
          );


          if (
            error.code ===
            "auth/popup-closed-by-user"
          ) {

            showMessage(
              "⚠️ Google Login বন্ধ করা হয়েছে।"
            );

          } else {

            showMessage(
              "❌ Google Login ব্যর্থ হয়েছে। আবার চেষ্টা করুন।"
            );

          }


          googleBtn.disabled = false;

        }

      }
    );

  </script>

</body>
</html>
