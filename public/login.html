
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWC-Core Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111217;
      color: white;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      padding: 30px 25px;
      background: #1d1f25;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #444;
      border-radius: 10px;
      background: #292c33;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #loginBtn {
      background: white;
      color: #111;
    }

    #signupBtn {
      background: #333740;
      color: white;
    }

    #googleBtn {
      background: #4285f4;
      color: white;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      color: #888;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #444;
    }

    #message {
      min-height: 24px;
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }

    .home-link {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #aaa;
      text-decoration: none;
    }

    .home-link:hover {
      color: white;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>🌍 WWC-Core</h1>

    <div class="subtitle">
      World wide connect
    </div>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >
      
<button type="button" id="loginBtn">
  🔐 Login
</button>
    
  <button type="button" id="resetPasswordBtn">
  🔑 Forgot Password
</button>

<button type="button" id="signupBtn">
  📝 Create Account
</button>

    <div class="divider">OR</div>

    <button id="googleBtn">
      🔵 Continue with Google
    </button>

    <div id="message"></div>

    <a class="home-link" href="./index.html">
      ← Back to WWC-Core
    </a>

  </div>


  <script type="module">

    import {
      getApps,
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail,
      GoogleAuthProvider,
      signInWithRedirect
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


    // =========================
    // 🔥 FIREBASE CONFIG
    // =========================

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",
  authDomain: "world-wide-connect-62c87.firebaseapp.com",
  projectId: "world-wide-connect-62c87",
  storageBucket: "world-wide-connect-62c87.firebasestorage.app",
  messagingSenderId: "93178453668",
  appId: "1:93178453668:web:2184630caa8e61f7445031",
  measurementId: "G-PKFJ5NEMGQ"
};

    // =========================
    // 🔥 INITIALIZE FIREBASE
    // =========================

    const app = getApps().length
      ? getApps()[0]
      : initializeApp(firebaseConfig);

    const auth = getAuth(app);


    // =========================
    // 📢 MESSAGE
    // =========================

    const message = document.getElementById("message");

    function showMessage(text) {
      message.textContent = text
    } 
    
    
message.textContent = "✅ JavaScript ঠিকভাবে চালু হয়েছে";

    // =========================
    // 🔐 LOGIN
    // =========================

    document
      .getElementById("loginBtn")
      .addEventListener("click", async () => {

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        if (!email || !password) {
          showMessage("⚠️ Email এবং Password দিন।");
          return;
        }

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage("✅ Login সফল হয়েছে!");

          setTimeout(() => {
            window.location.href = "./index.html";
          }, 800);

        } catch (error) {

          console.error("Login error:", error);

          showMessage(
            "❌ Login ব্যর্থ হয়েছে। Email অথবা Password পরীক্ষা করুন।"
          );
        }
      });

 
// 🔑 FORGOT PASSWORD
document
  .getElementById("resetPasswordBtn")
  .addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();

    if (!email) {
      showMessage("⚠️ আগে Email লিখুন");
      return;
    }

    try {
      await sendPasswordResetEmail(auth, email);

      showMessage("✅ Password Reset Email পাঠানো হয়েছে। আপনার Email দেখুন।");

    } catch (error) {
      console.error("Password reset error:", error);

      if (error.code === "auth/user-not-found") {
        showMessage("❌ এই Email দিয়ে কোনো Account পাওয়া যায়নি।");
      } else {
        showMessage("❌ Password Reset ব্যর্থ হয়েছে। আবার চেষ্টা করুন।");
      }
    }
  });

    // =========================
    // 📝 CREATE ACCOUNT
    // =========================

    document
      .getElementById("signupBtn")
      .addEventListener("click", async () => {

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        if (!email || !password) {
          showMessage("⚠️ Email এবং Password দিন।");
          return;
        }

        if (password.length < 6) {
          showMessage(
            "⚠️ Password কমপক্ষে 6 অক্ষরের হতে হবে।"
          );
          return;
        }

        try {

          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

          showMessage("✅ Account তৈরি হয়েছে!");

          setTimeout(() => {
            window.location.href = "./index.html";
          }, 800);

        } catch (error) {

          console.error("Signup error:", error);

          if (error.code === "auth/email-already-in-use") {
            showMessage("⚠️ এই Email দিয়ে আগে থেকেই Account আছে।");
          } else {
            showMessage(
              "❌ Account তৈরি করা যায়নি। আবার চেষ্টা করুন।"
            );
          }
        }
      });


    // =========================
    // 🔵 GOOGLE LOGIN
    // =========================

    const googleProvider =
      new GoogleAuthProvider();

    document
      .getElementById("googleBtn")
      .addEventListener("click", async () => {

        try {

        await signInWithRedirect(
  auth,
  googleProvider
);

          showMessage("✅ Google Login সফল হয়েছে!");

          setTimeout(() => {
            window.location.href = "./index.html";
          }, 800);

        } catch (error) {

          console.error("Google login error:", error);

          if (error.code === "auth/popup-closed-by-user") {
            showMessage("⚠️ Google Login বন্ধ করা হয়েছে।");
          } else {
            showMessage(
  "❌ " + error.code + " — " + error.message
);
          }
        }
      });

  </script>

</body>
  </html>
