<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        viewport-fit=cover, maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#000000">

  <title>WWC - Sign In</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      width:100%;
      min-height:100%;
      background:#000;
    }

    body{
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      color:#fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    input{
      font-family:inherit;
    }

    button{
      cursor:pointer;
    }

    .auth-container{
      width:100%;
      max-width:420px;
      padding:40px 28px 30px;
      background:
        linear-gradient(
          145deg,
          rgba(25,25,30,.98),
          rgba(10,10,12,.98)
        );
      border:1px solid rgba(255,255,255,.08);
      border-radius:28px;
      box-shadow:
        0 25px 80px rgba(0,0,0,.7),
        0 0 40px rgba(37,244,238,.04);
      animation:slideUp .4s ease;
    }

    @keyframes slideUp{
      from{
        opacity:0;
        transform:translateY(30px) scale(.97);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    .logo{
      width:74px;
      height:74px;
      margin:0 auto 14px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:34px;
      background:
        linear-gradient(
          135deg,
          #25f4ee,
          #fe2c55
        );
      box-shadow:
        0 10px 35px rgba(37,244,238,.15),
        0 10px 35px rgba(254,44,85,.12);
    }

    h1{
      text-align:center;
      color:#fff;
      font-size:24px;
      font-weight:800;
      letter-spacing:-.5px;
    }

    .subtitle{
      margin-top:5px;
      margin-bottom:28px;
      text-align:center;
      color:#888;
      font-size:14px;
    }

    .google-btn{
      width:100%;
      min-height:52px;
      padding:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      border:0;
      border-radius:14px;
      background:#fff;
      color:#222;
      font-size:15px;
      font-weight:700;
      transition:.15s;
    }

    .google-btn:hover{
      background:#f2f2f2;
    }

    .google-btn:active{
      transform:scale(.97);
    }

    .google-btn:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .divider{
      display:flex;
      align-items:center;
      gap:12px;
      margin:20px 0;
      color:#555;
      font-size:12px;
    }

    .divider::before,
    .divider::after{
      content:"";
      flex:1;
      height:1px;
      background:#292929;
    }

    .form-group{
      margin-bottom:14px;
    }

    .form-group label{
      display:block;
      margin-bottom:6px;
      color:#999;
      font-size:12px;
      font-weight:600;
    }

    .form-group input{
      width:100%;
      height:50px;
      padding:0 15px;
      border:1px solid #2b2b2b;
      border-radius:12px;
      outline:none;
      background:#111;
      color:#fff;
      font-size:15px;
      transition:.2s;
    }

    .form-group input:focus{
      border-color:#25f4ee;
      box-shadow:0 0 0 2px rgba(37,244,238,.08);
    }

    .form-group input::placeholder{
      color:#555;
    }

    .name-group{
      display:none;
    }

    .name-group.show{
      display:block;
      animation:slideDown .25s ease;
    }

    @keyframes slideDown{
      from{
        opacity:0;
        transform:translateY(-8px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .auth-btn{
      width:100%;
      min-height:52px;
      margin-top:6px;
      border:0;
      border-radius:14px;
      background:
        linear-gradient(
          135deg,
          #25f4ee,
          #fe2c55
        );
      color:#fff;
      font-size:16px;
      font-weight:700;
      transition:.15s;
    }

    .auth-btn:active{
      transform:scale(.97);
    }

    .auth-btn:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .auth-btn.loading .btn-text{
      display:none;
    }

    .spinner{
      display:none;
      width:22px;
      height:22px;
      margin:auto;
      border:2px solid rgba(255,255,255,.3);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin .7s linear infinite;
    }

    .auth-btn.loading .spinner{
      display:block;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    .mode-toggle{
      margin-top:20px;
      text-align:center;
      color:#888;
      font-size:14px;
    }

    .mode-toggle button{
      padding:4px 8px;
      border:0;
      background:transparent;
      color:#25f4ee;
      font-size:14px;
      font-weight:700;
    }

    .mode-toggle button:active{
      color:#fe2c55;
    }

    .message{
      display:none;
      min-height:24px;
      margin-top:14px;
      padding:9px 12px;
      border-radius:10px;
      text-align:center;
      font-size:13px;
      line-height:1.4;
    }

    .message.show{
      display:block;
    }

    .message.success{
      color:#25f4ee;
      background:rgba(37,244,238,.08);
    }

    .message.error{
      color:#ff5575;
      background:rgba(254,44,85,.08);
    }

    .message.info{
      color:#ffd84d;
      background:rgba(255,216,77,.08);
    }

    .back-home{
      display:block;
      margin-top:18px;
      text-align:center;
      color:#555;
      font-size:13px;
      text-decoration:none;
      transition:.2s;
    }

    .back-home:hover{
      color:#fff;
    }

    .back-home i{
      margin-right:6px;
    }

    @media(max-width:480px){

      body{
        padding:14px;
      }

      .auth-container{
        padding:28px 18px 24px;
        border-radius:22px;
      }

      .logo{
        width:62px;
        height:62px;
        font-size:28px;
      }

      h1{
        font-size:21px;
      }
    }
  </style>
</head>

<body>

<div class="auth-container">

  <div class="logo">🌍</div>

  <h1>World Wide Connect</h1>

  <p class="subtitle" id="subtitle">
    Sign in to continue
  </p>

  <!-- GOOGLE -->
  <button
    type="button"
    class="google-btn"
    id="googleBtn">

    <i
      class="fab fa-google"
      style="font-size:20px;">
    </i>

    <span>Continue with Google</span>

  </button>

  <div class="divider">
    <span>or</span>
  </div>

  <!-- AUTH FORM -->
  <form id="authForm">

    <div class="form-group">

      <label for="emailInput">
        Email
      </label>

      <input
        type="email"
        id="emailInput"
        placeholder="Enter your email"
        autocomplete="email"
        required>

    </div>

    <div class="form-group">

      <label for="passwordInput">
        Password
      </label>

      <input
        type="password"
        id="passwordInput"
        placeholder="Minimum 6 characters"
        autocomplete="current-password"
        minlength="6"
        required>

    </div>

    <!-- NAME -->
    <div
      class="form-group name-group"
      id="nameGroup">

      <label for="nameInput">
        Name
      </label>

      <input
        type="text"
        id="nameInput"
        placeholder="Your name"
        autocomplete="name"
        maxlength="50">

    </div>

    <button
      type="submit"
      class="auth-btn"
      id="authBtn">

      <span class="spinner"></span>

      <span
        class="btn-text"
        id="authBtnText">
        Sign In
      </span>

    </button>

  </form>

  <div class="mode-toggle">

    <span id="modeText">
      Don't have an account?
    </span>

    <button
      type="button"
      id="modeBtn">
      Sign Up
    </button>

  </div>

  <div
    class="message"
    id="message">
  </div>

  <a
    href="./index.html"
    class="back-home">

    <i class="fas fa-arrow-left"></i>

    Back to Home

  </a>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  updateProfile,
  setPersistence,
  browserLocalPersistence,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

  authDomain:
    "world-wide-connect-62c87.firebaseapp.com",

  projectId:
    "world-wide-connect-62c87",

  storageBucket:
    "world-wide-connect-62c87.firebasestorage.app",

  messagingSenderId:
    "93178453668",

  appId:
    "1:93178453668:web:2184630caa8e61f7445031",

  measurementId:
    "G-PKFJ5NEMGQ"
};


/* =========================================
   FIREBASE INITIALIZE
========================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const googleProvider =
  new GoogleAuthProvider();


/* =========================================
   DOM
========================================= */

const googleBtn =
  document.getElementById("googleBtn");

const authForm =
  document.getElementById("authForm");

const authBtn =
  document.getElementById("authBtn");

const authBtnText =
  document.getElementById("authBtnText");

const modeBtn =
  document.getElementById("modeBtn");

const modeText =
  document.getElementById("modeText");

const subtitle =
  document.getElementById("subtitle");

const message =
  document.getElementById("message");

const nameGroup =
  document.getElementById("nameGroup");

const nameInput =
  document.getElementById("nameInput");

const emailInput =
  document.getElementById("emailInput");

const passwordInput =
  document.getElementById("passwordInput");


/* =========================================
   STATE
========================================= */

let isRegisterMode = false;

let redirecting = false;


/* =========================================
   PERSISTENCE
========================================= */

try {

  await setPersistence(
    auth,
    browserLocalPersistence
  );

} catch(error) {

  console.warn(
    "Persistence warning:",
    error
  );

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  type = "info"
) {

  message.textContent = text;

  message.className =
    "message show " + type;
}


function hideMessage() {

  message.textContent = "";

  message.className =
    "message";

}


/* =========================================
   USERNAME
========================================= */

function makeUsername(user) {

  let base =
    user.displayName ||
    "wwc_user";

  base =
    String(base)
      .toLowerCase()
      .trim()
      .replace(/[^a-z0-9_]/g, "_")
      .replace(/^_+|_+$/g, "");

  if (!base) {
    base = "wwc_user";
  }

  return (
    base +
    "_" +
    user.uid.substring(0, 6)
  );
}


/* =========================================
   CREATE USER PROFILE
========================================= */

async function createUserProfile(
  user,
  extraData = {}
) {

  if (!user) return;

  const userRef =
    doc(
      db,
      "users",
      user.uid
    );

  try {

    const existing =
      await getDoc(userRef);

    /*
      IMPORTANT:
      Existing profile should NOT be overwritten.
    */

    if (existing.exists()) {

      return existing.data();

    }


    const profile = {

      uid:
        user.uid,

      name:
        extraData.name ||
        user.displayName ||
        "WWC User",

      username:
        makeUsername(user),

      email:
        user.email || "",

      photoURL:
        user.photoURL ||
        "./images/profile.png",

      bio:
        "🌍 Welcome to World Wide Connect",

      followers: 0,

      following: 0,

      likes: 0,

      followerIds: [],

      followingIds: [],

      savedVideoIds: [],

      createdAt:
        serverTimestamp()

    };


    await setDoc(
      userRef,
      profile
    );


    console.log(
      "✅ User profile created"
    );

    return profile;

  } catch(error) {

    console.error(
      "Profile creation error:",
      error
    );

    /*
      Authentication should still succeed
      even if Firestore profile creation
      temporarily fails.
    */

    return null;
  }
}


/* =========================================
   REDIRECT
========================================= */

function goHome() {

  if (redirecting) return;

  redirecting = true;

  window.location.replace(
    "./index.html"
  );
}


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (!user) return;

    console.log(
      "✅ Already logged in:",
      user.uid
    );

    /*
      Make sure profile exists.
    */

    await createUserProfile(user);

    /*
      Don't instantly redirect while
      the page is being submitted.
    */

    if (!authBtn.classList.contains("loading") &&
        !googleBtn.disabled) {

      goHome();

    }

  }
);


/* =========================================
   GOOGLE LOGIN
========================================= */

googleBtn.addEventListener(
  "click",
  async () => {

    if (redirecting) return;

    googleBtn.disabled = true;

    authBtn.disabled = true;

    modeBtn.disabled = true;

    showMessage(
      "⏳ Connecting to Google...",
      "info"
    );


    try {

      /*
        Optional:
        Always show account chooser.
      */

      googleProvider.setCustomParameters({
        prompt: "select_account"
      });


      const result =
        await signInWithPopup(
          auth,
          googleProvider
        );


      if (!result.user) {

        throw new Error(
          "Google user not found."
        );

      }


      console.log(
        "✅ Google login:",
        result.user.uid
      );


      await createUserProfile(
        result.user
      );


      showMessage(
        "✅ Welcome! Redirecting...",
        "success"
      );


      setTimeout(
        goHome,
        500
      );


    } catch(error) {

      console.error(
        "Google login error:",
        error
      );


      let msg =
        "Google login failed. Please try again.";


      switch(error.code) {

        case "auth/popup-closed-by-user":

          msg =
            "⚠️ Google login cancelled.";

          break;


        case "auth/popup-blocked":

          msg =
            "❌ Popup blocked. Please allow popups.";

          break;


        case "auth/cancelled-popup-request":

          msg =
            "⚠️ Another login window is already open.";

          break;


        case "auth/account-exists-with-different-credential":

          msg =
            "❌ This email already uses another sign-in method.";

          break;


        case "auth/network-request-failed":

          msg =
            "❌ Network error. Check your internet.";

          break;


        case "auth/unauthorized-domain":

          msg =
            "❌ This website domain is not authorized in Firebase.";

          break;


        default:

          msg =
            "❌ " +
            (
              error.message ||
              "Google authentication failed."
            );

      }


      showMessage(
        msg,
        "error"
      );


      googleBtn.disabled = false;

      authBtn.disabled = false;

      modeBtn.disabled = false;

    }

  }
);


/* =========================================
   SIGN IN / SIGN UP TOGGLE
========================================= */

modeBtn.addEventListener(
  "click",
  () => {

    isRegisterMode =
      !isRegisterMode;

    hideMessage();


    if (isRegisterMode) {

      nameGroup.classList.add(
        "show"
      );

      nameInput.required = true;

      passwordInput.autocomplete =
        "new-password";

      authBtnText.textContent =
        "Create Account";

      modeBtn.textContent =
        "Sign In";

      modeText.textContent =
        "Already have an account?";

      subtitle.textContent =
        "Create your WWC account";


    } else {

      nameGroup.classList.remove(
        "show"
      );

      nameInput.required = false;

      passwordInput.autocomplete =
        "current-password";

      authBtnText.textContent =
        "Sign In";

      modeBtn.textContent =
        "Sign Up";

      modeText.textContent =
        "Don't have an account?";

      subtitle.textContent =
        "Sign in to continue";

    }

  }
);


/* =========================================
   EMAIL AUTH
========================================= */

authForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    if (redirecting) return;


    hideMessage();


    const email =
      emailInput.value
        .trim()
        .toLowerCase();

    const password =
      passwordInput.value;

    const name =
      nameInput.value.trim();


    /* VALIDATION */

    if (!email) {

      showMessage(
        "⚠️ Please enter your email.",
        "error"
      );

      emailInput.focus();

      return;
    }


    if (
      !email.includes("@") ||
      !email.includes(".")
    ) {

      showMessage(
        "❌ Please enter a valid email.",
        "error"
      );

      emailInput.focus();

      return;
    }


    if (password.length < 6) {

      showMessage(
        "⚠️ Password must be at least 6 characters.",
        "error"
      );

      passwordInput.focus();

      return;
    }


    if (
      isRegisterMode &&
      !name
    ) {

      showMessage(
        "⚠️ Please enter your name.",
        "error"
      );

      nameInput.focus();

      return;
    }


    /* LOADING */

    authBtn.disabled = true;

    googleBtn.disabled = true;

    modeBtn.disabled = true;

    authBtn.classList.add(
      "loading"
    );


    try {

      let result;


      /* ===============================
         SIGN UP
      =============================== */

      if (isRegisterMode) {

        showMessage(
          "⏳ Creating your account...",
          "info"
        );


        result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        /*
          Update Firebase Auth profile
        */

        await updateProfile(
          result.user,
          {
            displayName: name
          }
        );


        /*
          Create Firestore profile
        */

        await createUserProfile(
          result.user,
          {
            name: name
          }
        );


        showMessage(
          "✅ Account created! Welcome 🎉",
          "success"
        );


      }

      /* ===============================
         SIGN IN
      =============================== */

      else {

        showMessage(
          "⏳ Signing in...",
          "info"
        );


        result =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        /*
          Create profile only if missing.
        */

        await createUserProfile(
          result.user
        );


        showMessage(
          "✅ Welcome back! 👋",
          "success"
        );

      }


      setTimeout(
        goHome,
        600
      );


    } catch(error) {

      console.error(
        "Email authentication error:",
        error
      );


      let msg =
        "❌ Authentication failed.";


      switch(error.code) {

        case "auth/email-already-in-use":

          msg =
            "❌ This email is already registered. Please sign in.";

          break;


        case "auth/invalid-email":

          msg =
            "❌ Invalid email address.";

          break;


        case "auth/user-not-found":

          msg =
            "❌ No account found with this email.";

          break;


        case "auth/wrong-password":

          msg =
            "❌ Incorrect password.";

          break;


        case "auth/invalid-credential":

          msg =
            "❌ Email or password is incorrect.";

          break;


        case "auth/weak-password":

          msg =
            "❌ Password must be at least 6 characters.";

          break;


        case "auth/too-many-requests":

          msg =
            "⚠️ Too many attempts. Please try again later.";

          break;


        case "auth/network-request-failed":

          msg =
            "❌ Network error. Check your internet connection.";

          break;


        case "auth/user-disabled":

          msg =
            "❌ This account has been disabled.";

          break;


        default:

          msg =
            "❌ " +
            (
              error.message ||
              "Authentication failed."
            );

      }


      showMessage(
        msg,
        "error"
      );

    }


    authBtn.disabled = false;

    googleBtn.disabled = false;

    modeBtn.disabled = false;

    authBtn.classList.remove(
      "loading"
    );

  }
);


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Escape"
    ) {

      window.location.href =
        "./index.html";

    }

  }
);


console.log(
  "✅ WWC Auth Page Loaded"
);

</script>

</body>
</html>
