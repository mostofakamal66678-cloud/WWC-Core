<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World wide connect - Register / Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111318;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .auth-box {
      width: 92%;
      max-width: 420px;
      padding: 30px 22px;
      background: #1d2027;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #googleBtn {
      background: #fff;
      color: #222;
    }

    #emailBtn {
      background: #4f46e5;
      color: #fff;
    }

    #message {
      min-height: 24px;
      margin-top: 18px;
      color: #bbb;
      font-size: 14px;
    }

    .small {
      margin-top: 20px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="auth-box">

    <h1>World wide connect</h1>

    <div class="subtitle">
      Register / Login করুন
    </div>

    <button id="googleBtn">
      Continue with Google
    </button>

    <button id="emailBtn">
      Email / Password
    </button>

    <div id="message"></div>

    <div class="small">
      Google দিয়ে দ্রুত ও সহজে অ্যাকাউন্ট তৈরি করুন।
    </div>

  </div>


  <script type="module">

    /* =========================================
       Firebase
       ========================================= */

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    
  import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
      


    /* =========================================
       আপনার Firebase Config এখানে বসাবেন
       ========================================= */

  const firebaseConfig = {
  apiKey: "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",
  authDomain: "world-wide-connect-62c87.firebaseapp.com",
  projectId: "world-wide-connect-62c87",
  storageBucket: "world-wide-connect-62c87.firebasestorage.app",
  messagingSenderId: "93178453668",
  appId: "1:93178453668:web:2184630caa8e61f7445031",
  measurementId: "G-PKFJ5NEMGQ"

  const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const googleBtn = document.getElementById("googleBtn");
const emailBtn = document.getElementById("emailBtn");
const message = document.getElementById("message");    
emailBtn.addEventListener("click", () => {
  window.location.href = "./login.html";
});
googleBtn.addEventListener("click", async () => {

  
  message.textContent = "Google Sign-In শুরু হচ্ছে...";

  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    message.textContent =
      "স্বাগতম, " + (user.displayName || user.email) + "!";

    setTimeout(() => {
      window.location.href = "index.html";
    }, 500);

  } catch (error) {
    console.error(error);
    message.textContent =
      "Google Login ব্যর্থ হয়েছে: " + error.message;
  }

});
  

</script>
  
    

</body>
</html>
