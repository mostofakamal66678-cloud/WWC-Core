<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Upload · WWC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;padding-top:50px;padding-bottom:30px;overflow-x:hidden}
    .top-bar{position:fixed;top:0;left:0;right:0;z-index:100;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(0,0,0,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.06)}
    .top-bar .back-btn{color:#fff;font-size:22px;background:none;border:0;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}
    .top-bar .back-btn:active{background:rgba(255,255,255,0.1);transform:scale(0.9)}
    .top-bar .title{font-size:17px;font-weight:700}
    .top-bar .placeholder{width:40px}
    .upload-container{padding:16px;max-width:500px;margin:0 auto;width:100%;animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .upload-box{position:relative;border-radius:16px;overflow:hidden;background:#111;aspect-ratio:9/16;max-height:55vh;display:flex;align-items:center;justify-content:center;border:2px dashed #333;transition:all .3s;cursor:pointer}
    .upload-box.dragover{border-color:#25f4ee;background:rgba(37,244,238,0.05)}
    .upload-box .placeholder-content{text-align:center;color:#666;padding:30px}
    .upload-box .placeholder-content i{font-size:55px;color:#444;display:block;margin-bottom:12px}
    .upload-box .placeholder-content .main-text{font-size:17px;font-weight:600;color:#aaa}
    .upload-box .placeholder-content .sub-text{font-size:13px;color:#555;margin-top:4px}
    .upload-box .placeholder-content .format-text{font-size:12px;color:#444;margin-top:4px}
    .upload-box video{width:100%;height:100%;object-fit:contain;display:none;background:#000}
    .upload-box .file-input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
    .preview-overlay{position:absolute;bottom:0;left:0;right:0;padding:16px 20px;background:linear-gradient(transparent,rgba(0,0,0,0.85));z-index:3;display:none}
    .preview-overlay .file-name{font-size:14px;color:#fff;font-weight:600}
    .preview-overlay .file-size{font-size:12px;color:#888}
    .form-section{margin-top:16px}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:13px;font-weight:600;color:#888;margin-bottom:6px}
    .form-group input,.form-group textarea{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:15px;outline:none;transition:border-color .3s;font-family:inherit}
    .form-group input:focus,.form-group textarea:focus{border-color:#555}
    .form-group textarea{min-height:60px;resize:vertical}
    .form-group .char-count{text-align:right;font-size:12px;color:#555;margin-top:4px}
    .upload-btn{width:100%;padding:16px;border-radius:12px;background:linear-gradient(135deg,#25f4ee,#fe2c55);color:#fff;font-size:17px;font-weight:700;border:0;cursor:pointer;transition:all .3s;margin-top:8px}
    .upload-btn:active{transform:scale(0.98)}
    .upload-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
    .upload-btn .btn-text{display:flex;align-items:center;justify-content:center;gap:10px}
    .upload-btn .spinner{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
    .upload-btn.loading .spinner{display:inline-block}
    .upload-btn.loading .btn-icon{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    .progress-container{display:none;margin-top:16px;background:#111;border-radius:12px;padding:16px 20px;border:1px solid #222}
    .progress-container .progress-info{display:flex;justify-content:space-between;font-size:13px;color:#888;margin-bottom:10px}
    .progress-container .progress-bar{height:6px;background:#222;border-radius:6px;overflow:hidden}
    .progress-container .progress-bar .bar{height:100%;width:0%;background:linear-gradient(90deg,#25f4ee,#fe2c55);transition:width .3s ease;border-radius:6px}
    .progress-container .progress-status{text-align:center;margin-top:12px;font-size:14px;color:#888}
    .progress-container .progress-status.success{color:#25f4ee}
    .progress-container .progress-status.error{color:#fe2c55}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,30,30,0.95);color:#fff;padding:10px 22px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:1000;white-space:nowrap;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.05)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .tips{margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .tips .tip{display:flex;align-items:center;gap:6px;font-size:11px;color:#555;background:#111;padding:6px 14px;border-radius:20px;border:1px solid #1a1a1a}
    .tips .tip i{font-size:12px;color:#444}
    @media(max-width:480px){.upload-box{aspect-ratio:9/16;max-height:50vh}.upload-box .placeholder-content i{font-size:40px}.upload-box .placeholder-content .main-text{font-size:15px}}
  </style>
</head>
<body>
<div class="top-bar">
  <button class="back-btn" onclick="window.location.href='./index.html'"><i class="fas fa-arrow-left"></i></button>
  <span class="title">Upload Video</span>
  <div class="placeholder"></div>
</div>
<div class="upload-container">
  <div class="upload-box" id="uploadBox">
    <div class="placeholder-content" id="placeholderContent">
      <i class="fas fa-cloud-upload-alt"></i>
      <div class="main-text">Select a video</div>
      <div class="sub-text">Tap to browse</div>
      <div class="format-text">MP4, WebM, MOV • Max 100MB</div>
    </div>
    <video id="videoPreview" muted playsinline></video>
    <div class="preview-overlay" id="previewOverlay">
      <div class="file-name" id="fileName">video.mp4</div>
      <div class="file-size" id="fileSize">0 MB</div>
    </div>
    <input type="file" class="file-input" id="fileInput" accept="video/*" />
  </div>
  <div class="form-section">
    <div class="form-group">
      <label><i class="fas fa-quote-right" style="color:#555;margin-right:6px;"></i>Caption</label>
      <input type="text" id="captionInput" placeholder="Write a caption..." maxlength="200" />
      <div class="char-count"><span id="charCount">0</span>/200</div>
    </div>
    <div class="form-group">
      <label><i class="fas fa-music" style="color:#555;margin-right:6px;"></i>Sound / Music</label>
      <input type="text" id="soundInput" placeholder="Original sound - WWC" />
    </div>
    <button class="upload-btn" id="uploadBtn" disabled>
      <span class="btn-text">
        <span class="spinner"></span>
        <span class="btn-icon"><i class="fas fa-upload"></i></span>
        <span id="uploadBtnText">Upload Video</span>
      </span>
    </button>
    <div class="progress-container" id="progressContainer">
      <div class="progress-info">
        <span id="progressText">⏳ Uploading...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div class="bar" id="progressBar"></div>
      </div>
      <div class="progress-status" id="progressStatus"></div>
    </div>
    <div class="tips">
      <span class="tip"><i class="fas fa-clock"></i> 60s max</span>
      <span class="tip"><i class="fas fa-crop-alt"></i> 9:16 ratio</span>
      <span class="tip"><i class="fas fa-file-video"></i> MP4 preferred</span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",
  authDomain: "world-wide-connect-62c87.firebaseapp.com",
  projectId: "world-wide-connect-62c87",
  storageBucket: "world-wide-connect-62c87.firebasestorage.app",
  messagingSenderId: "93178453668",
  appId: "1:93178453668:web:2184630caa8e61f7445031",
  measurementId: "G-PKFJ5NEMGQ"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

console.log("✅ Firebase Initialized!");

const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');
const placeholderContent = document.getElementById('placeholderContent');
const videoPreview = document.getElementById('videoPreview');
const previewOverlay = document.getElementById('previewOverlay');
const fileName = document.getElementById('fileName');
const fileSize = document.getElementById('fileSize');
const captionInput = document.getElementById('captionInput');
const soundInput = document.getElementById('soundInput');
const uploadBtn = document.getElementById('uploadBtn');
const uploadBtnText = document.getElementById('uploadBtnText');
const progressContainer = document.getElementById('progressContainer');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const progressPercent = document.getElementById('progressPercent');
const progressStatus = document.getElementById('progressStatus');
const charCount = document.getElementById('charCount');
const toast = document.getElementById('toast');

let selectedFile = null;
let currentUser = null;
let toastTimer = null;

function showToast(text) {
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

captionInput.addEventListener('input', () => { charCount.textContent = captionInput.value.length; });

function handleFile(file) {
  if (!file) return;
  if (!file.type.startsWith('video/')) { showToast('❌ Please select a video file'); return; }
  if (file.size > 100 * 1024 * 1024) { showToast('❌ File too large. Max 100MB'); return; }
  selectedFile = file;
  uploadBtn.disabled = false;
  uploadBtnText.textContent = 'Upload Video';
  uploadBtn.classList.remove('loading');
  placeholderContent.style.display = 'none';
  videoPreview.style.display = 'block';
  videoPreview.src = URL.createObjectURL(file);
  videoPreview.load();
  previewOverlay.style.display = 'block';
  fileName.textContent = file.name;
  fileSize.textContent = (file.size / 1024 / 1024).toFixed(1) + ' MB';
  showToast('✅ Video selected');
}

fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });
uploadBox.addEventListener('dragover', (e) => { e.preventDefault(); uploadBox.classList.add('dragover'); });
uploadBox.addEventListener('dragleave', () => { uploadBox.classList.remove('dragover'); });
uploadBox.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadBox.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
uploadBox.addEventListener('click', (e) => { if (e.target.closest('.file-input')) return; fileInput.click(); });

// =====================================================
// ✅ UPLOAD - সম্পূর্ণ ফিক্সড
// =====================================================
uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) { showToast('❌ Please select a video first'); return; }
  if (!currentUser) { showToast('🔐 Please login first'); return; }
  
  uploadBtn.disabled = true;
  uploadBtn.classList.add('loading');
  uploadBtnText.textContent = 'Uploading...';
  
  progressContainer.style.display = 'block';
  progressBar.style.width = '0%';
  progressPercent.textContent = '0%';
  progressStatus.textContent = '⏳ Uploading to WWC...';
  progressStatus.className = 'progress-status';
  progressText.textContent = '⏳ Uploading...';
  
  try {
    const fileExt = selectedFile.name.split('.').pop();
    const fileName = `video_${Date.now()}.${fileExt}`;
    const storageRef = ref(storage, `videos/${currentUser.uid}/${fileName}`);
    
    console.log('📤 Uploading to:', storageRef.fullPath);
    
    const uploadTask = uploadBytesResumable(storageRef, selectedFile);
    
    const downloadURL = await new Promise((resolve, reject) => {
      uploadTask.on('state_changed',
        (snapshot) => {
          const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
          progressBar.style.width = progress + '%';
          progressPercent.textContent = Math.round(progress) + '%';
          progressText.textContent = progress < 100 ? `⏳ Uploading... ${Math.round(progress)}%` : '✅ Upload complete!';
          console.log('📊 Progress:', Math.round(progress) + '%');
        },
        (error) => {
          console.error('❌ Upload error:', error);
          reject(error);
        },
        async () => {
          try {
            const url = await getDownloadURL(uploadTask.snapshot.ref);
            console.log('✅ Download URL:', url);
            resolve(url);
          } catch (e) {
            reject(e);
          }
        }
      );
    });
    
    progressText.textContent = '📝 Saving to database...';
    progressStatus.textContent = '📝 Saving...';
    
    const videoData = {
      uid: currentUser.uid,
      videoURL: downloadURL,
      caption: captionInput.value.trim() || 'No caption',
      sound: soundInput.value.trim() || 'Original sound - WWC',
      username: currentUser.displayName || 'wwc_user',
      name: currentUser.displayName || 'WWC User',
      photoURL: currentUser.photoURL || './images/profile.png',
      likes: 0,
      comments: 0,
      saves: 0,
      shares: 0,
      likedBy: [],
      savedBy: [],
      createdAt: serverTimestamp()
    };
    
    await addDoc(collection(db, 'videos'), videoData);
    console.log('✅ Video saved to Firestore');
    
    progressStatus.textContent = '✅ Video uploaded successfully! 🎉';
    progressStatus.className = 'progress-status success';
    progressBar.style.width = '100%';
    progressPercent.textContent = '100%';
    progressText.textContent = '🎉 Done!';
    showToast('🎉 Video uploaded successfully!');
    
    setTimeout(() => {
      selectedFile = null;
      fileInput.value = '';
      videoPreview.src = '';
      videoPreview.style.display = 'none';
      placeholderContent.style.display = 'block';
      previewOverlay.style.display = 'none';
      captionInput.value = '';
      soundInput.value = '';
      charCount.textContent = '0';
      uploadBtn.disabled = true;
      uploadBtn.classList.remove('loading');
      uploadBtnText.textContent = 'Upload Video';
      progressContainer.style.display = 'none';
      progressBar.style.width = '0%';
      progressPercent.textContent = '0%';
      progressStatus.textContent = '';
      
      setTimeout(() => {
        if (confirm('🎉 Video uploaded! Go to Home?')) {
          window.location.href = './index.html';
        }
      }, 500);
    }, 2000);
  } catch (error) {
    console.error('❌ Upload error:', error);
    progressStatus.textContent = '❌ Upload failed: ' + (error.message || 'Unknown error');
    progressStatus.className = 'progress-status error';
    progressText.textContent = '❌ Upload failed';
    showToast('❌ Upload failed: ' + (error.message || 'Unknown error'));
    uploadBtn.disabled = false;
    uploadBtn.classList.remove('loading');
    uploadBtnText.textContent = 'Retry Upload';
  }
});

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (!user) {
    uploadBtn.disabled = true;
    uploadBtnText.textContent = 'Login to Upload';
    showToast('🔐 Please login first');
  } else if (selectedFile) {
    uploadBtn.disabled = false;
    uploadBtnText.textContent = 'Upload Video';
  }
});

console.log('✅ Upload Page Loaded');
</script>
</body>
</html>
