<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Upload</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
h1{font-size:24px;margin-bottom:10px}
p{color:#888}
.upload-box{border:2px dashed #444;border-radius:20px;padding:40px;text-align:center;margin:20px 0;width:80%;max-width:400px}
.upload-box i{font-size:50px;color:#555}
.back-btn{position:fixed;top:20px;left:20px;color:#fff;font-size:24px;background:none;border:0;cursor:pointer}
</style>
</head>
<body>
<button class="back-btn" onclick="window.location.href='./index.html'"><i class="fas fa-arrow-left"></i></button>
<h1>📤 Upload Video</h1>
<p>ভিডিও আপলোড করুন</p>
<div class="upload-box">
  <i class="fas fa-cloud-upload-alt"></i>
  <p style="margin-top:15px;color:#666;">Coming soon...</p>
</div>
</body>
</html>
