<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWC Video Upload</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    .upload-box {
      max-width: 500px;
      margin: 50px auto;
      padding: 25px;
      background: #222;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 25px;
    }

    input[type="file"] {
      width: 100%;
      margin: 20px 0;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ff1744;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      line-height: 1.6;
      word-break: break-word;
    }

    progress {
      width: 100%;
      margin-top: 15px;
      height: 20px;
    }

    a {
      color: #00e5ff;
    }
  </style>
</head>

<body>

  <div class="upload-box">

    <h1>🎬 WWC Video Upload</h1>

    <p id="userStatus">Checking login...</p>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <button id="uploadBtn" disabled>
      ⬆️ Upload Video
    </button>

    <progress
      id="progressBar"
      value="0"
      max="100"
      style="display:none;"
      </progress>

    <div id="status"></div>

  </div>


  <script type="module">

    import {
      getApps,
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      setPersistence,
browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    import {
      getStorage,
      ref,
      uploadBytesResumable,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";


    // ==============================
    // 🔥 FIREBASE
    // ==============================

    const firebaseConfig = {
      apiKey: "AIzaSyC7ld7APerF7d6jdunQ3ny1M6FSW_t04",
      authDomain: "world-wide-connect-62c87.firebaseapp.com",
      projectId: "world-wide-connect-62c87",
      storageBucket: "world-wide-connect-62c87.firebasestorage.app",
      messagingSenderId: "931784536688",
      appId: "1:931784536668:web:2184630caae8e61f7445031",
      measurementId: "G-R2LSYXQPH"
    };


    const app = getApps().length
      ? getApps()[0]
      : initializeApp(firebaseConfig);

    const auth = getAuth(app);

// Keep login session
try {
  await setPersistence(auth, browserLocalPersistence);
  await auth.authStateReady();
} catch (error) {
  console.error("Auth initialization error:", error);
}

const storage = getStorage(app);

// ========================
// ELEMENTS
// ========================

const videoFile = document.getElementById("videoFile");
const uploadBtn = document.getElementById("uploadBtn");
const status = document.getElementById("status");
const userStatus = document.getElementById("userStatus");
const progressBar = document.getElementById("progressBar");

let currentUser = null;

// =========================
// 🔐 LOGIN CHECK
// =========================

async function checkLogin() {
  try {
    await auth.authStateReady();

    currentUser = auth.currentUser;

    if (currentUser) {
      userStatus.textContent =
        "✅ Login করা আছে: " + (currentUser.email || currentUser.uid);

      uploadBtn.disabled = false;
    } else {
      userStatus.textContent = "❌ আগে Login করুন";
      uploadBtn.disabled = true;

      status.innerHTML =
        'ভিডিও Upload করতে <a href="./login.html">Login</a> করুন';
    }

  } catch (error) {
    console.error("Login check error:", error);

    userStatus.textContent = "❌ Login check করা যায়নি";
    uploadBtn.disabled = true;
  }
}

// Login / Logout change হলে আবার check করবে
onAuthStateChanged(auth, (user) => {
  currentUser = user;

  if (user) {
    userStatus.textContent =
      "✅ Login করা আছে: " + (user.email || user.uid);

    uploadBtn.disabled = false;
  } else {
    userStatus.textContent = "❌ আগে Login করুন";
    uploadBtn.disabled = true;

    status.innerHTML =
      'ভিডিও Upload করতে <a href="./login.html">Login</a> করুন';
  }
});

checkLogin();

    // ==============================
    // 📹 VIDEO UPLOAD
    // ==============================

    uploadBtn.addEventListener("click", async () => {

      if (!currentUser) {

        status.textContent =
          "❌ আগে Login করুন।";

        return;
      }


      const file = videoFile.files[0];


      if (!file) {

        status.textContent =
          "⚠️ আগে একটি ভিডিও নির্বাচন করুন।";

        return;
      }


      if (!file.type.startsWith("video/")) {

        status.textContent =
          "❌ শুধু Video file Upload করা যাবে।";

        return;
      }


      // 100 MB limit
      if (file.size > 100 * 1024 * 1024) {

        status.textContent =
          "❌ ভিডিওর আকার সর্বোচ্চ 100 MB হতে পারবে।";

        return;
      }


      uploadBtn.disabled = true;

      progressBar.style.display = "block";
      progressBar.value = 0;

      status.textContent =
        "⏳ Video Upload হচ্ছে...";


      try {

        const safeFileName =
          file.name.replace(/[^a-zA-Z0-9._-]/g, "_");


        const filePath =
          "videos/" +
          currentUser.uid +
          "/" +
          Date.now() +
          "_" +
          safeFileName;


        const storageRef =
          ref(storage, filePath);


        const uploadTask =
          uploadBytesResumable(
            storageRef,
            file,
            {
              contentType: file.type
            }
          );


        uploadTask.on(
          "state_changed",

          (snapshot) => {

            const progress =
              (snapshot.bytesTransferred /
              snapshot.totalBytes) * 100;

            progressBar.value = progress;

            status.textContent =
              "⬆️ Upload হচ্ছে: " +
              Math.round(progress) +
              "%";

          },


          (error) => {

            console.error(
              "Upload error:",
              error
            );

            status.textContent =
              "❌ Upload ব্যর্থ হয়েছে।";

            uploadBtn.disabled = false;
          },


          async () => {

            const downloadURL =
              await getDownloadURL(
                uploadTask.snapshot.ref
              );


            status.innerHTML =
              "✅ Video সফলভাবে Upload হয়েছে!<br><br>" +
              "<a href=\"" +
              downloadURL +
              "\" target=\"_blank\">" +
              "🎬 ভিডিও দেখুন" +
              "</a>";


            console.log(
              "Video URL:",
              downloadURL
            );


            uploadBtn.disabled = false;

          }
        );


      } catch (error) {

        console.error(
          "Upload error:",
          error
        );

        status.textContent =
          "❌ সমস্যা হয়েছে: " +
          error.message;

        uploadBtn.disabled = false;
      }

    });

  </script>

</body>
  </html>
