<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WWC Video Upload</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }

    .upload-box {
      max-width: 500px;
      margin: 50px auto;
      padding: 25px;
      background: #222;
      border-radius: 15px;
      border: 1px solid #333;
    }

    h1 {
      margin-bottom: 25px;
    }

    input[type="file"] {
      width: 100%;
      margin: 20px 0;
      padding: 10px;
      box-sizing: border-box;
      background: #111;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ff1744;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      line-height: 1.6;
      word-break: break-word;
    }

    progress {
      width: 100%;
      margin-top: 15px;
      height: 20px;
    }

    a {
      color: #00e5ff;
    }
  </style>
</head>

<body>

  <div class="upload-box">

    <h1>🎬 WWC Video Upload</h1>

    <p id="userStatus">
      ⏳ Login Check হচ্ছে...
    </p>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <button
      id="uploadBtn"
      type="button"
      disabled
    >
      ⬆️ Upload Video
    </button>

    <progress
      id="progressBar"
      value="0"
      max="100"
      style="display:none;"
    ></progress>

    <div id="status"></div>

  </div>


  <script type="module">

    // ==========================================
    // FIREBASE APP
    // ==========================================

    import {
      getApps,
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


    // ==========================================
    // FIREBASE AUTH
    // ==========================================

    import {
      getAuth,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


    // ==========================================
    // FIREBASE STORAGE
    // ==========================================

    import {
      getStorage,
      ref,
      uploadBytesResumable,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {
  apiKey: "আপনার Profile-এর apiKey",
  authDomain: "world-wide-connect-62c87.firebaseapp.com",
  projectId: "world-wide-connect-62c87",
  storageBucket: "world-wide-connect-62c87.firebasestorage.app",
  messagingSenderId: "আপনার Profile-এর messagingSenderId",
  appId: "আপনার Profile-এর appId",
  measurementId: "আপনার Profile-এর measurementId"
};


    // ==========================================
    // FIREBASE START
    // ==========================================

    const app =
      getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const storage =
      getStorage(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const videoFile =
      document.getElementById("videoFile");

    const uploadBtn =
      document.getElementById("uploadBtn");

    const status =
      document.getElementById("status");

    const userStatus =
      document.getElementById("userStatus");

    const progressBar =
      document.getElementById("progressBar");


    // ==========================================
    // CURRENT USER
    // ==========================================

    let currentUser = null;


    // ==========================================
    // KEEP LOGIN SESSION
    // ==========================================

    try {

      await setPersistence(
        auth,
        browserLocalPersistence
      );

    } catch (error) {

      console.error(
        "Persistence Error:",
        error
      );

    }


    // ==========================================
    // LOGIN CHECK
    // ==========================================

    onAuthStateChanged(
      auth,
      (user) => {

        currentUser = user;


        if (user) {

          userStatus.textContent =
            "✅ Login করা আছে: " +
            (
              user.email ||
              user.displayName ||
              user.uid
            );


          uploadBtn.disabled =
            false;


          status.textContent =
            "🎥 Video নির্বাচন করে Upload করুন।";

        } else {

          userStatus.textContent =
            "❌ Login করা নেই";


          uploadBtn.disabled =
            true;


          status.innerHTML =
            '⚠️ Video Upload করতে আগে <a href="./login.html">Login</a> করুন।';

        }

      }
    );


    // ==========================================
    // VIDEO UPLOAD
    // ==========================================

    uploadBtn.addEventListener(
      "click",
      async () => {

        // Login check
        if (!currentUser) {

          status.textContent =
            "❌ আগে Login করুন।";

          return;
        }


        // File check
        const file =
          videoFile.files[0];


        if (!file) {

          status.textContent =
            "⚠️ আগে একটি Video নির্বাচন করুন।";

          return;
        }


        // Video type check
        if (!file.type.startsWith("video/")) {

          status.textContent =
            "❌ শুধু Video file Upload করা যাবে।";

          return;
        }


        // 100 MB limit
        if (
          file.size >
          100 * 1024 * 1024
        ) {

          status.textContent =
            "❌ ভিডিওর আকার সর্বোচ্চ 100 MB হতে পারবে।";

          return;
        }


        // Disable button
        uploadBtn.disabled =
          true;


        progressBar.style.display =
          "block";

        progressBar.value =
          0;


        status.textContent =
          "⏳ Video Upload শুরু হচ্ছে...";


        try {

          // ====================================
          // SAFE FILE NAME
          // ====================================

          const safeFileName =
            file.name
              .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
              );


          // ====================================
          // STORAGE PATH
          // ====================================

          const filePath =
            "videos/" +
            currentUser.uid +
            "/" +
            Date.now() +
            "_" +
            safeFileName;


          console.log(
            "Upload path:",
            filePath
          );


          // ====================================
          // STORAGE REF
          // ====================================

          const storageRef =
            ref(
              storage,
              filePath
            );


          // ====================================
          // START UPLOAD
          // ====================================

          const uploadTask =
            uploadBytesResumable(
              storageRef,
              file,
              {
                contentType:
                  file.type
              }
            );


          // ====================================
          // UPLOAD PROGRESS
          // ====================================

          uploadTask.on(

            "state_changed",

            (snapshot) => {

              const progress =
                (
                  snapshot.bytesTransferred /
                  snapshot.totalBytes
                ) * 100;


              progressBar.value =
                progress;


              status.textContent =
                "⬆️ Upload হচ্ছে: " +
                Math.round(progress) +
                "%";

            },


            // ==================================
            // ERROR
            // ==================================

            (error) => {

              console.error(
                "Firebase Storage Error:",
                error
              );


              progressBar.style.display =
                "none";


              uploadBtn.disabled =
                false;


              if (
                error.code ===
                "storage/unauthorized"
              ) {

                status.textContent =
                  "❌ Firebase Storage Permission নেই।";

              } else if (
                error.code ===
                "storage/canceled"
              ) {

                status.textContent =
                  "❌ Upload বাতিল হয়েছে।";

              } else {

                status.textContent =
                  "❌ Upload ব্যর্থ: " +
                  error.message;

              }

            },


            // ==================================
            // SUCCESS
            // ==================================

            async () => {

              try {

                const downloadURL =
                  await getDownloadURL(
                    uploadTask.snapshot.ref
                  );


                progressBar.value =
                  100;


                status.innerHTML =
                  "✅ Video সফলভাবে Upload হয়েছে!<br><br>" +

                  "<a href=\"" +
                  downloadURL +
                  "\" target=\"_blank\">" +

                  "🎬 ভিডিও দেখুন" +

                  "</a>";


                console.log(
                  "Video URL:",
                  downloadURL
                );


                uploadBtn.disabled =
                  false;


                videoFile.value =
                  "";

              } catch (error) {

                console.error(
                  "Download URL Error:",
                  error
                );


                status.textContent =
                  "❌ Video Upload হয়েছে, কিন্তু Video URL পাওয়া যায়নি।";


                uploadBtn.disabled =
                  false;

              }

            }

          );


        } catch (error) {

          console.error(
            "Upload Error:",
            error
          );


          progressBar.style.display =
            "none";


          status.textContent =
            "❌ সমস্যা হয়েছে: " +
            error.message;


          uploadBtn.disabled =
            false;

        }

      }
    );

  </script>

</body>

</html>
