<!DOCTYPE html>
<html lang="bn">

  
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#000000">

<title>WWC Video Upload</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  padding:20px;
}

.upload-box{
  width:100%;
  max-width:550px;
  margin:20px auto;
  padding:22px;
  background:#181818;
  border:1px solid #333;
  border-radius:18px;
}

.top-bar{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.back-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#292929;
  color:#fff;
  font-size:23px;
  cursor:pointer;
}

.title{
  font-size:21px;
  font-weight:bold;
}

.login-status{
  padding:12px;
  margin-bottom:18px;
  background:#111;
  border:1px solid #333;
  border-radius:10px;
  color:#aaa;
  font-size:14px;
  word-break:break-word;
}

.field{
  margin-bottom:18px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#ccc;
  font-size:14px;
}

.field textarea{
  width:100%;
  min-height:100px;
  padding:13px;
  resize:vertical;
  outline:none;
  border:1px solid #444;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:15px;
}

.file-box{
  padding:15px;
  background:#111;
  border:1px dashed #555;
  border-radius:12px;
}

.file-box input{
  width:100%;
  color:#fff;
}

.preview{
  display:none;
  width:100%;
  max-height:500px;
  margin-top:15px;
  border-radius:12px;
  background:#000;
  object-fit:contain;
}

.upload-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#fe2c55;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.upload-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.progress-box{
  display:none;
  margin-top:18px;
}

progress{
  width:100%;
  height:20px;
}

.progress-text{
  margin-top:8px;
  text-align:center;
  color:#aaa;
}

.status{
  min-height:25px;
  margin-top:18px;
  text-align:center;
  line-height:1.6;
  word-break:break-word;
}

.success{
  color:#4ade80;
}

.error{
  color:#ff6684;
}

.info{
  color:#aaa;
}

.login-link{
  display:inline-block;
  margin-top:12px;
  padding:10px 18px;
  background:#fe2c55;
  color:#fff;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

.done-btn{
  display:none;
  width:100%;
  margin-top:12px;
  padding:13px;
  border:1px solid #555;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:15px;
  cursor:pointer;
}

@media(max-width:500px){

  body{
    padding:10px;
  }

  .upload-box{
    margin:10px auto;
    padding:18px;
  }

}

</style>

</head>

<body>

<main class="upload-box">

<div class="top-bar">

<button
  type="button"
  id="backBtn"
  class="back-btn"
>
←
</button>

<div class="title">
🎬 Upload Video
</div>

</div>


<div
  id="loginStatus"
  class="login-status"
>
⏳ Login Check হচ্ছে...
</div>


<div class="field">

<label for="caption">
📝 Video Caption
</label>

<textarea
  id="caption"
  maxlength="300"
  placeholder="আপনার Video সম্পর্কে কিছু লিখুন..."
  disabled
></textarea>

</div>


<div class="field">

<label>
🎥 Video নির্বাচন করুন
</label>

<div class="file-box">

<input
  type="file"
  id="videoFile"
  accept="video/mp4,video/webm,video/quicktime,video/*"
  disabled
>

<video
  id="preview"
  class="preview"
  controls
  playsinline
></video>

</div>

</div>


<button
  type="button"
  id="uploadBtn"
  class="upload-btn"
  disabled
>
⬆️ Publish Video
</button>


<div
  id="progressBox"
  class="progress-box"
>

<progress
  id="progressBar"
  value="0"
  max="100"
></progress>

<div
  id="progressText"
  class="progress-text"
>
0%
</div>

</div>


<div
  id="status"
  class="status"
></div>


<button
  type="button"
  id="doneBtn"
  class="done-btn"
>
✅ Publish হয়েছে — Home-এ যান
</button>

</main>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  getApps,
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  addDoc,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

  authDomain:
    "world-wide-connect-62c87.firebaseapp.com",

  projectId:
    "world-wide-connect-62c87",

  storageBucket:
    "world-wide-connect-62c87.firebasestorage.app",

  messagingSenderId:
    "93178453668",

  appId:
    "1:93178453668:web:2184630caa8e61f7445031",

  measurementId:
    "G-PKFJ5NEMGQ"

};


const app =
  getApps().length
    ? getApps()[0]
    : initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   CLOUDINARY
===================================================== */

const CLOUDINARY_CLOUD_NAME =
  "fsalagrz";

const CLOUDINARY_UPLOAD_PRESET =
  "wwc_upload";

const CLOUDINARY_UPLOAD_URL =
  `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/video/upload`;


/* =====================================================
   ELEMENTS
===================================================== */

const backBtn =
  document.getElementById("backBtn");

const loginStatus =
  document.getElementById("loginStatus");

const caption =
  document.getElementById("caption");

const videoFile =
  document.getElementById("videoFile");

const preview =
  document.getElementById("preview");

const uploadBtn =
  document.getElementById("uploadBtn");

const progressBox =
  document.getElementById("progressBox");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const status =
  document.getElementById("status");

const doneBtn =
  document.getElementById("doneBtn");


/* =====================================================
   STATE
===================================================== */

let currentUser = null;

let selectedFile = null;

let previewURL = null;

let uploading = false;


/* =====================================================
   BACK
===================================================== */

backBtn.addEventListener(
  "click",
  () => history.back()
);


/* =====================================================
   STATUS
===================================================== */

function showStatus(
  text,
  type = "info"
){

  status.textContent =
    text;

  status.className =
    "status " + type;

}


/* =====================================================
   FORM
===================================================== */

function enableForm(
  enabled
){

  caption.disabled =
    !enabled;

  videoFile.disabled =
    !enabled;

  uploadBtn.disabled =
    !enabled;

}


/* =====================================================
   FILE SELECT
===================================================== */

videoFile.addEventListener(
  "change",
  () => {

    selectedFile =
      videoFile.files[0] || null;


    preview.pause();

    preview.removeAttribute(
      "src"
    );

    preview.style.display =
      "none";


    if(previewURL){

      URL.revokeObjectURL(
        previewURL
      );

      previewURL =
        null;

    }


    if(!selectedFile){

      showStatus(
        "⚠️ একটি Video নির্বাচন করুন।",
        "info"
      );

      return;

    }


    if(
      !selectedFile.type.startsWith(
        "video/"
      )
    ){

      selectedFile =
        null;

      videoFile.value =
        "";

      showStatus(
        "❌ শুধু Video file নির্বাচন করুন।",
        "error"
      );

      return;

    }


    /*
      আপাতত 100MB limit।
      বড় production system-এ পরে
      resumable/chunked upload যোগ করা যাবে।
    */

    if(
      selectedFile.size >
      100 * 1024 * 1024
    ){

      selectedFile =
        null;

      videoFile.value =
        "";

      showStatus(
        "❌ Video সর্বোচ্চ 100 MB হতে পারবে।",
        "error"
      );

      return;

    }


    previewURL =
      URL.createObjectURL(
        selectedFile
      );


    preview.src =
      previewURL;


    preview.style.display =
      "block";


    showStatus(
      "✅ Video নির্বাচন হয়েছে।",
      "info"
    );

  }
);


/* =====================================================
   AUTH PERSISTENCE
===================================================== */

try{

  await setPersistence(
    auth,
    browserLocalPersistence
  );

}catch(error){

  console.warn(
    "Persistence:",
    error
  );

}


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
  auth,
  async user => {

    currentUser =
      user;


    if(!user){

      loginStatus.textContent =
        "❌ Login করা নেই।";

      loginStatus.style.color =
        "#ff6684";

      enableForm(false);

      status.innerHTML =
        '⚠️ Video Publish করতে আগে Login করুন.<br>' +
        '<a class="login-link" href="./auth.html">' +
        '🔐 Login / Register' +
        '</a>';

      return;

    }


    loginStatus.textContent =
      "✅ Login করা আছে: " +
      (
        user.displayName ||
        user.email ||
        user.uid
      );


    loginStatus.style.color =
      "#4ade80";


    enableForm(true);


    try{

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const snap =
        await getDoc(
          userRef
        );


      if(!snap.exists()){

        await setDoc(
          userRef,
          {

            uid:
              user.uid,

            name:
              user.displayName ||
              "WWC User",

            username:
              "wwc_" +
              user.uid.substring(0,6),

            email:
              user.email || "",

            photoURL:
              user.photoURL ||
              "./images/profile.png",

            bio:
              "Welcome to World Wide Connect 🌍",

            followers:
              0,

            following:
              0,

            likes:
              0,

            followingIds:
              [],

            followerIds:
              [],

            savedVideoIds:
              [],

            createdAt:
              serverTimestamp()

          }
        );

      }

    }catch(error){

      console.error(
        "Profile error:",
        error
      );

    }


    showStatus(
      "🎥 Video নির্বাচন করে Publish করুন।",
      "info"
    );

  }
);


/* =====================================================
   CLOUDINARY UPLOAD
===================================================== */

function uploadToCloudinary(
  file
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const xhr =
        new XMLHttpRequest();


      xhr.open(
        "POST",
        CLOUDINARY_UPLOAD_URL
      );


      xhr.upload.addEventListener(
        "progress",
        event => {

          if(
            !event.lengthComputable
          ){
            return;
          }


          const percent =
            (
              event.loaded /
              event.total
            ) * 100;


          progressBar.value =
            percent;


          progressText.textContent =
            Math.round(percent) + "%";


          showStatus(
            "⬆️ Video Upload হচ্ছে: " +
            Math.round(percent) +
            "%",
            "info"
          );

        }
      );


      xhr.addEventListener(
        "load",
        () => {

          if(
            xhr.status >= 200 &&
            xhr.status < 300
          ){

            try{

              const result =
                JSON.parse(
                  xhr.responseText
                );

              resolve(result);

            }catch(error){

              reject(error);

            }

          }else{

            let message =
              "Cloudinary Upload failed";

            try{

              const result =
                JSON.parse(
                  xhr.responseText
                );

              message =
                result?.error?.message ||
                message;

            }catch(_){}


            reject(
              new Error(message)
            );

          }

        }
      );


      xhr.addEventListener(
        "error",
        () => {

          reject(
            new Error(
              "Network error"
            )
          );

        }
      );


      xhr.addEventListener(
        "abort",
        () => {

          reject(
            new Error(
              "Upload cancelled"
            )
          );

        }
      );


      const formData =
        new FormData();


      formData.append(
        "file",
        file
      );


      formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
      );


      formData.append(
        "folder",
        "wwc/videos"
      );


      xhr.send(
        formData
      );

    }
  );

}


/* =====================================================
   PUBLISH
===================================================== */

uploadBtn.addEventListener(
  "click",
  async () => {

    if(uploading){
      return;
    }


    if(!currentUser){

      showStatus(
        "❌ আগে Login করুন।",
        "error"
      );

      return;

    }


    const file =
      selectedFile ||
      videoFile.files[0];


    if(!file){

      showStatus(
        "⚠️ আগে একটি Video নির্বাচন করুন।",
        "error"
      );

      return;

    }


    if(
      !file.type.startsWith(
        "video/"
      )
    ){

      showStatus(
        "❌ শুধু Video Upload করা যাবে।",
        "error"
      );

      return;

    }


    if(
      file.size >
      100 * 1024 * 1024
    ){

      showStatus(
        "❌ Video সর্বোচ্চ 100 MB হতে পারবে।",
        "error"
      );

      return;

    }


    const videoCaption =
      caption.value.trim();


    if(!videoCaption){

      showStatus(
        "⚠️ Video Caption লিখুন।",
        "error"
      );

      caption.focus();

      return;

    }


    uploading =
      true;


    uploadBtn.disabled =
      true;

    videoFile.disabled =
      true;

    caption.disabled =
      true;


    progressBox.style.display =
      "block";


    progressBar.value =
      0;

    progressText.textContent =
      "0%";


    try{

      /* ===============================================
         USER PROFILE
      =============================================== */

      const userRef =
        doc(
          db,
          "users",
          currentUser.uid
        );


      const userSnapshot =
        await getDoc(
          userRef
        );


      const userData =
        userSnapshot.exists()
          ? userSnapshot.data()
          : {};


      const username =
        String(
          userData.username ||
          "wwc_" +
          currentUser.uid.substring(0,6)
        ).replace(
          /^@/,
          ""
        );


      const userName =
        userData.name ||
        currentUser.displayName ||
        "WWC User";


      const photoURL =
        userData.photoURL ||
        currentUser.photoURL ||
        "./images/profile.png";


      /* ===============================================
         CLOUDINARY
      =============================================== */

      showStatus(
        "⏳ Video Upload শুরু হচ্ছে...",
        "info"
      );


      const cloudinaryResult =
        await uploadToCloudinary(
          file
        );


      const videoURL =
        cloudinaryResult.secure_url;


      if(!videoURL){

        throw new Error(
          "Video URL পাওয়া যায়নি।"
        );

      }


      /* ===============================================
         FIRESTORE
      =============================================== */

      showStatus(
        "☁️ Video Upload হয়েছে। Publish হচ্ছে...",
        "info"
      );


      const videoData = {

        /*
          গুরুত্বপূর্ণ:
          Feed-এর creator lookup-এর জন্য
          creatorId রাখা হচ্ছে।
        */

        creatorId:
          currentUser.uid,

        uid:
          currentUser.uid,

        username:
          username,

        name:
          userName,

        photoURL:
          photoURL,

        videoURL:
          videoURL,

        caption:
          videoCaption,

        status:
          "published",

        visibility:
          "public",

        likes:
          0,

        comments:
          0,

        saves:
          0,

        views:
          0,

        likedBy:
          [],

        savedBy:
          [],

        /*
          ভবিষ্যতে pagination এবং sorting-এর
          জন্য createdAt ব্যবহার হবে।
        */

        createdAt:
          serverTimestamp()

      };


      const videoRef =
        await addDoc(
          collection(
            db,
            "videos"
          ),
          videoData
        );


      console.log(
        "WWC Video Published:",
        videoRef.id
      );


      /* ===============================================
         SUCCESS
      =============================================== */

      progressBar.value =
        100;

      progressText.textContent =
        "100%";


      showStatus(
        "✅ Video সফলভাবে Publish হয়েছে!",
        "success"
      );


      doneBtn.style.display =
        "block";


      caption.value =
        "";

      videoFile.value =
        "";

      selectedFile =
        null;


      preview.pause();

      preview.removeAttribute(
        "src"
      );

      preview.style.display =
        "none";


    }catch(error){

      console.error(
        "WWC Publish Error:",
        error
      );


      showStatus(
        "❌ Publish করা যায়নি: " +
        (
          error?.message ||
          "Unknown error"
        ),
        "error"
      );


      uploadBtn.disabled =
        false;

      videoFile.disabled =
        false;

      caption.disabled =
        false;

      progressBox.style.display =
        "none";


    }finally{

      uploading =
        false;

    }

  }
);


/* =====================================================
   DONE
===================================================== */

doneBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      "./index.html";

  }
);

</script>

</body>
</html>
