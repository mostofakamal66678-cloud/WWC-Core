      font-size: 15px;

    // ==========================================
    // AGE CALCULATOR
    // ==========================================

    function calculateAge(dateString) {

      if (!dateString) {
        return "";
      }

      const birthDate =
        new Date(dateString);

      if (isNaN(birthDate.getTime())) {
        return "";
      }

      const today =
        new Date();

      let age =
        today.getFullYear()
        - birthDate.getFullYear();

      const monthDifference =
        today.getMonth()
        - birthDate.getMonth();

      if (
        monthDifference < 0 ||
        (
          monthDifference === 0 &&
          today.getDate() < birthDate.getDate()
        )
      ) {

        age--;

      }

      if (age < 0) {
        return "";
      }

      return age;

    }

    // ==========================================
    // COMPRESS PHOTO
    // ==========================================

    function compressPhoto(file) {

      return new Promise(
        (resolve, reject) => {

          if (!file) {
            resolve("");
            return;
          }

          if (!file.type.startsWith("image/")) {

            reject(
              new Error(
                "শুধু ছবি নির্বাচন করুন।"
              )
            );

            return;
          }

          const reader =
            new FileReader();

          reader.onload = event => {

            const img =
              new Image();

            img.onload = () => {

              const maxSize = 400;

              let width =
                img.width;

              let height =
                img.height;


              if (width > height) {

                if (width > maxSize) {

                  height =
                    height * maxSize / width;

                  width =
                    maxSize;

                }

              } else {

                if (height > maxSize) {

                  width =
                    width * maxSize / height;

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement("canvas");

              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext("2d");

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const compressed =
                canvas.toDataURL(
                  "image/jpeg",
                  0.75
                );


              resolve(compressed);

            };


            img.onerror = () => {

              reject(
                new Error(
                  "ছবি পড়া যায়নি।"
                )
              );

            };


            img.src =
              event.target.result;

          };


          reader.onerror = () => {

            reject(
              new Error(
                "ছবি লোড করা যায়নি।"
              )
            );

          };


          reader.readAsDataURL(file);

        }
      );

    }
