<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WWC Profile</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

.profile-header{
  padding:55px 20px 25px;
  text-align:center;
  border-bottom:1px solid #333;
}

.back-btn{
  position:fixed;
  left:15px;
  top:15px;
  z-index:20;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:#fff;
  font-size:25px;
}

.profile-photo{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #fff;
  background:#333;
}

.username{
  font-size:25px;
  margin:12px 0 5px;
}

.handle{
  color:#aaa;
  margin-bottom:10px;
}

.email{
  color:#777;
  font-size:13px;
  word-break:break-all;
}

.bio{
  color:#ddd;
  margin:12px auto 20px;
  max-width:420px;
  line-height:1.5;
}

.stats{
  display:flex;
  justify-content:center;
  gap:38px;
  margin:20px 0;
}

.stat{
  text-align:center;
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:#aaa;
  font-size:13px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.main-btn{
  border:0;
  background:#fff;
  color:#000;
  padding:11px 20px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.logout-btn{
  background:#d9363e;
  color:#fff;
}

.edit-box{
  display:none;
  max-width:500px;
  margin:20px auto;
  padding:20px;
  background:#181818;
  border-radius:15px;
  border:1px solid #333;
}

.edit-box.show{
  display:block;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:7px;
  color:#ddd;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #444;
  border-radius:8px;
  background:#111;
  color:#fff;
  font-size:15px;
}

.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.save-btn,
.cancel-btn{
  width:100%;
  padding:13px;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}

.save-btn{
  border:0;
  background:#4f46e5;
  color:#fff;
}

.cancel-btn{
  margin-top:10px;
  border:1px solid #555;
  background:transparent;
  color:#fff;
}

#message{
  min-height:22px;
  margin-top:15px;
  text-align:center;
  color:#aaa;
}

.videos-title{
  padding:15px;
  font-size:18px;
  border-bottom:1px solid #333;
}

.video-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:2px;
}

.video-grid video{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#111;
}

.loading{
  padding:70px 20px;
  text-align:center;
  color:#aaa;
}

@media(max-width:500px){
  .video-grid video{
    height:150px;
  }

  .stats{
    gap:25px;
  }
}
</style>
</head>

<body>

<button class="back-btn" id="backBtn">←</button>

<div id="loading" class="loading">
  Profile লোড হচ্ছে...
</div>

<main id="profileContent" style="display:none;">

<section class="profile-header">

<img
  id="profilePhoto"
  class="profile-photo"
  src="./images/profile.png"
  alt="Profile"
>

<h1 id="profileName" class="username">
  WWC User
</h1>

<div id="profileHandle" class="handle">
  @wwc_user
</div>

<div id="profileEmail" class="email"></div>

<div id="profileBio" class="bio">
  Welcome to my WWC profile 🌍
</div>

<div class="stats">

<div class="stat">
<strong id="followers">0</strong>
<span>Followers</span>
</div>

<div class="stat">
<strong id="followingCount">0</strong>
<span>Following</span>
</div>

<div class="stat">
<strong id="likesCount">0</strong>
<span>Likes</span>
</div>

</div>

<div class="buttons">

<button id="followBtn" class="main-btn">
Follow
</button>

<button id="editBtn" class="main-btn">
✏️ Edit Profile
</button>

<button id="logoutBtn" class="main-btn logout-btn">
🚪 Logout
</button>

</div>

<div id="message"></div>

</section>


<section id="editBox" class="edit-box">

<h2 style="text-align:center;">
✏️ Edit Profile
</h2>

<div class="form-group">
<label>নাম</label>
<input id="nameInput" type="text" maxlength="50">
</div>

<div class="form-group">
<label>Username</label>
<input id="usernameInput" type="text" maxlength="30">
</div>

<div class="form-group">
<label>জন্মতারিখ</label>
<input id="dobInput" type="date">
</div>

<div class="form-group">
<label>বয়স</label>
<input id="ageInput" type="text" readonly>
</div>

<div class="form-group">
<label>Bio</label>
<textarea id="bioInput" maxlength="160"></textarea>
</div>

<div class="form-group">
<label>Gender</label>

<select id="genderInput">
<option value="">নির্বাচন করুন</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
<option value="Other">Other</option>
<option value="Prefer not to say">
Prefer not to say
</option>
</select>

</div>

<div class="form-group">
<label>Country</label>
<input id="countryInput" type="text" maxlength="50">
</div>

<button id="saveBtn" class="save-btn">
💾 Save Changes
</button>

<button id="cancelBtn" class="cancel-btn">
Cancel
</button>

</section>


<div class="videos-title">
🎬 Videos
</div>

<section class="video-grid">

<video controls muted playsinline>
<source src="./videos/video1.mp4" type="video/mp4">
</video>

<video controls muted playsinline>
<source src="./videos/video2.mp4" type="video/mp4">
</video>

<video controls muted playsinline>
<source src="./videos/video3.mp4" type="video/mp4">
</video>

</section>

</main>


<script type="module">

import {
  getApps,
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

  authDomain:
    "world-wide-connect-62c87.firebaseapp.com",

  projectId:
    "world-wide-connect-62c87",

  storageBucket:
    "world-wide-connect-62c87.firebasestorage.app",

  messagingSenderId:
    "93178453668",

  appId:
    "1:93178453668:web:2184630caa8e61f7445031",

  measurementId:
    "G-PKFJ5NEMGQ"
};


const app = getApps().length
  ? getApps()[0]
  : initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);


const loading =
  document.getElementById("loading");

const profileContent =
  document.getElementById("profileContent");

const profilePhoto =
  document.getElementById("profilePhoto");

const profileName =
  document.getElementById("profileName");

const profileHandle =
  document.getElementById("profileHandle");

const profileEmail =
  document.getElementById("profileEmail");

const profileBio =
  document.getElementById("profileBio");

const followers =
  document.getElementById("followers");

const followingCount =
  document.getElementById("followingCount");

const likesCount =
  document.getElementById("likesCount");

const followBtn =
  document.getElementById("followBtn");

const editBtn =
  document.getElementById("editBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const editBox =
  document.getElementById("editBox");

const saveBtn =
  document.getElementById("saveBtn");

const cancelBtn =
  document.getElementById("cancelBtn");

const message =
  document.getElementById("message");

const backBtn =
  document.getElementById("backBtn");

const nameInput =
  document.getElementById("nameInput");

const usernameInput =
  document.getElementById("usernameInput");

const dobInput =
  document.getElementById("dobInput");

const ageInput =
  document.getElementById("ageInput");

const bioInput =
  document.getElementById("bioInput");

const genderInput =
  document.getElementById("genderInput");

const countryInput =
  document.getElementById("countryInput");


const defaultPhoto =
  "./images/profile.png";

let currentUser = null;
let currentProfile = {};


function showMessage(text, success=false){

  message.textContent = text;

  message.style.color =
    success ? "#4ade80" : "#aaa";
}


function calculateAge(dateString){

  if(!dateString) return "";

  const birth =
    new Date(dateString);

  if(isNaN(birth.getTime()))
    return "";

  const today =
    new Date();

  let age =
    today.getFullYear()
    - birth.getFullYear();

  const month =
    today.getMonth()
    - birth.getMonth();

  if(
    month < 0 ||
    (
      month === 0 &&
      today.getDate() < birth.getDate()
    )
  ){
    age--;
  }

  return age >= 0 ? age : "";
}


dobInput.addEventListener(
  "change",
  () => {

    ageInput.value =
      calculateAge(dobInput.value);

  }
);


function renderProfile(){

  profileName.textContent =
    currentProfile.name ||
    currentUser.displayName ||
    "WWC User";

  let username =
    currentProfile.username ||
    "wwc_user";

  username =
    username.replace(/^@/, "");

  profileHandle.textContent =
    "@" + username;

  profileEmail.textContent =
    currentUser.email ||
    currentProfile.email ||
    "";

  profileBio.textContent =
    currentProfile.bio ||
    "Welcome to my WWC profile 🌍";

  profilePhoto.src =
    currentProfile.photoURL ||
    currentUser.photoURL ||
    defaultPhoto;

  followers.textContent =
    currentProfile.followers || 0;

  followingCount.textContent =
    currentProfile.following || 0;

  likesCount.textContent =
    currentProfile.likes || 0;

}


function fillEditForm(){

  nameInput.value =
    currentProfile.name ||
    currentUser.displayName ||
    "";

  usernameInput.value =
    currentProfile.username ||
    "wwc_user";

  dobInput.value =
    currentProfile.dob || "";

  ageInput.value =
    currentProfile.age ||
    calculateAge(currentProfile.dob);

  bioInput.value =
    currentProfile.bio ||
    "";

  genderInput.value =
    currentProfile.gender ||
    "";

  countryInput.value =
    currentProfile.country ||
    "Bangladesh";
}


async function loadProfile(user){

  currentUser = user;

  try{

    const userRef =
      doc(db, "users", user.uid);

    const snapshot =
      await getDoc(userRef);

    if(snapshot.exists()){

      currentProfile =
        snapshot.data();

    }else{

      currentProfile = {

        name:
          user.displayName ||
          "WWC User",

        username:
          "wwc_user",

        email:
          user.email || "",

        bio:
          "Welcome to my WWC profile 🌍",

        dob:"",
        age:"",
        gender:"",
        country:"Bangladesh",

        photoURL:
          user.photoURL ||
          defaultPhoto,

        followers:0,
        following:0,
        likes:0
      };

      await setDoc(
        userRef,
        currentProfile
      );
    }

    renderProfile();
    fillEditForm();

    loading.style.display = "none";
    profileContent.style.display = "block";

  }catch(error){

    console.error(error);

    loading.innerHTML =
      "❌ Profile লোড করা যায়নি।<br><br>" +
      "Firebase Firestore Rules পরীক্ষা করুন।";
  }
}


onAuthStateChanged(
  auth,
  (user) => {

    if(user){

      loadProfile(user);

    }else{

      loading.innerHTML =
        "❌ Login করা নেই।<br><br>" +
        "<a href='./login.html' style='color:#00e5ff;'>Login করুন</a>";
    }

  }
);


editBtn.addEventListener(
  "click",
  () => {

    editBox.classList.toggle("show");

  }
);


cancelBtn.addEventListener(
  "click",
  () => {

    editBox.classList.remove("show");

    fillEditForm();

  }
);


saveBtn.addEventListener(
  "click",
  async () => {

    if(!currentUser) return;

    saveBtn.disabled = true;

    showMessage(
      "⏳ Profile Save হচ্ছে..."
    );

    try{

      const username =
        usernameInput.value
        .trim()
        .replace(/^@/, "");

      const newProfile = {

        name:
          nameInput.value.trim()
          || "WWC User",

        username:
          username
          || "wwc_user",

        dob:
          dobInput.value,

        age:
          calculateAge(
            dobInput.value
          ),

        bio:
          bioInput.value.trim(),

        gender:
          genderInput.value,

        country:
          countryInput.value.trim(),

        email:
          currentUser.email || "",

        photoURL:
          currentProfile.photoURL ||
          currentUser.photoURL ||
          defaultPhoto,

        followers:
          Number(currentProfile.followers || 0),

        following:
          Number(currentProfile.following || 0),

        likes:
          Number(currentProfile.likes || 0)

      };


      const userRef =
        doc(
          db,
          "users",
          currentUser.uid
        );

      await setDoc(
        userRef,
        newProfile,
        { merge:true }
      );

      currentProfile = {
        ...currentProfile,
        ...newProfile
      };

      renderProfile();
      fillEditForm();

      editBox.classList.remove("show");

      showMessage(
        "✅ Profile সফলভাবে Save হয়েছে।",
        true
      );

    }catch(error){

      console.error(error);

      showMessage(
        "❌ Profile Save করা যায়নি: " +
        error.message
      );

    }

    saveBtn.disabled = false;

  }
);


followBtn.addEventListener(
  "click",
  () => {

    if(!currentUser){

      showMessage(
        "⚠️ আগে Login করুন।"
      );

      return;
    }

    showMessage(
      "ℹ️ নিজের Profile নিজেকে Follow করার দরকার নেই।"
    );

  }
);


logoutBtn.addEventListener(
  "click",
  async () => {

    try{

      await signOut(auth);

      window.location.href =
        "./login.html";

    }catch(error){

      console.error(error);

      showMessage(
        "❌ Logout করা যায়নি।"
      );

    }

  }
);


backBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      "./index.html";

  }
);

</script>

</body>
</html>
