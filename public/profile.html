<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WWC My Profile</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      background: #111;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    .title {
      margin-left: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding-bottom: 80px;
    }

    .profile-header {
      text-align: center;
      padding: 35px 20px 25px;
      border-bottom: 1px solid #333;
    }

    .photo-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: auto;
      cursor: pointer;
    }

    .profile-photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
      border: 3px solid #fff;
      display: block;
    }

    .photo-edit {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #fe2c55;
      border: 3px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    #photoInput {
      display: none;
    }

    .photo-help {
      color: #999;
      font-size: 12px;
      margin-top: 8px;
    }

    .name {
      font-size: 25px;
      margin: 14px 0 5px;
    }

    .handle {
      color: #999;
      margin-bottom: 12px;
    }

    .bio {
      color: #ddd;
      line-height: 1.5;
      max-width: 450px;
      margin: 10px auto;
    }

    .country {
      color: #999;
      font-size: 14px;
      margin-top: 10px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 22px 0;
    }

    .stat strong {
      display: block;
      font-size: 20px;
    }

    .stat span {
      color: #999;
      font-size: 13px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .main-btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 22px;
      background: #fff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    .friends-btn {
      background: #fe2c55;
      color: #fff;
    }

    .logout-btn {
      background: #222;
      color: #fff;
      border: 1px solid #555;
    }

    .edit-box {
      margin: 20px 15px;
      padding: 20px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 15px;
    }

    .edit-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .field input,
    .field textarea {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #444;
      outline: none;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    .field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .save-btn {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 12px;
      background: #fe2c55;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .save-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      text-align: center;
      min-height: 22px;
      margin: 12px 15px;
      color: #aaa;
      font-size: 14px;
    }

    .error {
      color: #ff6684;
    }

    .success {
      color: #4ade80;
    }

    .videos-title {
      padding: 18px 15px;
      font-size: 18px;
      font-weight: bold;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    .video-card {
      background: #111;
      aspect-ratio: 9 / 16;
      overflow: hidden;
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 20px;
      color: #888;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }

    @media (max-width: 500px) {
      .stats {
        gap: 25px;
      }

      .profile-photo,
      .photo-wrapper {
        width: 105px;
        height: 105px;
      }

      .name {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <button
      type="button"
      class="back-btn"
      id="backBtn"
    >
      ←
    </button>

    <div class="title">
      👤 My Profile
    </div>

  </header>


  <div
    id="loading"
    class="loading"
  >
    ⏳ Profile লোড হচ্ছে...
  </div>


  <main
    id="mainContainer"
    class="container"
    style="display:none;"
  >

    <section class="profile-header">

      <!-- PROFILE PHOTO -->
      <label
        class="photo-wrapper"
        for="photoInput"
        title="ছবি পরিবর্তন করুন"
      >

        <img
          id="profilePhoto"
          class="profile-photo"
          src="./images/profile.png"
          alt="Profile"
        >

        <span class="photo-edit">
          📷
        </span>

      </label>

      <input
        type="file"
        id="photoInput"
        accept="image/*"
      >

      <div class="photo-help">
        ছবিতে ক্লিক করে Profile Photo পরিবর্তন করুন
      </div>


      <h1
        id="profileName"
        class="name"
      >
        WWC User
      </h1>


      <div
        id="profileHandle"
        class="handle"
      >
        @wwc_user
      </div>


      <div
        id="profileBio"
        class="bio"
      >
        Welcome to WWC 🌍
      </div>


      <div
        id="profileCountry"
        class="country"
      ></div>


      <div class="stats">

        <div class="stat">
          <strong id="followers">
            0
          </strong>
          <span>
            Followers
          </span>
        </div>

        <div class="stat">
          <strong id="following">
            0
          </strong>
          <span>
            Following
          </span>
        </div>

        <div class="stat">
          <strong id="likes">
            0
          </strong>
          <span>
            Likes
          </span>
        </div>

      </div>


      <div class="buttons">

        <button
          type="button"
          class="main-btn friends-btn"
          id="friendsBtn"
        >
          👥 Friends
        </button>

        <button
          type="button"
          class="main-btn logout-btn"
          id="logoutBtn"
        >
          🚪 Logout
        </button>

      </div>

    </section>


    <!-- EDIT PROFILE -->

    <section class="edit-box">

      <div class="edit-title">
        ✏️ Edit Profile
      </div>


      <div class="field">

        <label>
          Name
        </label>

        <input
          type="text"
          id="nameInput"
          placeholder="আপনার নাম"
          maxlength="50"
        >

      </div>


      <div class="field">

        <label>
          Username
        </label>

        <input
          type="text"
          id="usernameInput"
          placeholder="username"
          maxlength="30"
        >

      </div>


      <div class="field">

        <label>
          Bio
        </label>

        <textarea
          id="bioInput"
          placeholder="আপনার সম্পর্কে লিখুন..."
          maxlength="200"
        ></textarea>

      </div>


      <div class="field">

        <label>
          Country
        </label>

        <input
          type="text"
          id="countryInput"
          placeholder="Bangladesh"
          maxlength="50"
        >

      </div>


      <button
        type="button"
        id="saveBtn"
        class="save-btn"
      >
        💾 Save Profile
      </button>

    </section>


    <div
      id="status"
      class="status"
    ></div>


    <!-- VIDEOS -->

    <div class="videos-title">
      🎬 My Videos
    </div>

    <section
      id="videoGrid"
      class="video-grid"
    ></section>

  </main>


  <script type="module">

    // ==========================================
    // FIREBASE IMPORT
    // ==========================================

    import {
      getApps,
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-storage.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

      authDomain:
        "world-wide-connect-62c87.firebaseapp.com",

      projectId:
        "world-wide-connect-62c87",

      storageBucket:
        "world-wide-connect-62c87.firebasestorage.app",

      messagingSenderId:
        "93178453668",

      appId:
        "1:93178453668:web:2184630caa8e61f7445031",

      measurementId:
        "G-PKFJ5NEMGQ"
    };


    // ==========================================
    // FIREBASE START
    // ==========================================

    const app =
      getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    const storage =
      getStorage(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const backBtn =
      document.getElementById("backBtn");

    const loading =
      document.getElementById("loading");

    const mainContainer =
      document.getElementById("mainContainer");

    const profilePhoto =
      document.getElementById("profilePhoto");

    const photoInput =
      document.getElementById("photoInput");

    const profileName =
      document.getElementById("profileName");

    const profileHandle =
      document.getElementById("profileHandle");

    const profileBio =
      document.getElementById("profileBio");

    const profileCountry =
      document.getElementById("profileCountry");

    const followers =
      document.getElementById("followers");

    const following =
      document.getElementById("following");

    const likes =
      document.getElementById("likes");

    const nameInput =
      document.getElementById("nameInput");

    const usernameInput =
      document.getElementById("usernameInput");

    const bioInput =
      document.getElementById("bioInput");

    const countryInput =
      document.getElementById("countryInput");

    const saveBtn =
      document.getElementById("saveBtn");

    const friendsBtn =
      document.getElementById("friendsBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const status =
      document.getElementById("status");

    const videoGrid =
      document.getElementById("videoGrid");


    // ==========================================
    // VARIABLES
    // ==========================================

    const defaultPhoto =
      "./images/profile.png";

    let currentUser =
      null;

    let currentProfile =
      {};


    // ==========================================
    // BACK
    // ==========================================

    backBtn.addEventListener(
      "click",
      () => {

        history.back();

      }
    );


    // ==========================================
    // STATUS
    // ==========================================

    function showStatus(
      text,
      type = ""
    ) {

      status.textContent =
        text;

      status.className =
        "status " + type;

    }


    // ==========================================
    // LOAD PROFILE
    // ==========================================

    async function loadProfile() {

      if (!currentUser) {
        return;
      }


      try {

        const userRef =
          doc(
            db,
            "users",
            currentUser.uid
          );


        const snapshot =
          await getDoc(
            userRef
          );


        if (snapshot.exists()) {

          currentProfile =
            snapshot.data();

        } else {

          currentProfile = {

            name:
              currentUser.displayName
              || "WWC User",

            username:
              "wwc_user",

            bio:
              "Welcome to WWC 🌍",

            country:
              "",

            photoURL:
              currentUser.photoURL
              || defaultPhoto,

            followers:
              0,

            following:
              0,

            likes:
              0,

            followingIds:
              [],

            followerIds:
              [],

            videos:
              []

          };


          await setDoc(
            userRef,
            currentProfile
          );

        }


        renderProfile();


      } catch (error) {

        console.error(
          "Profile load error:",
          error
        );


        loading.textContent =
          "❌ Profile লোড করা যায়নি।";

        loading.style.color =
          "#ff6684";

      }

    }


    // ==========================================
    // RENDER PROFILE
    // ==========================================

    function renderProfile() {

      const name =
        currentProfile.name
        || currentProfile.displayName
        || "WWC User";


      let username =
        currentProfile.username
        || "wwc_user";


      username =
        String(username)
          .replace(
            /^@/,
            ""
          );


      const bio =
        currentProfile.bio
        || "Welcome to WWC 🌍";


      const country =
        currentProfile.country
        || "";


      profileName.textContent =
        name;


      profileHandle.textContent =
        "@" + username;


      profileBio.textContent =
        bio;


      profileCountry.textContent =
        country
          ? "🌍 " + country
          : "";


      profilePhoto.src =
        currentProfile.photoURL
        || defaultPhoto;


      nameInput.value =
        name;


      usernameInput.value =
        username;


      bioInput.value =
        currentProfile.bio
        || "";


      countryInput.value =
        country;


      followers.textContent =
        Number(
          currentProfile.followers
          || 0
        );


      following.textContent =
        Number(
          currentProfile.following
          || 0
        );


      likes.textContent =
        Number(
          currentProfile.likes
          || 0
        );


      loading.style.display =
        "none";


      mainContainer.style.display =
        "block";


      renderVideos();

    }


    // ==========================================
    // SAVE PROFILE
    // ==========================================

    saveBtn.addEventListener(
      "click",
      async () => {

        if (!currentUser) {
          return;
        }


        const name =
          nameInput.value.trim();


        const username =
          usernameInput.value
            .trim()
            .replace(
              /^@/,
              ""
            );


        const bio =
          bioInput.value.trim();


        const country =
          countryInput.value.trim();


        if (!name) {

          showStatus(
            "❌ Name লিখুন।",
            "error"
          );

          return;

        }


        if (!username) {

          showStatus(
            "❌ Username লিখুন।",
            "error"
          );

          return;

        }


        saveBtn.disabled =
          true;


        showStatus(
          "⏳ Profile Save হচ্ছে..."
        );


        try {

          const userRef =
            doc(
              db,
              "users",
              currentUser.uid
            );


          await updateDoc(
            userRef,
            {

              name:
                name,

              username:
                username,

              bio:
                bio,

              country:
                country

            }
          );


          currentProfile.name =
            name;

          currentProfile.username =
            username;

          currentProfile.bio =
            bio;

          currentProfile.country =
            country;


          renderProfile();


          showStatus(
            "✅ Profile সফলভাবে Save হয়েছে।",
            "success"
          );


        } catch (error) {

          console.error(
            "Save profile error:",
            error
          );


          showStatus(
            "❌ Profile Save করা যায়নি।",
            "error"
          );

        }


        saveBtn.disabled =
          false;

      }
    );


    // ==========================================
    // CHANGE PROFILE PHOTO
    // ==========================================

    photoInput.addEventListener(
      "change",
      async () => {

        const file =
          photoInput.files[0];


        if (!file) {
          return;
        }


        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          showStatus(
            "❌ শুধু Image নির্বাচন করুন।",
            "error"
          );

          photoInput.value =
            "";

          return;

        }


        if (
          file.size >
          5 * 1024 * 1024
        ) {

          showStatus(
            "❌ ছবির সাইজ 5MB-এর কম হতে হবে।",
            "error"
          );

          photoInput.value =
            "";

          return;

        }


        try {

          showStatus(
            "⏳ Profile Photo Upload হচ্ছে..."
          );


          const storageRef =
            ref(
              storage,
              "profilePhotos/"
              +
              currentUser.uid
              +
              "/profile.jpg"
            );


          const uploadResult =
            await uploadBytes(
              storageRef,
              file,
              {
                contentType:
                  file.type
              }
            );


          const downloadURL =
            await getDownloadURL(
              uploadResult.ref
            );


          const userRef =
            doc(
              db,
              "users",
              currentUser.uid
            );


          await updateDoc(
            userRef,
            {

              photoURL:
                downloadURL

            }
          );


          currentProfile.photoURL =
            downloadURL;


          profilePhoto.src =
            downloadURL;


          showStatus(
            "✅ Profile Photo পরিবর্তন হয়েছে।",
            "success"
          );


        } catch (error) {

          console.error(
            "Photo upload error:",
            error
          );


          showStatus(
            "❌ Profile Photo Upload করা যায়নি।",
            "error"
          );

        }


        photoInput.value =
          "";

      }
    );


    // ==========================================
    // FRIENDS
    // ==========================================

    friendsBtn.addEventListener(
      "click",
      () => {

        window.location.href =
          "./friends.html";

      }
    );


    // ==========================================
    // LOGOUT
    // ==========================================

    logoutBtn.addEventListener(
      "click",
      async () => {

        logoutBtn.disabled =
          true;


        showStatus(
          "⏳ Logout হচ্ছে..."
        );


        try {

          await signOut(
            auth
          );


          window.location.href =
            "./login.html";


        } catch (error) {

          console.error(
            "Logout error:",
            error
          );


          showStatus(
            "❌ Logout করা যায়নি।",
            "error"
          );


          logoutBtn.disabled =
            false;

        }

      }
    );


    // ==========================================
    // RENDER VIDEOS
    // ==========================================

    function renderVideos() {

      videoGrid.innerHTML =
        "";


      const videos =
        Array.isArray(
          currentProfile.videos
        )
          ? currentProfile.videos
          : [];


      if (!videos.length) {

        videoGrid.innerHTML = `

          <div class="empty">

            🎬 এখনো কোনো Video Upload করেননি।

          </div>

        `;

        return;

      }


      videos.forEach(
        (videoItem) => {

          let videoUrl =
            "";


          if (
            typeof videoItem ===
            "string"
          ) {

            videoUrl =
              videoItem;

          } else if (
            videoItem
            &&
            typeof videoItem ===
            "object"
          ) {

            videoUrl =
              videoItem.url
              ||
              videoItem.videoURL
              ||
              videoItem.downloadURL
              ||
              "";

          }


          if (!videoUrl) {
            return;
          }


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "video-card";


          const video =
            document.createElement(
              "video"
            );


          video.src =
            videoUrl;

          video.controls =
            true;

          video.muted =
            true;

          video.playsInline =
            true;

          video.preload =
            "metadata";


          card.appendChild(
            video
          );


          videoGrid.appendChild(
            card
          );

        }
      );


      if (
        !videoGrid.children.length
      ) {

        videoGrid.innerHTML = `

          <div class="empty">

            🎬 কোনো Video পাওয়া যায়নি।

          </div>

        `;

      }

    }


    // ==========================================
    // AUTH
    // ==========================================

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          loading.textContent =
            "❌ আগে Login করুন।";


          setTimeout(
            () => {

              window.location.href =
                "./login.html";

            },
            1000
          );


          return;

        }


        currentUser =
          user;


        await loadProfile();

      }
    );

  </script>

</body>
</html>
