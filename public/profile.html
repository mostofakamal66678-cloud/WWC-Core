<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Profile · WWC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 30px;
    }
    
    /* ===== ব্যাক বাটন ===== */
    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #fff;
      font-size: 22px;
      background: rgba(255,255,255,0.1);
      border: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: background 0.2s;
      z-index: 10;
    }
    .back-btn:active {
      background: rgba(255,255,255,0.2);
      transform: scale(0.92);
    }
    
    /* ===== সেটিংস বাটন ===== */
    .settings-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      color: #fff;
      font-size: 20px;
      background: rgba(255,255,255,0.1);
      border: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      transition: background 0.2s;
      z-index: 10;
    }
    .settings-btn:active {
      background: rgba(255,255,255,0.2);
      transform: scale(0.92);
    }
    
    /* ===== প্রোফাইল সেকশন ===== */
    .profile-section {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }
    
    .profile-pic {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #888;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* ===== এডিট প্রোফাইল বাটন ===== */
    .edit-profile-btn {
      margin-top: 12px;
      padding: 8px 24px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: all 0.2s;
    }
    .edit-profile-btn:active {
      transform: scale(0.95);
      background: rgba(255,255,255,0.15);
    }
    
    .profile-name {
      font-size: 22px;
      font-weight: 700;
      margin-top: 4px;
    }
    
    .profile-username {
      font-size: 14px;
      color: #888;
      margin-top: 2px;
    }
    
    .profile-bio {
      font-size: 14px;
      color: #aaa;
      margin-top: 10px;
      text-align: center;
      line-height: 1.5;
      max-width: 90%;
    }
    
    /* ===== স্ট্যাটস ===== */
    .stats {
      display: flex;
      gap: 35px;
      margin: 20px 0 25px;
      padding: 15px 0;
      width: 100%;
      justify-content: center;
      border-top: 1px solid rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .stats div {
      text-align: center;
    }
    .stats .num {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .stats .label {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }
    
    /* ===== ভিডিও গ্রিড ===== */
    .video-grid-title {
      width: 100%;
      max-width: 400px;
      font-size: 16px;
      font-weight: 600;
      margin: 10px 0 15px;
      color: #aaa;
    }
    .video-grid-title span {
      color: #fff;
    }
    
    .video-grid {
      width: 100%;
      max-width: 400px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    
    .video-grid-item {
      aspect-ratio: 1 / 1;
      background: #1a1a1a;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #444;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .video-grid-item:active {
      transform: scale(0.96);
    }
    .video-grid-item img,
    .video-grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-grid-item .play-icon {
      position: absolute;
      font-size: 20px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .video-grid-item .views {
      position: absolute;
      bottom: 6px;
      left: 8px;
      font-size: 11px;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    /* ===== লোডিং ===== */
    .loading {
      color: #666;
      font-size: 14px;
      padding: 40px 0;
      text-align: center;
    }
    .loading i {
      margin-right: 8px;
    }
    
    /* ===== লগআউট ===== */
    .logout-btn {
      margin-top: 30px;
      padding: 12px 30px;
      border-radius: 12px;
      background: rgba(255,45,85,0.15);
      color: #ff2d55;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(255,45,85,0.2);
      cursor: pointer;
      transition: all 0.2s;
    }
    .logout-btn:active {
      transform: scale(0.95);
      background: rgba(255,45,85,0.25);
    }
    
    /* ===== অ্যানিমেশন ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .profile-section {
      animation: fadeIn 0.3s ease;
    }
    
    @media (min-width: 700px) {
      .profile-section { max-width: 500px; }
      .video-grid { max-width: 500px; }
      .video-grid-title { max-width: 500px; }
    }
  </style>
</head>
<body>

  <!-- নেভিগেশন বাটন -->
  <button class="back-btn" onclick="window.location.href='./index.html'">
    <i class="fas fa-arrow-left"></i>
  </button>
  <button class="settings-btn" onclick="showToast('Settings coming soon')">
    <i class="fas fa-cog"></i>
  </button>

  <!-- প্রোফাইল -->
  <div class="profile-section" id="profileSection">
    <div class="profile-pic" id="profilePic">
      <i class="fas fa-user"></i>
    </div>
    
    <div class="profile-name" id="profileName">Loading...</div>
    <div class="profile-username" id="profileUsername">@loading</div>
    <div class="profile-bio" id="profileBio">🌍 Welcome to World Wide Connect</div>
    
    <button class="edit-profile-btn" onclick="editProfile()">
      <i class="fas fa-pen" style="margin-right:6px;"></i>Edit Profile
    </button>
    
    <div class="stats">
      <div>
        <div class="num" id="followers">0</div>
        <div class="label">Followers</div>
      </div>
      <div>
        <div class="num" id="following">0</div>
        <div class="label">Following</div>
      </div>
      <div>
        <div class="num" id="likes">0</div>
        <div class="label">Likes</div>
      </div>
    </div>
  </div>

  <!-- ভিডিও গ্রিড -->
  <div class="video-grid-title">📹 <span>My Videos</span></div>
  <div class="video-grid" id="videoGrid">
    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading videos...</div>
  </div>

  <!-- লগআউট -->
  <button class="logout-btn" onclick="logout()">
    <i class="fas fa-sign-out-alt" style="margin-right:8px;"></i>Logout
  </button>

  <!-- টোস্ট মেসেজ -->
  <div id="toast" style="
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30,30,30,0.95);
    color: #fff;
    padding: 10px 22px;
    border-radius: 22px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 1000;
    white-space: nowrap;
  "></div>

  <script type="module">
    import { 
      getAuth, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
    
    import { 
      initializeApp, 
      getApps 
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      collection, 
      getDocs, 
      query, 
      where, 
      orderBy, 
      limit 
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    // ===== Firebase Config =====
    const firebaseConfig = {
      apiKey: "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",
      authDomain: "world-wide-connect-62c87.firebaseapp.com",
      projectId: "world-wide-connect-62c87",
      storageBucket: "world-wide-connect-62c87.firebasestorage.app",
      messagingSenderId: "93178453668",
      appId: "1:93178453668:web:2184630caa8e61f7445031"
    };

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const defaultPhoto = "./images/profile.png";
    let currentUserData = null;

    // ===== টোস্ট =====
    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(20px)';
      }, 2000);
    }
    window.showToast = showToast;

    // ===== লগআউট =====
    window.logout = async function() {
      try {
        await signOut(auth);
        showToast('✅ Logged out successfully');
        setTimeout(() => {
          window.location.href = './auth.html';
        }, 500);
      } catch (e) {
        console.error('Logout error:', e);
        showToast('❌ Logout failed');
      }
    };

    // ===== এডিট প্রোফাইল =====
    window.editProfile = function() {
      showToast('✏️ Edit profile coming soon');
    };

    // ===== ভিডিও লোড =====
    async function loadUserVideos(uid) {
      const grid = document.getElementById('videoGrid');
      
      try {
        const q = query(
          collection(db, 'videos'),
          where('uid', '==', uid),
          orderBy('createdAt', 'desc'),
          limit(9)
        );
        
        const snap = await getDocs(q);
        grid.innerHTML = '';
        
        if (snap.empty) {
          grid.innerHTML = `
            <div style="grid-column:1/-1;text-align:center;color:#555;padding:40px 0;font-size:14px;">
              <i class="fas fa-video" style="font-size:30px;display:block;margin-bottom:10px;color:#333;"></i>
              No videos yet
            </div>
          `;
          return;
        }
        
        snap.forEach(doc => {
          const data = doc.data();
          const div = document.createElement('div');
          div.className = 'video-grid-item';
          div.style.position = 'relative';
          div.style.background = '#1a1a1a';
          
          // থাম্বনেইল বা প্লেসহোল্ডার
          const thumb = data.thumbnail || data.photoURL || '';
          if (thumb) {
            div.innerHTML = `
              <img src="${thumb}" alt="Video" onerror="this.style.display='none'">
              <div class="play-icon" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);"><i class="fas fa-play-circle"></i></div>
              <div class="views"><i class="fas fa-eye"></i> ${data.views || 0}</div>
            `;
          } else {
            div.innerHTML = `
              <div style="display:flex;flex-direction:column;align-items:center;color:#555;">
                <i class="fas fa-video" style="font-size:24px;"></i>
                <span style="font-size:10px;margin-top:4px;">${data.caption ? data.caption.substring(0,10) : 'Video'}</span>
              </div>
            `;
          }
          
          div.addEventListener('click', () => {
            window.location.href = `./index.html?video=${doc.id}`;
          });
          
          grid.appendChild(div);
        });
        
      } catch (e) {
        console.error('Load videos error:', e);
        grid.innerHTML = `
          <div style="grid-column:1/-1;text-align:center;color:#666;padding:20px;font-size:13px;">
            <i class="fas fa-exclamation-circle" style="margin-right:6px;"></i>
            Could not load videos
          </div>
        `;
      }
    }

    // ===== প্রোফাইল লোড =====
    async function loadProfile(user) {
      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        
        if (snap.exists()) {
          const data = snap.data();
          currentUserData = data;
          
          document.getElementById('profileName').textContent = data.name || 'WWC User';
          document.getElementById('profileUsername').textContent = '@' + (data.username || 'wwc_user');
          document.getElementById('profileBio').textContent = data.bio || '🌍 Welcome to World Wide Connect';
          document.getElementById('followers').textContent = formatNumber(data.followers || 0);
          document.getElementById('following').textContent = formatNumber(data.following || 0);
          document.getElementById('likes').textContent = formatNumber(data.likes || 0);
          
          // প্রোফাইল পিকচার
          const pic = document.getElementById('profilePic');
          if (data.photoURL && data.photoURL !== defaultPhoto) {
            pic.innerHTML = `<img src="${data.photoURL}" alt="Profile" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-user\\'></i>'">`;
          } else {
            pic.innerHTML = '<i class="fas fa-user"></i>';
          }
          
          // ইউজারের ভিডিও লোড
          await loadUserVideos(user.uid);
        } else {
          document.getElementById('profileName').textContent = 'Set up profile';
          document.getElementById('profileUsername').textContent = '@' + user.uid.substring(0,8);
        }
      } catch (e) {
        console.error('Profile load error:', e);
        document.getElementById('profileName').textContent = 'Error loading profile';
      }
    }

    function formatNumber(num) {
      num = Number(num) || 0;
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return String(num);
    }

    // ===== AUTH =====
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        document.getElementById('profileName').textContent = 'Not Logged In';
        document.getElementById('profileUsername').textContent = '@guest';
        document.getElementById('videoGrid').innerHTML = `
          <div style="grid-column:1/-1;text-align:center;color:#555;padding:40px 0;">
            <i class="fas fa-lock" style="font-size:30px;display:block;margin-bottom:10px;color:#333;"></i>
            <a href="./auth.html" style="color:#4f46e5;text-decoration:none;">Login to see your videos</a>
          </div>
        `;
        return;
      }
      
      await loadProfile(user);
    });

    console.log('✅ Profile page loaded');
  </script>
</body>
</html>,
