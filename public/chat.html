"chat.html"

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>WWC Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .chat-app {
      height: 100vh;
      max-width: 700px;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    /* HEADER */

    .chat-header {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: #111;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    .chat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
      border: 1px solid #555;
    }

    .chat-user-info {
      flex: 1;
      min-width: 0;
    }

    .chat-name {
      font-size: 16px;
      font-weight: bold;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .chat-handle {
      color: #999;
      font-size: 12px;
      margin-top: 3px;
    }

    /* MESSAGES */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    .loading,
    .empty {
      text-align: center;
      color: #888;
      padding: 35px 15px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.theirs {
      justify-content: flex-start;
    }

    .message-bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 18px;
      line-height: 1.4;
      font-size: 15px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .mine .message-bubble {
      background: #fe2c55;
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .theirs .message-bubble {
      background: #242424;
      color: #fff;
      border-bottom-left-radius: 5px;
    }

    .message-time {
      display: block;
      font-size: 10px;
      opacity: .65;
      margin-top: 4px;
      text-align: right;
    }

    /* INPUT */

    .input-area {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      padding: 10px;
      background: #111;
      border-top: 1px solid #333;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      flex-shrink: 0;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      max-height: 120px;
      resize: none;
      border: 1px solid #444;
      border-radius: 22px;
      background: #1c1c1c;
      color: #fff;
      outline: none;
      padding: 11px 15px;
      font-size: 15px;
      font-family: inherit;
    }

    #messageInput:focus {
      border-color: #777;
    }

    #sendBtn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: #fe2c55;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #sendBtn:disabled {
      opacity: .5;
      cursor: wait;
    }

    .error {
      color: #ff6684;
      text-align: center;
      padding: 30px 15px;
    }
  </style>
</head>

<body>

  <div class="chat-app">

    <!-- HEADER -->

    <header class="chat-header">

      <button
        id="backBtn"
        class="back-btn"
        type="button"
        aria-label="Back"
      >
        ←
      </button>

      <img
        id="chatAvatar"
        class="chat-avatar"
        src="./images/profile.png"
        alt="Profile"
      >

      <div class="chat-user-info">

        <div
          id="chatName"
          class="chat-name"
        >
          Loading...
        </div>

        <div
          id="chatHandle"
          class="chat-handle"
        >
          @wwc_user
        </div>

      </div>

    </header>


    <!-- MESSAGES -->

    <main
      id="messages"
      class="messages"
    >

      <div class="loading">
        ⏳ Chat লোড হচ্ছে...
      </div>

    </main>


    <!-- INPUT -->

    <form
      id="inputArea"
      class="input-area"
    >

      <textarea
        id="messageInput"
        rows="1"
        maxlength="2000"
        placeholder="Message লিখুন..."
        autocomplete="off"
      ></textarea>

      <button
        id="sendBtn"
        type="submit"
        aria-label="Send"
      >
        ➤
      </button>

    </form>

  </div>


  <script type="module">

    /* ==========================================
       FIREBASE IMPORT
       ========================================== */

    import {
      getApps,
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


    import {
      getFirestore,
      doc,
      getDoc,
      collection,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


    /* ==========================================
       FIREBASE CONFIG
       ========================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

      authDomain:
        "world-wide-connect-62c87.firebaseapp.com",

      projectId:
        "world-wide-connect-62c87",

      storageBucket:
        "world-wide-connect-62c87.firebasestorage.app",

      messagingSenderId:
        "93178453668",

      appId:
        "1:93178453668:web:2184630caa8e61f7445031",

      measurementId:
        "G-PKFJ5NEMGQ"
    };


    /* ==========================================
       FIREBASE START
       ========================================== */

    const app =
      getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    /* ==========================================
       ELEMENTS
       ========================================== */

    const backBtn =
      document.getElementById("backBtn");

    const chatAvatar =
      document.getElementById("chatAvatar");

    const chatName =
      document.getElementById("chatName");

    const chatHandle =
      document.getElementById("chatHandle");

    const messages =
      document.getElementById("messages");

    const inputArea =
      document.getElementById("inputArea");

    const messageInput =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");


    /* ==========================================
       VARIABLES
       ========================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const targetUid =
      params.get("uid");


    const defaultPhoto =
      "./images/profile.png";


    let currentUser =
      null;


    let targetProfile =
      {};


    let unsubscribeMessages =
      null;


    /* ==========================================
       BACK BUTTON
       ========================================== */

    backBtn.addEventListener(
      "click",
      () => {
        history.back();
      }
    );


    /* ==========================================
       ESCAPE HTML
       ========================================== */

    function escapeHtml(value) {

      return String(value || "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ==========================================
       FORMAT TIME
       ========================================== */

    function formatTime(timestamp) {

      if (!timestamp) {
        return "";
      }


      try {

        const date =
          timestamp.toDate
            ? timestamp.toDate()
            : new Date(timestamp);


        return date.toLocaleTimeString(
          "bn-BD",
          {
            hour: "numeric",
            minute: "2-digit"
          }
        );

      } catch {

        return "";

      }

    }


    /* ==========================================
       LOAD TARGET PROFILE
       ========================================== */

    async function loadTargetProfile() {

      if (!targetUid) {

        showError(
          "❌ User ID পাওয়া যায়নি।"
        );

        return false;

      }


      if (
        targetUid ===
        currentUser.uid
      ) {

        showError(
          "❌ নিজের সাথে Chat করা যাবে না।"
        );

        return false;

      }


      try {

        const userRef =
          doc(
            db,
            "users",
            targetUid
          );


        const snapshot =
          await getDoc(
            userRef
          );


        if (!snapshot.exists()) {

          showError(
            "❌ এই User পাওয়া যায়নি।"
          );

          return false;

        }


        targetProfile =
          snapshot.data();


        const name =
          targetProfile.name
          ||
          targetProfile.displayName
          ||
          "WWC User";


        let username =
          targetProfile.username
          ||
          "wwc_user";


        username =
          String(username)
            .replace(
              /^@/,
              ""
            );


        chatName.textContent =
          name;


        chatHandle.textContent =
          "@" + username;


        chatAvatar.src =
          targetProfile.photoURL
          ||
          defaultPhoto;


        return true;


      } catch (error) {

        console.error(
          "Target profile error:",
          error
        );


        showError(
          "❌ User Profile লোড করা যায়নি।"
        );


        return false;

      }

    }


    /* ==========================================
       CHAT ID
       ========================================== */

    function getChatId() {

      const ids = [

        currentUser.uid,

        targetUid

      ].sort();


      return ids.join("_");

    }


    /* ==========================================
       LOAD MESSAGES
       ========================================== */

    function loadMessages() {

      if (
        !currentUser
        ||
        !targetUid
      ) {

        return;

      }


      const chatId =
        getChatId();


      const messagesRef =
        collection(
          db,
          "chats",
          chatId,
          "messages"
        );


      const messagesQuery =
        query(
          messagesRef,
          orderBy(
            "createdAt",
            "asc"
          )
        );


      unsubscribeMessages =
        onSnapshot(
          messagesQuery,

          (snapshot) => {

            messages.innerHTML =
              "";


            if (
              snapshot.empty
            ) {

              messages.innerHTML = `

                <div class="empty">

                  💬 এখনো কোনো Message নেই।<br>
                  প্রথম Message পাঠান।

                </div>

              `;

              return;

            }


            snapshot.forEach(
              (messageDoc) => {

                const data =
                  messageDoc.data();


                const mine =
                  data.senderId ===
                  currentUser.uid;


                const row =
                  document.createElement(
                    "div"
                  );


                row.className =
                  "message-row " +
                  (
                    mine
                      ? "mine"
                      : "theirs"
                  );


                const bubble =
                  document.createElement(
                    "div"
                  );


                bubble.className =
                  "message-bubble";


                bubble.innerHTML = `

                  ${escapeHtml(
                    data.text
                  )}

                  <span class="message-time">

                    ${formatTime(
                      data.createdAt
                    )}

                  </span>

                `;


                row.appendChild(
                  bubble
                );


                messages.appendChild(
                  row
                );

              }
            );


            messages.scrollTop =
              messages.scrollHeight;

          },

          (error) => {

            console.error(
              "Messages error:",
              error
            );


            showError(
              "❌ Message লোড করা যায়নি।"
            );

          }
        );

    }


    /* ==========================================
       SEND MESSAGE
       ========================================== */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) {
        return;
      }


      if (
        !currentUser
        ||
        !targetUid
      ) {

        return;

      }


      sendBtn.disabled =
        true;


      try {

        const chatId =
          getChatId();


        const messagesRef =
          collection(
            db,
            "chats",
            chatId,
            "messages"
          );


        await addDoc(
          messagesRef,
          {

            senderId:
              currentUser.uid,

            receiverId:
              targetUid,

            text:
              text,

            createdAt:
              serverTimestamp()

          }
        );


        messageInput.value =
          "";


        messageInput.style.height =
          "auto";


        messageInput.focus();


      } catch (error) {

        console.error(
          "Send message error:",
          error
        );


        alert(
          "❌ Message পাঠানো যায়নি।"
        );

      }


      sendBtn.disabled =
        false;

    }


    /* ==========================================
       SEND FORM
       ========================================== */

    inputArea.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        await sendMessage();

      }
    );


    /* ==========================================
       ENTER KEY
       ========================================== */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
          &&
          !event.shiftKey
        ) {

          event.preventDefault();

          inputArea.requestSubmit();

        }

      }
    );


    /* ==========================================
       AUTO RESIZE TEXTAREA
       ========================================== */

    messageInput.addEventListener(
      "input",
      () => {

        messageInput.style.height =
          "auto";


        messageInput.style.height =
          Math.min(
            messageInput.scrollHeight,
            120
          ) + "px";

      }
    );


    /* ==========================================
       ERROR
       ========================================== */

    function showError(text) {

      messages.innerHTML = `

        <div class="error">

          ${escapeHtml(text)}

        </div>

      `;

    }


    /* ==========================================
       AUTH
       ========================================== */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          showError(
            "❌ আগে Login করুন।"
          );


          setTimeout(
            () => {

              window.location.href =
                "./login.html";

            },
            1200
          );


          return;

        }


        currentUser =
          user;


        const loaded =
          await loadTargetProfile();


        if (loaded) {

          loadMessages();

        }

      }
    );


    /* ==========================================
       CLEANUP
       ========================================== */

    window.addEventListener(
      "beforeunload",
      () => {

        if (
          unsubscribeMessages
        ) {

          unsubscribeMessages();

        }

      }
    );

  </script>

</body>
</html>
