
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এক্সপ্লোর - WWC</title>
    <style>
        /* টিকটক স্টাইল */
        .explore-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            padding: 3px;
        }
        .explore-item {
            aspect-ratio: 9/16;
            background: #111;
            overflow: hidden;
            border-radius: 4px;
            position: relative;
        }
        .explore-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .explore-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="top"><h1>এক্সপ্লোর</h1></div>
    <div class="explore-grid" id="explore-grid"></div>
    <!-- নেভবার -->
    <script>
        // ট্রেন্ডিং ভিডিও লোড
        db.collection('videos')
            .orderBy('likes', 'desc')
            .limit(30)
            .get()
            .then(snap => {
                const grid = document.getElementById('explore-grid');
                snap.forEach(doc => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.className = 'explore-item';
                    item.innerHTML = `
                        <video src="${data.videoUrl}" muted loop playsinline></video>
                        <div class="overlay">❤️ ${data.likes || 0}</div>
                    `;
                    grid.appendChild(item);
                });
            });
    </script>
</body>
</html>
