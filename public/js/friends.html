<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Friends · WWC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-top: 60px;
            padding-bottom: 80px;
            min-height: 100vh;
        }
        .friends-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 16px;
        }
        .friends-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
        }
        .friends-header h1 {
            font-size: 22px;
            font-weight: 700;
        }
        .friends-header h1 i {
            color: #25f4ee;
            margin-right: 8px;
        }
        .friends-tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #222;
            margin-bottom: 16px;
        }
        .friends-tabs .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            background: none;
            border: 0;
            cursor: pointer;
            position: relative;
        }
        .friends-tabs .tab.active {
            color: #fff;
        }
        .friends-tabs .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: #fff;
            border-radius: 3px;
        }
        .friend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #141414;
        }
        .friend-item img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: #222;
            cursor: pointer;
        }
        .friend-item .info {
            flex: 1;
            cursor: pointer;
        }
        .friend-item .info .name {
            font-weight: 600;
            font-size: 15px;
        }
        .friend-item .info .username {
            font-size: 12px;
            color: #888;
        }
        .friend-item .follow-btn {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
        }
        .friend-item .follow-btn:active {
            transform: scale(0.95);
        }
        .empty-state {
            text-align: center;
            color: #666;
            padding: 50px 0;
        }
        .empty-state i {
            font-size: 50px;
            color: #333;
            display: block;
            margin-bottom: 15px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            color: #888;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            gap: 2px;
            flex: 1;
            cursor: pointer;
            background: none;
            border: 0;
        }
        .nav-item i {
            font-size: 22px;
        }
        .nav-item.active {
            color: #fff;
        }
        .nav-item.upload-btn {
            background: linear-gradient(45deg, #fe2c55, #25f4ee);
            width: 48px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            flex: 0 0 auto;
            margin: 0 6px;
        }
        .nav-item.upload-btn i {
            font-size: 20px;
            color: #000;
        }
        .back-btn {
            color: #fff;
            font-size: 22px;
            background: none;
            border: 0;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<!-- টপ বার -->
<div style="position:fixed;top:0;left:0;right:0;z-index:100;height:50px;display:flex;align-items:center;padding:0 16px;background:rgba(0,0,0,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.06)">
    <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
    <span style="font-size:17px;font-weight:700;flex:1;text-align:center;">বন্ধু</span>
    <div style="width:40px;"></div>
</div>

<div class="friends-container">
    <div class="friends-header">
        <h1><i class="fas fa-user-friends"></i>বন্ধু</h1>
        <button style="color:#888;background:none;border:0;font-size:18px;cursor:pointer;" onclick="showToast('🔍 খুঁজুন')"><i class="fas fa-search"></i></button>
    </div>

    <div class="friends-tabs">
        <button class="tab active" data-tab="following">Following</button>
        <button class="tab" data-tab="followers">Followers</button>
        <button class="tab" data-tab="suggested">Suggested</button>
    </div>

    <div id="friends-list">
        <div class="empty-state">
            <i class="fas fa-user-plus"></i>
            <div style="font-size:16px;color:#888;">কাউকে Follow করুন</div>
            <div style="font-size:13px;color:#555;">বন্ধুরা এখানে দেখাবে</div>
        </div>
    </div>
</div>

<!-- বটম নেভ -->
<nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>হোম</span></a>
    <a href="friends.html" class="nav-item active"><i class="fas fa-user-friends"></i><span>বন্ধু</span></a>
    <a href="upload.html" class="nav-item upload-btn"><i class="fas fa-plus"></i></a>
    <a href="inbox.html" class="nav-item"><i class="fas fa-message"></i><span>ইনবক্স</span></a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>প্রোফাইল</span></a>
</nav>

<script>
// Firebase ইতিমধ্যে initialized
const friendsList = document.getElementById('friends-list');
let currentUser = null;

auth.onAuthStateChanged(async (user) => {
    if (!user) { window.location.href = 'auth.html'; return; }
    currentUser = user;
    await loadFriends();
});

async function loadFriends() {
    try {
        // Get user's following list
        const userDoc = await db.collection('users').doc(currentUser.uid).get();
        if (!userDoc.exists) return;
        const userData = userDoc.data();
        const followingIds = userData.followingIds || [];

        if (!followingIds.length) {
            friendsList.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-user-plus"></i>
                    <div style="font-size:16px;color:#888;">আপনি কাউকে Follow করেননি</div>
                    <div style="font-size:13px;color:#555;">ইউজারদের ফলো করুন</div>
                </div>
            `;
            return;
        }

        // Load each following user's data
        let html = '';
        for (const uid of followingIds) {
            try {
                const doc = await db.collection('users').doc(uid).get();
                if (doc.exists) {
                    const data = doc.data();
                    html += `
                        <div class="friend-item">
                            <img src="${data.photoURL || './images/profile.png'}" onerror="this.src='./images/profile.png'" onclick="window.location.href='profile.html?uid=${uid}'">
                            <div class="info" onclick="window.location.href='profile.html?uid=${uid}'">
                                <div class="name">${data.name || 'WWC User'}</div>
                                <div class="username">@${data.username || 'user'}</div>
                            </div>
                            <button class="follow-btn" onclick="unfollowUser('${uid}', this)">Following</button>
                        </div>
                    `;
                }
            } catch(e) {}
        }

        if (!html) {
            friendsList.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-user-slash"></i>
                    <div style="font-size:16px;color:#888;">কোনো বন্ধু পাওয়া যায়নি</div>
                </div>
            `;
        } else {
            friendsList.innerHTML = html;
        }
    } catch (e) {
        console.error('Friends load error:', e);
        friendsList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><div style="font-size:16px;color:#888;">লোড করতে ব্যর্থ হয়েছে</div></div>';
    }
}

async function unfollowUser(uid, btn) {
    if (!currentUser) return;
    btn.textContent = '...';
    btn.disabled = true;

    try {
        const followRef = db.collection('follows').doc(`${currentUser.uid}_${uid}`);
        await followRef.delete();

        // Update user's following list
        const userRef = db.collection('users').doc(currentUser.uid);
        await userRef.update({
            followingIds: firebase.firestore.FieldValue.arrayRemove(uid)
        });

        btn.closest('.friend-item').remove();
        showToast('আনফলো করা হয়েছে');
    } catch (e) {
        console.error('Unfollow error:', e);
        btn.textContent = 'Following';
        btn.disabled = false;
    }
}

// Tabs
document.querySelectorAll('.friends-tabs .tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.friends-tabs .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        loadFriends();
    });
});

function showToast(msg) {
    let toast = document.getElementById('toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast';
        toast.style.cssText = `
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(30,30,30,0.95); color: #fff; padding: 10px 24px;
            border-radius: 24px; font-size: 14px; z-index: 999;
            opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none; white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        `;
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = '1';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 2000);
}
</script>

</body>
</html>
