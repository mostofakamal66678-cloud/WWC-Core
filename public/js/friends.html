<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>বন্ধু - WWC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding-bottom:70px; }
        .top { position:sticky; top:0; z-index:50; background:#000; padding:12px 16px; border-bottom:1px solid #222; text-align:center; }
        .top h1 { font-size:18px; font-weight:700; }
        .tabs { display:flex; border-bottom:1px solid #222; }
        .tab { flex:1; text-align:center; padding:12px; color:#888; font-size:14px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; }
        .tab.active { color:#fff; border-bottom-color:#fe2c55; }
        .user-row { display:flex; align-items:center; padding:12px 16px; gap:12px; border-bottom:1px solid #111; }
        .user-row img { width:48px; height:48px; border-radius:50%; object-fit:cover; flex-shrink:0; }
        .user-row .info { flex:1; min-width:0; cursor:pointer; }
        .user-row .username { font-weight:600; font-size:15px; }
        .user-row .name { font-size:13px; color:#888; margin-top:2px; }
        .user-row button { padding:8px 18px; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; }
        .user-row .follow-btn { background:#fe2c55; color:#fff; }
        .user-row .follow-btn.following { background:#2a2a2a; color:#fff; }
        .empty { text-align:center; color:#666; padding:60px 20px; font-size:14px; line-height:1.6; }
        .empty i { font-size:48px; margin-bottom:16px; display:block; opacity:0.4; }
        .bottom-nav { position:fixed; bottom:0; left:0; right:0; height:60px; background:#000; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #222; z-index:100; padding-bottom:env(safe-area-inset-bottom); }
        .nav-item { color:#888; text-decoration:none; display:flex; flex-direction:column; align-items:center; font-size:11px; gap:3px; flex:1; }
        .nav-item i { font-size:22px; }
        .nav-item.active { color:#fff; }
        .nav-item.upload-btn { background:linear-gradient(45deg,#fe2c55,#25f4ee); width:48px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#000; flex:0 0 auto; margin:0 6px; }
        .nav-item.upload-btn i { font-size:20px; color:#000; }
    </style>
</head>
<body>
    <div class="top"><h1>বন্ধু</h1></div>
    <div class="tabs">
        <div class="tab active" data-tab="following">Following</div>
        <div class="tab" data-tab="followers">Followers</div>
        <div class="tab" data-tab="suggested">সাজেস্টেড</div>
    </div>
    <div id="user-list">
        <div class="empty"><i class="fas fa-users"></i>লোড হচ্ছে...</div>
    </div>

    <nav class="bottom-nav">
        <a href="../../index.html" class="nav-item"><i class="fas fa-home"></i><span>হোম</span></a>
        <a href="friends.html" class="nav-item active"><i class="fas fa-users"></i><span>বন্ধু</span></a>
        <a href="upload.html" class="nav-item upload-btn"><i class="fas fa-plus"></i></a>
        <a href="inbox.html" class="nav-item"><i class="fas fa-message"></i><span>ইনবক্স</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let currentUser = null;
        let currentTab = 'following';
        let myFollowingIds = new Set();

        auth.onAuthStateChanged(user => {
            if (!user) { location.href = 'auth.html'; return; }
            currentUser = user;
            loadMyFollowingSet().then(() => loadTab('following'));
        });

        document.querySelectorAll('.tab').forEach(t => {
            t.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                currentTab = t.dataset.tab;
                loadTab(currentTab);
            });
        });

        async function loadMyFollowingSet() {
            myFollowingIds = new Set();
            try {
                const snap = await db.collection('follows').where('follower', '==', currentUser.uid).get();
                snap.forEach(doc => myFollowingIds.add(doc.data().following));
            } catch (e) { console.error('ফলোয়িং সেট লোড সমস্যা:', e); }
        }

        function avatarUrl(u) {
            return u.photoURL || u.avatar || u.userAvatar ||
                'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.username || 'W') + '&background=25f4ee&color=000&bold=true';
        }

        async function fetchUsersByIds(ids) {
            const users = [];
            for (const uid of ids) {
                try {
                    const doc = await db.collection('users').doc(uid).get();
                    if (doc.exists) users.push({ uid, ...doc.data() });
                } catch (e) {}
            }
            return users;
        }

        async function loadTab(tab) {
            const list = document.getElementById('user-list');
            list.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i>লোড হচ্ছে...</div>';

            try {
                let users = [];

                if (tab === 'following') {
                    const snap = await db.collection('follows').where('follower', '==', currentUser.uid).get();
                    const ids = snap.docs.map(d => d.data().following).filter(Boolean);
                    users = await fetchUsersByIds(ids);
                } else if (tab === 'followers') {
                    const snap = await db.collection('follows').where('following', '==', currentUser.uid).get();
                    const ids = snap.docs.map(d => d.data().follower).filter(Boolean);
                    users = await fetchUsersByIds(ids);
                } else if (tab === 'suggested') {
                    const snap = await db.collection('users').limit(30).get();
                    snap.forEach(doc => {
                        if (doc.id !== currentUser.uid && !myFollowingIds.has(doc.id)) {
                            users.push({ uid: doc.id, ...doc.data() });
                        }
                    });
                    users = users.slice(0, 20);
                }

                if (!users.length) {
                    const msgs = {
                        following: 'আপনি এখনো কাউকে ফলো করেননি',
                        followers: 'এখনো কোনো ফলোয়ার নেই',
                        suggested: 'এখন কোনো সাজেশন নেই'
                    };
                    list.innerHTML = `<div class="empty"><i class="fas fa-users"></i>${msgs[tab]}</div>`;
                    return;
                }

                list.innerHTML = '';
                users.forEach(u => {
                    const isFollowing = myFollowingIds.has(u.uid);
                    const row = document.createElement('div');
                    row.className = 'user-row';
                    row.innerHTML = `
                        <img src="${avatarUrl(u)}" alt="avatar">
                        <div class="info">
                            <div class="username">@${escapeHtml(u.username || 'user')}</div>
                            <div class="name">${escapeHtml(u.name || '')}</div>
                        </div>
                        ${u.uid === currentUser.uid ? '' : `<button class="follow-btn ${isFollowing ? 'following' : ''}" data-uid="${u.uid}">${isFollowing ? 'ফলোয়িং' : 'ফলো'}</button>`}
                    `;
                    row.querySelector('.info').addEventListener('click', () => {
                        window.location.href = `profile.html?uid=${u.uid}`;
                    });
                    const btn = row.querySelector('.follow-btn');
                    if (btn) {
                        btn.addEventListener('click', () => toggleFollow(u.uid, btn));
                    }
                    list.appendChild(row);
                });
            } catch (e) {
                console.error('লিস্ট লোড সমস্যা:', e);
                list.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle"></i>লোড করতে সমস্যা হয়েছে</div>`;
            }
        }

        async function toggleFollow(targetUid, btn) {
            const followId = `${currentUser.uid}_${targetUid}`;
            const ref = db.collection('follows').doc(followId);
            const isFollowing = myFollowingIds.has(targetUid);
            try {
                if (isFollowing) {
                    await ref.delete();
                    myFollowingIds.delete(targetUid);
                    btn.textContent = 'ফলো';
                    btn.classList.remove('following');
                } else {
                    await ref.set({ follower: currentUser.uid, following: targetUid, createdAt: Date.now() });
                    myFollowingIds.add(targetUid);
                    btn.textContent = 'ফলোয়িং';
                    btn.classList.add('following');

                    db.collection('notifications').add({
                        toUserId: targetUid,
                        fromUserId: currentUser.uid,
                        fromUsername: currentUser.displayName || 'user',
                        type: 'follow',
                        read: false,
                        createdAt: Date.now()
                    }).catch(() => {});
                }
                if (currentTab === 'following') loadTab('following');
            } catch (e) {
                console.error('ফলো সমস্যা:', e);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
