<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>WWC · Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;padding:20px}
    .auth-container{width:100%;max-width:420px;background:rgba(20,20,25,0.95);border-radius:28px;padding:40px 28px 32px;border:1px solid rgba(255,255,255,0.06);box-shadow:0 20px 60px rgba(0,0,0,0.6)}
    .logo{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#25f4ee,#fe2c55);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;box-shadow:0 8px 30px rgba(37,244,238,0.2)}
    h1{text-align:center;font-size:24px;font-weight:800;color:#fff}
    .subtitle{text-align:center;color:#888;font-size:14px;margin-top:4px;margin-bottom:28px}
    .google-btn{width:100%;padding:14px;border-radius:14px;background:#fff;color:#222;font-size:15px;font-weight:700;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}
    .google-btn:active{transform:scale(0.97)}
    .google-btn:disabled{opacity:0.5;cursor:not-allowed}
    .divider{display:flex;align-items:center;gap:12px;margin:14px 0 20px;color:#555;font-size:12px}
    .divider::before,.divider::after{content:"";flex:1;height:1px;background:#2a2a2a}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:12px;font-weight:600;color:#888;margin-bottom:5px}
    .form-group input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #2a2a2a;background:#111;color:#fff;font-size:15px;outline:none;transition:border-color .2s}
    .form-group input:focus{border-color:#25f4ee}
    .form-group input::placeholder{color:#555}
    .auth-btn{width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,#25f4ee,#fe2c55);color:#fff;font-size:16px;font-weight:700;border:0;cursor:pointer;transition:all .15s;margin-top:6px}
    .auth-btn:active{transform:scale(0.97)}
    .auth-btn:disabled{opacity:0.5;cursor:not-allowed}
    .auth-btn .spinner{display:none;width:22px;height:22px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
    .auth-btn.loading .spinner{display:block}
    .auth-btn.loading .btn-text{display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    .mode-toggle{text-align:center;margin-top:18px;color:#888;font-size:14px}
    .mode-toggle button{background:none;border:0;color:#25f4ee;font-weight:700;font-size:14px;cursor:pointer;padding:4px 8px}
    .mode-toggle button:active{color:#fe2c55}
    .message{min-height:24px;text-align:center;font-size:13px;margin-top:14px;padding:8px 12px;border-radius:10px;display:none}
    .message.show{display:block}
    .message.success{color:#25f4ee;background:rgba(37,244,238,0.08)}
    .message.error{color:#fe2c55;background:rgba(254,44,85,0.08)}
    .back-home{display:block;text-align:center;color:#555;font-size:13px;margin-top:16px;text-decoration:none}
    .back-home:hover{color:#fff}
    .name-group{display:none;animation:slideDown .25s ease}
    @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    .name-group.show{display:block}
  </style>
</head>
<body>
<div class="auth-container">
  <div class="logo">🌍</div>
  <h1>World Wide Connect</h1>
  <p class="subtitle" id="subtitle">Sign in to continue</p>

  <button class="google-btn" id="googleBtn"><i class="fab fa-google" style="font-size:20px;"></i>Continue with Google</button>

  <div class="divider">or</div>

  <form id="authForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="Enter your email" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="Min 6 characters" autocomplete="current-password" minlength="6" required>
    </div>
    <div class="form-group name-group" id="nameGroup">
      <label>Name</label>
      <input type="text" id="nameInput" placeholder="Your name" autocomplete="name" maxlength="50">
    </div>
    <button class="auth-btn" id="authBtn" type="submit">
      <span class="spinner"></span>
      <span class="btn-text" id="authBtnText">Sign In</span>
    </button>
  </form>

  <div class="mode-toggle">
    <span id="modeText">Don't have an account?</span>
    <button id="modeBtn" type="button">Sign Up</button>
  </div>

  <div class="message" id="message"></div>
  <a class="back-home" href="../index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",
  authDomain: "world-wide-connect-62c87.firebaseapp.com",
  projectId: "world-wide-connect-62c87",
  storageBucket: "world-wide-connect-62c87.firebasestorage.app",
  messagingSenderId: "93178453668",
  appId: "1:93178453668:web:2184630caa8e61f7445031",
  measurementId: "G-PKFJ5NEMGQ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

const googleBtn = document.getElementById('googleBtn');
const authForm = document.getElementById('authForm');
const authBtn = document.getElementById('authBtn');
const authBtnText = document.getElementById('authBtnText');
const modeBtn = document.getElementById('modeBtn');
const modeText = document.getElementById('modeText');
const subtitle = document.getElementById('subtitle');
const message = document.getElementById('message');
const nameGroup = document.getElementById('nameGroup');
const nameInput = document.getElementById('nameInput');
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');

let isRegisterMode = false;

try { await setPersistence(auth, browserLocalPersistence); } catch(e) {}

function showMessage(text, type = '') {
  message.textContent = text;
  message.className = 'message show';
  if (type) message.classList.add(type);
}

function hideMessage() { message.className = 'message'; }

async function createUserProfile(user, extraData = {}) {
  try {
    const userRef = doc(db, 'users', user.uid);
    const existing = await getDoc(userRef);
    if (existing.exists()) return;

    let baseName = extraData.name || user.displayName || 'wwc_user';
    let username = String(baseName).toLowerCase().trim()
      .replace(/[^a-z0-9_]/g, '_')
      .replace(/^_+|_+$/g, '')
      .substring(0, 20);
    if (!username) username = 'wwc_user';

    username = username + '_' + user.uid.substring(0, 5);

    const defaultAvatar = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(extraData.name || user.displayName || 'User') + '&background=25f4ee&color=000&bold=true';

    await setDoc(userRef, {
      uid: user.uid,
      name: extraData.name || user.displayName || 'WWC User',
      displayName: extraData.name || user.displayName || 'WWC User',
      username: username,
      email: user.email || '',
      photoURL: user.photoURL || defaultAvatar,
      bio: '🌍 Welcome to World Wide Connect',
      followers: 0,
      following: 0,
      likes: 0,
      isPrivate: false,
      notificationsEnabled: true,
      darkMode: false,
      createdAt: new Date().toISOString()
    });
  } catch(e) { console.error('Profile creation error:', e); }
}

function goHome() { window.location.replace('../index.html'); }

onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = '../index.html';
});

googleBtn.addEventListener('click', async () => {
  googleBtn.disabled = true; authBtn.disabled = true; modeBtn.disabled = true;
  showMessage('⏳ Connecting to Google...', 'info');
  try {
    const result = await signInWithPopup(auth, googleProvider);
    await createUserProfile(result.user);
    showMessage('✅ Welcome! Redirecting...', 'success');
    setTimeout(goHome, 500);
  } catch(error) {
    console.error('Google error:', error);
    let msg = 'Google login failed. Please try again.';
    if (error.code === 'auth/popup-closed-by-user') msg = '⚠️ Login cancelled.';
    else if (error.code === 'auth/popup-blocked') msg = '❌ Popup blocked. Please allow popups.';
    showMessage(msg, 'error');
    googleBtn.disabled = false; authBtn.disabled = false; modeBtn.disabled = false;
  }
});

modeBtn.addEventListener('click', () => {
  isRegisterMode = !isRegisterMode;
  hideMessage();
  if (isRegisterMode) {
    nameGroup.classList.add('show');
    nameInput.required = true;
    passwordInput.autocomplete = 'new-password';
    authBtnText.textContent = 'Create Account';
    modeBtn.textContent = 'Sign In';
    modeText.textContent = 'Already have an account?';
    subtitle.textContent = 'Create your WWC account';
  } else {
    nameGroup.classList.remove('show');
    nameInput.required = false;
    passwordInput.autocomplete = 'current-password';
    authBtnText.textContent = 'Sign In';
    modeBtn.textContent = 'Sign Up';
    modeText.textContent = "Don't have an account?";
    subtitle.textContent = 'Sign in to continue';
  }
});

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMessage();
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  const name = nameInput.value.trim();
  if (!email) { showMessage('⚠️ Please enter your email.', 'error'); return; }
  if (password.length < 6) { showMessage('⚠️ Password must be at least 6 characters.', 'error'); return; }
  if (isRegisterMode && !name) { showMessage('⚠️ Please enter your name.', 'error'); return; }
  authBtn.disabled = true; googleBtn.disabled = true; modeBtn.disabled = true;
  authBtn.classList.add('loading');
  try {
    if (isRegisterMode) {
      showMessage('⏳ Creating your account...', 'info');
      const result = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(result.user, { displayName: name });
      await createUserProfile(result.user, { name });
      showMessage('✅ Account created! Welcome 🎉', 'success');
    } else {
      showMessage('⏳ Signing in...', 'info');
      const result = await signInWithEmailAndPassword(auth, email, password);
      await createUserProfile(result.user);
      showMessage('✅ Welcome back! 👋', 'success');
    }
    setTimeout(goHome, 600);
  } catch(error) {
    console.error('Auth error:', error);
    let msg = 'Something went wrong.';
    switch(error.code) {
      case 'auth/email-already-in-use': msg = '❌ Email already registered. Please sign in.'; break;
      case 'auth/invalid-email': msg = '❌ Invalid email address.'; break;
      case 'auth/user-not-found': msg = '❌ No account found. Please sign up.'; break;
      case 'auth/wrong-password': msg = '❌ Incorrect password.'; break;
      case 'auth/weak-password': msg = '❌ Password too weak.'; break;
      case 'auth/too-many-requests': msg = '⚠️ Too many attempts. Try again later.'; break;
      default: msg = '❌ ' + (error.message || 'Authentication failed.');
    }
    showMessage(msg, 'error');
  }
  authBtn.disabled = false; googleBtn.disabled = false; modeBtn.disabled = false;
  authBtn.classList.remove('loading');
});
</script>
</body>
</html>
