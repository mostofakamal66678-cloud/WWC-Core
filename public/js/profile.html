<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>প্রোফাইল - WWC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding-bottom:70px; }
        
        .top { 
            position:sticky; top:0; z-index:50; 
            background:#000; 
            padding:12px 16px; 
            display:flex; 
            align-items:center; 
            justify-content:space-between; 
            border-bottom:1px solid #222; 
        }
        .top h1 { font-size:17px; font-weight:700; }
        .top .back-btn { background:none; border:none; color:#fff; font-size:20px; cursor:pointer; }
        .top .settings-btn { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }

        .profile-header {
            padding: 20px 16px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #222;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fe2c55, #25f4ee);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            font-weight: 700;
            color: #000;
            flex-shrink: 0;
        }
        .profile-stats {
            flex: 1;
            display: flex;
            justify-content: space-around;
        }
        .stat-item { text-align: center; }
        .stat-item .num { font-size: 20px; font-weight: 700; }
        .stat-item .label { font-size: 12px; color: #888; margin-top: 2px; }

        .profile-bio {
            padding: 12px 16px 16px;
            border-bottom: 1px solid #222;
        }
        .profile-bio .name { font-size: 17px; font-weight: 700; }
        .profile-bio .username { font-size: 14px; color: #888; margin-top: 2px; }
        .profile-bio .bio { font-size: 14px; margin-top: 6px; line-height: 1.4; color: #ddd; }

        .follow-btn {
            padding: 8px 24px;
            border: none;
            border-radius: 6px;
            background: #fe2c55;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin: 8px 16px 0;
        }
        .follow-btn.following { background: #2a2a2a; color: #fff; }

        .profile-tabs {
            display: flex;
            border-bottom: 1px solid #222;
            margin-top: 8px;
        }
        .profile-tabs .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            color: #888;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .profile-tabs .tab.active { color: #fff; border-bottom-color: #fe2c55; }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            padding: 3px;
        }
        .video-grid .grid-item {
            aspect-ratio: 9 / 16;
            background: #111;
            overflow: hidden;
            position: relative;
            border-radius: 4px;
        }
        .video-grid .grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-grid .grid-item .overlay-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #fff;
            font-size: 14px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        .empty-grid {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-size: 14px;
            line-height: 1.6;
        }
        .empty-grid i { font-size: 48px; display: block; margin-bottom: 16px; opacity: 0.4; }

        /* ===== সেটিংস মডাল ===== */
        .settings-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .settings-modal.active { display: flex; }
        .settings-box {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 24px 20px;
            width: 90%;
            max-width: 360px;
            border: 1px solid #333;
        }
        .settings-box .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .settings-box .settings-header h3 { font-size: 18px; }
        .settings-box .settings-header button { background:none; border:none; color:#fff; font-size:20px; cursor:pointer; }
        .settings-box .settings-item {
            padding: 14px 0;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            color: #ddd;
            transition: background 0.2s;
        }
        .settings-box .settings-item:hover { background: #252525; margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 8px; }
        .settings-box .settings-item i { font-size: 18px; width: 28px; color: #888; }
        .settings-box .settings-item:last-child { border-bottom: none; }
        .settings-box .logout-item {
            color: #fe2c55;
            margin-top: 8px;
            border-top: 1px solid #333;
            padding-top: 14px;
        }
        .settings-box .logout-item i { color: #fe2c55; }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            color: #888;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            gap: 3px;
            flex: 1;
        }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: #fff; }
        .nav-item.upload-btn {
            background: linear-gradient(45deg, #fe2c55, #25f4ee);
            width: 48px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            flex: 0 0 auto;
            margin: 0 6px;
        }
        .nav-item.upload-btn i { font-size: 20px; color: #000; }
    </style>
</head>
<body>

    <div class="top">
        <button class="back-btn" id="back-btn"><i class="fas fa-arrow-left"></i></button>
        <h1 id="page-title">প্রোফাইল</h1>
        <button class="settings-btn" id="settings-btn"><i class="fas fa-gear"></i></button>
    </div>

    <div class="profile-header">
        <div class="profile-avatar" id="profile-avatar">U</div>
        <div class="profile-stats">
            <div class="stat-item">
                <div class="num" id="video-count">0</div>
                <div class="label">ভিডিও</div>
            </div>
            <div class="stat-item">
                <div class="num" id="follower-count">0</div>
                <div class="label">ফলোয়ার</div>
            </div>
            <div class="stat-item">
                <div class="num" id="following-count">0</div>
                <div class="label">ফলো করছেন</div>
            </div>
        </div>
    </div>

    <div class="profile-bio">
        <div class="name" id="display-name">ইউজার</div>
        <div class="username" id="username">@user</div>
        <div class="bio" id="bio">হ্যালো, আমি WWC ব্যবহার করছি</div>
    </div>

    <button class="follow-btn" id="follow-btn" style="display:none;">ফলো</button>

    <div class="profile-tabs">
        <div class="tab active" data-tab="videos"><i class="fas fa-grid"></i> ভিডিও</div>
        <div class="tab" data-tab="liked"><i class="fas fa-heart"></i> লাইক</div>
        <div class="tab" data-tab="saved"><i class="fas fa-bookmark"></i> সেভ</div>
    </div>

    <div id="content-area">
        <div class="video-grid" id="video-grid"></div>
    </div>

    <!-- ===== সেটিংস মডাল ===== -->
    <div class="settings-modal" id="settings-modal">
        <div class="settings-box">
            <div class="settings-header">
                <h3><i class="fas fa-gear"></i> সেটিংস</h3>
                <button id="close-settings"><i class="fas fa-times"></i></button>
            </div>

            <!-- ১. প্রাথমিক এন্ডি (প্রোফাইল এডিট) -->
            <div class="settings-item" id="edit-profile">
                <i class="fas fa-user-edit"></i>
                <span>প্রাথমিক এন্ডি</span>
            </div>

            <!-- ২. গ্রাইভেরিস (প্রাইভেসি) -->
            <div class="settings-item" id="privacy">
                <i class="fas fa-lock"></i>
                <span>গ্রাইভেরিস</span>
            </div>

            <!-- ৩. লাটিমিকেশন (নোটিফিকেশন) -->
            <div class="settings-item" id="notifications">
                <i class="fas fa-bell"></i>
                <span>লাটিমিকেশন</span>
            </div>

            <!-- ৪. ডাক মোড (ডার্ক মোড) -->
            <div class="settings-item" id="dark-mode">
                <i class="fas fa-moon"></i>
                <span>ডাক মোড</span>
            </div>

            <!-- ৫. লগজাউ (লগআউট) -->
            <div class="settings-item logout-item" id="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                <span>লগজাউ</span>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>হোম</span></a>
        <a href="friends.html" class="nav-item"><i class="fas fa-users"></i><span>বন্ধু</span></a>
        <a href="upload.html" class="nav-item upload-btn"><i class="fas fa-plus"></i></a>
        <a href="inbox.html" class="nav-item"><i class="fas fa-message"></i><span>ইনবক্স</span></a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let currentUser = null;
        let targetUserId = null;
        let currentTab = 'videos';
        let darkMode = false;

        auth.onAuthStateChanged(user => {
            if (!user) { location.href = 'login.html'; return; }
            currentUser = user;
            const params = new URLSearchParams(window.location.search);
            targetUserId = params.get('uid') || currentUser.uid;
            loadProfile(targetUserId);
        });

        // ট্যাব
        document.querySelectorAll('.profile-tabs .tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.profile-tabs .tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                loadContent(targetUserId, currentTab);
            });
        });

        document.getElementById('back-btn').addEventListener('click', () => window.location.href = '../index.html');

        // ========== সেটিংস ==========
        const modal = document.getElementById('settings-modal');

        document.getElementById('settings-btn').addEventListener('click', () => modal.classList.add('active'));
        document.getElementById('close-settings').addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => { if (e.target === e.currentTarget) modal.classList.remove('active'); });

        // ১. প্রাথমিক এন্ডি (প্রোফাইল এডিট)
        document.getElementById('edit-profile').addEventListener('click', () => {
            modal.classList.remove('active');
            const newName = prompt('আপনার নতুন নাম লিখুন:', document.getElementById('display-name').textContent);
            if (newName && newName.trim()) {
                const name = newName.trim();
                document.getElementById('display-name').textContent = name;
                document.getElementById('username').textContent = `@${name}`;
                document.getElementById('profile-avatar').textContent = name[0].toUpperCase();
                // Firebase-এ সেভ
                db.collection('users').doc(currentUser.uid).set({
                    username: name,
                    bio: document.getElementById('bio').textContent
                }, { merge: true }).catch(err => console.error(err));
            }
        });

        // ২. গ্রাইভেরিস (প্রাইভেসি)
        document.getElementById('privacy').addEventListener('click', () => {
            modal.classList.remove('active');
            alert('🔒 প্রাইভেসি সেটিংস\n\n• অ্যাকাউন্ট প্রাইভেট করুন\n• কে আপনার ভিডিও দেখতে পারবে\n• কমেন্ট কন্ট্রোল\n\n(শীঘ্রই যোগ হবে)');
        });

        // ৩. লাটিমিকেশন (নোটিফিকেশন)
        document.getElementById('notifications').addEventListener('click', () => {
            modal.classList.remove('active');
            alert('🔔 নোটিফিকেশন সেটিংস\n\n• লাইক নোটিফিকেশন\n• কমেন্ট নোটিফিকেশন\n• ফলো নোটিফিকেশন\n• পুশ নোটিফিকেশন\n\n(শীঘ্রই যোগ হবে)');
        });

        // ৪. ডাক মোড (ডার্ক মোড)
        document.getElementById('dark-mode').addEventListener('click', () => {
            modal.classList.remove('active');
            darkMode = !darkMode;
            if (darkMode) {
                document.body.style.background = '#fff';
                document.body.style.color = '#000';
                document.querySelectorAll('.settings-box, .top, .bottom-nav, .profile-tabs, .profile-bio, .profile-header')
                    .forEach(el => { el.style.background = '#f5f5f5'; el.style.borderColor = '#ddd'; });
                document.querySelectorAll('.stat-item .label, .profile-bio .username, .settings-item, .nav-item')
                    .forEach(el => el.style.color = '#555');
                alert('🌙 ডার্ক মোড চালু হয়েছে!\n(আবার ক্লিক করলে বন্ধ হবে)');
            } else {
                document.body.style.background = '#000';
                document.body.style.color = '#fff';
                location.reload(); // রিলোড দিয়ে সব ঠিক করা
            }
        });

        // ৫. লগজাউ (লগআউট)
        document.getElementById('logout-btn').addEventListener('click', () => {
            if (confirm('আপনি কি লগআউট করতে চান?')) {
                auth.signOut().then(() => {
                    modal.classList.remove('active');
                    window.location.href = 'login.html';
                });
            }
        });

        // ========== প্রোফাইল লোড ==========
        async function loadProfile(uid) {
            const isOwn = (uid === currentUser.uid);
            let userData = {};
            try {
                const userDoc = await db.collection('users').doc(uid).get();
                if (userDoc.exists) userData = userDoc.data();
            } catch(e) {}

            if (!userData.username) {
                try {
                    const vids = await db.collection('videos').where('uid', '==', uid).limit(1).get();
                    if (!vids.empty) userData.username = vids.docs[0].data().username || 'user';
                    else userData.username = 'user';
                } catch(e) { userData.username = 'user'; }
            }

            const displayName = userData.username || 'ইউজার';
            document.getElementById('profile-avatar').textContent = displayName[0].toUpperCase();
            document.getElementById('display-name').textContent = displayName;
            document.getElementById('username').textContent = `@${displayName}`;
            document.getElementById('bio').textContent = userData.bio || 'হ্যালো, আমি WWC ব্যবহার করছি';
            document.getElementById('page-title').textContent = isOwn ? 'প্রোফাইল' : `@${displayName}`;

            const followBtn = document.getElementById('follow-btn');
            if (!isOwn && uid) {
                followBtn.style.display = 'block';
                await updateFollowButton(uid, followBtn);
                followBtn.onclick = () => toggleFollow(uid, followBtn);
            } else {
                followBtn.style.display = 'none';
            }

            await loadStats(uid);
            await loadContent(uid, 'videos');
        }

        async function loadStats(uid) {
            try {
                const vids = await db.collection('videos').where('uid', '==', uid).get();
                document.getElementById('video-count').textContent = vids.size;
                const followers = await db.collection('follows').where('following', '==', uid).get();
                document.getElementById('follower-count').textContent = followers.size;
                const following = await db.collection('follows').where('follower', '==', uid).get();
                document.getElementById('following-count').textContent = following.size;
            } catch(e) { console.error(e); }
        }

        async function loadContent(uid, tab) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '<div class="empty-grid"><i class="fas fa-spinner fa-spin"></i>লোড হচ্ছে...</div>';
            let videos = [];
            try {
                if (tab === 'videos') {
                    const snap = await db.collection('videos').where('uid', '==', uid).orderBy('createdAt', 'desc').get();
                    snap.forEach(doc => videos.push({ id: doc.id, ...doc.data() }));
                } else if (tab === 'liked') {
                    const likes = await db.collection('likes').where('userId', '==', uid).get();
                    for (const l of likes.docs) {
                        const videoId = l.data().videoId;
                        if (videoId) {
                            try {
                                const v = await db.collection('videos').doc(videoId).get();
                                if (v.exists) videos.push({ id: v.id, ...v.data() });
                            } catch(e) {}
                        }
                    }
                } else if (tab === 'saved') {
                    const saves = await db.collection('saves').where('userId', '==', uid).get();
                    for (const s of saves.docs) {
                        const videoId = s.data().videoId;
                        if (videoId) {
                            try {
                                const v = await db.collection('videos').doc(videoId).get();
                                if (v.exists) videos.push({ id: v.id, ...v.data() });
                            } catch(e) {}
                        }
                    }
                }
            } catch(e) { console.error(e); }

            if (!videos.length) {
                const icons = { videos: 'video', liked: 'heart', saved: 'bookmark' };
                const msgs = { videos: 'কোনো ভিডিও আপলোড করেননি', liked: 'লাইক করা ভিডিও নেই', saved: 'সেভ করা ভিডিও নেই' };
                grid.innerHTML = `<div class="empty-grid"><i class="fas fa-${icons[tab] || 'video'}"></i>${msgs[tab] || 'কোনো ভিডিও নেই'}</div>`;
                return;
            }

            grid.innerHTML = '';
            videos.forEach(v => {
                const item = document.createElement('div');
                item.className = 'grid-item';
                const src = v.videoURL || v.videoUrl || '';
                item.innerHTML = `
                    <video src="${src}" muted loop playsinline preload="metadata"></video>
                    ${tab === 'liked' ? '<div class="overlay-icon"><i class="fas fa-heart" style="color:#fe2c55;"></i></div>' : ''}
                    ${tab === 'saved' ? '<div class="overlay-icon"><i class="fas fa-bookmark" style="color:#facc15;"></i></div>' : ''}
                `;
                const vid = item.querySelector('video');
                item.addEventListener('click', () => { if (vid.paused) vid.play(); else vid.pause(); });
                item.addEventListener('mouseenter', () => { vid.play(); });
                item.addEventListener('mouseleave', () => { vid.pause(); });
                grid.appendChild(item);
            });
        }

        async function updateFollowButton(uid, btn) {
            try {
                const followId = `${currentUser.uid}_${uid}`;
                const doc = await db.collection('follows').doc(followId).get();
                if (doc.exists) { btn.textContent = 'ফলোয়িং'; btn.classList.add('following'); }
                else { btn.textContent = 'ফলো'; btn.classList.remove('following'); }
            } catch(e) {}
        }

        async function toggleFollow(uid, btn) {
            if (!currentUser || currentUser.uid === uid) return;
            const followId = `${currentUser.uid}_${uid}`;
            const ref = db.collection('follows').doc(followId);
            try {
                const doc = await ref.get();
                if (doc.exists) { await ref.delete(); btn.textContent = 'ফলো'; btn.classList.remove('following'); }
                else { await ref.set({ follower: currentUser.uid, following: uid, createdAt: Date.now() }); btn.textContent = 'ফলোয়িং'; btn.classList.add('following'); }
                await loadStats(uid);
            } catch(e) { alert('ফলো সমস্যা: ' + e.message); }
        }
    </script>
</body>
</html>
