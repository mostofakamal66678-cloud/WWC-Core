<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>প্রোফাইল - WWC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding-bottom:70px; }
        .top { position:sticky; top:0; z-index:50; background:#000; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #222; }
        .top h1 { font-size:17px; font-weight:700; }
        .top button { background:none; border:none; color:#fff; font-size:18px; cursor:pointer; }
        .profile-header { text-align:center; padding:24px 16px 16px; }
        .avatar { width:96px; height:96px; border-radius:50%; background:linear-gradient(135deg,#fe2c55,#25f4ee); display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:700; margin:0 auto 12px; color:#000; }
        .username { font-size:18px; font-weight:700; margin-bottom:4px; }
        .bio { color:#aaa; font-size:14px; margin-bottom:16px; }
        .stats { display:flex; justify-content:center; gap:28px; margin-bottom:18px; }
        .stats div { text-align:center; }
        .stats strong { display:block; font-size:17px; }
        .stats span { font-size:12px; color:#888; }
        .btn-row { display:flex; gap:10px; justify-content:center; padding:0 20px; }
        .btn { flex:1; max-width:160px; padding:10px; border:none; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; }
        .btn-edit { background:#2a2a2a; color:#fff; }
        .btn-logout { background:#fe2c55; color:#fff; }
        .tabs { display:flex; border-bottom:1px solid #222; margin-top:20px; }
        .tab { flex:1; text-align:center; padding:12px; color:#888; font-size:14px; cursor:pointer; border-bottom:2px solid transparent; }
        .tab.active { color:#fff; border-bottom-color:#fff; }
        .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px; }
        .grid-item { position:relative; aspect-ratio:9/16; background:#111; overflow:hidden; }
        .grid-item video { width:100%; height:100%; object-fit:cover; display:block; }
        .grid-item .views { position:absolute; bottom:6px; left:6px; font-size:12px; text-shadow:0 1px 2px #000; }
        .empty { text-align:center; color:#666; padding:40px 20px; font-size:14px; }
        .bottom-nav { position:fixed; bottom:0; left:0; right:0; height:60px; background:#000; display:flex; justify-content:space-around; align-items:center; border-top:1px solid #222; z-index:100; padding-bottom:env(safe-area-inset-bottom); }
        .nav-item { color:#888; text-decoration:none; display:flex; flex-direction:column; align-items:center; font-size:11px; gap:3px; flex:1; }
        .nav-item i { font-size:22px; }
        .nav-item.active { color:#fff; }
        .nav-item.upload-btn { background:linear-gradient(45deg,#fe2c55,#25f4ee); width:48px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#000; flex:0 0 auto; margin:0 6px; }
        .nav-item.upload-btn i { font-size:20px; color:#000; }
    </style>
</head>
<body>
    <div class="top">
        <button onclick="history.back()"><i class="fas fa-arrow-left"></i></button>
        <h1 id="page-title">প্রোফাইল</h1>
        <button id="menu-btn"><i class="fas fa-bars"></i></button>
    </div>

    <div class="profile-header">
        <div class="avatar" id="avatar">U</div>
        <div class="username" id="username">@user</div>
        <div class="bio" id="bio">WWC ইউজার</div>
        <div class="stats">
            <div><strong id="following-count">0</strong><span>Following</span></div>
            <div><strong id="follower-count">0</strong><span>Followers</span></div>
            <div><strong id="like-count">0</strong><span>Likes</span></div>
        </div>
        <div class="btn-row">
            <button class="btn btn-edit" id="edit-btn">এডিট প্রোফাইল</button>
            <button class="btn btn-logout" id="logout-btn">লগআউট</button>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" data-tab="videos"><i class="fas fa-th"></i></div>
        <div class="tab" data-tab="liked"><i class="fas fa-heart"></i></div>
        <div class="tab" data-tab="saved"><i class="fas fa-bookmark"></i></div>
    </div>
    <div class="grid" id="video-grid">
        <div class="empty">লোড হচ্ছে...</div>
    </div>

    <nav class="bottom-nav">
        <a href="../../index.html" class="nav-item"><i class="fas fa-home"></i><span>হোম</span></a>
        <a href="friends.html" class="nav-item"><i class="fas fa-users"></i><span>বন্ধু</span></a>
        <a href="upload.html" class="nav-item upload-btn"><i class="fas fa-plus"></i></a>
        <a href="inbox.html" class="nav-item"><i class="fas fa-message"></i><span>ইনবক্স</span></a>
        <a href="profile.html" class="nav-item active"><i class="fas fa-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        let currentUser = null;
        let currentTab = 'videos';

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;
            loadProfile(user);
            loadVideos('videos');
        });

        function loadProfile(user) {
            const name = user.displayName || 'user';
            document.getElementById('username').textContent = '@' + name;
            document.getElementById('page-title').textContent = name;
            document.getElementById('avatar').textContent = name[0].toUpperCase();

            db.collection('follows').where('following', '==', user.uid).onSnapshot(s => {
                document.getElementById('follower-count').textContent = s.size;
            });
            db.collection('follows').where('follower', '==', user.uid).onSnapshot(s => {
                document.getElementById('following-count').textContent = s.size;
            });
            db.collection('videos').where('uid', '==', user.uid).get().then(s => {
                let totalLikes = 0;
                s.forEach(d => { totalLikes += (d.data().likes || 0); });
                document.getElementById('like-count').textContent = totalLikes;
            });
        }

        function loadVideos(tab) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '<div class="empty">লোড হচ্ছে...</div>';
            currentTab = tab;

            if (tab === 'videos') {
                db.collection('videos').where('uid', '==', currentUser.uid).get()
                    .then(snap => renderGrid(snap, grid));
            } else if (tab === 'liked') {
                db.collection('likes').where('userId', '==', currentUser.uid).get().then(async snap => {
                    if (snap.empty) { grid.innerHTML = '<div class="empty">কোনো লাইক করা ভিডিও নেই</div>'; return; }
                    grid.innerHTML = '';
                    for (const doc of snap.docs) {
                        const vid = await db.collection('videos').doc(doc.data().videoId).get();
                        if (vid.exists) addGridItem(vid.id, vid.data(), grid);
                    }
                    if (!grid.children.length) grid.innerHTML = '<div class="empty">কোনো লাইক করা ভিডিও নেই</div>';
                });
            } else if (tab === 'saved') {
                db.collection('saves').where('userId', '==', currentUser.uid).get().then(async snap => {
                    if (snap.empty) { grid.innerHTML = '<div class="empty">কোনো সেভ করা ভিডিও নেই</div>'; return; }
                    grid.innerHTML = '';
                    for (const doc of snap.docs) {
                        const vid = await db.collection('videos').doc(doc.data().videoId).get();
                        if (vid.exists) addGridItem(vid.id, vid.data(), grid);
                    }
                    if (!grid.children.length) grid.innerHTML = '<div class="empty">কোনো সেভ করা ভিডিও নেই</div>';
                });
            }
        }

        function renderGrid(snap, grid) {
            if (snap.empty) { grid.innerHTML = '<div class="empty">এখনো কোনো ভিডিও নেই<br>আপলোড করুন!</div>'; return; }
            grid.innerHTML = '';
            const docs = snap.docs.sort((a,b) => (b.data().createdAt||0) - (a.data().createdAt||0));
            docs.forEach(doc => addGridItem(doc.id, doc.data(), grid));
        }

        function addGridItem(id, data, grid) {
            const src = data.videoURL || data.videoUrl || '';
            const el = document.createElement('div');
            el.className = 'grid-item';
            el.innerHTML = `<video src="${src}" muted loop playsinline preload="metadata"></video>
                <div class="views"><i class="fas fa-play"></i> ${data.likes || 0}</div>`;
            el.addEventListener('click', () => window.location.href = '../../index.html');
            grid.appendChild(el);
        }

        document.querySelectorAll('.tab').forEach(t => {
            t.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
                t.classList.add('active');
                loadVideos(t.dataset.tab);
            });
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            if (confirm('লগআউট করবেন?')) auth.signOut().then(() => location.href = 'login.html');
        });

        document.getElementById('edit-btn').addEventListener('click', () => {
            const name = prompt('নতুন নাম:', currentUser.displayName || '');
            if (name && name.trim()) {
                currentUser.updateProfile({ displayName: name.trim() }).then(() => {
                    loadProfile(currentUser);
                    alert('আপডেট হয়েছে!');
                });
            }
        });
    </script>
</body>
</html>
