<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল - WWC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-container" id="profile-container">
        <div class="avatar-big" id="avatar">👤</div>
        <h2 id="username" style="text-align:center;">@ইউজার</h2>
        <div class="stats">
            <div><strong id="video-count">0</strong><br>ভিডিও</div>
            <div><strong id="follower-count">0</strong><br>ফলোয়ার</div>
            <div><strong id="following-count">0</strong><br>ফলো করছেন</div>
        </div>
        <button id="logout-btn" style="width:100%;padding:14px;border:none;border-radius:30px;background:#f44336;color:#fff;font-size:18px;font-weight:700;">লগআউট</button>
        <div id="my-videos" style="margin-top:20px;"></div>
    </div>

    <div class="navbar">
        <a href="index.html"><i class="fas fa-home"></i><span>হোম</span></a>
        <a href="upload.html"><i class="fas fa-plus-circle"></i><span>আপলোড</span></a>
        <a href="profile.html" class="active"><i class="fas fa-user"></i><span>প্রোফাইল</span></a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            if (!user) window.location.href = 'login.html';
            else loadProfile(user);
        });

        function loadProfile(user) {
            document.getElementById('username').textContent = `@${user.displayName || 'ইউজার'}`;
            document.getElementById('avatar').textContent = (user.displayName || 'U')[0].toUpperCase();

            // ইউজারের ভিডিও
            db.collection('videos').where('uid', '==', user.uid).onSnapshot(snap => {
                document.getElementById('video-count').textContent = snap.size;
                const container = document.getElementById('my-videos');
                container.innerHTML = '';
                snap.forEach(doc => {
                    const data = doc.data();
                    container.innerHTML += `<video src="${data.videoUrl}" style="width:100px;height:150px;object-fit:cover;margin:4px;border-radius:8px;" loop muted></video>`;
                });
            });

            // ফলোয়ার ও ফলোইং
            db.collection('follows').where('following', '==', user.uid).onSnapshot(snap => {
                document.getElementById('follower-count').textContent = snap.size;
            });
            db.collection('follows').where('follower', '==', user.uid).onSnapshot(snap => {
                document.getElementById('following-count').textContent = snap.size;
            });
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut().then(() => window.location.href = 'login.html');
        });
    </script>
</body>
</html>
