<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Inbox · WWC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-top: 60px;
            padding-bottom: 80px;
            min-height: 100vh;
        }
        .inbox-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 16px;
        }
        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
        }
        .inbox-header h1 {
            font-size: 22px;
            font-weight: 700;
        }
        .inbox-header h1 i {
            color: #25f4ee;
            margin-right: 8px;
        }
        .inbox-tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid #222;
            margin-bottom: 16px;
        }
        .inbox-tabs .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            background: none;
            border: 0;
            cursor: pointer;
            position: relative;
        }
        .inbox-tabs .tab.active {
            color: #fff;
        }
        .inbox-tabs .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: #fff;
            border-radius: 3px;
        }
        .notification-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #141414;
        }
        .notification-item img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background: #222;
        }
        .notification-item .content {
            flex: 1;
        }
        .notification-item .content .user {
            font-weight: 600;
            font-size: 14px;
        }
        .notification-item .content .action {
            font-size: 13px;
            color: #aaa;
        }
        .notification-item .content .time {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        .notification-item .badge {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #25f4ee;
            flex-shrink: 0;
        }
        .empty-state {
            text-align: center;
            color: #666;
            padding: 50px 0;
        }
        .empty-state i {
            font-size: 50px;
            color: #333;
            display: block;
            margin-bottom: 15px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            color: #888;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            gap: 2px;
            flex: 1;
            cursor: pointer;
            background: none;
            border: 0;
        }
        .nav-item i {
            font-size: 22px;
        }
        .nav-item.active {
            color: #fff;
        }
        .nav-item.upload-btn {
            background: linear-gradient(45deg, #fe2c55, #25f4ee);
            width: 48px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            flex: 0 0 auto;
            margin: 0 6px;
        }
        .nav-item.upload-btn i {
            font-size: 20px;
            color: #000;
        }
        .back-btn {
            color: #fff;
            font-size: 22px;
            background: none;
            border: 0;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<!-- টপ বার -->
<div style="position:fixed;top:0;left:0;right:0;z-index:100;height:50px;display:flex;align-items:center;padding:0 16px;background:rgba(0,0,0,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.06)">
    <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
    <span style="font-size:17px;font-weight:700;flex:1;text-align:center;">ইনবক্স</span>
    <div style="width:40px;"></div>
</div>

<div class="inbox-container">
    <div class="inbox-header">
        <h1><i class="fas fa-inbox"></i>ইনবক্স</h1>
        <button style="color:#888;background:none;border:0;font-size:18px;cursor:pointer;" onclick="showToast('🔍 খুঁজুন')"><i class="fas fa-search"></i></button>
    </div>

    <div class="inbox-tabs">
        <button class="tab active" data-tab="all">সব</button>
        <button class="tab" data-tab="likes">লাইক</button>
        <button class="tab" data-tab="follows">ফলো</button>
        <button class="tab" data-tab="comments">কমেন্ট</button>
    </div>

    <div id="notifications-list">
        <div class="empty-state">
            <i class="fas fa-bell-slash"></i>
            <div style="font-size:16px;color:#888;">কোনো নোটিফিকেশন নেই</div>
            <div style="font-size:13px;color:#555;">লাইক, কমেন্ট, ফলো পেলে দেখাবে</div>
        </div>
    </div>
</div>

<!-- বটম নেভ -->
<nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>হোম</span></a>
    <a href="friends.html" class="nav-item"><i class="fas fa-user-friends"></i><span>বন্ধু</span></a>
    <a href="upload.html" class="nav-item upload-btn"><i class="fas fa-plus"></i></a>
    <a href="inbox.html" class="nav-item active"><i class="fas fa-message"></i><span>ইনবক্স</span></a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>প্রোফাইল</span></a>
</nav>

<script>
const notificationsList = document.getElementById('notifications-list');
let currentUser = null;

auth.onAuthStateChanged(async (user) => {
    if (!user) { window.location.href = 'auth.html'; return; }
    currentUser = user;
    await loadNotifications();
});

async function loadNotifications() {
    try {
        const snap = await db.collection('notifications')
            .where('userId', '==', currentUser.uid)
            .orderBy('createdAt', 'desc')
            .limit(50)
            .get();

        if (snap.empty) {
            notificationsList.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-bell-slash"></i>
                    <div style="font-size:16px;color:#888;">কোনো নোটিফিকেশন নেই</div>
                </div>
            `;
            return;
        }

        let html = '';
        snap.forEach(doc => {
            const data = doc.data();
            const actionText = data.type === 'like' ? 'আপনার ভিডিও লাইক করেছেন' :
                              data.type === 'follow' ? 'আপনাকে ফলো করেছেন' :
                              data.type === 'comment' ? 'কমেন্ট করেছেন: ' + (data.text || '') : '';
            const time = new Date(data.createdAt).toLocaleDateString('bn', { hour: '2-digit', minute: '2-digit' });
            const avatar = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(data.fromUsername || 'U') + '&background=25f4ee&color=000&bold=true';

            html += `
                <div class="notification-item">
                    <img src="${avatar}" onerror="this.src='./images/profile.png'">
                    <div class="content">
                        <div class="user">@${data.fromUsername || 'user'}</div>
                        <div class="action">${actionText}</div>
                        <div class="time">${time}</div>
                    </div>
                    ${!data.read ? '<div class="badge"></div>' : ''}
                </div>
            `;
        });

        notificationsList.innerHTML = html;
    } catch (e) {
        console.error('Notifications load error:', e);
        notificationsList.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><div style="font-size:16px;color:#888;">লোড করতে ব্যর্থ হয়েছে</div></div>';
    }
}

// Tabs
document.querySelectorAll('.inbox-tabs .tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.inbox-tabs .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        loadNotifications();
    });
});

function showToast(msg) {
    let toast = document.getElementById('toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast';
        toast.style.cssText = `
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(30,30,30,0.95); color: #fff; padding: 10px 24px;
            border-radius: 24px; font-size: 14px; z-index: 999;
            opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none; white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        `;
        document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = '1';
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 2000);
}
</script>

</body>
</html>
