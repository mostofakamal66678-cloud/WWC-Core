<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>ইনবক্স · WWC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; min-height:100vh; padding-bottom:70px; }

        .top-bar {
            position:sticky; top:0; z-index:50; background:#000;
            padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
            border-bottom:1px solid #1a1a1a;
        }
        .top-bar h1 { font-size:18px; font-weight:700; display:flex; align-items:center; gap:8px; }
        .top-bar h1 i { color:#25f4ee; }
        .top-bar button { background:none; border:none; color:#fff; font-size:20px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; cursor:pointer; }

        .inbox-tabs {
            display:flex; border-bottom:1px solid #1a1a1a; background:#000;
            position:sticky; top:57px; z-index:40;
        }
        .inbox-tabs .tab {
            flex:1; padding:14px 0; text-align:center; font-size:14px; font-weight:600;
            color:#666; background:none; border:0; cursor:pointer; position:relative;
        }
        .inbox-tabs .tab.active { color:#fff; }
        .inbox-tabs .tab.active::after {
            content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
            width:28px; height:3px; background:#fe2c55; border-radius:3px;
        }

        .notifications-list { padding:0 16px; }

        .notification-item {
            display:flex; align-items:center; gap:12px; padding:14px 0;
            border-bottom:1px solid #141414; cursor:pointer;
        }
        .notification-item .avatar {
            width:48px; height:48px; border-radius:50%; object-fit:cover; background:#222; flex-shrink:0;
        }
        .notification-item .content { flex:1; min-width:0; }
        .notification-item .content .text { font-size:14px; line-height:1.4; }
        .notification-item .content .text .user { font-weight:700; }
        .notification-item .content .time { font-size:12px; color:#666; margin-top:3px; }
        .notification-item .unread-dot {
            width:8px; height:8px; border-radius:50%; background:#fe2c55; flex-shrink:0;
        }

        .empty-state { text-align:center; padding:80px 20px; color:#666; }
        .empty-state i { font-size:56px; margin-bottom:16px; opacity:0.4; display:block; }
        .empty-state .title { font-size:16px; color:#888; margin-bottom:6px; }
        .empty-state .subtitle { font-size:13px; color:#555; }

        .bottom-nav {
            position:fixed; bottom:0; left:0; right:0; height:60px; background:#000;
            display:flex; justify-content:space-around; align-items:center;
            border-top:1px solid #222; z-index:100; padding-bottom:env(safe-area-inset-bottom);
        }
        .nav-item {
            color:#888; text-decoration:none; display:flex; flex-direction:column;
            align-items:center; font-size:11px; gap:3px; flex:1;
        }
        .nav-item i { font-size:22px; }
        .nav-item.active { color:#fff; }
        .nav-item.upload-btn {
            background:linear-gradient(45deg,#fe2c55,#25f4ee); width:48px; height:32px;
            border-radius:8px; display:flex; align-items:center; justify-content:center;
            color:#000; flex:0 0 auto; margin:0 6px;
        }
        .nav-item.upload-btn i { font-size:20px; color:#000; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button onclick="window.location.href='../index.html'"><i class="fas fa-arrow-left"></i></button>
        <h1><i class="fas fa-inbox"></i> ইনবক্স</h1>
        <button><i class="fas fa-search"></i></button>
    </div>

    <div class="inbox-tabs">
        <button class="tab active" data-type="all">সব</button>
        <button class="tab" data-type="like">লাইক</button>
        <button class="tab" data-type="follow">ফলো</button>
        <button class="tab" data-type="comment">কমেন্ট</button>
    </div>

    <div class="notifications-list" id="notifications-list">
        <div class="empty-state">
            <i class="fas fa-spinner fa-spin"></i>
            <div class="title">লোড হচ্ছে...</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>হোম</span></a>
        <a href="friends.html" class="nav-item"><i class="fas fa-users"></i><span>বন্ধু</span></a>
        <a href="upload.html" class="nav-item upload-btn"><i class="fas fa-plus"></i></a>
        <a href="inbox.html" class="nav-item active"><i class="fas fa-message"></i><span>ইনবক্স</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>প্রোফাইল</span></a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let currentUser = null;
        let currentFilter = 'all';
        let allNotifications = [];

        function timeAgo(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const now = new Date();
            const sec = Math.floor((now - date) / 1000);
            if (sec < 60) return 'এইমাত্র';
            if (sec < 3600) return Math.floor(sec / 60) + ' মিনিট আগে';
            if (sec < 86400) return Math.floor(sec / 3600) + ' ঘণ্টা আগে';
            if (sec < 604800) return Math.floor(sec / 86400) + ' দিন আগে';
            return date.toLocaleDateString('bn-BD');
        }

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'auth.html';
                return;
            }
            currentUser = user;
            await loadNotifications();
        });

        document.querySelectorAll('.inbox-tabs .tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.inbox-tabs .tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.type;
                renderNotifications();
            });
        });

        async function loadNotifications() {
            const list = document.getElementById('notifications-list');
            list.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <div class="title">লোড হচ্ছে...</div>
                </div>
            `;

            try {
                const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 7000));
                const query = db.collection('notifications')
                    .where('toUserId', '==', currentUser.uid)
                    .get();

                const snap = await Promise.race([query, timeout]);

                allNotifications = [];
                snap.forEach(doc => {
                    allNotifications.push({ id: doc.id, ...doc.data() });
                });

                allNotifications.sort((a, b) => {
                    const ta = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt || 0);
                    const tb = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt || 0);
                    return tb - ta;
                });

                renderNotifications();
            } catch (e) {
                console.error(e);
                allNotifications = [];
                renderNotifications();
            }
        }

        function renderNotifications() {
            const list = document.getElementById('notifications-list');
            let filtered = allNotifications;

            if (currentFilter !== 'all') {
                filtered = allNotifications.filter(n => n.type === currentFilter);
            }

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-bell-slash"></i>
                        <div class="title">কোনো নোটিফিকেশন নেই</div>
                        <div class="subtitle">লাইক, কমেন্ট বা ফলো পেলে এখানে দেখাবে</div>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach(n => {
                const avatar = (n.fromPhotoURL && n.fromPhotoURL.startsWith('http'))
                    ? n.fromPhotoURL
                    : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(n.fromUsername || 'U') + '&background=25f4ee&color=000&bold=true';

                let actionText = '';
                if (n.type === 'like') actionText = 'আপনার ভিডিও লাইক করেছেন';
                else if (n.type === 'follow') actionText = 'আপনাকে ফলো করেছেন';
                else if (n.type === 'comment') actionText = 'কমেন্ট করেছেন: “' + (n.text || '') + '”';
                else actionText = 'নতুন নোটিফিকেশন';

                html += `
                    <div class="notification-item" data-from="${n.fromUserId || ''}">
                        <img class="avatar" src="${avatar}" onerror="this.src='https://ui-avatars.com/api/?name=U&background=25f4ee&color=000'">
                        <div class="content">
                            <div class="text">
                                <span class="user">@${n.fromUsername || 'user'}</span> ${actionText}
                            </div>
                            <div class="time">${timeAgo(n.createdAt)}</div>
                        </div>
                        ${!n.read ? '<div class="unread-dot"></div>' : ''}
                    </div>
                `;
            });

            list.innerHTML = html;

            list.querySelectorAll('.notification-item').forEach(item => {
                item.addEventListener('click', () => {
                    const from = item.dataset.from;
                    if (from) window.location.href = 'profile.html?uid=' + from;
                });
            });
        }
    </script>
</body>
</html>
