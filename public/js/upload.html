<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Upload · WWC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-top: 60px;
            padding-bottom: 80px;
            min-height: 100vh;
        }
        .upload-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 16px;
        }
        .upload-header {
            display: flex;
            align-items: center;
            padding: 16px 0;
            gap: 12px;
        }
        .upload-header h1 {
            font-size: 22px;
            font-weight: 700;
            flex: 1;
        }
        .upload-header h1 i {
            color: #fe2c55;
            margin-right: 8px;
        }
        .upload-box {
            border: 2px dashed #333;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
            background: #0a0a0a;
        }
        .upload-box.dragover {
            border-color: #25f4ee;
            background: rgba(37, 244, 238, 0.05);
        }
        .upload-box i {
            font-size: 50px;
            color: #444;
            display: block;
            margin-bottom: 12px;
        }
        .upload-box .main-text {
            font-size: 18px;
            font-weight: 600;
            color: #aaa;
        }
        .upload-box .sub-text {
            font-size: 13px;
            color: #555;
            margin-top: 4px;
        }
        .upload-box .format-text {
            font-size: 12px;
            color: #444;
            margin-top: 4px;
        }
        .upload-box input {
            display: none;
        }
        .preview-container {
            margin-top: 16px;
            border-radius: 12px;
            overflow: hidden;
            background: #111;
            display: none;
        }
        .preview-container video {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            display: block;
        }
        .preview-container .info {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            background: #0a0a0a;
            border-top: 1px solid #222;
        }
        .preview-container .info .name {
            font-size: 14px;
            font-weight: 600;
        }
        .preview-container .info .size {
            font-size: 12px;
            color: #888;
        }
        .form-group {
            margin-top: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #111;
            color: #fff;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #25f4ee;
        }
        .form-group textarea {
            min-height: 60px;
            resize: vertical;
        }
        .upload-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, #25f4ee, #fe2c55);
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            border: 0;
            cursor: pointer;
            margin-top: 16px;
            transition: transform 0.15s;
        }
        .upload-btn:active {
            transform: scale(0.97);
        }
        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .progress-container {
            display: none;
            margin-top: 16px;
            background: #111;
            border-radius: 12px;
            padding: 16px;
        }
        .progress-bar {
            height: 4px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar .bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #25f4ee, #fe2c55);
            transition: width 0.3s;
        }
        .progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 13px;
            color: #888;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            color: #888;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            gap: 2px;
            flex: 1;
            cursor: pointer;
            background: none;
            border: 0;
        }
        .nav-item i {
            font-size: 22px;
        }
        .nav-item.active {
            color: #fff;
        }
        .nav-item.upload-btn {
            background: linear-gradient(45deg, #fe2c55, #25f4ee);
            width: 48px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            flex: 0 0 auto;
            margin: 0 6px;
        }
        .nav-item.upload-btn i {
            font-size: 20px;
            color: #000;
        }
        .back-btn {
            color: #fff;
            font-size: 22px;
            background: none;
            border: 0;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .char-count {
            text-align: right;
            font-size: 12px;
            color: #555;
            margin-top: 4px;
        }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30,30,30,0.95);
            color: #fff;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<!-- টপ বার -->
<div style="position:fixed;top:0;left:0;right:0;z-index:100;height:50px;display:flex;align-items:center;padding:0 16px;background:rgba(0,0,0,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.06)">
    <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i></button>
    <span style="font-size:17px;font-weight:700;flex:1;text-align:center;">আপলোড</span>
    <div style="width:40px;"></div>
</div>

<div class="upload-container">
    <div class="upload-header">
        <h1><i class="fas fa-cloud-upload-alt"></i>নতুন ভিডিও</h1>
    </div>

    <div class="upload-box" id="uploadBox">
        <i class="fas fa-cloud-upload-alt"></i>
        <div class="main-text">ভিডিও সিলেক্ট করুন</div>
        <div class="sub-text">ট্যাপ করে ব্রাউজ করুন</div>
        <div class="format-text">MP4, WebM, MOV • Max 100MB</div>
        <input type="file" id="fileInput" accept="video/*">
    </div>

    <div class="preview-container" id="previewContainer">
        <video id="videoPreview" controls></video>
        <div class="info">
            <span class="name" id="fileName">video.mp4</span>
            <span class="size" id="fileSize">0 MB</span>
        </div>
    </div>

    <div class="form-group">
        <label>ক্যাপশন</label>
        <input type="text" id="captionInput" placeholder="ক্যাপশন লিখুন..." maxlength="200">
        <div class="char-count"><span id="charCount">0</span>/200</div>
    </div>

    <div class="form-group">
        <label>সাউন্ড / মিউজিক</label>
        <input type="text" id="soundInput" placeholder="Original sound - WWC">
    </div>

    <button class="upload-btn" id="uploadBtn" disabled>আপলোড করুন</button>

    <div class="progress-container" id="progressContainer">
        <div class="progress-bar"><div class="bar" id="progressBar"></div></div>
        <div class="progress-text" id="progressText">আপলোড: 0%</div>
    </div>
</div>

<!-- বটম নেভ -->
<nav class="bottom-nav">
    <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>হোম</span></a>
    <a href="friends.html" class="nav-item"><i class="fas fa-user-friends"></i><span>বন্ধু</span></a>
    <a href="upload.html" class="nav-item active upload-btn"><i class="fas fa-plus"></i></a>
    <a href="inbox.html" class="nav-item"><i class="fas fa-message"></i><span>ইনবক্স</span></a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>প্রোফাইল</span></a>
</nav>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// Firebase ইতিমধ্যে initialized
const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');
const previewContainer = document.getElementById('previewContainer');
const videoPreview = document.getElementById('videoPreview');
const fileName = document.getElementById('fileName');
const fileSize = document.getElementById('fileSize');
const captionInput = document.getElementById('captionInput');
const soundInput = document.getElementById('soundInput');
const uploadBtn = document.getElementById('uploadBtn');
const progressContainer = document.getElementById('progressContainer');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const charCount = document.getElementById('charCount');
const toast = document.getElementById('toast');

let selectedFile = null;
let currentUser = null;
let toastTimer = null;

auth.onAuthStateChanged((user) => {
    if (!user) { window.location.href = 'auth.html'; return; }
    currentUser = user;
});

// Char count
captionInput.addEventListener('input', () => {
    charCount.textContent = captionInput.value.length;
});

// File selection
uploadBox.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) handleFile(e.target.files[0]);
});

// Drag and drop
uploadBox.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadBox.classList.add('dragover');
});

uploadBox.addEventListener('dragleave', () => {
    uploadBox.classList.remove('dragover');
});

uploadBox.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadBox.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
    if (!file) return;
    if (!file.type.startsWith('video/')) {
        showToast('❌ ভিডিও ফাইল সিলেক্ট করুন');
        return;
    }
    if (file.size > 100 * 1024 * 1024) {
        showToast('❌ 100MB এর বেশি বড়');
        return;
    }

    selectedFile = file;
    uploadBtn.disabled = false;

    // Show preview
    previewContainer.style.display = 'block';
    videoPreview.src = URL.createObjectURL(file);
    videoPreview.load();
    fileName.textContent = file.name;
    fileSize.textContent = (file.size / 1024 / 1024).toFixed(1) + ' MB';

    showToast('✅ ভিডিও সিলেক্ট করা হয়েছে');
}

// Upload
uploadBtn.addEventListener('click', async () => {
    if (!selectedFile || !currentUser) {
        showToast('❌ ভিডিও সিলেক্ট করুন');
        return;
    }

    uploadBtn.disabled = true;
    uploadBtn.textContent = 'আপলোড হচ্ছে...';
    progressContainer.style.display = 'block';
    progressBar.style.width = '0%';
    progressText.textContent = 'আপলোড: 0%';

    try {
        const fileName = `videos/${currentUser.uid}/${Date.now()}_${selectedFile.name}`;
        const storageRef = storage.ref(fileName);
        const uploadTask = storageRef.put(selectedFile);

        uploadTask.on('state_changed',
            (snapshot) => {
                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                progressBar.style.width = progress + '%';
                progressText.textContent = `আপলোড: ${Math.round(progress)}%`;
            },
            (error) => {
                console.error('Upload error:', error);
                showToast('❌ আপলোড ব্যর্থ হয়েছে');
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'আবার চেষ্টা করুন';
            },
            async () => {
                const downloadURL = await uploadTask.snapshot.ref.getDownloadURL();

                // Save to Firestore
                await db.collection('videos').add({
                    uid: currentUser.uid,
                    username: currentUser.displayName || 'wwc_user',
                    videoURL: downloadURL,
                    caption: captionInput.value.trim() || 'No caption',
                    sound: soundInput.value.trim() || 'Original sound - WWC',
                    likes: 0,
                    comments: 0,
                    saves: 0,
                    shares: 0,
                    likedBy: [],
                    savedBy: [],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('🎉 ভিডিও আপলোড হয়েছে!');
                uploadBtn.textContent = '✅ সম্পন্ন';
                progressText.textContent = '✅ আপলোড সম্পন্ন!';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            }
        );
    } catch (e) {
        console.error('Upload error:', e);
        showToast('❌ আপলোড ব্যর্থ হয়েছে');
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'আবার চেষ্টা করুন';
    }
});

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>

</body>
</html>
