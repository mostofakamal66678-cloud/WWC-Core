<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WWC Friends</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid #333;
      background: #111;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    .title {
      margin-left: 15px;
      font-size: 21px;
      font-weight: bold;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 18px 15px 90px;
    }

    .user-box {
      background: #181818;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 18px;
    }

    .user-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .my-avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
      border: 2px solid #fff;
    }

    .my-info {
      flex: 1;
      min-width: 0;
    }

    .my-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .my-handle {
      color: #999;
      font-size: 13px;
    }

    .stats {
      display: flex;
      gap: 25px;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }

    .stat {
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 18px;
    }

    .stat span {
      color: #999;
      font-size: 12px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #444;
      border-radius: 10px;
      outline: none;
      background: #181818;
      color: #fff;
      font-size: 15px;
    }

    #searchInput:focus {
      border-color: #777;
    }

    #searchBtn {
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      background: #fff;
      color: #000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 20px 0 12px;
    }

    .friend-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      margin-bottom: 10px;
      background: #181818;
      border: 1px solid #333;
      border-radius: 13px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
      border: 1px solid #555;
      flex-shrink: 0;
    }

    .friend-info {
      flex: 1;
      min-width: 0;
    }

    .friend-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .friend-handle {
      color: #999;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-buttons {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .profile-btn,
    .follow-btn {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .profile-btn {
      background: #fff;
      color: #000;
    }

    .follow-btn {
      background: #fe2c55;
      color: #fff;
    }

    .follow-btn.following {
      background: #333;
      border: 1px solid #777;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #888;
      background: #111;
      border-radius: 15px;
      border: 1px solid #222;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    #status {
      text-align: center;
      color: #aaa;
      padding: 15px 5px;
      min-height: 20px;
    }

    .error {
      color: #ff667f !important;
    }

    @media (max-width: 500px) {
      .container {
        padding-left: 10px;
        padding-right: 10px;
      }

      .card-buttons {
        flex-direction: column;
      }

      .profile-btn,
      .follow-btn {
        padding: 8px 10px;
        font-size: 12px;
      }

      .stats {
        gap: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <button
      class="back-btn"
      type="button"
      id="backBtn"
    >
      ←
    </button>

    <div class="title">
      👥 Friends
    </div>

  </header>


  <main class="container">

    <section class="user-box">

      <div class="user-top">

        <img
          id="myAvatar"
          class="my-avatar"
          src="./images/profile.png"
          alt="Profile"
        >

        <div class="my-info">

          <div
            id="myName"
            class="my-name"
          >
            Loading...
          </div>

          <div
            id="myHandle"
            class="my-handle"
          >
            @wwc_user
          </div>

        </div>

      </div>


      <div class="stats">

        <div class="stat">
          <strong id="followersCount">0</strong>
          <span>Followers</span>
        </div>

        <div class="stat">
          <strong id="followingCount">0</strong>
          <span>Following</span>
        </div>

      </div>

    </section>


    <div class="search-box">

      <input
        type="search"
        id="searchInput"
        placeholder="নাম বা username খুঁজুন..."
        autocomplete="off"
      >

      <button
        type="button"
        id="searchBtn"
      >
        🔍 Search
      </button>

    </div>


    <div
      id="status"
    >
      Friends লোড হচ্ছে...
    </div>


    <div class="section-title">
      👥 People on WWC
    </div>


    <section id="usersList"></section>

  </main>


  <script type="module">

    import {
      getApps,
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      getDoc,
      setDoc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

      authDomain:
        "world-wide-connect-62c87.firebaseapp.com",

      projectId:
        "world-wide-connect-62c87",

      storageBucket:
        "world-wide-connect-62c87.firebasestorage.app",

      messagingSenderId:
        "93178453668",

      appId:
        "1:93178453668:web:2184630caa8e61f7445031",

      measurementId:
        "G-PKFJ5NEMGQ"
    };


    // ==========================================
    // FIREBASE START
    // ==========================================

    const app =
      getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);


    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const backBtn =
      document.getElementById("backBtn");

    const myAvatar =
      document.getElementById("myAvatar");

    const myName =
      document.getElementById("myName");

    const myHandle =
      document.getElementById("myHandle");

    const followersCount =
      document.getElementById("followersCount");

    const followingCount =
      document.getElementById("followingCount");

    const searchInput =
      document.getElementById("searchInput");

    const searchBtn =
      document.getElementById("searchBtn");

    const usersList =
      document.getElementById("usersList");

    const status =
      document.getElementById("status");


    // ==========================================
    // VARIABLES
    // ==========================================

    let currentUser = null;

    let currentProfile = {};

    let allUsers = [];

    let followingIds = [];


    // ==========================================
    // DEFAULT PHOTO
    // ==========================================

    const defaultPhoto =
      "./images/profile.png";


    // ==========================================
    // BACK BUTTON
    // ==========================================

    backBtn.addEventListener(
      "click",
      () => {
        history.back();
      }
    );


    // ==========================================
    // LOAD MY PROFILE
    // ==========================================

    async function loadMyProfile() {

      if (!currentUser) {
        return;
      }

      try {

        const userRef =
          doc(
            db,
            "users",
            currentUser.uid
          );

        const snapshot =
          await getDoc(userRef);


        if (snapshot.exists()) {

          currentProfile =
            snapshot.data();

        } else {

          currentProfile = {

            name:
              currentUser.displayName
              || "WWC User",

            username:
              "wwc_user",

            photoURL:
              currentUser.photoURL
              || defaultPhoto,

            followers:
              0,

            following:
              0,

            likes:
              0

          };


          await setDoc(
            userRef,
            currentProfile
          );

        }


        myName.textContent =
          currentProfile.name
          || "WWC User";


        let username =
          currentProfile.username
          || "wwc_user";


        username =
          username.replace(
            /^@/,
            ""
          );


        myHandle.textContent =
          "@" + username;


        myAvatar.src =
          currentProfile.photoURL
          || defaultPhoto;


        followersCount.textContent =
          currentProfile.followers
          || 0;


        followingCount.textContent =
          currentProfile.following
          || 0;


        followingIds =
          Array.isArray(
            currentProfile.followingIds
          )
            ? currentProfile.followingIds
            : [];


      } catch (error) {

        console.error(
          "My profile error:",
          error
        );

        status.textContent =
          "❌ নিজের Profile লোড করা যায়নি।";

        status.classList.add("error");

      }

    }


    // ==========================================
    // LOAD ALL USERS
    // ==========================================

    async function loadUsers() {

      usersList.innerHTML = "";

      status.classList.remove("error");

      status.textContent =
        "⏳ Users লোড হচ্ছে...";


      try {

        const usersSnapshot =
          await getDocs(
            collection(
              db,
              "users"
            )
          );


        allUsers = [];


        usersSnapshot.forEach(
          (userDoc) => {

            const data =
              userDoc.data();


            if (
              userDoc.id !==
              currentUser.uid
            ) {

              allUsers.push({

                uid:
                  userDoc.id,

                ...data

              });

            }

          }
        );


        renderUsers(
          allUsers
        );


      } catch (error) {

        console.error(
          "Users load error:",
          error
        );

        status.textContent =
          "❌ Users লোড করা যায়নি।";

        status.classList.add(
          "error"
        );

      }

    }


    // ==========================================
    // RENDER USERS
    // ==========================================

    function renderUsers(
      users
    ) {

      usersList.innerHTML = "";


      if (!users.length) {

        status.textContent = "";

        usersList.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              👥
            </div>

            <div>
              এখনো অন্য কোনো User নেই।
            </div>

            <p>
              নতুন User Register করলে এখানে দেখা যাবে।
            </p>

          </div>

        `;

        return;

      }


      status.textContent =
        users.length +
        " জন User পাওয়া গেছে।";


      users.forEach(
        (user) => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "friend-card";


          const photo =
            user.photoURL
            || defaultPhoto;


          const name =
            user.name
            || user.displayName
            || "WWC User";


          let username =
            user.username
            || "wwc_user";


          username =
            username.replace(
              /^@/,
              ""
            );


          const isFollowing =
            followingIds.includes(
              user.uid
            );


          card.innerHTML = `

            <img
              class="avatar"
              src="${photo}"
              alt="Profile"
            >

            <div class="friend-info">

              <div class="friend-name">
                ${escapeHtml(name)}
              </div>

              <div class="friend-handle">
                @${escapeHtml(username)}
              </div>

            </div>

            <div class="card-buttons">

              <button
                type="button"
                class="profile-btn"
                data-profile="${user.uid}"
              >
                Profile
              </button>

              <button
                type="button"
                class="follow-btn ${
                  isFollowing
                    ? "following"
                    : ""
                }"
                data-follow="${user.uid}"
              >
                ${
                  isFollowing
                    ? "Following"
                    : "Follow"
                }
              </button>

            </div>

          `;


          usersList.appendChild(
            card
          );

        }
      );

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHtml(
      value
    ) {

      return String(value || "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ==========================================
    // FOLLOW / UNFOLLOW
    // ==========================================

    async function toggleFollow(
      targetUid
    ) {

      if (!currentUser) {
        return;
      }


      if (
        targetUid ===
        currentUser.uid
      ) {
        return;
      }


      try {

        const targetRef =
          doc(
            db,
            "users",
            targetUid
          );


        const myRef =
          doc(
            db,
            "users",
            currentUser.uid
          );


        const targetSnapshot =
          await getDoc(
            targetRef
          );


        const mySnapshot =
          await getDoc(
            myRef
          );


        if (
          !targetSnapshot.exists()
        ) {
          return;
        }


        const targetData =
          targetSnapshot.data();


        const myData =
          mySnapshot.exists()
            ? mySnapshot.data()
            : currentProfile;


        let myFollowing =
          Array.isArray(
            myData.followingIds
          )
            ? [...myData.followingIds]
            : [];


        let targetFollowers =
          Array.isArray(
            targetData.followerIds
          )
            ? [...targetData.followerIds]
            : [];


        const alreadyFollowing =
          myFollowing.includes(
            targetUid
          );


        if (alreadyFollowing) {

          myFollowing =
            myFollowing.filter(
              id =>
                id !== targetUid
            );


          targetFollowers =
            targetFollowers.filter(
              id =>
                id !== currentUser.uid
            );


        } else {

          myFollowing.push(
            targetUid
          );


          if (
            !targetFollowers.includes(
              currentUser.uid
            )
          ) {

            targetFollowers.push(
              currentUser.uid
            );

          }

        }


        const newFollowingCount =
          myFollowing.length;


        const newFollowersCount =
          targetFollowers.length;


        await updateDoc(
          myRef,
          {

            followingIds:
              myFollowing,

            following:
              newFollowingCount

          }
        );


        await updateDoc(
          targetRef,
          {

            followerIds:
              targetFollowers,

            followers:
              newFollowersCount

          }
        );


        followingIds =
          myFollowing;


        currentProfile.following =
          newFollowingCount;


        currentProfile.followingIds =
          myFollowing;


        followingCount.textContent =
          newFollowingCount;


        renderUsers(
          filterUsers()
        );


      } catch (error) {

        console.error(
          "Follow error:",
          error
        );


        status.textContent =
          "❌ Follow পরিবর্তন করা যায়নি।";

        status.classList.add(
          "error"
        );

      }

    }


    // ==========================================
    // USER CLICK EVENTS
    // ==========================================

    usersList.addEventListener(
      "click",
      async (event) => {

        const followButton =
          event.target.closest(
            "[data-follow]"
          );


        if (followButton) {

          const uid =
            followButton.dataset.follow;


          followButton.disabled =
            true;


          await toggleFollow(
            uid
          );


          followButton.disabled =
            false;


          return;

        }


        const profileButton =
          event.target.closest(
            "[data-profile]"
          );


        if (profileButton) {

          const uid =
            profileButton.dataset.profile;


          /*
           * পরে আমরা dedicated
           * user-profile.html তৈরি করে
           * UID পাঠাব।
           */

          window.location.href =
            "user-profile.html?uid=" +
            encodeURIComponent(uid);

        }

      }
    );


    // ==========================================
    // SEARCH
    // ==========================================

    function filterUsers() {

      const query =
        searchInput.value
          .trim()
          .toLowerCase();


      if (!query) {

        return allUsers;

      }


      return allUsers.filter(
        (user) => {

          const name =
            String(
              user.name
              || user.displayName
              || ""
            ).toLowerCase();


          const username =
            String(
              user.username
              || ""
            )
              .replace(
                /^@/,
                ""
              )
              .toLowerCase();


          return (
            name.includes(query)
            ||
            username.includes(query)
          );

        }
      );

    }


    function doSearch() {

      const results =
        filterUsers();


      renderUsers(
        results
      );

    }


    searchBtn.addEventListener(
      "click",
      doSearch
    );


    searchInput.addEventListener(
      "input",
      doSearch
    );


    searchInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          doSearch();

        }

      }
    );


    // ==========================================
    // AUTH
    // ==========================================

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          status.textContent =
            "❌ আগে Login করুন।";

          status.classList.add(
            "error"
          );


          setTimeout(
            () => {

              window.location.href =
                "./login.html";

            },
            1200
          );


          return;

        }


        currentUser =
          user;


        await loadMyProfile();

        await loadUsers();

      }
    );

  </script>

</body>
</html>
