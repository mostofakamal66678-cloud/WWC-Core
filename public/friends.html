<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Friends · WWC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    /* =====================================================
       TIKTOK STYLE FRIENDS
    ===================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      min-height: 100vh;
      padding-top: 50px;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* ===== টপ বার ===== */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .top-bar .back-btn {
      color: #fff;
      font-size: 22px;
      background: none;
      border: 0;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.15s;
    }
    .top-bar .back-btn:active {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(0.9);
    }
    .top-bar .title {
      font-size: 17px;
      font-weight: 700;
    }
    .top-bar .placeholder {
      width: 40px;
    }

    /* ===== হেডার ===== */
    .header {
      text-align: center;
      padding: 16px 0 20px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #25f4ee, #fe2c55);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      color: #888;
      font-size: 13px;
      margin-top: 4px;
    }

    /* ===== সার্চ বার ===== */
    .search-bar {
      max-width: 500px;
      margin: 0 auto 16px;
      padding: 0 16px;
    }
    .search-bar input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }
    .search-bar input:focus {
      border-color: #25f4ee;
    }
    .search-bar input::placeholder {
      color: #555;
    }

    /* ===== ফ্রেন্ডস লিস্ট ===== */
    .friend-list {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .friend-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      transition: background 0.15s;
      border-radius: 8px;
      padding-left: 8px;
      padding-right: 8px;
    }
    .friend-item:active {
      background: rgba(255, 255, 255, 0.03);
    }
    .friend-item img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: #222;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s;
    }
    .friend-item img:hover {
      border-color: #25f4ee;
    }
    .friend-item .info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .friend-item .info .name {
      font-weight: 600;
      font-size: 15px;
      color: #fff;
    }
    .friend-item .info .username {
      font-size: 12px;
      color: #888;
    }
    .friend-item .info .bio {
      font-size: 12px;
      color: #555;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .friend-item .follow-btn {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      border: 0;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .friend-item .follow-btn:active {
      transform: scale(0.95);
    }
    .friend-item .follow-btn.follow {
      background: #fff;
      color: #000;
    }
    .friend-item .follow-btn.following {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .friend-item .follow-btn.following:hover {
      background: rgba(255, 45, 85, 0.2);
      border-color: #ff2d55;
      color: #ff2d55;
    }

    /* ===== সাজেশন ===== */
    .suggestion-title {
      max-width: 500px;
      margin: 20px auto 12px;
      padding: 0 16px;
      font-size: 16px;
      font-weight: 600;
      color: #888;
    }
    .suggestion-title i {
      margin-right: 8px;
      color: #25f4ee;
    }

    /* ===== খালি অবস্থা ===== */
    .empty-state {
      text-align: center;
      color: #666;
      padding: 40px 0;
    }
    .empty-state i {
      font-size: 45px;
      color: #333;
      display: block;
      margin-bottom: 15px;
    }
    .empty-state .main-text {
      font-size: 16px;
      color: #888;
    }
    .empty-state .sub-text {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 40px 0;
    }
    .loading i {
      margin-right: 8px;
    }

    /* ===== টোস্ট ===== */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(30, 30, 30, 0.95);
      color: #fff;
      padding: 10px 22px;
      border-radius: 22px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 1000;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== অ্যানিমেশন ===== */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .friend-item {
      animation: fadeIn 0.3s ease;
    }
  </style>
</head>
<body>

<!-- ===== টপ বার ===== -->
<div class="top-bar">
  <button class="back-btn" onclick="window.location.href='./index.html'">
    <i class="fas fa-arrow-left"></i>
  </button>
  <span class="title"><i class="fas fa-user-friends" style="color:#25f4ee;margin-right:8px;"></i>Friends</span>
  <div class="placeholder"></div>
</div>

<!-- ===== হেডার ===== -->
<div class="header">
  <h1>👥 Friends</h1>
  <p>আপনি যাদের Follow করেন তাদের তালিকা</p>
</div>

<!-- ===== সার্চ বার ===== -->
<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍 Search friends..." />
</div>

<!-- ===== ফ্রেন্ডস লিস্ট ===== -->
<div class="friend-list" id="friendList">
  <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
</div>

<!-- ===== টোস্ট ===== -->
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { 
  getFirestore, 
  doc, 
  getDoc, 
  getDocs, 
  updateDoc, 
  collection, 
  query, 
  where,
  runTransaction 
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

// ===== Firebase Config =====
const firebaseConfig = {
  apiKey: "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",
  authDomain: "world-wide-connect-62c87.firebaseapp.com",
  projectId: "world-wide-connect-62c87",
  storageBucket: "world-wide-connect-62c87.firebasestorage.app",
  messagingSenderId: "93178453668",
  appId: "1:93178453668:web:2184630caa8e61f7445031",
  measurementId: "G-PKFJ5NEMGQ"
};

// ===== Init Firebase =====
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const auth = getAuth(app);
const db = getFirestore(app);

console.log("✅ Firebase Initialized!");

// ===== DOM =====
const friendList = document.getElementById('friendList');
const searchInput = document.getElementById('searchInput');
const toast = document.getElementById('toast');

let currentUser = null;
let allFriends = [];
let filteredFriends = [];
let toastTimer = null;

// ===== Toast =====
function showToast(text) {
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ===== Load Friends =====
async function loadFriends(user) {
  try {
    const userSnap = await getDoc(doc(db, 'users', user.uid));
    if (!userSnap.exists()) {
      friendList.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-user-plus"></i>
          <div class="main-text">No friends yet</div>
          <div class="sub-text">Follow users to see them here</div>
        </div>`;
      return;
    }

    const data = userSnap.data();
    const followingIds = Array.isArray(data.followingIds) ? data.followingIds : [];

    if (!followingIds.length) {
      friendList.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-user-plus"></i>
          <div class="main-text">You're not following anyone yet</div>
          <div class="sub-text">Follow users to see them here</div>
        </div>`;
      return;
    }

    // Load each user's data
    const friends = [];
    for (const uid of followingIds) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (snap.exists()) {
          friends.push({ uid, ...snap.data() });
        }
      } catch (e) {}
    }

    allFriends = friends;
    filteredFriends = [...friends];
    renderFriends(friends);

  } catch (e) {
    console.error('Load friends error:', e);
    friendList.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-exclamation-circle"></i>
        <div class="main-text">Could not load friends</div>
        <div class="sub-text">Please try again</div>
      </div>`;
  }
}

// ===== Render Friends =====
function renderFriends(friends) {
  if (!friends.length) {
    friendList.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-user-slash"></i>
        <div class="main-text">No matching friends found</div>
      </div>`;
    return;
  }

  friendList.innerHTML = friends.map(f => `
    <div class="friend-item" data-uid="${f.uid}">
      <img src="${f.photoURL || './images/profile.png'}" 
           onerror="this.src='./images/profile.png'" 
           alt="${f.name || 'User'}" 
           onclick="window.location.href='./profile.html?uid=${f.uid}'">
      <div class="info" onclick="window.location.href='./profile.html?uid=${f.uid}'">
        <div class="name">${f.name || 'WWC User'}</div>
        <div class="username">${f.username ? '@' + f.username : '@' + f.uid?.substring(0, 8)}</div>
        ${f.bio ? `<div class="bio">${f.bio.substring(0, 50)}</div>` : ''}
      </div>
      <button class="follow-btn following" onclick="unfollowUser('${f.uid}', this)">
        Following
      </button>
    </div>
  `).join('');
}

// =====================================================
// ✅ UNFOLLOW - সম্পূর্ণ ফিক্সড
// =====================================================
window.unfollowUser = async function(uid, btn) {
  if (!currentUser) return;
  btn.disabled = true;
  btn.textContent = '...';

  try {
    const myRef = doc(db, 'users', currentUser.uid);
    const targetRef = doc(db, 'users', uid);

    await runTransaction(db, async (t) => {
      const mySnap = await t.get(myRef);
      const targetSnap = await t.get(targetRef);
      
      if (!mySnap.exists() || !targetSnap.exists()) return;

      const myData = mySnap.data();
      const targetData = targetSnap.data();

      const followingIds = Array.isArray(myData.followingIds) ? myData.followingIds : [];
      const followerIds = Array.isArray(targetData.followerIds) ? targetData.followerIds : [];

      t.update(myRef, {
        followingIds: followingIds.filter(id => id !== uid),
        following: Math.max(0, (myData.following || 0) - 1)
      });

      t.update(targetRef, {
        followerIds: followerIds.filter(id => id !== currentUser.uid),
        followers: Math.max(0, (targetData.followers || 0) - 1)
      });
    });

    // Remove from UI
    const item = btn.closest('.friend-item');
    item.style.animation = 'fadeIn 0.2s reverse';
    setTimeout(() => {
      item.remove();
      // Update the list
      allFriends = allFriends.filter(f => f.uid !== uid);
      filteredFriends = filteredFriends.filter(f => f.uid !== uid);
      if (!friendList.children.length) {
        friendList.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-user-plus"></i>
            <div class="main-text">You're not following anyone yet</div>
            <div class="sub-text">Follow users to see them here</div>
          </div>`;
      }
    }, 200);

    showToast('✅ Unfollowed successfully');

  } catch (e) {
    console.error('Unfollow error:', e);
    showToast('❌ Could not unfollow');
    btn.disabled = false;
    btn.textContent = 'Following';
  }
};

// =====================================================
// ✅ SEARCH
// =====================================================
searchInput.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  
  if (!query) {
    filteredFriends = [...allFriends];
    renderFriends(filteredFriends);
    return;
  }

  filteredFriends = allFriends.filter(f => {
    const name = (f.name || '').toLowerCase();
    const username = (f.username || '').toLowerCase();
    return name.includes(query) || username.includes(query);
  });

  renderFriends(filteredFriends);
});

// =====================================================
// ✅ AUTH
// =====================================================
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    friendList.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-lock"></i>
        <div class="main-text">Please login to see your friends</div>
        <button class="follow-btn follow" style="margin-top:12px;padding:10px 24px;border-radius:22px;font-size:14px;" 
                onclick="window.location.href='./auth.html'">
          Login
        </button>
      </div>`;
    return;
  }

  currentUser = user;
  await loadFriends(user);
});

console.log('✅ Friends Page Loaded!');
</script>
</body>
</html>
