<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Friends · WWC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;padding:60px 16px 30px}
    .back-btn{position:fixed;top:16px;left:16px;color:#fff;font-size:20px;background:rgba(255,255,255,0.1);border:0;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);z-index:10}
    .back-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.2)}
    .header{text-align:center;margin-bottom:25px}
    .header h1{font-size:22px;font-weight:700}
    .header p{color:#888;font-size:13px;margin-top:4px}
    .friend-list{max-width:500px;margin:0 auto}
    .friend-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
    .friend-item img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#222}
    .friend-item .info{flex:1}
    .friend-item .info .name{font-weight:600;font-size:15px}
    .friend-item .info .username{font-size:12px;color:#888}
    .friend-item .unfollow-btn{padding:6px 14px;border-radius:6px;background:rgba(255,45,85,0.15);color:#ff2d55;font-size:12px;font-weight:600;border:1px solid rgba(255,45,85,0.2);cursor:pointer}
    .friend-item .unfollow-btn:active{transform:scale(0.95)}
    .empty-state{text-align:center;color:#666;padding:40px 0}
    .empty-state i{font-size:40px;color:#333;display:block;margin-bottom:15px}
    .loading{text-align:center;color:#666;padding:40px 0}
    .loading i{margin-right:8px}
  </style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='./index.html'">
  <i class="fas fa-arrow-left"></i>
</button>

<div class="header">
  <h1><i class="fas fa-user-friends" style="color:#25f4ee;margin-right:8px;"></i>Friends</h1>
  <p>আপনি যাদের Follow করেন তাদের তালিকা</p>
</div>

<div class="friend-list" id="friendList">
  <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
</div>

<script type="module">
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, arrayRemove, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",
  authDomain: "world-wide-connect-62c87.firebaseapp.com",
  projectId: "world-wide-connect-62c87",
  storageBucket: "world-wide-connect-62c87.firebasestorage.app",
  messagingSenderId: "93178453668",
  appId: "1:93178453668:web:2184630caa8e61f7445031"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const defaultPhoto = "./images/profile.png";

function showToast(text) {
  const toast = document.getElementById('toast') || (() => {
    const t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,30,30,0.95);color:#fff;padding:10px 22px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:all 0.3s;z-index:1000;white-space:nowrap;';
    document.body.appendChild(t);
    return t;
  })();
  toast.textContent = text;
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2000);
}

async function loadFriends(user) {
  const list = document.getElementById('friendList');
  
  try {
    const userSnap = await getDoc(doc(db, 'users', user.uid));
    if (!userSnap.exists()) {
      list.innerHTML = `<div class="empty-state"><i class="fas fa-user-plus"></i>No friends yet</div>`;
      return;
    }
    
    const data = userSnap.data();
    const followingIds = Array.isArray(data.followingIds) ? data.followingIds : [];
    
    if (!followingIds.length) {
      list.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-user-plus"></i>
          <div style="font-size:16px;color:#888;margin-bottom:6px;">You're not following anyone yet</div>
          <div style="font-size:13px;color:#555;">Follow users to see them here</div>
        </div>
      `;
      return;
    }
    
    // ফলোয়িং ইউজারদের ডেটা আনুন
    const users = [];
    for (const uid of followingIds) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (snap.exists()) {
          users.push({ uid, ...snap.data() });
        }
      } catch (e) { console.warn('User not found:', uid); }
    }
    
    if (!users.length) {
      list.innerHTML = `<div class="empty-state"><i class="fas fa-user-slash"></i>No friends found</div>`;
      return;
    }
    
    list.innerHTML = users.map(u => `
      <div class="friend-item">
        <img src="${u.photoURL || defaultPhoto}" onerror="this.src='${defaultPhoto}'" alt="${u.name || 'User'}">
        <div class="info">
          <div class="name">${u.name || 'WWC User'}</div>
          <div class="username">@${u.username || u.uid?.substring(0,8) || 'user'}</div>
        </div>
        <button class="unfollow-btn" data-uid="${u.uid}" onclick="unfollowUser('${u.uid}', this)">Unfollow</button>
      </div>
    `).join('');
    
  } catch (e) {
    console.error('Load friends error:', e);
    list.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i>Could not load friends</div>`;
  }
}

window.unfollowUser = async function(uid, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  
  try {
    const user = auth.currentUser;
    if (!user) return;
    
    const myRef = doc(db, 'users', user.uid);
    const targetRef = doc(db, 'users', uid);
    
    // Get current data
    const mySnap = await getDoc(myRef);
    const targetSnap = await getDoc(targetRef);
    
    if (!mySnap.exists() || !targetSnap.exists()) {
      showToast('User not found');
      btn.disabled = false;
      btn.textContent = 'Unfollow';
      return;
    }
    
    const myData = mySnap.data();
    const targetData = targetSnap.data();
    
    const following = Array.isArray(myData.followingIds) ? myData.followingIds : [];
    const followers = Array.isArray(targetData.followerIds) ? targetData.followerIds : [];
    
    // Remove from following
    await updateDoc(myRef, {
      followingIds: following.filter(id => id !== uid),
      following: Math.max(0, (myData.following || 0) - 1)
    });
    
    // Remove from followers
    await updateDoc(targetRef, {
      followerIds: followers.filter(id => id !== user.uid),
      followers: Math.max(0, (targetData.followers || 0) - 1)
    });
    
    showToast('Unfollowed successfully');
    btn.closest('.friend-item').remove();
    
    // Check if list is empty
    const items = document.querySelectorAll('.friend-item');
    if (!items.length) {
      document.getElementById('friendList').innerHTML = `
        <div class="empty-state">
          <i class="fas fa-user-plus"></i>
          <div style="font-size:16px;color:#888;margin-bottom:6px;">You're not following anyone yet</div>
        </div>
      `;
    }
    
  } catch (e) {
    console.error('Unfollow error:', e);
    showToast('Could not unfollow');
    btn.disabled = false;
    btn.textContent = 'Unfollow';
  }
};

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById('friendList').innerHTML = `
      <div class="empty-state">
        <i class="fas fa-lock"></i>
        <div style="font-size:16px;color:#888;">Please login to see your friends</div>
        <a href="./auth.html" style="color:#4f46e5;text-decoration:none;margin-top:10px;display:inline-block;">Login</a>
      </div>
    `;
    return;
  }
  await loadFriends(user);
});
</script>

</body>
</html>
