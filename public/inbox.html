<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>WWC Inbox</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      background: #111;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    .title {
      margin-left: 15px;
      font-size: 21px;
      font-weight: bold;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 15px 12px 90px;
    }

    .search-box {
      margin-bottom: 15px;
    }

    #searchInput {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #444;
      border-radius: 12px;
      background: #181818;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    #searchInput:focus {
      border-color: #777;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 15px 3px 12px;
    }

    #usersList {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      border: 1px solid #333;
      border-radius: 13px;
      background: #181818;
      color: #fff;
      cursor: pointer;
      text-align: left;
    }

    .user-card:active {
      background: #252525;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
      border: 1px solid #555;
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-handle {
      color: #999;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-icon {
      font-size: 21px;
      flex-shrink: 0;
    }

    .status {
      text-align: center;
      color: #999;
      padding: 25px 10px;
    }

    .error {
      color: #ff6684;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      background: #111;
      border: 1px solid #222;
      border-radius: 14px;
      color: #888;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    /* ==========================================
       CHAT SCREEN
       ========================================== */

    #chatScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 500;
    }

    .chat-header {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      background: #111;
      border-bottom: 1px solid #333;
    }

    .chat-back {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 23px;
      cursor: pointer;
    }

    .chat-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
    }

    .chat-user-info {
      flex: 1;
      min-width: 0;
    }

    .chat-user-name {
      font-weight: bold;
      font-size: 16px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-user-handle {
      color: #888;
      font-size: 12px;
    }

    .profile-open-btn {
      border: 0;
      border-radius: 9px;
      background: #222;
      color: #fff;
      padding: 9px;
      cursor: pointer;
    }

    .messages {
      position: absolute;
      top: 64px;
      bottom: 72px;
      left: 0;
      right: 0;
      overflow-y: auto;
      padding: 15px 12px;
    }

    .message-row {
      display: flex;
      margin: 8px 0;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 16px;
      background: #222;
      color: #fff;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message-row.mine .message-bubble {
      background: #fe2c55;
    }

    .message-time {
      display: block;
      font-size: 10px;
      opacity: .65;
      margin-top: 4px;
      text-align: right;
    }

    .chat-input-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #111;
      border-top: 1px solid #333;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      resize: none;
      height: 45px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 22px;
      outline: none;
      background: #1c1c1c;
      color: #fff;
      font-size: 15px;
    }

    #sendBtn {
      width: 45px;
      height: 45px;
      border: 0;
      border-radius: 50%;
      background: #fe2c55;
      color: #fff;
      font-size: 19px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #sendBtn:disabled {
      opacity: .5;
    }

    .no-messages {
      text-align: center;
      color: #777;
      padding: 50px 15px;
    }

    @media (max-width: 500px) {
      .container {
        padding-left: 9px;
        padding-right: 9px;
      }

      .message-bubble {
        max-width: 85%;
      }
    }
  </style>
</head>

<body>

  <!-- ==========================================
       INBOX
       ========================================== -->

  <header class="header">

    <button
      id="backBtn"
      class="back-btn"
      type="button"
    >
      ←
    </button>

    <div class="title">
      💬 Inbox
    </div>

  </header>


  <main class="container">

    <div class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="নাম বা username খুঁজুন..."
        autocomplete="off"
      >

    </div>


    <div class="section-title">
      💬 Message
    </div>


    <div
      id="status"
      class="status"
    >
      ⏳ Users লোড হচ্ছে...
    </div>


    <section id="usersList"></section>

  </main>


  <!-- ==========================================
       CHAT SCREEN
       ========================================== -->

  <section id="chatScreen">

    <header class="chat-header">

      <button
        id="chatBackBtn"
        class="chat-back"
        type="button"
      >
        ←
      </button>


      <img
        id="chatAvatar"
        class="chat-avatar"
        src="./images/profile.png"
        alt="User"
      >


      <div class="chat-user-info">

        <div
          id="chatUserName"
          class="chat-user-name"
        >
          User
        </div>

        <div
          id="chatUserHandle"
          class="chat-user-handle"
        >
          @wwc_user
        </div>

      </div>


      <button
        id="profileOpenBtn"
        class="profile-open-btn"
        type="button"
        aria-label="Open profile"
      >
        👤
      </button>

    </header>


    <div
      id="messages"
      class="messages"
    ></div>


    <div class="chat-input-area">

      <textarea
        id="messageInput"
        maxlength="1000"
        placeholder="Message লিখুন..."
      ></textarea>


      <button
        id="sendBtn"
        type="button"
        aria-label="Send message"
      >
        ➤
      </button>

    </div>

  </section>


  <script type="module">

    // ==========================================
    // FIREBASE
    // ==========================================

    import {
      getApps,
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      getDoc,
      addDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

      authDomain:
        "world-wide-connect-62c87.firebaseapp.com",

      projectId:
        "world-wide-connect-62c87",

      storageBucket:
        "world-wide-connect-62c87.firebasestorage.app",

      messagingSenderId:
        "93178453668",

      appId:
        "1:93178453668:web:2184630caa8e61f7445031",

      measurementId:
        "G-PKFJ5NEMGQ"

    };


    // ==========================================
    // START FIREBASE
    // ==========================================

    const app =
      getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const backBtn =
      document.getElementById("backBtn");

    const searchInput =
      document.getElementById("searchInput");

    const status =
      document.getElementById("status");

    const usersList =
      document.getElementById("usersList");

    const chatScreen =
      document.getElementById("chatScreen");

    const chatBackBtn =
      document.getElementById("chatBackBtn");

    const chatAvatar =
      document.getElementById("chatAvatar");

    const chatUserName =
      document.getElementById("chatUserName");

    const chatUserHandle =
      document.getElementById("chatUserHandle");

    const profileOpenBtn =
      document.getElementById("profileOpenBtn");

    const messages =
      document.getElementById("messages");

    const messageInput =
      document.getElementById("messageInput");

    const sendBtn =
      document.getElementById("sendBtn");


    // ==========================================
    // VARIABLES
    // ==========================================

    const defaultPhoto =
      "./images/profile.png";

    let currentUser =
      null;

    let allUsers =
      [];

    let selectedUser =
      null;

    let unsubscribeMessages =
      null;


    // ==========================================
    // BACK
    // ==========================================

    backBtn.addEventListener(
      "click",
      () => {
        history.back();
      }
    );


    chatBackBtn.addEventListener(
      "click",
      closeChat
    );


    // ==========================================
    // LOAD USERS
    // ==========================================

    async function loadUsers() {

      status.textContent =
        "⏳ Users লোড হচ্ছে...";

      status.classList.remove(
        "error"
      );


      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "users"
            )
          );


        allUsers = [];


        snapshot.forEach(
          userDoc => {

            if (
              userDoc.id ===
              currentUser.uid
            ) {
              return;
            }


            allUsers.push({

              uid:
                userDoc.id,

              ...userDoc.data()

            });

          }
        );


        renderUsers(
          allUsers
        );


      } catch (error) {

        console.error(
          "Users error:",
          error
        );

        status.textContent =
          "❌ Users লোড করা যায়নি।";

        status.classList.add(
          "error"
        );

      }

    }


    // ==========================================
    // RENDER USERS
    // ==========================================

    function renderUsers(
      users
    ) {

      usersList.innerHTML =
        "";


      if (!users.length) {

        status.textContent =
          "";

        usersList.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              💬
            </div>

            <div>
              এখনো অন্য কোনো User নেই।
            </div>

          </div>

        `;

        return;

      }


      status.textContent =
        users.length +
        " জন User";


      users.forEach(
        user => {

          const button =
            document.createElement(
              "button"
            );

          button.type =
            "button";

          button.className =
            "user-card";

          button.dataset.uid =
            user.uid;


          const name =
            user.name
            || user.displayName
            || "WWC User";


          let username =
            user.username
            || "wwc_user";


          username =
            String(username)
              .replace(
                /^@/,
                ""
              );


          const photo =
            user.photoURL
            || defaultPhoto;


          button.innerHTML = `

            <img
              class="avatar"
              src="${escapeHtml(photo)}"
              alt="Profile"
            >

            <div class="user-info">

              <div class="user-name">
                ${escapeHtml(name)}
              </div>

              <div class="user-handle">
                @${escapeHtml(username)}
              </div>

            </div>

            <div class="chat-icon">
              💬
            </div>

          `;


          usersList.appendChild(
            button
          );

        }
      );

    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHtml(
      value
    ) {

      return String(value || "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ==========================================
    // SEARCH
    // ==========================================

    searchInput.addEventListener(
      "input",
      () => {

        const text =
          searchInput.value
            .trim()
            .toLowerCase();


        if (!text) {

          renderUsers(
            allUsers
          );

          return;

        }


        const filtered =
          allUsers.filter(
            user => {

              const name =
                String(
                  user.name
                  || user.displayName
                  || ""
                ).toLowerCase();


              const username =
                String(
                  user.username
                  || ""
                )
                  .replace(
                    /^@/,
                    ""
                  )
                  .toLowerCase();


              return (
                name.includes(text)
                ||
                username.includes(text)
              );

            }
          );


        renderUsers(
          filtered
        );

      }
    );


    // ==========================================
    // USER CLICK
    // ==========================================

    usersList.addEventListener(
      "click",
      event => {

        const card =
          event.target.closest(
            ".user-card"
          );


        if (!card) {
          return;
        }


        const uid =
          card.dataset.uid;


        const user =
          allUsers.find(
            item =>
              item.uid === uid
          );


        if (user) {

          openChat(
            user
          );

        }

      }
    );


    // ==========================================
    // OPEN CHAT
    // ==========================================

    function openChat(
      user
    ) {

      selectedUser =
        user;


      const name =
        user.name
        || user.displayName
        || "WWC User";


      let username =
        user.username
        || "wwc_user";


      username =
        String(username)
          .replace(
            /^@/,
            ""
          );


      chatUserName.textContent =
        name;


      chatUserHandle.textContent =
        "@" + username;


      chatAvatar.src =
        user.photoURL
        || defaultPhoto;


      chatScreen.style.display =
        "block";


      messages.innerHTML = `

        <div class="no-messages">
          ⏳ Messages লোড হচ্ছে...
        </div>

      `;


      listenToMessages();


      setTimeout(
        () => {
          messageInput.focus();
        },
        100
      );

    }


    // ==========================================
    // CHAT ID
    // ==========================================

    function getChatId(
      uid1,
      uid2
    ) {

      return [
        uid1,
        uid2
      ]
        .sort()
        .join("_");

    }


    // ==========================================
    // LISTEN MESSAGES
    // ==========================================

    function listenToMessages() {

      if (
        !currentUser
        ||
        !selectedUser
      ) {
        return;
      }


      if (unsubscribeMessages) {

        unsubscribeMessages();

        unsubscribeMessages =
          null;

      }


      const chatId =
        getChatId(
          currentUser.uid,
          selectedUser.uid
        );


      const messagesRef =
        collection(
          db,
          "chats",
          chatId,
          "messages"
        );


      const messagesQuery =
        query(
          messagesRef,
          orderBy(
            "createdAt",
            "asc"
          )
        );


      unsubscribeMessages =
        onSnapshot(
          messagesQuery,
          snapshot => {

            messages.innerHTML =
              "";


            if (
              snapshot.empty
            ) {

              messages.innerHTML = `

                <div class="no-messages">
                  💬 এখনো কোনো Message নেই।<br>
                  প্রথম Message পাঠান।
                </div>

              `;

              return;

            }


            snapshot.forEach(
              messageDoc => {

                const data =
                  messageDoc.data();


                const row =
                  document.createElement(
                    "div"
                  );


                row.className =
                  "message-row";


                if (
                  data.senderId ===
                  currentUser.uid
                ) {

                  row.classList.add(
                    "mine"
                  );

                }


                const bubble =
                  document.createElement(
                    "div"
                  );


                bubble.className =
                  "message-bubble";


                bubble.textContent =
                  data.text
                  || "";


                const time =
                  document.createElement(
                    "span"
                  );


                time.className =
                  "message-time";


                time.textContent =
                  formatTime(
                    data.createdAt
                  );


                bubble.appendChild(
                  time
                );


                row.appendChild(
                  bubble
                );


                messages.appendChild(
                  row
                );

              }
            );


            scrollMessages();

          },
          error => {

            console.error(
              "Message listener error:",
              error
            );


            messages.innerHTML = `

              <div class="no-messages">
                ❌ Messages লোড করা যায়নি।
              </div>

            `;

          }
        );

    }


    // ==========================================
    // SEND MESSAGE
    // ==========================================

    async function sendMessage() {

      if (
        !currentUser
        ||
        !selectedUser
      ) {
        return;
      }


      const text =
        messageInput.value.trim();


      if (!text) {
        return;
      }


      sendBtn.disabled =
        true;


      try {

        const chatId =
          getChatId(
            currentUser.uid,
            selectedUser.uid
          );


        await addDoc(
          collection(
            db,
            "chats",
            chatId,
            "messages"
          ),
          {

            senderId:
              currentUser.uid,

            receiverId:
              selectedUser.uid,

            text:
              text,

            createdAt:
              serverTimestamp()

          }
        );


        messageInput.value =
          "";


        scrollMessages();


      } catch (error) {

        console.error(
          "Send message error:",
          error
        );


        alert(
          "❌ Message পাঠানো যায়নি।"
        );

      }


      sendBtn.disabled =
        false;


      messageInput.focus();

    }


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    // ==========================================
    // ENTER TO SEND
    // ==========================================

    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
          &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    // ==========================================
    // SCROLL
    // ==========================================

    function scrollMessages() {

      requestAnimationFrame(
        () => {

          messages.scrollTop =
            messages.scrollHeight;

        }
      );

    }


    // ==========================================
    // TIME
    // ==========================================

    function formatTime(
      timestamp
    ) {

      if (
        !timestamp
        ||
        !timestamp.toDate
      ) {

        return "";

      }


      const date =
        timestamp.toDate();


      return date.toLocaleTimeString(
        "bn-BD",
        {
          hour: "numeric",
          minute: "2-digit"
        }
      );

    }


    // ==========================================
    // CLOSE CHAT
    // ==========================================

    function closeChat() {

      if (
        unsubscribeMessages
      ) {

        unsubscribeMessages();

        unsubscribeMessages =
          null;

      }


      selectedUser =
        null;


      chatScreen.style.display =
        "none";


      messages.innerHTML =
        "";

    }


    // ==========================================
    // OPEN USER PROFILE
    // ==========================================

    profileOpenBtn.addEventListener(
      "click",
      () => {

        if (
          selectedUser
        ) {

          window.location.href =
            "user-profile.html?uid=" +
            encodeURIComponent(
              selectedUser.uid
            );

        }

      }
    );


    // ==========================================
    // AUTH
    // ==========================================

    onAuthStateChanged(
      auth,
      async user => {

        if (!user) {

          status.textContent =
            "❌ আগে Login করুন।";

          status.classList.add(
            "error"
          );


          setTimeout(
            () => {

              window.location.href =
                "./login.html";

            },
            1200
          );


          return;

        }


        currentUser =
          user;


        await loadUsers();

      }
    );

  </script>

</body>
</html>
