<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Inbox · WWC</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;min-height:100vh;padding:60px 16px 30px}
    .back-btn{position:fixed;top:16px;left:16px;color:#fff;font-size:20px;background:rgba(255,255,255,0.1);border:0;width:44px;height:44px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);z-index:10}
    .back-btn:active{transform:scale(0.92);background:rgba(255,255,255,0.2)}
    .header{text-align:center;margin-bottom:25px}
    .header h1{font-size:22px;font-weight:700}
    .header p{color:#888;font-size:13px;margin-top:4px}
    .inbox-list{max-width:500px;margin:0 auto}
    .inbox-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer}
    .inbox-item:active{background:rgba(255,255,255,0.03)}
    .inbox-item img{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#222}
    .inbox-item .info{flex:1}
    .inbox-item .info .name{font-weight:600;font-size:15px}
    .inbox-item .info .msg{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
    .inbox-item .time{font-size:11px;color:#555}
    .inbox-item .unread{width:10px;height:10px;border-radius:50%;background:#25f4ee;flex-shrink:0}
    .empty-state{text-align:center;color:#666;padding:50px 0}
    .empty-state i{font-size:45px;color:#333;display:block;margin-bottom:15px}
    .loading{text-align:center;color:#666;padding:40px 0}
    .loading i{margin-right:8px}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,30,30,0.95);color:#fff;padding:10px 22px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:1000;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  </style>
</head>
<body>
<button class="back-btn" onclick="window.location.href='./index.html'"><i class="fas fa-arrow-left"></i></button>
<div class="header"><h1><i class="fas fa-inbox" style="color:#25f4ee;margin-right:8px;"></i>Inbox</h1><p>আপনার মেসেজ এবং নোটিফিকেশন</p></div>
<div class="inbox-list" id="inboxList"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div>
<div class="toast" id="toast"></div>
<script type="module">
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, getDocs, limit } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",
  authDomain: "world-wide-connect-62c87.firebaseapp.com",
  projectId: "world-wide-connect-62c87",
  storageBucket: "world-wide-connect-62c87.firebasestorage.app",
  messagingSenderId: "93178453668",
  appId: "1:93178453668:web:2184630caa8e61f7445031"
};
const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const defaultPhoto = "./images/profile.png";

function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

async function loadInbox(user) {
  const list = document.getElementById('inboxList');
  try {
    const dummyData = [
      { name: 'Alex Wander', msg: '❤️ Liked your video!', time: '2m ago', unread: true, photo: 'https://i.pravatar.cc/100?img=11' },
      { name: 'Luna Creates', msg: '💬 Commented: "Amazing video!"', time: '15m ago', unread: true, photo: 'https://i.pravatar.cc/100?img=25' },
      { name: 'Mike Travels', msg: '🔖 Saved your video', time: '1h ago', unread: false, photo: 'https://i.pravatar.cc/100?img=33' },
      { name: 'Sara Khan', msg: '✅ Started following you', time: '3h ago', unread: false, photo: 'https://i.pravatar.cc/100?img=44' },
      { name: 'John Doe', msg: '📤 Shared your video', time: '5h ago', unread: false, photo: 'https://i.pravatar.cc/100?img=55' },
    ];
    list.innerHTML = dummyData.map(item => `
      <div class="inbox-item" onclick="showToast('Opening message...')">
        <img src="${item.photo}" onerror="this.src='${defaultPhoto}'" alt="${item.name}">
        <div class="info"><div class="name">${item.name}</div><div class="msg">${item.msg}</div></div>
        <div class="time">${item.time}</div>
        ${item.unread ? '<div class="unread"></div>' : ''}
      </div>
    `).join('');
    try {
      const q = query(collection(db, 'comments'), where('uid', '==', user.uid), orderBy('createdAt', 'desc'), limit(10));
      const snap = await getDocs(q);
      if (!snap.empty) console.log('Found user comments:', snap.size);
    } catch (e) {}
  } catch (e) { console.error('Inbox error:', e); list.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i>Could not load inbox</div>`; }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById('inboxList').innerHTML = `<div class="empty-state"><i class="fas fa-lock"></i><div style="font-size:16px;color:#888;">Please login to see your messages</div><a href="./auth.html" style="color:#4f46e5;text-decoration:none;margin-top:10px;display:inline-block;">Login</a></div>`;
    return;
  }
  await loadInbox(user);
});
</script>
</body>
</html>
