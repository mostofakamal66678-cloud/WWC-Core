<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>WWC Inbox</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      background: #111;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    .title {
      margin-left: 15px;
      font-size: 21px;
      font-weight: bold;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 15px 12px 90px;
    }

    .search-box {
      display: flex;
      margin-bottom: 15px;
    }

    #searchInput {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #333;
      border-radius: 12px;
      outline: none;
      background: #181818;
      color: #fff;
      font-size: 15px;
    }

    #searchInput:focus {
      border-color: #777;
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
      margin: 15px 3px 10px;
    }

    .conversation {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px;
      margin-bottom: 8px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 13px;
      cursor: pointer;
    }

    .conversation:active {
      transform: scale(.99);
    }

    .avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      background: #333;
      border: 1px solid #555;
      flex-shrink: 0;
    }

    .conversation-info {
      flex: 1;
      min-width: 0;
    }

    .name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .name {
      font-size: 16px;
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time {
      color: #777;
      font-size: 11px;
      flex-shrink: 0;
    }

    .handle {
      color: #888;
      font-size: 12px;
      margin-top: 3px;
    }

    .last-message {
      color: #aaa;
      font-size: 13px;
      margin-top: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      background: #111;
      border: 1px solid #222;
      border-radius: 15px;
      margin-top: 15px;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .status {
      text-align: center;
      color: #999;
      padding: 15px 5px;
      min-height: 20px;
    }

    .error {
      color: #ff6684 !important;
    }

    @media (max-width: 500px) {
      .container {
        padding-left: 8px;
        padding-right: 8px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <button
      id="backBtn"
      class="back-btn"
      type="button"
    >
      ←
    </button>

    <div class="title">
      💬 Inbox
    </div>

  </header>


  <main class="container">

    <div class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="নাম বা username খুঁজুন..."
        autocomplete="off"
      >

    </div>


    <div
      id="status"
      class="status"
    >
      Inbox লোড হচ্ছে...
    </div>


    <div class="section-title">
      💬 Messages
    </div>


    <section id="conversationList"></section>

  </main>


  <script type="module">

    // ==========================================
    // FIREBASE
    // ==========================================

    import {
      getApps,
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIG
    // ==========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyCgio17aPEfR7d6juqIhn3yi6Mf65W_tO4",

      authDomain:
        "world-wide-connect-62c87.firebaseapp.com",

      projectId:
        "world-wide-connect-62c87",

      storageBucket:
        "world-wide-connect-62c87.firebasestorage.app",

      messagingSenderId:
        "93178453668",

      appId:
        "1:93178453668:web:2184630caa8e61f7445031",

      measurementId:
        "G-PKFJ5NEMGQ"
    };


    const app =
      getApps().length
        ? getApps()[0]
        : initializeApp(firebaseConfig);


    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const backBtn =
      document.getElementById("backBtn");

    const searchInput =
      document.getElementById("searchInput");

    const conversationList =
      document.getElementById("conversationList");

    const status =
      document.getElementById("status");


    // ==========================================
    // VARIABLES
    // ==========================================

    let currentUser = null;

    let allConversations = [];

    const defaultPhoto =
      "./images/profile.png";


    // ==========================================
    // BACK
    // ==========================================

    backBtn.addEventListener(
      "click",
      () => {
        history.back();
      }
    );


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // ==========================================
    // FORMAT TIME
    // ==========================================

    function formatTime(value) {

      if (!value) {
        return "";
      }

      try {

        let date;

        if (
          typeof value.toDate ===
          "function"
        ) {

          date = value.toDate();

        } else {

          date = new Date(value);

        }

        if (isNaN(date.getTime())) {
          return "";
        }

        return date.toLocaleTimeString(
          "bn-BD",
          {
            hour: "numeric",
            minute: "2-digit"
          }
        );

      } catch (error) {

        return "";

      }

    }


    // ==========================================
    // LOAD INBOX
    // ==========================================

    async function loadInbox() {

      if (!currentUser) {
        return;
      }

      status.classList.remove("error");

      status.textContent =
        "⏳ Messages লোড হচ্ছে...";

      conversationList.innerHTML = "";


      try {

        /*
         * messages collection-এর মধ্যে
         * যেসব message-এর senderId বা receiverId
         * current user-এর UID, সেগুলো নেওয়া হবে।
         */

        const messagesRef =
          collection(
            db,
            "messages"
          );


        const sentQuery =
          query(
            messagesRef,
            where(
              "senderId",
              "==",
              currentUser.uid
            )
          );


        const receivedQuery =
          query(
            messagesRef,
            where(
              "receiverId",
              "==",
              currentUser.uid
            )
          );


        const [
          sentSnapshot,
          receivedSnapshot
        ] =
          await Promise.all([
            getDocs(sentQuery),
            getDocs(receivedQuery)
          ]);


        const messageMap =
          new Map();


        function processSnapshot(snapshot) {

          snapshot.forEach(
            (messageDoc) => {

              const data =
                messageDoc.data();


              const otherUid =
                data.senderId ===
                currentUser.uid

                  ? data.receiverId

                  : data.senderId;


              if (!otherUid) {
                return;
              }


              const old =
                messageMap.get(
                  otherUid
                );


              const oldTime =
                old?.createdAt
                ? getDateValue(
                    old.createdAt
                  )
                : 0;


              const newTime =
                data.createdAt
                ? getDateValue(
                    data.createdAt
                  )
                : 0;


              if (
                !old
                ||
                newTime >= oldTime
              ) {

                messageMap.set(
                  otherUid,
                  {

                    uid:
                      otherUid,

                    lastMessage:
                      data.text
                      || "",

                    createdAt:
                      data.createdAt
                      || null

                  }
                );

              }

            }
          );

        }


        processSnapshot(
          sentSnapshot
        );

        processSnapshot(
          receivedSnapshot
        );


        allConversations =
          Array.from(
            messageMap.values()
          );


        if (!allConversations.length) {

          renderEmpty();

          return;

        }


        await loadProfilesForConversations();


      } catch (error) {

        console.error(
          "Inbox error:",
          error
        );


        status.textContent =
          "❌ Inbox লোড করা যায়নি।";

        status.classList.add(
          "error"
        );

      }

    }


    // ==========================================
    // DATE VALUE
    // ==========================================

    function getDateValue(value) {

      try {

        if (
          value
          &&
          typeof value.toDate ===
          "function"
        ) {

          return value.toDate().getTime();

        }

        return new Date(value).getTime();

      } catch (error) {

        return 0;

      }

    }


    // ==========================================
    // LOAD USER PROFILES
    // ==========================================

    async function loadProfilesForConversations() {

      const conversations = [];


      for (
        const conversation
        of allConversations
      ) {

        try {

          const profileQuery =
            query(
              collection(
                db,
                "users"
              ),
              where(
                "__name__",
                "==",
                conversation.uid
              )
            );


          const snapshot =
            await getDocs(
              profileQuery
            );


          if (!snapshot.empty) {

            const profileData =
              snapshot.docs[0].data();


            conversations.push({

              ...conversation,

              name:
                profileData.name
                || profileData.displayName
                || "WWC User",

              username:
                profileData.username
                || "wwc_user",

              photoURL:
                profileData.photoURL
                || defaultPhoto

            });

          }

        } catch (error) {

          console.error(
            "Profile load error:",
            error
          );

        }

      }


      allConversations =
        conversations;


      renderConversations(
        allConversations
      );

    }


    // ==========================================
    // RENDER
    // ==========================================

    function renderConversations(
      conversations
    ) {

      conversationList.innerHTML = "";


      if (!conversations.length) {

        renderEmpty();

        return;

      }


      status.textContent =
        conversations.length +
        "টি conversation";


      conversations.forEach(
        (conversation) => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "conversation";


          let username =
            conversation.username
            || "wwc_user";


          username =
            String(username)
              .replace(
                /^@/,
                ""
              );


          card.innerHTML = `

            <img
              class="avatar"
              src="${
                escapeHtml(
                  conversation.photoURL
                  || defaultPhoto
                )
              }"
              alt="Profile"
            >

            <div class="conversation-info">

              <div class="name-row">

                <div class="name">
                  ${
                    escapeHtml(
                      conversation.name
                    )
                  }
                </div>

                <div class="time">
                  ${
                    formatTime(
                      conversation.createdAt
                    )
                  }
                </div>

              </div>

              <div class="handle">
                @${escapeHtml(username)}
              </div>

              <div class="last-message">
                ${
                  escapeHtml(
                    conversation.lastMessage
                    || "No message"
                  )
                }
              </div>

            </div>

          `;


          card.addEventListener(
            "click",
            () => {

              window.location.href =
                "./chat.html?uid=" +
                encodeURIComponent(
                  conversation.uid
                );

            }
          );


          conversationList.appendChild(
            card
          );

        }
      );

    }


    // ==========================================
    // EMPTY
    // ==========================================

    function renderEmpty() {

      status.textContent = "";

      conversationList.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            💬
          </div>

          <div>
            এখনো কোনো Message নেই।
          </div>

          <p>
            Friends থেকে কোনো User নির্বাচন করে
            Message শুরু করুন।
          </p>

        </div>

      `;

    }


    // ==========================================
    // SEARCH
    // ==========================================

    function searchConversations() {

      const queryText =
        searchInput.value
          .trim()
          .toLowerCase();


      if (!queryText) {

        renderConversations(
          allConversations
        );

        return;

      }


      const filtered =
        allConversations.filter(
          (conversation) => {

            const name =
              String(
                conversation.name
                || ""
              ).toLowerCase();


            const username =
              String(
                conversation.username
                || ""
              )
                .replace(
                  /^@/,
                  ""
                )
                .toLowerCase();


            return (
              name.includes(
                queryText
              )
              ||
              username.includes(
                queryText
              )
            );

          }
        );


      renderConversations(
        filtered
      );

    }


    searchInput.addEventListener(
      "input",
      searchConversations
    );


    // ==========================================
    // AUTH
    // ==========================================

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          status.textContent =
            "❌ আগে Login করুন।";

          status.classList.add(
            "error"
          );


          setTimeout(
            () => {

              window.location.href =
                "./login.html";

            },
            1200
          );


          return;

        }


        currentUser =
          user;


        await loadInbox();

      }
    );

  </script>

</body>
</html>
