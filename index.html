<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#000000" />

  <title>WWC · Home</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <!-- WWC CSS -->
  <link rel="stylesheet" href="./CSS/style.css" />
</head>

<body>

  <div class="app">

    <!-- VIDEO FEED -->
    <main class="feed" id="feed">

      <!-- Videos will load from app.js -->

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

      <!-- HOME -->
      <button
        class="nav-btn active"
        onclick="goHome()"
      >
        <span class="nav-icon">
          <i class="fas fa-home"></i>
        </span>

        <span>Home</span>
      </button>


      <!-- FRIENDS -->
      <button
        class="nav-btn"
        onclick="goFriends()"
      >
        <span class="nav-icon">
          <i class="fas fa-user-friends"></i>
        </span>

        <span>Friends</span>
      </button>


      <!-- CREATE / UPLOAD -->
      <button
        class="nav-btn"
        onclick="goUpload()"
      >
        <span class="upload-btn">
          <i class="fas fa-plus"></i>
        </span>
      </button>


      <!-- INBOX -->
      <button
        class="nav-btn"
        onclick="goInbox()"
      >
        <span class="nav-icon">
          <i class="fas fa-inbox"></i>
        </span>

        <span>Inbox</span>
      </button>


      <!-- PROFILE -->
      <button
        class="nav-btn"
        onclick="goProfile()"
      >
        <span class="nav-icon">
          <i class="fas fa-user"></i>
        </span>

        <span>Profile</span>
      </button>

    </nav>


    <!-- COMMENT PANEL -->
    <div
      class="comment-panel"
      id="commentPanel"
    >

      <div class="comment-header">

        <span>Comments</span>

        <button
          class="close-comments"
          onclick="closeComments()"
        >
          ✕
        </button>

      </div>


      <!-- COMMENTS -->
      <div
        class="comments-list"
        id="commentsList"
      ></div>


      <!-- COMMENT INPUT -->
      <div class="comment-input">

        <input
          id="commentInput"
          type="text"
          maxlength="500"
          placeholder="Add comment..."
        />

        <button onclick="addComment()">
          <i class="fas fa-paper-plane"></i>
        </button>

      </div>

    </div>


    <!-- TOAST MESSAGE -->
    <div
      class="toast"
      id="toast"
    ></div>

  </div>


  <!-- WWC JAVASCRIPT -->
  <script
    type="module"
    src="./public/js/app.js"
  ></script>

</body>
</html>
