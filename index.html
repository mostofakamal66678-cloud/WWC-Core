<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>WWC - World Wide Connect</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- টপ বার: Following / For You + সার্চ -->
    <div class="top-bar">
        <div class="top-tabs">
            <button class="tab-btn" data-tab="following">Following</button>
            <button class="tab-btn active" data-tab="foryou">For You</button>
        </div>
        <button class="search-btn" id="search-btn"><i class="fas fa-search"></i></button>
    </div>

    <!-- ভিডিও ফিড -->
    <div id="video-feed" class="video-feed"></div>

    <!-- সার্চ ওভারলে -->
    <div id="search-overlay" class="search-overlay">
        <div class="search-top">
            <button id="search-back"><i class="fas fa-arrow-left"></i></button>
            <input type="text" id="search-input" placeholder="ইউজারনেম খুঁজুন..." autocomplete="off">
        </div>
        <div id="search-results" class="search-results">
            <div class="feed-loading" style="height:auto;padding:40px 20px;">ইউজারনেম লিখে খুঁজুন</div>
        </div>
    </div>

    <!-- কমেন্ট শিট -->
    <div id="comment-modal" class="comment-sheet">
        <div class="comment-header">
            <div class="handle"></div>
            <h3 id="comment-count-title">মন্তব্য</h3>
            <button id="close-comment"><i class="fas fa-times"></i></button>
        </div>
        <div id="comment-list" class="comment-list"></div>
        <div class="comment-input-box">
            <input type="text" id="comment-input" placeholder="মন্তব্য যোগ করুন..." autocomplete="off">
            <button id="comment-submit"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- ভিডিও অপশন শিট (রিপোর্ট / ব্লক) -->
    <div id="video-options-sheet" class="comment-sheet short">
        <div class="comment-header">
            <div class="handle"></div>
            <h3>অপশন</h3>
            <button id="close-video-options"><i class="fas fa-times"></i></button>
        </div>
        <div style="padding:8px 16px 24px;">
            <button class="option-btn" id="opt-report-video"><i class="fas fa-flag"></i> রিপোর্ট ভিডিও</button>
            <button class="option-btn danger" id="opt-block-user"><i class="fas fa-user-slash"></i> ইউজার ব্লক করুন</button>
        </div>
    </div>

    <!-- রিপোর্ট কারণ শিট -->
    <div id="report-sheet" class="comment-sheet short">
        <div class="comment-header">
            <div class="handle"></div>
            <h3>কেন রিপোর্ট করছেন?</h3>
            <button id="close-report"><i class="fas fa-times"></i></button>
        </div>
        <div style="padding:8px 16px 24px;">
            <button class="option-btn report-reason-btn" data-reason="স্প্যাম">স্প্যাম</button>
            <button class="option-btn report-reason-btn" data-reason="অনুপযুক্ত কন্টেন্ট">অনুপযুক্ত কন্টেন্ট</button>
            <button class="option-btn report-reason-btn" data-reason="সহিংসতা বা বিপজ্জনক কাজ">সহিংসতা বা বিপজ্জনক কাজ</button>
            <button class="option-btn report-reason-btn" data-reason="হয়রানি বা বুলিং">হয়রানি বা বুলিং</button>
            <button class="option-btn report-reason-btn" data-reason="মিথ্যা তথ্য">মিথ্যা তথ্য</button>
            <button class="option-btn report-reason-btn" data-reason="অন্যান্য">অন্যান্য</button>
        </div>
    </div>

    <!-- বটম নেভবার -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>হোম</span>
        </a>
        <a href="public/js/friends.html" class="nav-item">
            <i class="fas fa-users"></i>
            <span>বন্ধু</span>
        </a>
        <a href="public/js/upload.html" class="nav-item upload-btn">
            <i class="fas fa-plus"></i>
        </a>
        <a href="public/js/inbox.html" class="nav-item">
            <i class="fas fa-message"></i>
            <span>ইনবক্স</span>
        </a>
        <a href="public/js/profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>প্রোফাইল</span>
        </a>
    </nav>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    <!-- Config & App -->
    <script src="public/js/firebase-config.js"></script>
    <script src="public/js/app.js"></script>

</body>
    </html>
